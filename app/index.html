async function btRunSim(){
  if(BT.running) return;
  var ticker=(BT.ticker||'SPY').toUpperCase().trim();
  var fast=BT.fast||20;var slow=BT.slow||50;var capital=BT.capital||10000;
  if(fast>=slow){showToast('La SMA rápida debe ser menor a la SMA lenta.','warn');return;}
  BT.running=true;BT.result=null;renderBack();
  try{
    var hist=await fetchHistory(ticker,BT.range||'1y');
    if(!hist||hist.length<slow+10){BT.result={error:'No hay suficientes datos históricos para '+ticker+' con SMA'+slow+'. Intenta con un período mayor o ticker diferente.'};BT.running=false;renderBack();return;}
    var closes=hist.map(function(d){return d.close;});
    // calc SMAs
    function sma(arr,n,i){if(i<n-1)return null;var s=0;for(var j=i-n+1;j<=i;j++)s+=arr[j];return s/n;}
    var trades=[];var pos=null;var equity=capital;
    var winPnls=[];var lossPnls=[];
    for(var i=slow;i<closes.length;i++){
      var f=sma(closes,fast,i);var s2=sma(closes,slow,i);
      var fp=sma(closes,fast,i-1);var sp=sma(closes,slow,i-1);
      if(!f||!s2||!fp||!sp) continue;
      // golden cross → buy
      if(fp<=sp&&f>s2&&!pos){
        var units=Math.floor(equity/closes[i]);
        if(units<1) continue;
        pos={price:closes[i],units:units,cost:closes[i]*units};
        trades.push({date:hist[i].date||('d'+i),type:'buy',price:closes[i],pnl:null,cum:equity});
      }
      // death cross → sell
      else if(fp>=sp&&f<s2&&pos){
        var exitPrice=closes[i];
        var pnl=(exitPrice-pos.price)*pos.units;
        equity+=pnl;
        if(pnl>0) winPnls.push(pnl); else lossPnls.push(Math.abs(pnl));
        trades.push({date:hist[i].date||('d'+i),type:'sell',price:exitPrice,pnl:pnl,cum:equity});
        pos=null;
      }
    }
    // close open position at last price
    if(pos&&closes.length){
      var lastP=closes[closes.length-1];
      var pnl=(lastP-pos.price)*pos.units;
      equity+=pnl;
      if(pnl>0) winPnls.push(pnl); else lossPnls.push(Math.abs(pnl));
      trades.push({date:'Hoy',type:'sell',price:lastP,pnl:pnl,cum:equity});
      pos=null;
    }
    var sells2=trades.filter(function(r){return r.type==='sell';});
    var wins2=winPnls.length;
    var profitFactor2=(lossPnls.length&&lossPnls.reduce(function(s,v){return s+v;},0)>0)?(winPnls.reduce(function(s,v){return s+v;},0)/lossPnls.reduce(function(s,v){return s+v;},0)):null;
    var peak2=capital;var maxDD2=0;
    trades.forEach(function(r){if(r.cum>peak2)peak2=r.cum;var dd=peak2-r.cum;if(dd>maxDD2)maxDD2=dd;});
    BT.result={
      capital:capital,finalCapital:equity,
      totalReturn:(equity-capital)/capital,
      trades:trades,
      totalTrades:sells2.length,
      wins:wins2,
      winRate:sells2.length?wins2/sells2.length:0,
      profitFactor:profitFactor2,
      maxDrawdown:maxDD2,
      maxDrawdownPct:peak2>0?maxDD2/peak2:0
    };
  } catch(e){
    BT.result={error:'Error al obtener datos: '+e.message};
  }
  BT.running=false;renderBack();
}

async function confirmDeleteAccount(){
  var btn=document.getElementById('da-btn');
  var err=document.getElementById('da-err');
  if(err){ err.style.display='none'; }
  if(btn){ btn.disabled=true; btn.textContent='Eliminando…'; }
  try{
    if(typeof sb==='undefined'||!sb||!sb.auth){ throw new Error('No se pudo cargar el servicio de autenticación. Recargá la página.'); }
    var sess=await sb.auth.getSession();
    var tok=sess&&sess.data&&sess.data.session&&sess.data.session.access_token;
    if(!tok){ throw new Error('Debés iniciar sesión de nuevo para poder eliminar la cuenta.'); }
    var res=await fetch('/api/delete-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})});
    var data=await res.json().catch(function(){return {};});
    if(!res.ok||!data.ok){
      throw new Error(data.error||'No se pudo eliminar la cuenta. Intentá de nuevo o escribinos a invest@moyiq.app.');
    }
    // La cuenta ya no existe del lado del servidor: limpiar sesión local y
    // volver a la landing (no tiene sentido re-renderizar la app logueada).
    if(typeof stopBoot==='function') stopBoot();
    try{ await sb.auth.signOut(); }catch(e){}
    S.user=null;
    window.location.href='/';
  }catch(e){
    if(err){ err.textContent=e.message||'Error de conexión. Intentá de nuevo.'; err.style.display='block'; }
    if(btn){ btn.textContent='Eliminar cuenta definitivamente'; daSync(); }
  }
}

  h.textContent=tk+' cotiza ahora a $'+fmtD(cur)+'. Se avisará cuando '+(ty==='Max'?'suba a':'baje a')+' tu objetivo.';

// Niveles propuestos a partir de datos que la app YA tiene del usuario, para no
// fijar el objetivo a ciegas. Cada chip dice de donde sale el numero: sin la
// razon visible seria un numero magico y el usuario no podria juzgarlo.
// Solo se ofrecen niveles coherentes con la direccion elegida: un objetivo por
// encima del precio actual no tiene sentido en una alerta de bajada.
function alSugerencias(tk,ty,cur){
  var cont=document.getElementById('al-sug'); if(!cont) return;
  var sug=[];
  try{
    var pos=(S.portfolio||[]).find(function(h){return h.t===tk;});
    if(pos&&pos.cost>0) sug.push({v:pos.cost, txt:'tu coste medio'});
    var lq=(typeof LIVE==='object')?LIVE[tk]:null;
    if(lq&&lq.low52>0) sug.push({v:lq.low52, txt:'mínimo 52 semanas'});
    if(cur>0){
      sug.push({v:cur*0.9,  txt:'−10% desde hoy'});
      sug.push({v:cur*1.1,  txt:'+10% desde hoy'});
    }
  }catch(e){}
  // Max = avisar al subir -> solo niveles por encima. Min = al bajar -> por debajo.
  sug=sug.filter(function(s){
    return isFinite(s.v)&&s.v>0&&(ty==='Max'? s.v>cur : s.v<cur);
  });
  // Quitar duplicados muy proximos entre si (mismo nivel por dos motivos)
  var vistos=[];
  sug=sug.filter(function(s){
    var dup=vistos.some(function(v){return Math.abs(v-s.v)/s.v<0.005;});
    if(!dup) vistos.push(s.v);
    return !dup;
  });
  if(!sug.length){ cont.innerHTML=''; return; }
  cont.innerHTML='<div style="font-size:11px;color:var(--text3);margin-bottom:5px">Niveles sugeridos según tus datos</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:5px">'+
    sug.map(function(s){
      return '<button type="button" class="btn" style="padding:3px 9px;font-size:11px" '+
        'onclick="document.getElementById(\'al-pr\').value='+s.v.toFixed(2)+';alSync()">'+
        '$'+fmtD(s.v)+' <span style="color:var(--text3)">· '+s.txt+'</span></button>';
    }).join('')+'</div>';
}

async function doUpgrade(){
  var u=S.user;
  if(!u)return;
  track('upgrade_click',{interval:_billingPeriod});
  try{
    var res=await fetch('/api/create-checkout',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({product:'invest_pro',userId:u.id,email:u.email,
        interval:_billingPeriod,
        successUrl:window.location.origin+'/app?upgraded=1',
        cancelUrl:window.location.origin+'/app?upgrade_cancelled=1'})
    });
    var data=await res.json();
    if(data.url){window.location.href=data.url;return;}
    throw new Error(data.error||'Error');
  }catch(e){
    if(e.message&&e.message.includes('not configured')){
      track('checkout_unavailable'); // Stripe aún no configurado → fallback a trial gratis
      if(S.user&&S.user.plan==='free'){ startTrial(); showToast('Trial Pro activado — 14 días gratis. El pago con tarjeta estará disponible muy pronto.','info'); }
      else { showToast('Pago con tarjeta disponible muy pronto.','info'); }
    }else{
      trackError('checkout',e,{critical:true}); // fallo de pago — alta prioridad
      showToast('Error al conectar con el servidor de pagos. Intenta de nuevo.','error');
    }
  }
}

// Autofill "Precio actual" en el modal de posición. Type==="Crypto" usa
// /api/crypto (CoinGecko); el resto sigue por /api/quote (Yahoo) via fetchQuote.
// Compartida entre el input de ticker y el select de tipo: cambiar cualquiera
// de los dos debe re-resolver el precio con la fuente correcta.
function posAutofillPrice(){
  var tEl=document.getElementById('pt'),tyEl=document.getElementById('pty'),el=document.getElementById('pcur');
  if(!tEl||!el)return;
  var t=(tEl.value||"").toUpperCase().trim();
  if(!t)return;
  var isCrypto=tyEl&&tyEl.value==='Crypto';
  if(LIVE[t]&&!isCrypto){el.value=LIVE[t].price.toFixed(2);return;}
  var p=isCrypto?fetchCryptoQuote(t):fetchQuote(t);
  p.then(function(q){
    if(!q)return;
    // Ticker y tipo pedidos en esta llamada — el usuario pudo haber tipeado
    // otro ticker o cambiado Stock↔Crypto mientras la request estaba en vuelo.
    // Sin este chequeo, una respuesta de Yahoo que tarda más que la de
    // CoinGecko (o viceversa) puede llegar después y pisar el precio correcto
    // con uno de la fuente equivocada (mismo ticker, forma de datos distinta).
    var tNow=document.getElementById('pt'),tyNow=document.getElementById('pty');
    if(!tNow||!el)return;
    var curT=(tNow.value||"").toUpperCase().trim();
    var curIsCrypto=tyNow&&tyNow.value==='Crypto';
    if(curT!==t||curIsCrypto!==isCrypto)return;
    LIVE[t]=q;el.value=q.price.toFixed(2);
  });
}

async function savePos(id){
  var t=(document.getElementById("pt").value||"").toUpperCase().trim();
  var type=document.getElementById("pty").value;
  var sh=parseFloat(document.getElementById("ps").value||"");
  var cost=parseFloat(document.getElementById("pc").value||"");
  var cur=parseFloat(document.getElementById("pcur").value||"");
  var err=document.getElementById("perr");
  if(!t){err.style.display="block";err.textContent="Ticker requerido";return;}
  if(!sh||sh<=0){err.style.display="block";err.textContent="Shares inválido";return;}
  if(!cost||cost<=0){err.style.display="block";err.textContent="Precio de entrada inválido";return;}
  if(!cur||cur<=0){err.style.display="block";err.textContent="Precio actual inválido";return;}
  if(id===-1){
    var h={id:S.nextId++,t:t,type:type,sh:sh,cost:cost,cur:cur};
    S.portfolio.push(h);
    sbAddHolding(h).then(function(realId){if(realId){h.id=realId;persist();}}).catch(function(){});
  } else {
    var idx=S.portfolio.findIndex(function(p){return p.id===id;});
    if(idx>=0){
      S.portfolio[idx]=Object.assign({},S.portfolio[idx],{type:type,sh:sh,cost:cost,cur:cur});
      sbUpdateHolding(S.portfolio[idx]);
    }
  }
  persist();
  REBAL.targets={}; // reset rebalancing targets when portfolio changes
  S.modal=null;S.editPos=null;
  document.getElementById("mroot").innerHTML="";
  showToast(id===-1?'Posición agregada':'Posición actualizada');
  renderMain(); // fast partial re-render
}

function saveTrade(){
  var type=document.getElementById("tr_type").value;
  var ticker=(document.getElementById("tr_ticker").value||"").toUpperCase().trim();
  var price=parseFloat(document.getElementById("tr_price").value||"");
  var qty=parseFloat(document.getElementById("tr_qty").value||"");
  var amount=parseFloat(document.getElementById("tr_amount").value||"");

  var rsi=parseFloat(document.getElementById("tr_rsi").value||"")||null;
  var note=document.getElementById("tr_note").value.trim();
  var err=document.getElementById("trerr");

  var needsTicker=["buy","sell","dividend"].indexOf(type)>=0;
  if(needsTicker&&!ticker){err.style.display="block";err.textContent="Ingresá el ticker.";return;}
  if(!amount||amount<=0){err.style.display="block";err.textContent="Ingresá el monto total.";return;}
  if(!date){err.style.display="block";err.textContent="Ingresá la fecha.";return;}

  // For buy/sell compute qty if missing
  if(["buy","sell"].indexOf(type)>=0&&(!qty||qty<=0)&&price>0) qty=amount/price;

  // Calculate P&L for sells
  var pnl=null;
  if(type==='sell'&&ticker&&price>0){
    // Coste medio movil: hay que descontar lo ya vendido. Antes se promediaba
    // sobre TODAS las compras historicas aunque parte ya se hubiera vendido, lo
    // que inflaba el coste base y falseaba el P&L de quien recorta posiciones.
    var previos=S.trades.filter(function(t){return t.ticker===ticker;})
                        .sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;});
    var uds=0, coste=0;
    previos.forEach(function(t){
      if(t.type==='buy'){ uds+=t.qty; coste+=t.amount; }
      else if(t.type==='sell'&&uds>0){
        var medio=coste/uds;
        var vendidas=Math.min(t.qty,uds);
        uds-=vendidas; coste-=medio*vendidas;   // sale al coste medio del momento
      }
    });
    if(uds>0){
      var avgC=coste/uds;
      pnl=(price-avgC)*(qty||0);
    }
  }

  loadTrades();loadAlerts();
  S.trades.push({
    id:S.tradeNextId++,
    ticker:needsTicker?ticker:null,
    type:type,
    date:date,
    price:price||null,
    qty:qty||null,
    amount:amount,
    rsi:rsi,
    note:note,
    pnl:pnl,
  });
  persistTrades();

  // Reconstruir la posicion desde TODAS las operaciones del ticker (buys suman
  // unidades y coste, sells restan). Antes solo actualizaba el coste de una
  // posicion YA existente: una compra de un activo nuevo quedaba solo en la
  // Bitacora y nunca creaba la posicion en el portafolio.
  var creoPosicion=false;
  if((type==='buy'||type==='sell')&&ticker){
    var ops=S.trades.filter(function(t){return t.ticker===ticker;})
                    .sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;});
    var netUds=0, netCoste=0;
    ops.forEach(function(t){
      if(t.type==='buy'){ netUds+=(t.qty||0); netCoste+=(t.amount||0); }
      else if(t.type==='sell'&&netUds>0){
        var medio=netCoste/netUds;
        var vend=Math.min(t.qty||0,netUds);
        netUds-=vend; netCoste-=medio*vend;
      }
    });
    var pos=S.portfolio.find(function(h){return h.t===ticker;});
    if(netUds>0.0000001){
      var costeMedio=netCoste/netUds;
      if(pos){
        pos.sh=netUds; pos.cost=costeMedio;
        sbUpdateHolding(pos);
      } else {
        // posicion nueva: crearla. sbAddHolding devuelve el id real de la DB.
        var nuevo={id:S.nextId++, t:ticker, type:(rsi&&rsi.tipo)||'Stock', sh:netUds, cost:costeMedio, cur:price||costeMedio};
        S.portfolio.push(nuevo);
        creoPosicion=true;
        if(typeof sbAddHolding==='function'){
          sbAddHolding(nuevo).then(function(realId){ if(realId){ nuevo.id=realId; persist(); } }).catch(function(){});
        }
      }
      persist();
    } else if(pos){
      // se vendio todo: quitar la posicion del portafolio
      S.portfolio=S.portfolio.filter(function(h){return h.t!==ticker;});
      if(typeof sbDeleteHolding==='function') sbDeleteHolding(pos.id);
      persist();
    }
  }

  closeModal();
  showToast(creoPosicion?ticker+' agregado a tu portafolio':'Operación registrada en Bitácora');
  setPage("bitacora");
}

function pearson(a,b){
  var n=Math.min(a.length,b.length);
  if(n<5) return null;
  var ax=a.slice(-n),bx=b.slice(-n);
  var ma=ax.reduce(function(s,v){return s+v;},0)/n;
  var mb=bx.reduce(function(s,v){return s+v;},0)/n;
  var num=0,da=0,db=0;
  for(var i=0;i<n;i++){var ra=ax[i]-ma,rb=bx[i]-mb;num+=ra*rb;da+=ra*ra;db+=rb*rb;}
  var denom=Math.sqrt(da)*Math.sqrt(db);
  return denom===0?null:num/denom;
}

function corrColor(r){
  if(r===null) return 'var(--card3)';
  var abs=Math.abs(r);
  if(r>0.7) return 'rgba(239,68,68,0.5)';
  if(r>0.4) return 'rgba(234,179,8,0.4)';
  if(r>0.1) return 'rgba(255,255,255,0.08)';
  if(r>-0.1) return 'rgba(255,255,255,0.04)';
  if(r>-0.4) return 'rgba(59,130,246,0.2)';
  return 'rgba(34,197,94,0.3)';
}

function openDrawer(ticker,curPrice){
  dTicker=ticker;dTab="chart";
  var sig=ALL_SIG.find(function(s){return s.t===ticker;})||{sig:"HOLD",sc:60};
  var price=curPrice||sig.p||100;
  renderDrawerHead(ticker,price);
  document.getElementById("dov").classList.add("open");
  document.getElementById("drw").classList.add("open");
  document.body.style.overflow="hidden";
  // Render immediately with cached/available data — chart area shows its own spinner
  renderDrawerBody();
  // Load history — re-renders chart area when data arrives
  loadDrawerHistory(ticker,price);
  // Pre-hydrate fundamentals from localStorage synchronously (instant on revisit)
  if(!dFundCache[ticker]){
    try{
      var _lsf=localStorage.getItem('ff_'+ticker);
      if(_lsf){var _pf=JSON.parse(_lsf);if(_pf&&_pf.ts&&(Date.now()-_pf.ts)<3600000&&_pf.data) dFundCache[ticker]=_pf.data;}
    }catch(e){}
  }
  // Pre-hydrate earnings from localStorage synchronously
  if(!dEarnCache[ticker]){
    try{
      var _lse=localStorage.getItem('fe_'+ticker);
      if(_lse){var _pe=JSON.parse(_lse);if(_pe&&_pe.ts&&(Date.now()-_pe.ts)<14400000&&_pe.data) dEarnCache[ticker]=_pe.data;}
    }catch(e){}
  }
  // Load fundamentals in background — re-render tab when data arrives
  if(!dFundCache[ticker]){
    fetchFundamentals(ticker).then(function(f){
      if(f){
        dFundCache[ticker]=f;
        if(dTicker===ticker&&dTab==='fundamentals') renderDrawerBody();
      }
    });
  }
  // Load earnings in background — re-renders fundamentals tab + header when ready
  if(!dEarnCache[ticker]){
    fetchEarningsData(ticker).then(function(e){
      if(e&&dTicker===ticker){
        renderDrawerHead(ticker,curPrice||getLivePrice(ticker)||price);
        if(dTab==='fundamentals') renderDrawerBody();
      }
    });
  }
  // Fetch live quote if needed
  if(!LIVE[ticker]){
    fetchQuote(ticker).then(function(q){
      if(q){LIVE[ticker]=q;renderDrawerHead(ticker,q.price);}
    }).catch(function(){});
  }
}

function closeDrawer(){
  document.getElementById("dov").classList.remove("open");
  document.getElementById("drw").classList.remove("open");
  document.body.style.overflow="";
  // Libera los charts de lightweight-charts al cerrar: si no, las instancias,
  // sus canvas y la suscripcion de rango (subscribeVisibleLogicalRangeChange)
  // quedaban vivas hasta el proximo openDrawer -> fuga en cada cierre.
  if(_lwChartMain){try{_lwChartMain.remove();}catch(e){} _lwChartMain=null;}
  if(_lwChartVol){try{_lwChartVol.remove();}catch(e){} _lwChartVol=null;}
  if(_lwResizeObs){try{_lwResizeObs.disconnect();}catch(e){} _lwResizeObs=null;}
}

function prefetchFund(ticker){
  if(dFundCache[ticker]) return;
  // Check localStorage first
  try{
    var s=localStorage.getItem('ff_'+ticker);
    if(s){var p=JSON.parse(s);if(p&&p.ts&&(Date.now()-p.ts)<3600000&&p.data){dFundCache[ticker]=p.data;return;}}
  }catch(e){}
  fetchFundamentals(ticker).then(function(f){if(f) dFundCache[ticker]=f;}).catch(function(){});
  // Also prefetch earnings
  if(!dEarnCache[ticker]){
    fetchEarningsData(ticker).then(function(e){}).catch(function(){});
  }
}

var AI={open:false,messages:[],loading:false};

function toggleAI(){
  AI.open=!AI.open;
  var panel=document.getElementById('ai-panel');
  if(!panel){renderAIPanel();return;}
  panel.style.transform=AI.open?'translateX(0)':'translateX(100%)';

function buildPortfolioContext(){
  var port=S.portfolio;
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var pnl=totM-totC;
  var lines=["PORTFOLIO DEL USUARIO:"];
  lines.push("Capital total: $"+fmt(S.capital));
  lines.push("Valor de mercado: $"+fmt(totM));
  lines.push("P&L total: "+(pnl>=0?"+":"")+D(pnl)+" ("+(pnl>=0?"+":"")+pct(pnl/(totC||1))+")");
  lines.push("\nPOSICIONES:");
  port.forEach(function(h){
    var pnlH=h.sh*(h.cur-h.cost);
    lines.push("- "+h.t+" ("+h.type+"): "+h.sh+" acciones @ $"+fmtD(h.cost)+" entrada, $"+fmtD(h.cur)+" actual, P&L: "+(pnlH>=0?"+":"")+D(pnlH));
  });
  lines.push("\nWATCHLIST: "+S.watchlist.join(", "));
  lines.push("\nSEÑALES ACTUALES:");
  ALL_SIG.slice(0,8).forEach(function(s){
    lines.push("- "+s.t+": "+s.sig+" (Score "+s.sc+", precio $"+(s.p?fmtD(s.p):"—")+")");
  });
  lines.push("\nNOTICIAS RELEVANTES (semana actual):");
  getNewsData().slice(0,4).forEach(function(n){
    lines.push("- ["+n.cat+"] "+n.title+" ("+relTime(n.hoursAgo)+")");
  });
  return lines.join("\n");
}

  if(!userMsg||!userMsg.trim()||AI.loading) return;
  AI.messages.push({role:"user",content:userMsg});
  AI.loading=true;
  renderAIMessages();

  var context=buildPortfolioContext();
  var sysPrompt="Eres MOY IQ Analista, un asistente de análisis técnico educativo especializado en mercados de EE.UU. y LATAM. "+
    "Ofreces análisis técnico educativo basado en datos y explicas conceptos de forma clara. "+

    "Toda decisión de inversión es responsabilidad exclusiva del usuario. "+

// Copia de seguridad completa: todo vive en localStorage, un borrado de
// navegador lo pierde todo. Serializa lo esencial y permite restaurarlo.
function exportBackup(){
  var data={
    _v:1, _fecha:new Date().toISOString(),
    portfolio:S.portfolio, trades:S.trades, watchlist:S.watchlist,
    capitalPlan:S.capitalPlan, capital:S.capital,
    profile:(RADAR&&RADAR.profile)||null,
    rebalTargets:(REBAL&&REBAL.targets)||{}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='moyiq-invest-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  showToast('Copia de seguridad descargada');
}
function importBackup(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d||typeof d!=='object') throw new Error('formato');
      if(Array.isArray(d.portfolio)) S.portfolio=d.portfolio;
      if(Array.isArray(d.trades)) S.trades=d.trades;
      if(Array.isArray(d.watchlist)) S.watchlist=d.watchlist;
      if(d.capitalPlan) S.capitalPlan=d.capitalPlan;
      if(typeof d.capital==='number') S.capital=d.capital;
      if(d.profile&&typeof radarSaveProfile==='function') radarSaveProfile(d.profile);
      if(d.rebalTargets&&typeof REBAL==='object'){ REBAL.targets=d.rebalTargets; if(typeof rebalSaveTargets==='function') rebalSaveTargets(); }
      if(typeof persist==='function') persist();
      if(typeof persistTrades==='function') persistTrades();
      if(typeof _capSave==='function') _capSave();
      showToast('Copia restaurada correctamente');
      renderMain();
    }catch(err){ showToast('Archivo no válido','error'); }
  };
  reader.readAsText(file);
}
function exportCSV(){
  var port=S.portfolio;
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var rows=[['Ticker','Tipo','Unidades','Entrada','Precio Actual','Valor','P&L $','Retorno %','Peso %','Fecha']];
  var date=new Date().toLocaleDateString('es-CL');
  port.forEach(function(h){
    var pnl=h.sh*(h.cur-h.cost);
    var ret=h.cost>0?(h.cur-h.cost)/h.cost*100:0;   // coste 0 daba Infinity%
    var w=(h.sh*h.cur)/(totM||1)*100;
    rows.push([h.t,h.type,h.sh,h.cost.toFixed(2),h.cur.toFixed(2),(h.sh*h.cur).toFixed(2),pnl.toFixed(2),ret.toFixed(2),w.toFixed(2),date]);
  });
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var tPnl=port.reduce(function(s,h){return s+h.sh*(h.cur-h.cost);},0);
  rows.push(['TOTAL','','','','',totM.toFixed(2),tPnl.toFixed(2),((tPnl/(totC||1))*100).toFixed(2),'100','']);
  var csv=rows.map(function(r){
    return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');
  }).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='moyiq-invest-'+new Date().toISOString().split('T')[0]+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function pbFill(ticker,price){
  PB.ticker=ticker;PB.price=price;PB.stop=0;
  renderPBBody();
  setTimeout(function(){pbCalc();},50);
}

function pbFetchPrice(){
  var t=PB.ticker.toUpperCase().trim();
  if(!t) return;
  if(LIVE[t]){
    PB.price=LIVE[t].price;
    var el=document.getElementById('pb-price');
    if(el) el.value=LIVE[t].price.toFixed(2);
  } else {
    fetchQuote(t).then(function(q){
      if(q){LIVE[t]=q;PB.price=q.price;var el=document.getElementById('pb-price');if(el)el.value=q.price.toFixed(2);}
    });
  }
}

function pbCalc(){
  var ticker=((document.getElementById('pb-ticker')||{}).value||PB.ticker||'').toUpperCase().trim();
  var price=parseFloat((document.getElementById('pb-price')||{}).value)||PB.price;
  var capital=parseFloat((document.getElementById('pb-capital')||{}).value)||PB.capital||S.capital;
  var risk=parseFloat((document.getElementById('pb-risk')||{}).value)||PB.risk||2;
  var stop=parseFloat((document.getElementById('pb-stop')||{}).value)||PB.stop||0;
  var rr=parseFloat((document.getElementById('pb-rr')||{}).value)||PB.rr||2;

  if(!price||price<=0){showToast('Ingresa o carga un precio válido para continuar.','warn');return;}
  if(!capital||capital<=0){showToast('Define tu capital disponible.','warn');return;}

  // Calculo extraido a app/lib/risk.js (computePositionSize) el 13-sep-2026 —
  // misma ecuacion que renderRiskBody, ver comentario ahi.
  var calc=computePositionSize({price:price,capital:capital,riskPct:risk,stop:stop,rrTarget:rr});
  if(calc.error==='stop-not-below-price'){showToast('El stop loss debe ser menor al precio de entrada.','warn');return;}
  if(calc.error==='invalid-risk-pct'){showToast('Diferencia entre precio y stop inválida.','warn');return;}

  PB.ticker=ticker;PB.price=price;PB.capital=capital;PB.risk=risk;PB.stop=calc.stop;PB.rr=rr;
  PB.computed={ticker:ticker,price:price,stop:calc.stop,target:calc.target,riskAmt:calc.riskAmt,posSize:calc.posSize,units:calc.units,rr:calc.rr};
  renderPBBody();
}

function pbAddToPortfolio(){
  if(!PB.computed) return;
  var c=PB.computed;
  var plan=planOf();
  if(S.portfolio.length>=plan.maxT&&plan.maxT<999){openModal('upgrade');return;}
  S.portfolio.push({id:S.nextId++,t:c.ticker,type:'Stock',sh:parseFloat(c.units.toFixed(4)),cost:c.price,cur:c.price});

function calcSentiment(){
  var buyPct=ALL_SIG.length?
    (ALL_SIG.filter(function(s){return s.sig==='BUY';}).length/ALL_SIG.length)*100:50;
  var sigAvg=ALL_SIG.length?
    ALL_SIG.reduce(function(s,x){return s+x.sc;},0)/ALL_SIG.length:50;
  var port=S.portfolio;
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var pnlPct=totC?((totM-totC)/(totC||1))*100:0;
  var momentumScore=Math.max(0,Math.min(100,50+pnlPct*2));

  // VIX: use cached DE value if available, otherwise default 18
  var vixVal=(DE_CACHE.vix&&DE_CACHE.vix.vix)||18;
  var vixScore=Math.max(0,Math.min(100,100-(vixVal-10)*3));
  var vixDisplay=DE_CACHE.vix&&DE_CACHE.vix.vix?DE_CACHE.vix.vix.toFixed(1):'—';

  // Esta variable se llamaba rsiAvg pero sumaba sig.sc, que es un score 0-100,
  // no un RSI. Se mostraba al usuario como 'RSI portfolio': dato mal etiquetado.
  // Ahora se usa el RSI real si IND_CACHE ya lo cargo, y si no, se cae al
  // promedio de score PERO con la etiqueta correcta.
  var rsiAvg=0,rsiCount=0,rsiEsReal=false;
  port.forEach(function(h){
    var ind=IND_CACHE[h.t];
    if(ind&&ind.rsi!=null){ rsiAvg+=ind.rsi; rsiCount++; rsiEsReal=true; }
  });
  if(!rsiCount){
    port.forEach(function(h){var sig=ALL_SIG.find(function(x){return x.t===h.t;});if(sig){rsiAvg+=sig.sc;rsiCount++;}});
  }
  rsiAvg=rsiCount?rsiAvg/rsiCount:sigAvg;

  var score=Math.round(buyPct*0.30+sigAvg*0.15+rsiAvg*0.25+vixScore*0.15+momentumScore*0.15);
  score=Math.max(0,Math.min(100,score));

  var label,color,emoji,desc;
  if(score<=20){label='Miedo Extremo';color='#e84142';emoji='face-panic';desc='Sentimiento extremadamente negativo. Históricamente asociado a alta volatilidad y ventas indiscriminadas.';}
  else if(score<=40){label='Miedo';color='#f59e0b';emoji='face-fear';desc='Cautela. Posible sobreacción bajista en el corto plazo.';}
  else if(score<=60){label='Neutral';color='#6b80a0';emoji='face-neutral';desc='Sin señal clara. El mercado procesa información.';}
  else if(score<=80){label='Codicia';color='#f7931a';emoji='face-greed';desc='Optimismo. Cuidado con FOMO. Considera toma parcial de ganancias.';}
  else{label='Codicia Extrema';color='#26a65b';emoji='face-euphoria';desc='Euforia. Riesgo de corrección. Revisa stops y diversificación.';}

  sentSaveToday(score);

  return{score:score,label:label,color:color,emoji:emoji,desc:desc,vixVal:vixVal,
    components:[
      {name:'Sesgo alcista', value:buyPct.toFixed(0)+'%',          score:buyPct,        icon:'bolt'},
      {name:'Score DE avg',  value:sigAvg.toFixed(0)+'/100',        score:sigAvg,        icon:'capital'},
      {name:(rsiEsReal?'RSI portafolio':'Score portafolio'), value:rsiAvg.toFixed(0), score:rsiAvg, icon:'ind'},
      {name:'VIX inverso',   value:'VIX '+vixDisplay,               score:vixScore,      icon:'therm'},
      {name:'Momentum P&L',  value:(pnlPct>=0?'+':'')+pnlPct.toFixed(1)+'%', score:momentumScore, icon:'cash'}
    ]
  };
}

function buildDial(score,color,size){
  var sz=size||200,cy=sz*0.5;
  var ang=((score/100)*180)-90;
  var rad=(ang-90)*Math.PI/180;
  var r=sz*0.37;
  var nx=(sz/2+r*Math.cos(rad)).toFixed(1);
  var ny=(cy+r*Math.sin(rad)).toFixed(1);
  var segs=[['#e84142',0,.2],['#f59e0b',.2,.4],['#6b80a0',.4,.6],['#f7931a',.6,.8],['#26a65b',.8,1]];
  var arcs=segs.map(function(seg){
    var s1=seg[1]*Math.PI,s2=seg[2]*Math.PI,sr=sz*0.41;
    var x1=(sz/2-sr*Math.cos(s1)).toFixed(1),y1=(cy-sr*Math.sin(s1)).toFixed(1);
    var x2=(sz/2-sr*Math.cos(s2)).toFixed(1),y2=(cy-sr*Math.sin(s2)).toFixed(1);
    return '<path d="M '+x1+' '+y1+' A '+sr+' '+sr+' 0 0 1 '+x2+' '+y2+'" fill="none" stroke="'+seg[0]+'" stroke-width="'+(sz*0.065).toFixed(0)+'" opacity=".5"/>';
  }).join('');
  return '<svg viewBox="0 0 '+sz+' '+(cy+14)+'" style="width:100%;display:block">'+
    arcs+
    '<line x1="'+(sz/2)+'" y1="'+cy+'" x2="'+nx+'" y2="'+ny+'" stroke="'+color+'" stroke-width="3" stroke-linecap="round"/>'+
    '<circle cx="'+(sz/2)+'" cy="'+cy+'" r="6" fill="'+color+'" opacity=".2"/>'+
    '<circle cx="'+(sz/2)+'" cy="'+cy+'" r="3" fill="'+color+'"/>'+
    '<text x="'+(sz/2)+'" y="'+(cy-6)+'" text-anchor="middle" fill="'+color+'" font-size="'+(sz*0.12).toFixed(0)+'" font-weight="700" font-family="IBM Plex Mono,monospace">'+score+'</text>'+
    '</svg>';
}

// ── HEALTH SCORE ──────────────────────────────────────────────────
function calcHealthScore(){
  var port=S.portfolio;
  if(!port||!port.length) return{total:0,subs:{div:0,mom:0,risk:0,corr:0,val:0}};

  var totM=port.reduce(function(s,h){return s+h.sh*(getLivePrice(h.t)||h.cur||0);},0);

  // 1. Diversificación — HHI (Herfindahl-Hirschman Index)
  var hhi=0;
  port.forEach(function(h){
    var w=totM>0?(h.sh*(getLivePrice(h.t)||h.cur||0))/totM:0;
    hhi+=w*w;
  });
  var divScore=Math.round(Math.max(0,Math.min(100,(1-hhi)*120)));

  // 2. Momentum — % posiciones en verde
  var inProfit=port.filter(function(h){
    return (getLivePrice(h.t)||h.cur||0)>h.cost;
  }).length;
  var momScore=Math.round((inProfit/port.length)*100);

  // 3. Riesgo de concentración — mayor posición
  var weights=port.map(function(h){
    return totM>0?(h.sh*(getLivePrice(h.t)||h.cur||0))/totM:0;
  });
  var maxW=Math.max.apply(null,weights);
  var riskScore=Math.round(Math.max(0,Math.min(100,(1-maxW)*130)));

  // 4. Correlación — diversificación por tipo de activo
  var types={};
  port.forEach(function(h){ types[h.type]=(types[h.type]||0)+1; });
  var nTypes=Object.keys(types).length;
  var corrScore=Math.round(Math.min(100,nTypes*28));

  // 5. Valoración — ratio señales BUY vs SELL en el portfolio
  var portTickers=port.map(function(h){return h.t;});
  var sigs=ALL_SIG.filter(function(s){return portTickers.indexOf(s.t)>=0;});
  var buys=sigs.filter(function(s){return s.sig==='BUY';}).length;
  var sells=sigs.filter(function(s){return s.sig==='SELL';}).length;
  var total=sigs.length||1;
  var valScore=Math.round(((buys-sells*0.5)/total)*80+40);
  valScore=Math.max(0,Math.min(100,valScore));

  var totalScore=Math.round(divScore*0.25+momScore*0.20+riskScore*0.25+corrScore*0.15+valScore*0.15);

  return{
    total:Math.max(0,Math.min(100,totalScore)),
    subs:{div:divScore,mom:momScore,risk:riskScore,corr:corrScore,val:valScore}
  };
}

      '</div>'+

    profile[key]=val;
    renderStep();
  };

    if(step>0){step--;renderStep();}
  };

    if(!profile[q[step].key]) return;

    else{
      radarSaveProfile(profile);
      mr.innerHTML='';
      if(onDone) onDone();
    }
  };

  renderStep();
}

// ── GENERATE REPORT ───────────────────────────────────────────────
async function generateRadarReport(){
  if(RADAR.loading) return;

  // Check profile — show wizard first if missing
  if(!RADAR.profile){
    showRiskProfile(function(){
      generateRadarReport();
    });
    return;
  }

  RADAR.loading=true;
  renderRadar();

  var port=S.portfolio;
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var totM=port.reduce(function(s,h){return s+h.sh*(getLivePrice(h.t)||h.cur||0);},0);
  var pnl=totM-totC;
  var health=calcHealthScore();
  var sent=calcSentiment();

  // Benchmark SPY vs portfolio this week
  var spyLive=LIVE['SPY'];
  var spyChgStr=spyLive?((spyLive.changePct||0)*100).toFixed(2)+'%':'desconocido';

  // Top/worst positions
  var sorted=port.slice().sort(function(a,b){
    var ra=(getLivePrice(a.t)||a.cur||0)/a.cost-1;
    var rb=(getLivePrice(b.t)||b.cur||0)/b.cost-1;
    return rb-ra;
  });
  var topPos=sorted.slice(0,3).map(function(h){
    var r=((getLivePrice(h.t)||h.cur||0)/h.cost-1)*100;
    return h.t+'('+( r>=0?'+':'')+r.toFixed(1)+'%)';
  }).join(', ');
  var worstPos=sorted.slice(-2).map(function(h){
    var r=((getLivePrice(h.t)||h.cur||0)/h.cost-1)*100;
    return h.t+'('+( r>=0?'+':'')+r.toFixed(1)+'%)';
  }).join(', ');

  // BUY signals not in portfolio (opportunities)
  var portTickers=port.map(function(h){return h.t;});
  var opportunities=ALL_SIG
    .filter(function(s){return s.sig==='BUY'&&portTickers.indexOf(s.t)<0;})
    .sort(function(a,b){return b.sc-a.sc;})
    .slice(0,3)
    .map(function(s){return s.t+'(score:'+s.sc+')';}).join(', ');

      return s;
    },0);

  var goalLabel={growth:'Crecimiento de capital',income:'Ingresos pasivos',preservation:'Preservación de capital'}[RADAR.profile.goal]||'Crecimiento';

  // Previous week score for comparison
  var prevScore=RADAR.history.length>0?RADAR.history[0].score:null;
  var scoreChange=prevScore!==null?' (semana anterior: '+prevScore+', cambio: '+(health.total-prevScore>0?'+':'')+( health.total-prevScore)+')':'';

  var systemPrompt='Eres un analista financiero senior especializado en inversores individuales de LATAM. '+
    'Generas reportes semanales concisos, específicos y accionables. '+
    'Siempre usas los tickers y números exactos del portfolio. '+
    'NUNCA das consejos genéricos — todo debe ser específico para este inversor. '+
    'Respondes ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin backticks.';

  var userPrompt='Genera el Radar Financiero semanal para este inversor.\n\n'+
    'PERFIL DEL INVERSOR:\n'+
    '- Tolerancia al riesgo: '+riskLabel+'\n'+
    '- Horizonte: '+horizonLabel+'\n'+
    '- Objetivo: '+goalLabel+'\n\n'+
    'PORTFOLIO ('+port.length+' posiciones):\n'+
    '- Capital total: $'+fmt(S.capital)+'\n'+
    '- Valor mercado: $'+fmt(totM)+'\n'+
    '- P&L: '+(pnl>=0?'+':'')+D(pnl)+' ('+(pnl>=0?'+':'')+((pnl/(totC||1))*100).toFixed(1)+'%)\n'+
    '- Mejores posiciones: '+topPos+'\n'+
    '- Posiciones con pérdida: '+worstPos+'\n\n'+
    'INDICADORES DE MERCADO:\n'+
    '- Health Score: '+health.total+'/100'+scoreChange+'\n'+
    '- Sub-scores: Diversificación '+health.subs.div+'/100, Momentum '+health.subs.mom+'/100, Riesgo '+health.subs.risk+'/100, Correlación '+health.subs.corr+'/100, Valoración '+health.subs.val+'/100\n'+
    '- Sentiment del mercado: '+sent.label+' ('+sent.score+'/100)\n'+
    '- SPY esta semana: '+spyChgStr+'\n'+

    '    {"id":"portfolio","title":"Diagnóstico del Portfolio","content":"Análisis posición por posición. Cuál mantener, cuál reducir, cuál promediar. Menciona tickers concretos. 4-5 oraciones."},\n'+
    '    {"id":"entries","title":"Oportunidades Técnicas","content":"Hasta 2 activos con condición técnica favorable según indicadores. Para cada uno: ticker, zona referencial de precio de soporte, nivel de riesgo referencial por ATR, proyección técnica referencial, ratio R/R estimado, y contexto en 1 línea. Solo análisis técnico educativo — no constituye asesoría financiera ni recomendación de inversión."},\n'+
    '    {"id":"exits","title":"Señales de Alerta","content":"Posiciones con señal técnica de debilidad según los indicadores. Indica cuáles vigilar y por qué. El usuario decide cuándo actuar."},\n'+
    '    {"id":"practice","title":"Práctica de la Semana","content":"UNA sola práctica de gestión de portfolio específica para este inversor, basada en su perfil '+riskLabel+' y sus datos actuales. Concreta, aplicable esta semana."},\n'+
    '    {"id":"action","title":"Puntos de Atención","content":"3 puntos de seguimiento técnico para esta semana. Formato: \'1. [Observación técnica con ticker y nivel de referencia]\'. Análisis educativo, no directivo."}\n'+
    '  ]\n'+
    '}';

  try{
    // Sin delay artificial: antes un setTimeout(600) fingia que la IA
    // "analizaba". El diagnostico es local e instantaneo; el analisis
    // narrativo con IA todavia no esta conectado (ver banner en el reporte).
    var reportObj={
      date:new Date().toISOString(),
      dateLabel:new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
      score:health.total,subs:health.subs,profile:RADAR.profile,

      sections:[
        {id:'health',title:'Score de Salud',content:'Tu portfolio tiene un score de '+health.total+'/100. Diversificación: '+health.subs.div+' · Momentum: '+health.subs.mom+' · Riesgo: '+health.subs.risk+' · Correlación: '+health.subs.corr+' · Valoración: '+health.subs.val+'.'},
        {id:'macro',title:'Análisis Técnico Avanzado',content:icon('volume')+' Los sub-scores del Health Score son calculados localmente con datos en tiempo real. El análisis narrativo completo estará disponible muy pronto.'},
        {id:'action',title:'Mientras tanto',content:'1. Revisa tus posiciones en Portfolio. 2. Consulta Análisis Comparativo para ver indicadores históricos (Alto/Medio/Bajo). 3. Usa el Position Builder para calcular niveles de referencia.'},

  }catch(e){

      date:new Date().toISOString(),
      dateLabel:new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}),
      score:health.total,
      subs:health.subs,

      sections:[{id:'error',title:'Error',content:'No se pudo cargar el análisis. Intenta nuevamente en unos minutos.'}],
    };
  }
  RADAR.loading=false;
  renderRadar();
}

// ── SHARE LINK ────────────────────────────────────────────────────
function radarShare(){
  if(!RADAR.report) return;
  try{
    var payload={
      v:1,
      date:RADAR.report.dateLabel,
      score:RADAR.report.score,
      subs:RADAR.report.subs,
      summary:RADAR.report.summary,
      sections:RADAR.report.sections,
      user:S.user?S.user.name||S.user.email.split('@')[0]:'Usuario',
    };
    var encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    var url=window.location.href.split('#')[0]+'#radar='+encoded;

    // Copy to clipboard
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){
        radarToast(icon('link')+' Link copiado al portapapeles — válido 7 días');
      });
    } else {
      // Fallback: show the URL
      var ta=document.createElement('textarea');
      ta.value=url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      radarToast(icon('link')+' Link copiado al portapapeles');
    }
  }catch(e){
    radarToast('Error al generar el link');
  }
}

function radarCheckSharedLink(){
  var hash=window.location.hash;
  if(!hash||!hash.startsWith('#radar=')) return;
  try{
    var encoded=hash.replace('#radar=','');
    var payload=JSON.parse(decodeURIComponent(escape(atob(encoded))));
    renderRadarShared(payload);
  }catch(e){/* silent */}
}

// ── REPORT HTML BUILDER ───────────────────────────────────────────
function radarReportHTML(r,shared){
  if(!r||!r.sections||!r.sections.length) return '';

  var sectionIcons={
    health:'risk',macro:'macro',portfolio:'port',
    entries:'bull',exits:'bear',practice:'bitacora',action:'sig',error:'alert'
  };
  var sectionColors={
    health:'var(--blue)',macro:'var(--text)',portfolio:'var(--text)',
    entries:'var(--grn)',exits:'var(--red)',practice:'var(--amber)',action:'var(--amber)',
    error:'var(--red)'
  };

  // Score block
  var scoreHTML=
    '<div class="radar-score-block" style="display:flex;gap:20px;align-items:flex-start;margin-bottom:16px">'+
    '<div style="flex-shrink:0">'+
    '<div class="radar-score-big" style="font-size:52px;font-weight:800;color:var(--amber);font-family:\'IBM Plex Mono\',monospace;line-height:1">'+r.score+'</div>'+

    Object.entries({
      'Diversificación':r.subs&&r.subs.div||0,
      'Momentum':r.subs&&r.subs.mom||0,
      'Riesgo':r.subs&&r.subs.risk||0,
      'Correlación':r.subs&&r.subs.corr||0,
      'Valoración':r.subs&&r.subs.val||0,
    }).map(function(kv){
      var label=kv[0],val=kv[1];

    }).join('')+

  // Summary
  // esc() aca: r.summary/sec.content/sec.title pueden venir de un link

  // controlado por quien arma la URL, no solo del propio reporte local —
  // sin esto era XSS reflejado via URL, no solo self-XSS.
  var summaryHTML=r.summary?
    '<div class="radar-summary" style="font-size:14px;color:var(--bright);font-style:italic;margin-bottom:16px;padding:12px 16px;border-left:3px solid var(--amber);background:var(--orange-bg);border-radius:0 var(--r-sm) var(--r-sm) 0">'+esc(r.summary)+'</div>':'';

  // Sections
  var sectHTML=r.sections.map(function(sec){
    var secIco=sectionIcons[sec.id]||'help';
    var color=sectionColors[sec.id]||'var(--text)';
    // Format action plan with numbered items (escapar ANTES de insertar los <br>)
    var content=esc(sec.content||'');
    content=content.replace(/\n(\d+)\.\s/g,'<br><span style="color:var(--amber);font-weight:700">$1.</span> ');
    content=content.replace(/\n/g,'<br>');
    return '<div class="radar-section" style="background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:10px">'+
      '<div class="radar-section-title" style="display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:'+color+';font-family:\'IBM Plex Mono\',monospace;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--border)">'+

      '</div>'+
      '<div class="radar-section-content" style="font-size:12px;color:var(--text);line-height:1.75;font-family:\'IBM Plex Sans\',sans-serif">'+content+'</div>'+
      '</div>';
  }).join('');

  return scoreHTML+summaryHTML+sectHTML;
}

// ── TRIAL SYSTEM ───────────────────────────────────────────────
function getTrialDaysLeft(){
  if(!S.user||S.user.plan!=='trial') return null;
  var started=S.user.trialStarted||Date.now();
  var elapsed=(Date.now()-started)/(1000*60*60*24);
  return Math.max(0,Math.ceil(TRIAL_DAYS-elapsed));
}

function trialBanner(){
  var days=getTrialDaysLeft();
  if(!S.user||!days&&days!==0) return '';
  var urgency=days<=3?'var(--red)':days<=7?'var(--amber)':'var(--blue)';
  var msg=days===0?'Tu trial termina hoy — Activa Pro para no perder acceso':
          days===1?'Último día de trial — Upgrade antes de que expire':
          'Te quedan '+days+' días de trial Pro gratuito';
  return '<div style="background:'+urgency+';padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:11px;font-family:\'IBM Plex Mono\',monospace;color:#fff">'+
    '<span>⏰ '+msg+'</span>'+
    '<button onclick="openModal(\'upgrade\')" style="margin-left:auto;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:var(--r-sm);padding:3px 10px;color:#fff;font-size:11px;cursor:pointer;font-family:\'IBM Plex Mono\',monospace;font-weight:700">Activar Pro →</button>'+
    '</div>';
}

// ── ONBOARDING WIZARD ──────────────────────────────────────────
var ONBOARD={step:0,shown:false};

function showOnboarding(){
  // El perfil se pide ANTES del recorrido, no dentro: mezclar captura con tour
  // aumenta el abandono, y el resto de pasos puede referirse a "tu perfil".
  // Saltable: si el usuario lo cierra, el tour sigue igual.
  var pf=(typeof perfilInversor==='function')?perfilInversor():null;
  if(!pf && !localStorage.getItem('mv_perfil_omitido')){
    try{ localStorage.setItem('mv_perfil_omitido','1'); }catch(e){}
    showRiskProfile(function(){ showOnboarding(); });
    return;
  }
  var steps=[
    {icon:'port',title:'Tu portfolio, siempre actualizado',
     desc:'Agrega tus posiciones y MOY IQ Invest las conecta con precios de Yahoo Finance. Ve tu P&L con datos de mercado actualizados.',
     action:'Ver Portfolio',page:'port'},
    {icon:'sig',title:'Señales inteligentes',
     desc:'20 activos analizados con 4 indicadores técnicos. Score compuesto 0-100. Indicadores alto, medio y bajo actualizados con el mercado.',
     action:'Ver Señales',page:'sig'},
    {icon:'pb',title:'Position Builder',
     desc:'Calcula el tamaño óptimo de cada operación basado en tu capital y tolerancia al riesgo. Nunca más sobredimensiones una posición.',
     action:'Calcular entrada',page:'pb'},
  ];

  var step=steps[ONBOARD.step];
  var progress=(ONBOARD.step/steps.length*100).toFixed(0);
  var isLast=ONBOARD.step===steps.length-1;

  document.getElementById('mroot').innerHTML=
    '<div class="overlay" style="z-index:500" onclick="">'+
    '<div class="modal" style="max-width:440px;text-align:center" onclick="event.stopPropagation()">'+
    // Progress bar
    '<div style="height:3px;background:var(--border);border-radius:2px;margin-bottom:22px;overflow:hidden">'+
    '<div style="height:100%;width:'+progress+'%;background:var(--amber);border-radius:2px;transition:.4s"></div></div>'+
    // Step counter
    '<div style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:16px">'+
    'Paso '+(ONBOARD.step+1)+' de '+steps.length+'</div>'+
    // Icon
    '<div style="width:48px;height:48px;margin:0 auto 14px;color:var(--amber)">'+icon(step.icon,'ico-lg').replace('class="ico ico-lg"','class="ico ico-lg" style="width:100%;height:100%"')+'</div>'+
    // Title
    '<h2 style="margin-bottom:10px;font-size:18px">'+step.title+'</h2>'+
    // Description
    '<p style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:24px">'+step.desc+'</p>'+
    // Buttons
    '<div style="display:flex;gap:10px;justify-content:center">'+
    (ONBOARD.step>0?'<button class="btn" onclick="onboardPrev()">← Anterior</button>':'')+
    (isLast?
      '<button class="btn-big" onclick="onboardFinish()">Empezar a invertir '+icon('rocket')+'</button>':
      '<button class="btn-big" onclick="onboardNext()">'+step.action+' →</button>')+
    '</div>'+
    // Skip
    '<div style="margin-top:14px"><button onclick="onboardFinish()" style="background:transparent;border:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:\'IBM Plex Mono\',monospace">Saltar tour</button></div>'+
    '</div></div>';
}

function onboardNext(){
  var steps=[{page:'port'},{page:'sig'},{page:'pb'}];   // sin IA mientras no exista
  var s=steps[ONBOARD.step];
  if(s.fn) window[s.fn]&&window[s.fn]();
  else if(s.page) S.page=s.page;
  ONBOARD.step++;
  if(ONBOARD.step<steps.length) showOnboarding();
  else onboardFinish();
}
function onboardPrev(){ONBOARD.step=Math.max(0,ONBOARD.step-1);showOnboarding();}
function onboardFinish(){
  document.getElementById('mroot').innerHTML='';
  ONBOARD.shown=true;
  try{localStorage.setItem('mv_onboard_done','1');}catch(e){/* silent */}
  renderMain();
}
function checkOnboarding(){
  try{if(localStorage.getItem('mv_onboard_done')) return;}catch(e){/* silent */}
  if(!ONBOARD.shown&&S.user){
    setTimeout(showOnboarding, 800);
  }
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────────
// Los controles construidos sobre <div role="button" tabindex="0"> no reciben
// activacion por teclado nativa como un <button>. Un unico manejador delegado
// los cubre a todos en lugar de repetir onkeydown en cada plantilla JS.
// Va en su propio listener y ANTES del guard de sesion: activar un control no
// es un atajo de la app, y varios de estos controles viven en la pantalla de
// acceso, donde todavia no hay S.user.
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  var ctrl=document.activeElement;
  if(!ctrl||!ctrl.getAttribute) return;
  if(ctrl.getAttribute('role')==='button'&&ctrl.tagName!=='BUTTON'){
    e.preventDefault();
    ctrl.click();
  }
});

document.addEventListener('keydown',function(e){
  if(!S.user) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  var map={
    'n':'news','d':'dash','p':'port','w':'watch','s':'sig',
    'b':'pb','c':'comp','m':'sentiment','a':'coach',
    'i':'ind','r':'risk','k':'back','t':'alert'
  };
  if(e.key==='?' ){showShortcuts();return;}
  if(e.key==='Escape'){
    document.getElementById('mroot').innerHTML='';
    closeDrawer();
    if(document.getElementById('ai-panel'))
      document.getElementById('ai-panel').style.transform='translateX(100%)';
    return;
  }
  if(e.altKey&&map[e.key.toLowerCase()]){
    e.preventDefault();
    setPage(map[e.key.toLowerCase()]);
  }
  if(e.key==='r'&&e.ctrlKey){e.preventDefault();manualRefresh();}
});

  var SUGS=[

    ["GOOGL","META","Publicidad digital"],

  ];
  var sugRows=SUGS.map(function(s){
    var label=s.slice(0,-1).join(" vs ");
    var desc=s[s.length-1];
    // Comillas SIMPLES: el atributo onclick va entre comillas dobles, asi que
    // unas dobles aqui lo cerraban en el primer ticker y el navegador se
    // quedaba con onclick="compSet(" — los pares rapidos no hacian nada.
    var args=s.slice(0,-1).map(function(t){return "'"+t+"'";}).join(",");
    return '<div role="button" tabindex="0" onclick="compSet('+args+')" style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;cursor:pointer;border-radius:var(--r-sm);border:1px solid var(--border);margin-bottom:4px;transition:.15s" onmouseover="this.style.borderColor=\'var(--orange-bd)\';this.style.background=\'var(--orange-bg)\'" onmouseout="this.style.borderColor=\'var(--border)\';this.style.background=\'transparent\'">'+
      '<span style="font-size:11px;font-weight:600;color:var(--bright);font-family:\'IBM Plex Mono\',monospace">'+label+'</span>'+
      '<span style="font-size:11px;color:var(--text3)">'+desc+'</span></div>';
  }).join('');

  var chartContent='';
  var statsContent='';
  var hasData=Object.keys(COMP.data).length===COMP.tickers.length;

  if(COMP.loading){
    chartContent='<div class="dload"><div class="spin"></div>Cargando histórico...</div>';
  } else if(!hasData){
    chartContent='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;text-align:center;color:var(--text3)">'+
      '<div style="margin-bottom:10px;color:var(--text3)">'+icon('scale','ico-xl')+'</div>'+
      '<div style="font-size:13px;font-weight:600;color:var(--bright);margin-bottom:5px">Comparador head-to-head</div>'+
      '<div style="font-size:11px;font-family:\'IBM Plex Mono\',monospace">Presiona "Comparar" para cargar datos reales</div></div>';
  } else {
    var series=[];
    COMP.tickers.forEach(function(t,ti){
      var hist=COMP.data[t];
      if(!hist||!hist.length) return;
      var base=hist[0].close;
      var pts=hist.map(function(d,i){return{x:i,y:(d.close/base-1)*100,close:d.close};});
      series.push({t:t,pts:pts,color:colors[ti]});
    });

    // Build SPY benchmark series (base-100 normalized)
    var spySeries=null;
    if(COMP.showSPY&&COMP.spy&&COMP.spy.length>0&&COMP.tickers.indexOf('SPY')<0){
      var spyBase=COMP.spy[0].close;
      spySeries={pts:COMP.spy.map(function(d,i){return{x:i,y:(d.close/spyBase-1)*100};})};
    }

    if(series.length>0){
      var W=520,H=200;
      var allY=[];
      series.forEach(function(s){s.pts.forEach(function(p){allY.push(p.y);});});
      if(spySeries) spySeries.pts.forEach(function(p){allY.push(p.y);});
      var minY=Math.min.apply(null,allY)-3;
      var maxY=Math.max.apply(null,allY)+3;
      var rng=maxY-minY||1;
      var nPts=series[0].pts.length;
      var spyPts=spySeries?spySeries.pts.length:nPts;
      var xS=function(i,total){return(i/Math.max((total||nPts)-1,1))*W;};
      var yS=function(v){return H-((v-minY)/rng)*H;};

      var grid='';
      [-20,-10,0,10,20,30].forEach(function(v){
        if(v<minY||v>maxY) return;
        var y=yS(v).toFixed(1);
        var col=v===0?'rgba(255,255,255,.15)':'rgba(255,255,255,.04)';
        grid+="<line x1='0' y1='"+y+"' x2='"+W+"' y2='"+y+"' stroke='"+col+"' stroke-width='1'/>";
        grid+="<text x='3' y='"+(parseFloat(y)-2).toFixed(1)+"' fill='var(--text3)' font-size='8' font-family='IBM Plex Mono,monospace'>"+(v>=0?'+':'')+v+"%</text>";
      });

      // SPY dashed benchmark line (drawn first, behind tickers)
      var spySvg='';
      if(spySeries){
        var spts=spySeries.pts;
        var spyStr=spts.map(function(p,i){return xS(i,spyPts).toFixed(1)+','+yS(p.y).toFixed(1);}).join(' ');
        var spyLast=spts[spts.length-1];
        var slx=xS(spyPts-1,spyPts);var sly=yS(spyLast.y);
        spySvg="<polyline points='"+spyStr+"' fill='none' stroke='rgba(156,163,175,.5)' stroke-width='1.5' stroke-dasharray='5,3'/>"+
          "<text x='"+(slx+5).toFixed(1)+"' y='"+(sly+3).toFixed(1)+"' fill='rgba(156,163,175,.7)' font-size='8' font-family='IBM Plex Mono,monospace'>SPY "+(spyLast.y>=0?'+':'')+spyLast.y.toFixed(1)+"%</text>";
      }

      var lines_svg=series.map(function(s){
        var pts_str=s.pts.map(function(p){return xS(p.x,nPts).toFixed(1)+','+yS(p.y).toFixed(1);}).join(' ');
        var last=s.pts[s.pts.length-1];
        var lx=xS(last.x,nPts);var ly=yS(last.y);
        return "<polyline points='"+pts_str+"' fill='none' stroke='"+s.color+"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>"+
          "<circle cx='"+lx.toFixed(1)+"' cy='"+ly.toFixed(1)+"' r='3' fill='"+s.color+"'/>"+
          "<text x='"+(lx+5).toFixed(1)+"' y='"+(ly+3).toFixed(1)+"' fill='"+s.color+"' font-size='9' font-weight='700' font-family='IBM Plex Mono,monospace'>"+esc(s.t)+" "+(last.y>=0?'+':'')+last.y.toFixed(1)+"%</text>";
      }).join('');

      chartContent='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px">'+grid+spySvg+lines_svg+'</svg>';

      // Stats
      var tickerStats=series.map(function(s){
        var closes=s.pts.map(function(p){return p.close;});
        var returns=closes.slice(1).map(function(c,i){return(c-closes[i])/closes[i]*100;});
        var mean=returns.reduce(function(a,b){return a+b;},0)/(returns.length||1);
        var vol=Math.sqrt(returns.reduce(function(a,r){return a+(r-mean)*(r-mean);},0)/(returns.length||1));
        var ret=s.pts[s.pts.length-1].y;
        var maxR=Math.max.apply(null,s.pts.map(function(p){return p.y;}));
        var minR=Math.min.apply(null,s.pts.map(function(p){return p.y;}));
        // Anualiza con la constante de dias de trading/ano (datos diarios,
        // interval=1d en fetchHistory) — NO con closes.length: dividir 252
        // por el tamano de la ventana hacia que el mismo activo mostrara un
        // Sharpe distinto solo por cambiar el período elegido (1M vs 1A),
        // sin que cambiara nada del riesgo/retorno real.
        var sharpe=vol>0?(mean/vol)*Math.sqrt(252):0;
        var sig=ALL_SIG.find(function(x){return x.t===s.t;})||{sig:'HOLD',sc:60};
        var lq=LIVE[s.t];
        return{t:s.t,color:s.color,ret:ret,vol:vol,maxR:maxR,minR:minR,sharpe:sharpe,
          cur:lq?lq.price:closes[closes.length-1],sig:sig.sig+' ('+sig.sc+')',returns:returns};
      });

      if(tickerStats.length>=2){
        var r0=tickerStats[0].returns;
        tickerStats.forEach(function(s,i){
          if(i===0){s.corr=1.00;return;}
          var n=Math.min(r0.length,s.returns.length);
          var m1=r0.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
          var m2=s.returns.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
          var cov=0,v1=0,v2=0;
          for(var k=0;k<n;k++){cov+=(r0[k]-m1)*(s.returns[k]-m2);v1+=(r0[k]-m1)*(r0[k]-m1);v2+=(s.returns[k]-m2)*(s.returns[k]-m2);}
          s.corr=(v1>0&&v2>0)?cov/Math.sqrt(v1*v2):0;
        });
      }

      var METRICS=[
        {k:'ret',    label:'Retorno período', fmt:function(v){return(v>=0?'+':'')+v.toFixed(2)+'%';}, higher:true},
        {k:'vol',    label:'Volatilidad',      fmt:function(v){return v.toFixed(2)+'%';},              higher:false},
        {k:'sharpe', label:'Sharpe ratio',     fmt:function(v){return v.toFixed(2)+'x';},              higher:true},
        {k:'maxR',   label:'Máximo',           fmt:function(v){return(v>=0?'+':'')+v.toFixed(2)+'%';}, higher:true},

        {k:'cur',    label:'Precio actual',    fmt:function(v){return'$'+fmtD(v);},                    higher:null},

async function compLoad(){
  if(COMP.loading) return;
  COMP.tickers=COMP.tickers.filter(function(t){return t&&t.trim().length>0;});
  if(COMP.tickers.length<2){showToast('Selecciona al menos 2 tickers','warning');return;}
  COMP.loading=true;COMP.data={};COMP.spy=null;COMP.synthetic=[];renderComp();
  var rangeMap={30:'1mo',60:'3mo',90:'3mo',130:'6mo',365:'1y',1095:'5y'}; // 2mo y 3y no existen en Yahoo: devolvian 400
  var rng=rangeMap[COMP.range]||'3mo';
  try{
    var promises=COMP.tickers.map(function(t){
      return fetchHistory(t,rng).then(function(hist){
        if(hist&&hist.length>5){COMP.data[t]=hist;}
        else{COMP.data[t]=genFallback(getLivePrice(t)||100,COMP.range);if(COMP.synthetic.indexOf(t)<0)COMP.synthetic.push(t);}
        if(!LIVE[t]) return fetchQuote(t).then(function(q){if(q) LIVE[t]=q;});
      }).catch(function(){COMP.data[t]=genFallback(getLivePrice(t)||100,COMP.range);if(COMP.synthetic.indexOf(t)<0)COMP.synthetic.push(t);});
    });
    // Fetch SPY benchmark unless already comparing it
    var spyPromise=COMP.tickers.indexOf('SPY')<0
      ?fetchHistory('SPY',rng).then(function(h){if(h&&h.length>5)COMP.spy=h;}).catch(function(){})
      :Promise.resolve();
    await Promise.all(promises.concat([spyPromise]));
  }catch(e){/* silent */}
  COMP.loading=false;renderComp();
}

function renderDivs(){
  var plan=planOf();if(plan.locked&&plan.locked.indexOf('divs')>=0){document.getElementById('main').innerHTML=lockedBanner('Dividendos','Proyecta ingresos por dividendos anuales y mensuales de todo tu portafolio.');return;}

    var d=DIVS.data[h.t];
    var annualRate=d?d.trailingAnnualDividendRate||d.dividendRate:0;

    var cur=getLivePrice(h.t)||h.cur||0;
    var yld=annualRate&&cur?annualRate/cur:0;
    var freq=d&&d.dividendRate&&d.trailingAnnualDividendRate?Math.round(d.trailingAnnualDividendRate/d.dividendRate):0;
    var freqLabel=freq===12?'Mensual':freq===4?'Trimestral':freq===2?'Semestral':freq===1?'Anual':freq===0?'Sin dividendo':'Irregular';
    return annualRate>0?{t:h.t,sh:h.sh,cur:cur,annualRate:annualRate,annualIncome:annualIncome,yld:yld,freqLabel:freqLabel}:null;

  var totalAnnual=divRows.reduce(function(s,r){return s+r.annualIncome;},0);

  var tableRows=divRows.map(function(r){

      '<td>'+r.sh+'</td>'+
      '<td style="font-weight:600;color:var(--bright)">$'+fmtD(r.annualRate)+'/acción</td>'+

  document.getElementById('main').innerHTML=
    '<div class="fos-module-header"><div><div class="fos-module-crumb">Seguir · Dividendos</div><h1 class="fos-module-title">Dividendos</h1>'+
    '<div class="fos-module-sub">Proyección de ingresos · 12 meses</div></div>'+

    '<div class="krow">'+
    kpi('Ingreso anual'+(USER_CURRENCY!=='USD'?' USD':''),'$'+fmtD(totalAnnual),'Proyectado','g')+

// ── PLAN DE CAPITAL (Pro) ────────────────────────────────────────
// Guía educativa de distribución de capital mensual por ETF, con escalera de
// tramos según distancia a SMA20/50/100/200 y condición de RSI. Referencial.
// La escalera era fija e identica para todo usuario, aunque el wizard de perfil
// lleva capturando 'horizon' desde siempre sin que nadie lo leyera. Ahora el
// reparto depende del horizonte declarado: es aritmetica de distribucion, no
// consejo. Horizonte corto reparte parejo entre las cuatro medias; horizonte
// largo concentra la mitad en la SMA200.
var CAP_LADDERS={
  short: [{sma:20,pct:0.25},{sma:50,pct:0.25},{sma:100,pct:0.25},{sma:200,pct:0.25}],
  mid:   [{sma:20,pct:0.15},{sma:50,pct:0.20},{sma:100,pct:0.25},{sma:200,pct:0.40}],
  long:  [{sma:20,pct:0.10},{sma:50,pct:0.15},{sma:100,pct:0.25},{sma:200,pct:0.50}]
};
function capLadder(){
  var pf=(typeof perfilInversor==='function')?perfilInversor():null;
  var h=(pf&&pf.horizon)||'long';
  var base=CAP_LADDERS[h]||CAP_LADDERS.long;
  return base.map(function(t){return {sma:t.sma, pct:t.pct, label:'SMA'+t.sma};});
}
// Se conserva el nombre para no romper referencias existentes.
var CAP_LADDER=capLadder();
// Carga la cesta de ejemplo del perfil en el plan. Editable despues: solo
// rellena los valores de partida para que la herramienta tenga con que calcular.
function capUsarCesta(json){
  try{
    var cesta=JSON.parse(json);
    S.capitalPlan.tickers=cesta.map(function(c){return {t:c[0], pct:c[1]};});
    var pf=(typeof perfilInversor==='function')?perfilInversor():null;
    if(pf&&pf.monthly&&parseFloat(pf.monthly)>0) S.capitalPlan.monthly=parseFloat(pf.monthly);
    _capSave();
    showToast('Punto de partida cargado — edítalo a tu gusto');
    loadCapitalData();
  }catch(e){ showToast('No se pudo cargar el punto de partida','error'); }
}
function _smaLast(closes,n){ if(closes.length<n) return null; var arr=TI.sma(closes,n); for(var i=arr.length-1;i>=0;i--){ if(arr[i]!=null) return arr[i]; } return null; }

// ── Plan de Capital: gestión de tickers ─────────────────────────────
function _capKey(){ return 'cap_tk_'+(S.user&&S.user.id||'demo'); }
function _capSave(){ try{
  localStorage.setItem(_capKey(),JSON.stringify(S.capitalPlan.tickers));
  localStorage.setItem(_capKey()+'_m',String(S.capitalPlan.monthly||0));  // no se guardaba: volvia a 1000 en cada recarga
}catch(e){} }
function _capLoad(){
  try{
    var m=localStorage.getItem(_capKey()+'_m');
    if(m&&parseFloat(m)>0) S.capitalPlan.monthly=parseFloat(m);
    else {
      // sin valor guardado, se toma el del perfil antes que el 1000 fijo
      var pf=(typeof perfilInversor==='function')?perfilInversor():null;
      if(pf&&pf.monthly&&parseFloat(pf.monthly)>0) S.capitalPlan.monthly=parseFloat(pf.monthly);
    }
    var raw=localStorage.getItem(_capKey());
    if(raw){ S.capitalPlan.tickers=JSON.parse(raw); return; }
  }catch(e){}
  // sin datos guardados → importar desde portafolio si existe
  capImportFromPortfolio(true);
}
function capImportFromPortfolio(silent){
  if(!S.portfolio||!S.portfolio.length){ S.capitalPlan.tickers=[]; return; }
  // Antes repartia a partes iguales (100/N), que no responde a ningun criterio:
  // ni refleja tu asignacion ni corrige nada. Ahora el aporte va a lo que esta
  // POR DEBAJO de su objetivo, en proporcion a cuanto le falta. Asi el aporte
  // mensual rebalancea sin vender: sin costes de transaccion ni hecho imponible.
  // Si nada esta por debajo, sigue la asignacion objetivo.
  var reparto=(typeof repartoPorDesvio==='function')?repartoPorDesvio():[];
  if(reparto.length){
    S.capitalPlan.tickers=reparto.map(function(r){ return {t:r.t, pct:r.pct}; });
  } else {
    var eq=Math.round(100/S.portfolio.length);
    S.capitalPlan.tickers=S.portfolio.map(function(h,i){
      return {t:h.t, pct:(i===S.portfolio.length-1?100-eq*(S.portfolio.length-1):eq)};
    });
  }
  _capSave();
  if(!silent){ S.capitalResults=null; if(S.page==='capital') renderMain(); }
}
function capAddTicker(t,pct){
  t=(t||'').toUpperCase().trim();
  if(!t) return;
  if(!S.capitalPlan.tickers) S.capitalPlan.tickers=[];
  if(S.capitalPlan.tickers.find(function(x){return x.t===t;})) return;
  S.capitalPlan.tickers.push({t:t, pct:parseFloat(pct)||0});
  _capSave(); S.capitalResults=null; if(S.page==='capital') renderMain();
}
function capRemoveTicker(t){
  if(!S.capitalPlan.tickers) return;
  S.capitalPlan.tickers=S.capitalPlan.tickers.filter(function(x){return x.t!==t;});
  _capSave(); S.capitalResults=null; if(S.page==='capital') renderMain();
}
function capUpdatePct(t,val){
  if(!S.capitalPlan.tickers) return;
  var item=S.capitalPlan.tickers.find(function(x){return x.t===t;});
  if(item){ item.pct=parseFloat(val)||0; _capSave(); }
}
function capHandleAddKey(e){ if(e.key==='Enter') capAddTicker(document.getElementById('cap-add-t').value, document.getElementById('cap-add-p').value); }

// Rellena el importe con el capital que el usuario ya tiene sin comprometer.
// Se avisa de forma explicita porque repartir un monto unico NO es lo mismo que
// un aporte periodico: la escalera espera precios mejores para soltar los tramos
// altos, y con dinero que ya se tiene eso deja capital parado, mientras que con
// un aporte mensual no cuesta nada esperar (el mes siguiente entra dinero igual).
function capUsarDisponible(monto){
  S.capitalPlan.monthly=monto;
  _capSave();
  renderCapital();
  showToast('Importe fijado en $'+fmt(Math.round(monto))+' — reparto de un monto unico, no aporte recurrente');
}

async function loadCapitalData(){
  if(S.capitalLoading) return;
  var inp=document.getElementById('cap-monthly');
  if(inp){ var v=parseFloat(inp.value); if(v>0) S.capitalPlan.monthly=v; }
  if(!S.capitalPlan.tickers) _capLoad();
  var tickers=S.capitalPlan.tickers||[];
  if(!tickers.length){ S.capitalResults=[]; if(S.page==='capital') renderMain(); return; }
  S.capitalLoading=true; if(S.page==='capital') renderMain();
  var results=[];
  for(var i=0;i<tickers.length;i++){
    var tk=tickers[i];
    var sig=ALL_SIG.find(function(s){return s.t===tk.t;});
    var row={t:tk.t, name:sig?sig.n:tk.t, pct:tk.pct};
    try{
      var hist=await fetchHistory(tk.t,'1y');
      var closes=(hist||[]).map(function(d){return d.close;}).filter(function(c){return c>0;});
      if(closes.length<25){ results.push({row:row, error:true}); continue; }
      var price=closes[closes.length-1];
      var rsiArr=TI.rsi(closes,14); var rsi=rsiArr[rsiArr.length-1];
      var smas={20:_smaLast(closes,20),50:_smaLast(closes,50),100:_smaLast(closes,100),200:_smaLast(closes,200)};
      results.push({row:row, price:price, rsi:rsi, smas:smas});
    }catch(e){ results.push({row:row, error:true}); }
  }
  S.capitalResults=results; S.capitalLoading=false;

// ── REBALANCING TOOL ─────────────────────────────────────────────
var REBAL={targets:{}};

// ── ASIGNACION OBJETIVO ──────────────────────────────────────────
// REBAL.targets no se persistia: vivia en memoria y se perdia en cada recarga,
// asi que el "objetivo" nunca sobrevivia a cerrar la pestana. Y se inicializaba
// desde los pesos ACTUALES, con lo que el objetivo siempre coincidia con la
// realidad y el rebalanceo jamas señalaba desvio: se auto-justificaba.
// Ahora persiste por usuario y, si no hay nada guardado, arranca desde la cesta
// de referencia del perfil declarado.
function _rebalKey(){ return 'rebal_tg_'+(S.user&&S.user.id||'demo'); }
function rebalSaveTargets(){
  try{ localStorage.setItem(_rebalKey(),JSON.stringify(REBAL.targets)); }catch(e){}
}
function rebalLoadTargets(){
  try{
    var raw=localStorage.getItem(_rebalKey());
    if(raw){ REBAL.targets=JSON.parse(raw)||{}; return true; }
  }catch(e){}
  return false;
}
// Cesta de referencia por perfil, la misma que ofrece Plan de Capital.
function cestaDePerfil(){
  var pf=(typeof perfilInversor==='function')?perfilInversor():null;
  if(!pf) return null;
  var cestas={
    '1':[['BIL',40],['BND',30],['VYM',20],['GLD',10]],
    '2':[['BND',30],['SCHD',30],['VTI',30],['GLD',10]],
    '3':[['VTI',45],['VXUS',20],['BND',20],['GLD',15]],
    '4':[['VTI',40],['QQQ',30],['VXUS',20],['GLD',10]],
    '5':[['QQQ',45],['VTI',35],['VXUS',20]]
  };
  return cestas[String(pf.risk)]||cestas['3'];
}
// Reparto del aporte mensual segun DESVIO respecto al objetivo: se aporta a lo
// que esta por debajo, en proporcion a cuanto le falta. Rebalancear comprando
// en vez de vendiendo evita costes de transaccion y hechos imponibles.
function repartoPorDesvio(){
  var port=S.portfolio||[];
  if(!port.length) return [];
  var totM=port.reduce(function(a,h){return a+h.sh*(getLivePrice(h.t)||h.cur||0);},0);
  if(!(totM>0)) return [];
  var filas=port.map(function(h){
    var val=h.sh*(getLivePrice(h.t)||h.cur||0);
    var actual=val/totM*100;
    var obj=(REBAL.targets[h.t]!=null)?REBAL.targets[h.t]:actual;
    return {t:h.t, actual:actual, objetivo:obj, desvio:obj-actual};
  });
  var bajo=filas.filter(function(f){return f.desvio>0.5;});
  // Si nada esta por debajo del objetivo, el aporte sigue la asignacion objetivo
  var base=bajo.length?bajo:filas.filter(function(f){return f.objetivo>0;});
  var suma=base.reduce(function(a,f){return a+(bajo.length?f.desvio:f.objetivo);},0);
  if(!(suma>0)) return [];
  return base.map(function(f){
    var peso=(bajo.length?f.desvio:f.objetivo)/suma*100;
    return {t:f.t, pct:Math.round(peso*10)/10, actual:f.actual, objetivo:f.objetivo, desvio:f.desvio};
  }).sort(function(a,b){return b.pct-a.pct;});
}

function renderRebal(){
  var plan=planOf();if(plan.locked&&plan.locked.indexOf('rebal')>=0){document.getElementById('main').innerHTML=lockedBanner('Rebalanceo','Mantén tu portafolio alineado con tus objetivos de asignación de activos.');return;}
  var port=S.portfolio;
  var totM=port.reduce(function(s,h){return s+h.sh*(getLivePrice(h.t)||h.cur||0);},0);

  // Primero se intenta recuperar lo guardado. Si no hay nada, el objetivo sale
  // de la cesta del perfil para los tickers que coincidan; el resto cae al peso
  // actual como ultimo recurso. Antes TODO arrancaba del peso actual, con lo que
  // objetivo y realidad siempre coincidian y el desvio era siempre cero.
  if(!Object.keys(REBAL.targets).length) rebalLoadTargets();
  var cesta=(typeof cestaDePerfil==='function')?cestaDePerfil():null;
  var mapaCesta={};
  if(cesta) cesta.forEach(function(c){ mapaCesta[c[0]]=c[1]; });
  port.forEach(function(h){
    if(REBAL.targets[h.t]===undefined){
      REBAL.targets[h.t]= (mapaCesta[h.t]!=null)
        ? mapaCesta[h.t]
        : Math.round(h.sh*(getLivePrice(h.t)||h.cur||0)/(totM||1)*100);
    }
  });

  var sumTargets=Object.values(REBAL.targets).reduce(function(s,v){return s+v;},0);
  var balanced=Math.abs(sumTargets-100)<1;

var _bootInterval=null;
var _bootRunning=false;

async function bootLiveData(){
  if(_bootRunning) return;
  _bootRunning=true;
  // Scores reales en segundo plano: no bloquea el arranque y se sirve de cache
  // si ya se calcularon hace menos de 30 min.
  setTimeout(function(){ loadAllSigScores(); }, 1200);
  if(_bootInterval) clearInterval(_bootInterval);

  // Boot: portfolio + watchlist + top señales del dashboard
  var tickers=[];
  S.portfolio.forEach(function(h){if(tickers.indexOf(h.t)<0)tickers.push(h.t);});
  S.watchlist.forEach(function(t){if(tickers.indexOf(t)<0)tickers.push(t);});
  // TODAS las señales, no solo las 8 primeras. Señales muestra hasta 20 filas
  // (maxS=999 en Pro) y las columnas Δ Hoy y vs mín 52s salen de LIVE[t]: con
  // solo 8 tickers cargados, 12 de las 20 filas quedaban vacias.
  // Son 20 tickers = 2 peticiones de 10, el mismo coste que ya tenia el resto.
  ALL_SIG.forEach(function(s){if(tickers.indexOf(s.t)<0)tickers.push(s.t);});

  // ① Show cached prices instantly — user sees something immediately
  try{
    var _c=JSON.parse(localStorage.getItem('mv_prices_cache')||'null');
    if(_c&&_c.live&&(Date.now()-_c.ts)<LIVE_CACHE_TTL){
      Object.assign(LIVE,_c.live);
      liveFromCache=true;liveUpdated=_c.ts;
      S.portfolio.forEach(function(h){if(LIVE[h.t])h.cur=LIVE[h.t].price;});
      updateLiveBadge();
      updateLivePricesInDOM();
    }
  }catch(e){/* silent */}

  // ② Fetch fresh in background — re-render current page so tablas sin data-live
  //    (dashboard Top Señales / Portfolio) reflejen los precios recién cargados
  refreshLive(tickers).then(function(){
    updateLiveBadge();
    updateLivePricesInDOM();
    checkAlerts();
    // El dashboard arma sus tablas en render-time (sin data-live-*), así que
    // necesita un re-render completo para mostrar precios y Δ% live.
    if(S.user&&(S.page==='dash'||S.page==='port'||S.page==='watch')){
      try{ renderMain(); }catch(e){/* silent */}
    }
  }).catch(function(){});

  // ③ Auto-refresh every 5 min (only when tab visible and during market hours)
  _bootInterval=setInterval(function(){
    if(!S.user){clearInterval(_bootInterval);_bootInterval=null;_bootRunning=false;return;}
    if(document.hidden) return; // skip when tab not visible
    var t2=[];
    S.portfolio.forEach(function(h){if(t2.indexOf(h.t)<0)t2.push(h.t);});
    S.watchlist.forEach(function(t){if(t2.indexOf(t)<0)t2.push(t);});
    // Mismo conjunto que en el arranque: si el refresco periodico no incluyera
    // las señales, sus columnas en vivo se quedarian congeladas a los 5 minutos.
    ALL_SIG.forEach(function(s){if(t2.indexOf(s.t)<0)t2.push(s.t);});
    refreshLive(t2).then(function(){
      updateLiveBadge();
      updateLivePricesInDOM();
      checkAlerts();
    }).catch(function(){});
  },LIVE_REFRESH_MS);
}

function stopBoot(){
  if(_bootInterval){clearInterval(_bootInterval);_bootInterval=null;}
  _bootRunning=false;
}

// Activas en producción, invocadas en cada login/signup vía
// _sbLoadUserDataImpl. Activado en un commit posterior a este bloque original.

// Versions currently required for full access
function getRequiredConsents(){
  return [
    {document_type:'terms',                 version:'v1'},
    {document_type:'privacy',               version:'v1'},
    {document_type:'investment_disclaimer', version:'v1'}
  ];
}

// Read all consent records for the authenticated user from Supabase
async function readUserConsents(userId){
  try{
    // Timeout de 8s: esta llamada se ejecuta en cada login/signup (via
    // checkConsentGate <- _sbLoadUserDataImpl) y no tenia guardia — un cuelgue
    // de Supabase aca freezaba el post-login entero, igual que el resto de
    // los awaits ya corregidos en esta misma funcion.
    var res=await withTimeout(
      sb.from('consents').select('document_type,version').eq('user_id',userId),
      8000
    );
    if(res.error) throw res.error;
    return res.data||[];
  }catch(e){
    console.error('readUserConsents failed',e);
    return [];
  }
}

// Return which required consents are missing given the existing ones
function getMissingConsents(existing){
  var required=getRequiredConsents();
  return required.filter(function(req){
    return !existing.some(function(e){
      return e.document_type===req.document_type && e.version===req.version;
    });
  });
}

// Insert only the missing consents — no upsert, no update needed
async function recordUserConsents(userId,source){
  try{
    var existing=await readUserConsents(userId);
    var missing=getMissingConsents(existing);
    if(missing.length===0) return {ok:true,inserted:0};
    var ua=navigator.userAgent.slice(0,200);
    var rows=missing.map(function(c){
      return {
        user_id:      userId,
        document_type:c.document_type,
        version:      c.version,
        source:       source||'unknown',
        user_agent:   ua
      };
    });
    // Timeout de 8s: mismo riesgo que readUserConsents — sin guardia, un
    // cuelgue en el insert freezaba el modal de consentimiento sin salida.
    var res=await withTimeout(sb.from('consents').insert(rows),8000);
    if(res.error) throw res.error;
    return {ok:true,inserted:rows.length};
  }catch(e){
    console.error('recordUserConsents failed',e);
    return {ok:false,error:e.message||'insert_failed'};
  }
}
