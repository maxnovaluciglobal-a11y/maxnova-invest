// Mini grafica de la banda de mercado. La version que vivia dentro de Contexto
// usaba #00b050/#ff4444 hardcodeados, que ya no son los colores de la paleta:
// esta usa los tokens semanticos --pos/--neg.
function bandSpark(pts,isUp){
  if(!pts||pts.length<2) return '';
  var validos=pts.filter(function(v){return v!==null&&v!==undefined&&isFinite(v);});
  if(validos.length<2) return '';
  var w=52,h=16;
  var mn=Math.min.apply(null,validos), mx=Math.max.apply(null,validos), rng=(mx-mn)||1;
  var coords=validos.map(function(v,i){
    return (i/(validos.length-1)*w).toFixed(1)+','+(h-(v-mn)/rng*h).toFixed(1);
  }).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true" style="display:block;flex-shrink:0">'+
    '<polyline points="'+coords+'" fill="none" stroke="'+(isUp?'var(--pos)':'var(--neg)')+'" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function renderTopbar(){
  var el=document.getElementById('topbar');
  if(!el||!S.user) return;
  var u=S.user;
  var initials=(u.name||'U').split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2)||'U';
  var r=DE_CACHE.regime;
  var v=DE_CACHE.vix;

  // Banda completa de mercado. Antes solo mostraba 4 simbolos (SPY/QQQ/VIX/BTC)
  // y los 11 vivian dentro de Contexto: el dato mas util de la app solo se veia
  // entrando a una pantalla concreta. Ahora la banda es global y Contexto ya no
  // la duplica.
  var BAR_DEF=[
    {sym:'^GSPC',   label:'S&P 500'},
    {sym:'^DJI',    label:'Dow 30'},
    {sym:'^IXIC',   label:'Nasdaq'},
    {sym:'^RUT',    label:'Russell 2K'},
    {sym:'CL=F',    label:'Crude'},
    {sym:'GC=F',    label:'Gold'},
    {sym:'SI=F',    label:'Silver'},
    {sym:'EURUSD=X',label:'EUR/USD'},
    {sym:'^TNX',    label:'10-Yr'},
    {sym:'BTC-USD', label:'BTC'},
    {sym:'^VIX',    label:'VIX', vixOnly:true}
  ];
  var sep='<span style="width:1px;height:18px;background:var(--border2);flex-shrink:0"></span>';
  var chips='';
  if(MARKET_BAR.length){
    BAR_DEF.forEach(function(bt){
      var b=MARKET_BAR.find(function(x){return x.sym===bt.sym;});
      if(!b||!isFinite(b.price)) return;
      var isUp=(b.changePct||0)>=0;
      var col=bt.vixOnly?'var(--text2)':(isUp?'var(--pos)':'var(--neg)');
      var pctStr=bt.vixOnly?'':(isUp?'+':'')+((b.changePct||0)).toFixed(2)+'%';
      // Cada instrumento tiene su formato: el bono va en %, el euro a 4 decimales
      // y bitcoin en miles. Con un formato unico se leian mal casi todos.
      var valStr;
      if(bt.sym==='EURUSD=X')      valStr=b.price.toFixed(4);
      else if(bt.sym==='^TNX')     valStr=b.price.toFixed(2)+'%';
      else if(bt.sym==='BTC-USD')  valStr='$'+(b.price/1000).toFixed(1)+'K';
      else if(b.price>=10000)      valStr=b.price.toLocaleString('en-US',{maximumFractionDigits:0});
      else if(b.price>=1000)       valStr=b.price.toLocaleString('en-US',{maximumFractionDigits:0});
      else                         valStr=b.price.toFixed(2);
      chips+=sep+
        '<div style="display:flex;align-items:center;gap:6px;padding:0 10px;flex-shrink:0">'+
        '<div style="display:flex;flex-direction:column;gap:1px">'+
        '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--text3);letter-spacing:.3px;line-height:1.2">'+bt.label+'</span>'+
        '<div style="display:flex;align-items:baseline;gap:5px">'+
        '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;font-weight:600;color:var(--bright);line-height:1.2">'+valStr+'</span>'+
        (pctStr?'<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:'+col+'">'+pctStr+'</span>':'')+
        '</div></div>'+
        bandSpark(b.spark,isUp)+
        '</div>';
    });
  } else if(v&&v.vix){
    chips=sep+'<div style="display:flex;align-items:center;gap:5px;padding:0 10px">'+
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--text3)">VIX</span>'+
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;font-weight:600;color:var(--bright)">'+v.vix.toFixed(1)+'</span></div>';
  }

  // Régimen chip
  var regChip='';
  if(r){
    var rCol=r.regime==='risk_on'?'var(--grn)':r.regime==='risk_off'?'var(--red)':'var(--amber)';
    regChip=sep+'<div style="display:flex;align-items:center;gap:5px;padding:0 12px">'+
      '<span style="width:6px;height:6px;border-radius:50%;background:'+rCol+';flex-shrink:0"></span>'+
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;font-weight:700;color:'+rCol+';letter-spacing:.5px">'+r.label.toUpperCase()+'</span></div>';
  }

  el.innerHTML=
    // Los 11 simbolos no caben en una pantalla estrecha: scroll horizontal en
    // vez de recortar, para que ninguno quede inaccesible. flex:1 aqui y no en
    // un separador aparte, para que la banda ocupe el espacio disponible.
    '<div class="mkt-strip" style="display:flex;align-items:center;height:100%;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden">'+chips+regChip+'</div>'+
    '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--text3);margin-right:14px;white-space:nowrap">~15min delay</span>'+
    '<div role="button" tabindex="0" title="'+u.email+'" style="width:28px;height:28px;border-radius:50%;background:var(--grn-bg);border:1px solid var(--grn-lt);display:flex;align-items:center;justify-content:center;font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--grn);flex-shrink:0;cursor:pointer" onclick="setPage(\'settings\')">'+initials+'</div>';

  if(!r||!v){
    Promise.all([deGetRegime(),deGetVIX()]).then(function(){renderTopbar();}).catch(function(){});
  }
}
function toggleMobileMenu(force){
  // El drawer movil es #mainnav (el nav de grupos). #sb es un sidebar retirado
  // que ya no se muestra nunca (ver comentario en su regla CSS); tocar el
  // boton hamburguesa solia abrir ese vacio.
  var nav=document.getElementById('mainnav');
  if(!nav) return;
  var bd=document.getElementById('sb-backdrop');
  var open=typeof force==='boolean'?force:!nav.classList.contains('mobile-open');
  nav.classList.toggle('mobile-open',open);
  if(bd) bd.style.display=open?'block':'none';
}
function setPage(p){
  // Estos redirects venian de una consolidacion anterior (10a9fcf) que oculto
  // sig/comp del sidebar y los mandaba a screener. Las paginas se volvieron a
  // mostrar pero el redirect quedo: el usuario pulsaba Senales o Comparador y
  // aterrizaba en Screener. renderSig y renderComp funcionan, asi que se quita.
  // 'pb' si sigue redirigiendo, porque ahora es una pestana de Riesgo, pero
  // fijando antes la pestana: el redirect a secas la dejaba en 'mis posiciones'.
  if(p==='pb'){ RISK_TAB='nueva'; p='risk'; }
  // Contexto/Noticias se fusiono dentro del Dashboard (banda "Mercado hoy").
  // Cualquier enlace antiguo a 'news' aterriza en el Dashboard.
  if(p==='news') p='dash';
  S.page=p;
  track('module_view',{module:p});
  closeDrawer();
  toggleMobileMenu(false);
  renderTopbar();
  // La barra superior se repinta entera: al cambiar de grupo cambia tambien la
  // segunda fila, asi que no basta con mover la clase 'act' como en el sidebar.
  renderMainNav();
  renderMain();
}

var _modalLastFocus=null;
function openModal(t,data){
  // Guarda el foco previo para restaurarlo al cerrar (a11y: el foco no debe
  // perderse al abrir/cerrar un dialogo).
  _modalLastFocus=document.activeElement;
  closeDrawer();S.modal=t;S.editPos=data||null;if(t==='upgrade')track('paywall_view');renderModal();
}
function closeModal(){
  S.modal=null;S.editPos=null;
  document.getElementById("mroot").innerHTML="";
  // Restaura el foco al elemento que abrio el modal.
  if(_modalLastFocus&&typeof _modalLastFocus.focus==='function'){try{_modalLastFocus.focus();}catch(e){}}
  _modalLastFocus=null;
  // Only re-render the current page content, not sidebar
  renderMain();
}
// Foco inicial + trap de Tab dentro del modal (role=dialog aria-modal sin trap
// es un defecto conocido: Tab se escapaba al fondo). Se llama tras renderizar.
function _setupModalFocus(){
  var mr=document.getElementById("mroot");
  var modal=mr&&mr.querySelector(".modal, .modal-box");
  if(!modal) return;
  var SEL='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function focusables(){
    return Array.prototype.slice.call(modal.querySelectorAll(SEL)).filter(function(el){return el.offsetParent!==null;});
  }
  setTimeout(function(){
    if(modal.contains(document.activeElement)) return; // re-render con foco ya dentro
    var first=modal.querySelector("input:not([type=hidden]),textarea,select")||focusables()[0];
    if(first){try{first.focus();}catch(e){}}
  },30);
  modal.addEventListener("keydown",function(e){
    if(e.key!=="Tab") return;
    var f=focusables(); if(!f.length) return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
}

var DE_CACHE={regime:null,vix:null,breadth:null,sectorRS:{},scores:{},lastFetch:0};

// VIX — volatility regime layer
async function deGetVIX(){
  if(DE_CACHE.vix&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.vix;
  try{
    var hist=await fetchHistory('^VIX','3mo');
    if(!hist||!hist.length)throw new Error('no data');
    var v=hist[hist.length-1].close;
    var prev=hist.length>5?hist[hist.length-6].close:v;
    var regime=v<15?'low':v<25?'normal':v<35?'elevated':'crisis';
    var sizing={low:1.0,normal:0.75,elevated:0.50,crisis:0.25}[regime];
    var label={low:'VIX Bajo',normal:'VIX Normal',elevated:'VIX Elevado',crisis:'VIX Crisis'}[regime];
    var color={low:'var(--grn)',normal:'var(--blue)',elevated:'var(--amber)',crisis:'var(--red)'}[regime];
    var emoji={low:'🟢',normal:'🔵',elevated:'🟠',crisis:'🔴'}[regime];
    var tip={low:'Volatilidad baja — entorno de baja incertidumbre histórica.',normal:'Volatilidad normal — nivel dentro del rango histórico promedio.',elevated:'Volatilidad alta — entorno de mayor incertidumbre de mercado.',crisis:'Volatilidad extrema — nivel históricamente muy elevado.'}[regime];
    var result={vix:v,prev:prev,regime:regime,label:label,color:color,emoji:emoji,tip:tip,sizing:sizing};
    DE_CACHE.vix=result;return result;
  }catch(e){return{vix:null,regime:'unknown',label:'VIX N/D',color:'var(--text3)',emoji:'⚪',tip:'No se pudo obtener VIX.',sizing:1.0};}
}

// Market Breadth — % S&P 500 above SMA200 via $SPXA200R
async function deGetBreadth(){
  if(DE_CACHE.breadth&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.breadth;
  try{
    var hist=await fetchHistory('%5ESPXA200R','3mo');
    if(!hist||!hist.length)throw new Error('no data');
    var v=hist[hist.length-1].close; // value is already a percentage (0-100)
    var prev=hist.length>5?hist[hist.length-6].close:v;
    var regime=v>=70?'strong':v>=50?'neutral':v>=30?'weak':'bear';
    var label={strong:'Amplitud Fuerte',neutral:'Amplitud Neutral',weak:'Amplitud Débil',bear:'Bear Market Breadth'}[regime];
    var color={strong:'var(--grn)',neutral:'var(--blue)',weak:'var(--amber)',bear:'var(--red)'}[regime];
    var warning=v<50&&v<prev?'⚠ Divergencia: SPY puede estar en "hollow rally" — solo el índice sube.':'';
    var result={pct:v,prev:prev,regime:regime,label:label,color:color,warning:warning};
    DE_CACHE.breadth=result;return result;
  }catch(e){return{pct:null,regime:'unknown',label:'Amplitud N/D',color:'var(--text3)',warning:''};}
}

// Sector RS — performance del sector del ticker vs SPY (30 días)
var SECTOR_MAP={
  AAPL:'XLK',MSFT:'XLK',NVDA:'XLK',META:'XLK',GOOGL:'XLK',AMD:'XLK',AVGO:'XLK',CRM:'XLK',
  AMZN:'XLY',TSLA:'XLY',HD:'XLY',NKE:'XLY',
  JPM:'XLF',BAC:'XLF',WFC:'XLF',GS:'XLF',V:'XLF',MA:'XLF',
  JNJ:'XLV',UNH:'XLV',PFE:'XLV',ABBV:'XLV',MRK:'XLV',
  XOM:'XLE',CVX:'XLE',COP:'XLE',
  PG:'XLP',KO:'XLP',WMT:'XLP',COST:'XLP',
  NEE:'XLU',DUK:'XLU',
  CAT:'XLI',HON:'XLI',UPS:'XLI',
  LIN:'XLB',NEM:'XLB',
  AMT:'XLRE',PLD:'XLRE',
};
async function deGetSectorRS(ticker){
  var etf=SECTOR_MAP[ticker];
  if(!etf)return null;
  if(DE_CACHE.sectorRS[etf]&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.sectorRS[etf];
  try{
    var [etfH,spyH]=await Promise.all([fetchHistory(etf,'3mo'),fetchHistory('SPY','3mo')]);
    if(!etfH||etfH.length<22||!spyH||spyH.length<22)return null;
    var etfRet=(etfH[etfH.length-1].close-etfH[etfH.length-22].close)/etfH[etfH.length-22].close;
    var spyRet=(spyH[spyH.length-1].close-spyH[spyH.length-22].close)/spyH[spyH.length-22].close;
    var rs=etfRet-spyRet;
    var label=etf+' '+(rs>=0.02?'outperform':rs>=-0.02?'≈ en línea':'underperform');
    var color=rs>=0.02?'var(--grn)':rs>=-0.02?'var(--text2)':'var(--red)';
    var mult=rs>=0.02?1.2:rs>=-0.02?1.0:0.7;
    var result={etf:etf,rs:rs,label:label,color:color,mult:mult,etfRet:etfRet,spyRet:spyRet};
    DE_CACHE.sectorRS[etf]=result;return result;
  }catch(e){return null;}
}

async function deGetRegime(){
  // Return from cache if < 30 min old
  if(DE_CACHE.regime&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.regime;
  var hist=await fetchHistory('SPY','1y');
  if(!hist||hist.length<55){return{regime:'neutral',label:'Sin datos',color:'var(--text2)',spy:null,sma200:null};}
  var closes=hist.map(function(d){return d.close;});
  var sma200arr=TI.sma(closes,Math.min(200,closes.length));
  var sma50arr =TI.sma(closes,Math.min(50,closes.length));
  var last=closes[closes.length-1];
  var s200=sma200arr[sma200arr.length-1];
  var s50 =sma50arr[sma50arr.length-1];
  var regime,label,color,emoji,desc;
  var pct200=(last-s200)/s200;
  if(last>s200&&s50>s200&&pct200>0.01){
    regime='risk_on';label='Risk On';color='var(--grn)';emoji='🟢';
    desc='Precio y SMA50 sobre SMA200. Tendencia alcista confirmada.';
  }else if(last<s200&&s50<s200){
    regime='risk_off';label='Risk Off';color='var(--red)';emoji='🔴';
    desc='Precio y SMA50 bajo SMA200. Mercado en tendencia bajista.';
  }else{
    regime='neutral';label='Neutral';color='var(--amber)';emoji='🟡';
    desc='SPY entre SMA50 y SMA200. Zona de transición — mayor cautela.';
  }
  var result={regime:regime,label:label,color:color,emoji:emoji,desc:desc,spy:last,sma200:s200,sma50:s50,pct200:pct200,hist:hist};
  DE_CACHE.regime=result;DE_CACHE.lastFetch=Date.now();
  return result;
}

function drawSPYMiniChart(regime){
  try{
    var canvas=document.getElementById('spy-mini-chart');
    if(!canvas) return;
    var ctx=canvas.getContext('2d');
    var rawHist=regime&&regime.hist;
    // Work on a copy sorted oldest→newest — do not mutate regime.hist
    // Se ordenaba por la fecha ya formateada ("jun. 5"), que es alfabetica:
    // "dic." caia antes que "ene.". Se ordena por el timestamp original.
    var hist=rawHist?rawHist.slice().sort(function(a,b){
      var ta=a.t||a.ts||Date.parse(a.date)||0, tb=b.t||b.ts||Date.parse(b.date)||0;
      return ta-tb;
    }):[];
    var closes=hist.map(function(d){return d.close;});
    var hasSMA200=closes.length>=200;
    // Status label
    var statusEl=document.getElementById('spy-mini-status');
    if(statusEl){
      if(!closes.length){statusEl.textContent='No se pudo cargar el contexto SPY.';}
      else if(!hasSMA200){statusEl.textContent='SMA200 no disponible — datos insuficientes.';}
      else{statusEl.textContent=closes[closes.length-1]>=regime.sma200?'SPY sobre SMA200':'SPY bajo SMA200';}
    }
    if(!hasSMA200||!closes.length) return;
    // Compute full SMA200 array (only real 200-period values — no Math.min shortcut)
    var smaArr=[];
    for(var i=0;i<closes.length;i++){
      if(i<199){smaArr.push(null);}
      else{var sum=0;for(var j=i-199;j<=i;j++) sum+=closes[j];smaArr.push(sum/200);}
    }
    // Size canvas for retina
    var dpr=window.devicePixelRatio||1;
    var W=canvas.offsetWidth||canvas.parentElement.offsetWidth||300;
    var H=76;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.scale(dpr,dpr);
    // Price range across both series
    var validSma=smaArr.filter(function(v){return v!=null;});
    var allV=closes.concat(validSma);
    var minP=Math.min.apply(null,allV), maxP=Math.max.apply(null,allV);
    var rng=maxP-minP||1;
    function xOf(i){return 1+(W-2)*(i/(closes.length-1));}
    function yOf(v){return H-4-(H-8)*((v-minP)/rng);}
    // SMA200 line
    ctx.beginPath(); ctx.strokeStyle=regime.color||'#f59e0b'; ctx.lineWidth=1.5;
    var firstSma=true;
    smaArr.forEach(function(v,i){
      if(v==null) return;
      if(firstSma){ctx.moveTo(xOf(i),yOf(v));firstSma=false;}else ctx.lineTo(xOf(i),yOf(v));
    });
    ctx.stroke();
    // SPY price line
    ctx.beginPath(); ctx.strokeStyle='rgba(226,232,240,.85)'; ctx.lineWidth=1.5;
    closes.forEach(function(v,i){if(i===0)ctx.moveTo(xOf(i),yOf(v));else ctx.lineTo(xOf(i),yOf(v));});
    ctx.stroke();
    // Current price dot
    var lx=xOf(closes.length-1),ly=yOf(closes[closes.length-1]);
    ctx.beginPath(); ctx.arc(lx,ly,3,0,Math.PI*2); ctx.fillStyle='rgba(226,232,240,.9)'; ctx.fill();
  }catch(e){
    var fb=document.getElementById('spy-mini-fallback');
    if(fb) fb.style.display='block';
    var mc=document.getElementById('spy-mini-chart');
    if(mc) mc.style.display='none';
  }
}

// ── ALL_SIG DINAMICO ─────────────────────────────────────────────
// ALL_SIG nacio como array estatico: 20 tickers con sig y sc escritos a mano
// que nunca se recalculaban. Convivia con deScoreTicker, el motor real, asi que
// el MISMO ticker podia mostrar 89 en Senales y otro numero en Screener sin que
// nada lo explicara. Esto lo unifica: un solo motor para toda la app.
// Coste acotado: fetchHistory ya cachea en localStorage y deScoreTicker tiene
// DE_CACHE con 30 min de TTL, asi que 20 tickers no son 20 llamadas por carga.
var ALL_SIG_REAL=false;              // true cuando los scores vienen del motor
// _allSigLoading era un booleano simple: loadAllSigScores() solo se llamaba
// una vez (setTimeout de bootLiveData). Si esa unica pasada fallaba para
// TODOS los tickers (guardar quedaba vacio — ej. una interrupcion de red al
// cargar), ALL_SIG_REAL nunca pasaba a true y "Foco de hoy"/Senales/
// Indicadores quedaban en "Calculando señales técnicas…" el resto de la
// sesion, sin reintentar. createLoadGate reintenta solo tras un cooldown, y
// dashFocoCard/renderSig/renderInd ahora piden la carga ellos mismos si hace
// falta (ver allSigIsLoading()) en vez de depender de un solo disparo en boot.
var _allSigGate=createLoadGate(20000);
function allSigIsLoading(){ return _allSigGate.isLoading(); }
var ALL_SIG_TTL=30*60*1000;

function _allSigKey(){ return 'sig_scores_'+(S.user&&S.user.id||'demo'); }

function _allSigFromCache(){
  try{
    var raw=localStorage.getItem(_allSigKey());
    if(!raw) return false;
    var o=JSON.parse(raw);
    if(!o||!o.ts||(Date.now()-o.ts)>ALL_SIG_TTL) return false;
    var n=0;
    ALL_SIG.forEach(function(x){
      var v=o.d[x.t];
      if(v){ x.sc=v.sc; x.sig=v.sig; n++; }
    });
    if(n>0){ ALL_SIG_REAL=true; return true; }
  }catch(e){}
  return false;
}

// Un score 0-100 se traduce a las tres bandas que ya usa la UI.
function _sigDesdeScore(sc){ return sc>=70?'BUY':sc>=45?'HOLD':'SELL'; }

async function loadAllSigScores(force){
  if(!force && _allSigFromCache()){ return; }
  try{
    await _allSigGate.run(async function(){
      var guardar={};
      for(var i=0;i<ALL_SIG.length;i++){
        var x=ALL_SIG[i];
        try{
          var r=await deScoreTicker(x.t);
          if(r&&isFinite(r.score)){
            x.sc=Math.round(r.score);
            x.sig=_sigDesdeScore(x.sc);
            guardar[x.t]={sc:x.sc,sig:x.sig};
          }
        }catch(e){/* un ticker que falla no detiene al resto */}
      }
      if(!Object.keys(guardar).length){
        // Ningun ticker resolvio (ej. corte de red): que el gate lo trate
        // como fallo y reintente solo mas adelante, en vez de quedar
        // ALL_SIG_REAL en false para siempre.
        throw new Error('sin scores reales — reintentar');
      }
      ALL_SIG_REAL=true;
      try{ localStorage.setItem(_allSigKey(),JSON.stringify({ts:Date.now(),d:guardar})); }catch(e){}
      // Repintar solo las pantallas que leen ALL_SIG
      if(['sig','dash','sentiment','radar','ind'].indexOf(S.page)>=0){ try{ renderMain(); }catch(e){} }
      return guardar;
    });
  }catch(e){/* cooldown o fallo real: el proximo render que necesite ALL_SIG_REAL reintenta */}
}

async function deScoreTicker(ticker){
  if(DE_CACHE.scores[ticker]&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.scores[ticker];
  var hist=await fetchHistory(ticker,'1y');
  if(!hist||hist.length<30)return null;
  var closes=hist.map(function(d){return d.close;});
  var highs=hist.map(function(d){return d.high;});
  var lows=hist.map(function(d){return d.low;});
  var vols=hist.map(function(d){return d.vol;});
  var last=closes[closes.length-1];
  var score=0;var signals=[];

  // 1. Trend vs SMA200 (30pts)
  if(closes.length>=200){
    var s200=TI.sma(closes,200);var v200=s200[s200.length-1];
    var pct=(last-v200)/v200;
    if(last>v200){
      var pts=pct>0.15?15:pct>0.05?22:30;score+=pts;
      signals.push(pct<0.05?icon('check','ico-inline')+' Sobre SMA200 (cerca)':icon('check','ico-inline')+' Sobre SMA200');
    }else{score+=5;signals.push('⚠️ Bajo SMA200');}
  }

  // 2. RSI position (25pts — ideal 40-60)
  var rsiArr=TI.rsi(closes);var rsi=rsiArr[rsiArr.length-1];
  if(rsi>=40&&rsi<=60){score+=25;signals.push(icon('check','ico-inline')+' RSI neutro ('+rsi.toFixed(0)+')');}
  else if(rsi<40){score+=20;signals.push(icon('check','ico-inline')+' RSI oversold ('+rsi.toFixed(0)+') — condición técnica de sobreventa');}
  else if(rsi>70){score+=5;signals.push('⚠️ RSI sobrecomprado ('+rsi.toFixed(0)+')');}
  else{score+=12;signals.push(icon('capital','ico-inline')+' RSI '+rsi.toFixed(0));}

  // 3. MACD momentum (20pts)
  var macd=TI.macd(closes);var mhist=macd.hist;
  var mLast=mhist[mhist.length-1];var mPrev=mhist[mhist.length-2];
  if(mLast>0&&mLast>mPrev){score+=20;signals.push(icon('check','ico-inline')+' MACD alcista y acelerando');}
  else if(mLast>0){score+=14;signals.push(icon('capital','ico-inline')+' MACD positivo');}
  else if(mLast<0&&mLast>mPrev){score+=10;signals.push(icon('capital','ico-inline')+' MACD recuperando');}
  else{score+=3;signals.push('⚠️ MACD negativo');}

  // 4. Volume confirmation (25pts)
  var avgVol=vols.slice(-20).reduce(function(a,b){return a+b;},0)/20;
  var lastVol=vols[vols.length-1];
  var volRatio=lastVol/avgVol;
  var priceUp=last>closes[closes.length-2];
  if(priceUp&&volRatio>1.2){score+=25;signals.push(icon('check','ico-inline')+' Volumen alto en alza ('+volRatio.toFixed(1)+'x)');}
  else if(!priceUp&&volRatio>1.2){score+=8;signals.push('⚠️ Volumen alto en baja');}
  else{score+=15;signals.push(icon('capital','ico-inline')+' Volumen normal ('+volRatio.toFixed(1)+'x)');}

  // ATR-based entry/stop/target
  var atrArr=TI.atr(highs,lows,closes,14);var atr=atrArr[atrArr.length-1]||last*0.02;
  var entry=parseFloat((last*(1-0.005)).toFixed(2));
  var stop =parseFloat((last-atr*1.5).toFixed(2));
  var target=parseFloat((last+atr*3).toFixed(2));
  var rr=((target-entry)/(entry-stop)).toFixed(1);

  // Sector RS multiplier
  var sectorRS=await deGetSectorRS(ticker);
  var sectorMult=sectorRS?sectorRS.mult:1.0;
  var finalScore=Math.min(100,Math.round(score*sectorMult));

  var action=finalScore>=75?'Score alto':finalScore>=55?'Score medio':finalScore>=35?'Score bajo':'Fuera de criterio';
  var actionColor=finalScore>=75?'var(--grn)':finalScore>=55?'var(--blue)':finalScore>=35?'var(--amber)':'var(--red)';

  // Scale-out targets
  var t1=parseFloat((entry+atr*1.5).toFixed(2));
  var t2=parseFloat((entry+atr*3.0).toFixed(2));

  // Pullback Quality Score
  var pqScore=0;
  var s50arr=TI.sma(closes,Math.min(50,closes.length));var s50v=s50arr[s50arr.length-1];
  var s200v=closes.length>=200?(function(){var a=TI.sma(closes,200);return a[a.length-1];}()):null;
  var high52=Math.max.apply(null,highs.slice(-Math.min(252,highs.length)));
  var pullbackPct=(high52-last)/high52;
  // RSI zone (40 pts)
  if(rsi>=30&&rsi<=55){pqScore+=40;}else if(rsi<30){pqScore+=30;}else if(rsi<=65){pqScore+=20;}else{pqScore+=5;}
  // Above SMA50 (25 pts)
  if(last>s50v) pqScore+=25;
  // Above SMA200 (20 pts)
  if(s200v&&last>s200v) pqScore+=20;
  // Distance from 52w high: 5-20% ideal (15 pts)
  if(pullbackPct>=0.05&&pullbackPct<=0.20){pqScore+=15;}else if(pullbackPct<0.05||pullbackPct>0.35){pqScore+=0;}else{pqScore+=8;}
  // Volume declining on pullback = orderly (not a panic dump)
  var vol3avg=vols.slice(-3).reduce(function(a,b){return a+b;},0)/3;
  var vol20avg=vols.slice(-20).reduce(function(a,b){return a+b;},0)/20;
  // (bonus) — not added to pqScore since it can be 0 on volatile tickers
  var volOrderly=vol3avg<vol20avg*0.9;
  var pqLabel=pqScore>=75?'Excelente':pqScore>=55?'Bueno':pqScore>=35?'Regular':'Débil';
  var pqColor=pqScore>=75?'var(--grn)':pqScore>=55?'var(--blue)':pqScore>=35?'var(--amber)':'var(--red)';
  var pqTip=pqScore>=75?'Condiciones técnicas favorables — indicadores alineados.':pqScore>=55?'Condiciones técnicas moderadamente favorables.':pqScore>=35?'Condiciones técnicas mixtas — señales divergentes.':'Condiciones técnicas desfavorables — indicadores débiles.';

  // Expected Value (EV) from Bitácora trade history
  loadTrades();loadAlerts();
  var sells=S.trades.filter(function(t){return t.type==='sell'&&t.pnl!=null;});
  var ev=null;
  if(sells.length>=3){
    var wins=sells.filter(function(t){return t.pnl>0;});
    var losses=sells.filter(function(t){return t.pnl<=0;});
    var winRate=wins.length/sells.length;
    var avgWinPct=wins.length?wins.reduce(function(s,t){return s+(t.pnl/t.amount);},0)/wins.length:0;
    var avgLossPct=losses.length?Math.abs(losses.reduce(function(s,t){return s+(t.pnl/t.amount);},0)/losses.length):0;
    ev=(winRate*avgWinPct)-((1-winRate)*avgLossPct);
  }

  var result={ticker:ticker,score:finalScore,rawScore:score,sectorRS:sectorRS,signals:signals,rsi:rsi.toFixed(0),action:action,actionColor:actionColor,entry:entry,stop:stop,target:target,t1:t1,t2:t2,rr:rr,last:last,atr:atr,ev:ev,pqScore:pqScore,pqLabel:pqLabel,pqColor:pqColor,pqTip:pqTip,volOrderly:volOrderly,pullbackPct:pullbackPct,s50v:s50v,s200v:s200v};
  DE_CACHE.scores[ticker]=result;
  return result;
}

function deNarrative(s,regime,vix,breadth){
  var parts=[];
  if(regime){
    if(regime.regime==='risk_on') parts.push('El mercado está en modo <b>Risk On</b> — SPY sobre SMA200, tendencia alcista global confirmada.');
    else if(regime.regime==='risk_off') parts.push('El mercado está en <b>Risk Off</b> — SPY bajo SMA200. Contexto técnico de mayor incertidumbre.');
    else parts.push('Mercado en zona de <b>transición</b> — SPY entre SMA50 y SMA200. Selectividad alta.');
  }
  if(vix&&vix.vix){
    var vixVal=vix.vix.toFixed(1);
    if(vix.regime==='low') parts.push('Volatilidad baja (VIX '+vixVal+') — entorno de baja volatilidad histórica.');
    else if(vix.regime==='normal') parts.push('Volatilidad normal (VIX '+vixVal+') — nivel de volatilidad dentro del rango histórico promedio.');
    else if(vix.regime==='elevated') parts.push('Volatilidad elevada (VIX '+vixVal+') — entorno de mayor incertidumbre de mercado.');
    else parts.push('VIX en niveles extremos ('+vixVal+') — volatilidad histórica muy elevada.');
  }
  var rsi=parseFloat(s.rsi);
  if(rsi<=30) parts.push(s.ticker+' en zona de sobreventa (RSI '+s.rsi+') — condición técnica de sobreventa; verificar soporte como referencia.');
  else if(rsi<=50) parts.push('RSI '+s.rsi+' — momentum moderado, espacio alcista disponible sin señal de sobrecompra.');
  else if(rsi<=65) parts.push('RSI '+s.rsi+' — momentum positivo y saludable.');
  else parts.push('RSI '+s.rsi+' — zona de sobrecompra; esperar consolidación para entrada de mejor calidad.');
  if(s.sectorRS) parts.push('Sector <b>'+s.sectorRS.etf+'</b> '+s.sectorRS.label.toLowerCase()+' vs SPY — factor sectorial '+s.sectorRS.mult+'x '+(s.sectorRS.mult>=1.2?'añadiendo impulso al score.':s.sectorRS.mult<=0.7?'reduciendo el score por debilidad relativa.':'sin impacto significativo.'));
  if(s.pullbackPct!=null){
    var pp=(s.pullbackPct*100).toFixed(0);
    if(s.pullbackPct<0.03) parts.push(s.ticker+' cotiza cerca de su máximo anual ('+pp+'% abajo) — riesgo de entrada en techo.');
    else if(s.pullbackPct<=0.20) parts.push('Pullback del '+pp+'% desde el máximo — zona de entrada con buena relación riesgo/recompensa.');
    else parts.push('Corrección del '+pp+'% desde el máximo anual — esperar señales de estabilización antes de acumular.');
  }
  parts.push('Zona referencial de precio · ATR(14): <b>$'+s.entry+'</b> · Nivel de riesgo referencial: <b>$'+s.stop+'</b> ('+( ((s.entry-s.stop)/s.entry)*100).toFixed(1)+'% Δ) · R:R <b>'+s.rr+'x</b>.');
  return parts.join(' ');
}

async function deGetEarnings(ticker){
  try{
    var ckey='earn_'+ticker;
    var cached=_cacheGet(ckey);
    if(cached) return cached;
    var r=_USE_EDGE
      ? await fetchWithTimeout('/api/quoteSummary?ticker='+encodeURIComponent(ticker)+'&modules=calendarEvents',7000)
      : await fetchWithTimeout('https://api.allorigins.win/raw?url='+encodeURIComponent('https://query1.finance.yahoo.com/v10/finance/quoteSummary/'+ticker+'?modules=calendarEvents'),9000);
    if(!r||!r.ok) return null;
    var data=await r.json();
    var cal=data&&data.quoteSummary&&data.quoteSummary.result&&data.quoteSummary.result[0]&&data.quoteSummary.result[0].calendarEvents;
    if(!cal) return null;
    var dates=cal.earnings&&cal.earnings.earningsDate;
    if(!dates||!dates.length) return null;
    var ts=dates[0].raw*1000;
    var dt=new Date(ts);
    var out={ticker:ticker,date:dt,dateStr:dt.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'}),daysAway:Math.round((ts-Date.now())/86400000)};
    _cacheSet(ckey,out);
    return out;
  }catch(e){return null;}
}

function renderScreenerBody(){
  var plan=planOf();
  if(plan.locked&&plan.locked.indexOf('screener')>=0){
    document.getElementById('main').innerHTML=
      _ph('Investigar · Screener','Screener','// Filtro técnico · Score Motor · Export CSV')+

    return;
  }
  var f=S.screenerFilters;
  var running=S.screenerRunning;
  var results=S.screenerResults;

  var actionOpts=['ALL','Acumular','Neutral','Reducir','Esperar'].map(function(a){
    return '<option value="'+a+'"'+(f.action===a?' selected':'')+'>'+a+'</option>';
  }).join('');

  var resultsHtml='';
  if(running){
    resultsHtml='<div style="display:flex;align-items:center;gap:12px;padding:24px 0;color:var(--text2);font-family:\'IBM Plex Mono\',monospace;font-size:12px">'+
      '<div class="spin" style="width:18px;height:18px;border-width:2px"></div>Analizando tickers... '+
      (results.length>0?results.length+' completados':'')+'</div>';
  } else if(results.length===0){
    resultsHtml='<div style="padding:24px 0;color:var(--text3);font-family:\'IBM Plex Mono\',monospace;font-size:11px;text-align:center">Ingresa tickers y presiona Analizar para ejecutar el screener.</div>';
  } else {
    var filtered=results.filter(function(r){
      if(r.error) return false;
      if(r.score<f.scoreMin) return false;
      var rsi=parseFloat(r.rsi);
      if(rsi<f.rsiMin||rsi>f.rsiMax) return false;
      if(f.action!=='ALL'&&r.action!==f.action) return false;
      return true;
    }).sort(function(a,b){return b.score-a.score;});

    var errors=results.filter(function(r){return !!r.error;});

    var rows=filtered.map(function(s){
      var sc=s.score;
      var barC=sc>=75?'var(--grn)':sc>=55?'var(--blue)':sc>=35?'var(--amber)':'var(--red)';
      var rsi=parseFloat(s.rsi);
      var rsiC=rsi>=70?'var(--red)':rsi<=30?'var(--grn)':'var(--text2)';
      var rr=parseFloat(s.rr);

function screenerApplyFilters(){
  var tickers=(document.getElementById('scr-tickers')||{}).value||S.screenerTickers;
  S.screenerTickers=tickers.trim();
  S.screenerFilters.scoreMin=parseInt((document.getElementById('scr-scoreMin')||{}).value||0)||0;
  S.screenerFilters.rsiMin=parseInt((document.getElementById('scr-rsiMin')||{}).value||0)||0;
  S.screenerFilters.rsiMax=parseInt((document.getElementById('scr-rsiMax')||{}).value||100)||100;
  S.screenerFilters.action=(document.getElementById('scr-action')||{}).value||'ALL';
  renderScreenerBody();
}

// Presets de categoria: rellenan el screener sin construir un universo de
// miles de activos (mantiene el foco curado). Aprovecha el motor que ya corre
// sobre listas de tickers.
function scrPreset(cat){
  var sets={
    etf:     'SPY QQQ VTI VOO IVV VXUS VEA VWO BND SCHD',
    tech:    'AAPL MSFT NVDA GOOGL META AMZN AMD TSLA AVGO CRM',
    dividend:'SCHD VYM JNJ PG KO PEP JPM HD VZ ABBV',
    sectors: 'XLK XLF XLV XLE XLI XLY XLP XLU XLB XLRE',
    safe:    'BND TLT AGG BIL SHY GLD IAU SLV TIP VTIP'
  };
  var v=sets[cat]||'';
  S.screenerTickers=v;
  var ta=document.getElementById('scr-tickers'); if(ta) ta.value=v;
  screenerRun();
}
function screenerRun(){
  var tickers=(document.getElementById('scr-tickers')||{}).value||S.screenerTickers;
  S.screenerTickers=tickers.trim();
  S.screenerFilters.scoreMin=parseInt((document.getElementById('scr-scoreMin')||{}).value||0)||0;
  S.screenerFilters.rsiMin=parseInt((document.getElementById('scr-rsiMin')||{}).value||0)||0;
  S.screenerFilters.rsiMax=parseInt((document.getElementById('scr-rsiMax')||{}).value||100)||100;
  S.screenerFilters.action=(document.getElementById('scr-action')||{}).value||'ALL';

  var list=S.screenerTickers.split(/[\s,]+/).map(function(t){return t.trim().toUpperCase();}).filter(Boolean);
  if(!list.length) return;

  S.screenerResults=[];
  S.screenerRunning=true;
  renderScreenerBody();

  function tickerTimeout(ms){return new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);});}

  var promises=list.map(function(ticker){
    return Promise.race([deScoreTicker(ticker),tickerTimeout(10000)]).then(function(r){
      if(r) S.screenerResults.push(r);
      else S.screenerResults.push({ticker:ticker,error:true});
      renderScreenerBody();
      return r;
    }).catch(function(){
      S.screenerResults.push({ticker:ticker,error:true});
      renderScreenerBody();
    });
  });

  Promise.all(promises).then(function(){
    S.screenerRunning=false;
    renderScreenerBody();
  });
}

// Abre el Billing Portal de Stripe. El token va en el cuerpo; el servidor
// resuelve el customer_id del perfil, el cliente nunca lo maneja.
async function abrirPortalPago(){
  var btn=document.getElementById('btn-portal');
  if(btn){ btn.disabled=true; btn.textContent='Abriendo…'; }
  try{
    var sess=await sb.auth.getSession();
    var tok=sess&&sess.data&&sess.data.session&&sess.data.session.access_token;
    if(!tok){ showToast('Debes iniciar sesión','error'); return; }
    var res=await fetch('/api/billing-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})});
    var data=await res.json().catch(function(){return {};});
    if(res.ok&&data.url){ window.location.href=data.url; return; }
    showToast(data.error||'No se pudo abrir el portal de pago','error');
  }catch(e){ showToast('Error de conexión','error'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Gestionar o cancelar suscripción'; } }
}

// ── GLOBO DEL HERO ───────────────────────────────────────────────────────
// Globo de puntos dibujado en canvas 2D. Se implementa nativo en vez de
// instalar cobe desde un registro externo: este proyecto no tiene React ni
// build step, y el codigo del componente de aquel registro no es auditable
// sin cuenta. La malla se genera con espiral de Fibonacci (puntos repartidos
// uniformemente sobre la esfera, sin acumularse en los polos) y se rota sobre
// el eje Y; los puntos de la cara oculta se descartan por su normal.
var _globeRAF=null, _globeObs=null;
function globeBgStart(){
  var cv=document.getElementById('globe-bg');
  if(!cv) return;
  // Igual que el hero anterior: renderWelcome puede ejecutarse varias veces y
  // cada vez crea un canvas nuevo. Sin cancelar, el bucle viejo seguiria vivo
  // sobre un canvas desechado y bloquearia el arranque del nuevo.
  if(_globeRAF){ cancelAnimationFrame(_globeRAF); _globeRAF=null; }
  if(_globeObs){ try{ _globeObs.disconnect(); }catch(e){} _globeObs=null; }
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx=cv.getContext('2d'); if(!ctx) return;

  var N=2600, pts=[], phi=Math.PI*(3-Math.sqrt(5));
  for(var i=0;i<N;i++){
    var y=1-(i/(N-1))*2, r=Math.sqrt(Math.max(0,1-y*y)), th=phi*i;
    pts.push([Math.cos(th)*r, y, Math.sin(th)*r]);
  }

  var t=0, dpr=1, W=0, H=0, R=0;
  function medir(){
    var rc=cv.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1,rc.width); H=Math.max(1,rc.height);
    cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    R=Math.min(W,H)*0.42;
  }
  function tinte(){
    var cs=getComputedStyle(document.documentElement);
    return (cs.getPropertyValue('--grn')||'#d8c9a3').trim();
  }
  var col=tinte();

  function pinta(){
    ctx.clearRect(0,0,W,H);
    var cx=W/2, cy=H/2;
    var ct=Math.cos(t), st=Math.sin(t);
    // Inclinacion fija del eje: un globo perfectamente vertical lee como circulo
    var tilt=-0.38, ctl=Math.cos(tilt), stl=Math.sin(tilt);
    for(var i=0;i<N;i++){
      var p=pts[i];
      var x=p[0]*ct - p[2]*st;
      var z=p[0]*st + p[2]*ct;
      var y=p[1]*ctl - z*stl;
      z=p[1]*stl + z*ctl;
      if(z<0) continue;               // cara oculta
      var d=0.55+0.45*z;              // los puntos del frente pesan mas
      ctx.globalAlpha=d*d;
      ctx.fillStyle=col;
      var s=d*2.0;
      ctx.fillRect(cx+x*R-s/2, cy+y*R-s/2, s, s);
    }
    ctx.globalAlpha=1;
    t+=0.0022;
    _globeRAF=requestAnimationFrame(pinta);
  }
  function arranca(){ if(!_globeRAF){ col=tinte(); _globeRAF=requestAnimationFrame(pinta); } }
  function para(){ if(_globeRAF){ cancelAnimationFrame(_globeRAF); _globeRAF=null; } }

  medir();
  window.addEventListener('resize',medir,{passive:true});
  // No gastar bateria pintando lo que no se ve.
  try{
    _globeObs=new IntersectionObserver(function(e){ e[0].isIntersecting?arranca():para(); });
    _globeObs.observe(cv);
  }catch(e){ arranca(); }
  document.addEventListener('visibilitychange',function(){ document.hidden?para():arranca(); });
  arranca();
}

// ── DASHBOARD ──────────────────────────────────────────────────
// ── ÍNDICES ───────────────────────────────────────────────────────────────
// Extraida de mercadoHoyBody() para poder ubicarla junto a Top Señales y
// Portafolio en renderDash() (antes solo vivia en el rail de "Mercado hoy").
// Los valores de partida eran cifras reales de 2024 hardcodeadas (VIX 16.8,
// Bitcoin $97.400...). Como marketbar no devolvia VIX ni BTC, esos dos se
// mostraban con datos de hace mas de un ano SIN ninguna marca de que eran
// estaticos. Un dato viejo presentado como actual es peor que un hueco: ahora
// el valor arranca vacio y solo se rellena si llega de la API.
function indicesCard(){
  // Antes esta tarjeta dependia por completo de que mercadoHoyBody() se
  // renderizara despues en el mismo pase (mismo array MARKET_BAR) para
  // disparar el fetch — si algun dia se renderiza indicesCard() sola, se
  // quedaba en "sin dato" para siempre sin que nada la rellenara. Ahora pide
  // los datos ella misma si hace falta (fetchMarketBar ya es idempotente:
  // cache localStorage + createLoadGate evitan pedidos duplicados).
  if(!MARKET_BAR.length && !barIsLoading()){
    fetchMarketBar().then(function(){renderMain();}).catch(function(){});
  }
  var IDX_MAP={
    '^GSPC':  {n:'S&P 500',    v:null,c:null,up:null},
    '^IXIC':  {n:'NASDAQ',     v:null,c:null,up:null},
    '^DJI':   {n:'Dow 30',     v:null,c:null,up:null},
    '^VIX':   {n:'VIX',        v:null,c:null,up:null},
    'BTC-USD':{n:'Bitcoin USD',v:null,c:null,up:null}
  };
  if(MARKET_BAR.length){
    MARKET_BAR.forEach(function(b){
      if(!IDX_MAP[b.sym]||!isFinite(b.price)) return;
      var isUp=(b.changePct||0)>=0;
      var pct=(isUp?'+':'')+(b.changePct||0).toFixed(2)+'%';
      var val=b.sym==='BTC-USD'?'$'+(b.price/1000).toFixed(1)+'K':b.sym==='^VIX'?b.price.toFixed(2):b.price>=10000?b.price.toLocaleString('en-US',{maximumFractionDigits:0}):b.price.toFixed(2);
      IDX_MAP[b.sym]={n:IDX_MAP[b.sym].n,v:val,c:pct,up:isUp};
    });
  }
  var IDXS=[IDX_MAP['^GSPC'],IDX_MAP['^IXIC'],IDX_MAP['^DJI'],IDX_MAP['^VIX'],IDX_MAP['BTC-USD']];
  // "sin dato" antes era el unico estado posible cuando v es null, sin
  // distinguir "todavia no llego la respuesta" de "se intento y fallo". Ahora
  // que fetchMarketBar() reintenta solo (createLoadGate), vale la pena que la
  // UI lo refleje: "cargando…" mientras el fetch esta en vuelo.
  var idxPlaceholder=barIsLoading()?'cargando…':'sin dato';
  var idxRows=IDXS.map(function(x){
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">'+
      '<span style="font-size:11px;font-weight:600;color:var(--bright);font-family:\'IBM Plex Mono\',monospace">'+x.n+'</span>'+
      '<div style="display:flex;gap:8px;align-items:baseline">'+
      '<span style="font-size:11px;color:'+(x.v?'var(--bright)':'var(--text3)')+';font-family:\'IBM Plex Mono\',monospace">'+(x.v||idxPlaceholder)+'</span>'+
      (x.c?'<span style="font-size:11px;font-weight:700;font-family:\'IBM Plex Mono\',monospace;color:'+(x.up?'var(--pos)':'var(--neg)')+'">'+x.c+'</span>':'')+
      '</div></div>';
  }).join('');
  return '<div class="fos-card" style="overflow:hidden">'+
    '<div style="padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:space-between">'+
      '<span class="fos-section-label" style="margin:0">Índices</span>'+
      '<span style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace">~15min delay</span>'+
    '</div>'+
    '<div style="padding:4px 14px 8px">'+idxRows+'</div>'+
  '</div>';
}

// "Foco de hoy": tarjeta decision-first al tope del dashboard. Surface, desde
// datos REALES (ALL_SIG del motor + watchlist + portafolio), 1-2 cosas concretas
// para revisar hoy. Solo usa señales cuando el scoring real ya corrio
// (ALL_SIG_REAL); si no, muestra un estado de carga. Encuadre educativo: son
// señales técnicas "para revisar", no recomendaciones de compra/venta.
function dashFocoCard(port){
  // Antes ALL_SIG_REAL solo podia pasar a true por el unico disparo de
  // loadAllSigScores() en bootLiveData (setTimeout 1200ms). Si ese intento
  // fallaba (ver loadAllSigScores), esta tarjeta quedaba en "Calculando
  // señales técnicas…" para siempre. Ahora se autopide los datos si hace
  // falta — loadAllSigScores/createLoadGate ya evitan pedidos duplicados.
  if(!ALL_SIG_REAL && !allSigIsLoading()){
    loadAllSigScores().catch(function(){});
  }
  var inPort={}; (port||[]).forEach(function(h){inPort[h.t]=true;});
  var wl=S.watchlist||[];
  var buyC=[], sellC=[];
  if(ALL_SIG_REAL){
    ALL_SIG.forEach(function(s){
      if(s.sig==='BUY' && wl.indexOf(s.t)>=0 && !inPort[s.t]) buyC.push(s);
      else if(s.sig==='SELL' && inPort[s.t]) sellC.push(s);
    });
    buyC.sort(function(a,b){return (b.sc||0)-(a.sc||0);});
    sellC.sort(function(a,b){return (a.sc||0)-(b.sc||0);});
  }
  function tkChips(arr){
    return arr.slice(0,5).map(function(s){
      return '<button class="btn" style="font-size:11px;padding:3px 9px" onclick="openDrawer(\''+s.t+'\','+(s.p||100)+')">'+s.t+' · '+(s.sc||0)+'</button>';
    }).join('');
  }
  var rows='';
  if(!ALL_SIG_REAL){
    rows='<div style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace">Calculando señales técnicas…</div>';
  }else if(!buyC.length && !sellC.length){
    rows='<div style="font-size:11px;color:var(--text2);line-height:1.6">Sin señales técnicas destacadas en tu watchlist ni portafolio ahora mismo. Revisa tu P&amp;L y el contexto de mercado abajo.</div>';
  }else{
    if(buyC.length){
      rows+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:'+(sellC.length?'10px':'0')+'">'+
        statusDot('🟢',12)+'<span style="font-size:12px;color:var(--text);font-weight:600">'+buyC.length+' en tu watchlist con señal alcista</span>'+
        '<span style="font-size:11px;color:var(--text3)">para revisar:</span>'+tkChips(buyC)+'</div>';
    }
    if(sellC.length){
      rows+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
        statusDot('🔴',12)+'<span style="font-size:12px;color:var(--text);font-weight:600">'+sellC.length+' de tus posiciones con señal bajista</span>'+
        '<span style="font-size:11px;color:var(--text3)">para revisar:</span>'+tkChips(sellC)+'</div>';
    }
  }
  return '<div class="fos-card" style="padding:var(--sp-8);margin-bottom:16px">'+
    // El boton "Motor completo →" se quito el 13-sep-2026: era uno de los 5
    // caminos redundantes a Analizar -> Motor de Analisis (ver auditoria UX);
    // la pestaña "Analizar" del nav principal ya cubre esto.
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">'+
      '<div class="fos-section-label" style="margin:0;display:flex;align-items:center;gap:8px">'+icon('decision')+' Foco de hoy</div>'+
    '</div>'+
    rows+
    '<div style="margin-top:12px;font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace;line-height:1.5">Señales técnicas educativas para revisar — no son recomendaciones de compra o venta.</div>'+
  '</div>';
}

function renderDash(){
  var plan=planOf();
  var port=S.portfolio.slice(0,plan.maxT);
  // Precio actual: live si existe, sino el último conocido, sino el costo
  // (evita NaN/"—" mientras cargan los precios o si el fetch falla)
  port.forEach(function(h){h.cur=LIVE[h.t]?LIVE[h.t].price:(h.cur||h.cost);});
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var pnl=totM-totC;
  var pnlPct=totC>0?((pnl/totC)*100):0;
  var winners=port.filter(function(h){return h.cur>h.cost;}).length;
  var losers=port.filter(function(h){return h.cur<h.cost;}).length;
  var avgScore=ALL_SIG.length>0?Math.round(ALL_SIG.slice(0,10).reduce(function(s,x){return s+x.sc;},0)/Math.min(10,ALL_SIG.length)):0;
  var top=ALL_SIG.slice(0,5);

  // ── helpers locales ──
  function scoreCircle(sc){
    var cls=sc>=70?'fos-score--g':sc>=50?'fos-score--a':'fos-score--r';
    return '<span class="fos-score '+cls+'">'+sc+'</span>';
  }
  function chgBadge(lqd){
    if(!lqd||lqd.changePct==null) return '<span style="color:var(--text3);font-family:\'IBM Plex Mono\',monospace">—</span>';
    var v=(lqd.changePct||0)*100,c=v>=0?'var(--pos)':'var(--neg)',arrow=v>=0?'▲':'▼';
    return '<span style="color:'+c+';font-family:\'IBM Plex Mono\',monospace">'+arrow+' '+(v>=0?'+':'')+v.toFixed(2)+'%</span>';
  }
  function fmtMoney(n){ return n==null||isNaN(n)?'—':'$'+fmtD(n); }

  // ── Top Señales rows ──
  var sigRows=top.map(function(s){
    var lp=getLivePrice(s.t);
    var lqd=LIVE[s.t];
    return '<tr role="button" tabindex="0" style="cursor:pointer" onclick="openDrawer(\''+s.t+'\','+lp+')" onmouseenter="prefetchFund(\''+s.t+'\');this.style.background=\'var(--card3)\'" onmouseleave="this.style.background=\'\'">'+
      '<td style="font-weight:600;color:var(--bright);font-family:\'IBM Plex Mono\',monospace">'+s.t+'</td>'+
      '<td>'+scoreCircle(s.sc)+'</td>'+
      '<td style="font-family:\'IBM Plex Mono\',monospace;color:var(--text)">'+fmtMoney(lp)+'</td>'+
      '<td>'+chgBadge(lqd)+'</td>'+
      '</tr>';

  // ── name lookup (best-effort) ──
  var _TN={'AAPL':'Apple Inc.','NVDA':'NVIDIA Corp.','MSFT':'Microsoft','AMZN':'Amazon.com','GOOGL':'Alphabet','META':'Meta Platforms','TSLA':'Tesla','SPY':'SPDR S&P 500','QQQ':'Invesco QQQ','VTI':'Vanguard Total','BRK.B':'Berkshire B','V':'Visa Inc.','JPM':'JPMorgan','XLK':'Tech Select','XLF':'Financial Sel.','GLD':'Gold ETF','TLT':'20yr Treasury','BTC-USD':'Bitcoin','AMD':'AMD Inc.','NFLX':'Netflix'};
  function _tname(t){ return _TN[t]||t; }

  // ── Portfolio rows ──

    var pnlPctH=h.cost>0?((h.cur-h.cost)/h.cost*100):0;
    var pc=pnlH>=0?'var(--pos)':'var(--neg)';

    var chgColor=chgV===null?'var(--text3)':chgV>=0?'var(--pos)':'var(--neg)';
    var chgStr=chgV===null?'—':(chgV>=0?'+':'')+chgV.toFixed(2)+'%';
    var wt=totM>0?Math.round(h.sh*h.cur/totM*100):0;
    return '<tr role="button" tabindex="0" style="cursor:pointer" onclick="openDrawer(\''+esc(h.t)+'\','+h.cur+')" onmouseenter="this.style.background=\'var(--card3)\'" onmouseleave="this.style.background=\'\'">'+
      '<td style="font-weight:700;color:var(--bright);font-family:\'IBM Plex Mono\',monospace">'+esc(h.t)+'</td>'+
      '<td style="color:var(--text2);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(_tname(h.t))+'</td>'+
      '<td style="font-family:\'IBM Plex Mono\',monospace;color:var(--text)">'+fmtMoney(h.cur)+'</td>'+
      '<td style="font-family:\'IBM Plex Mono\',monospace;color:'+chgColor+'">'+chgStr+'</td>'+
      '<td style="font-family:\'IBM Plex Mono\',monospace;color:'+pc+'">'+(pnlH>=0?'+':'')+fmtMoney(Math.abs(pnlH))+'</td>'+

      '</tr>';
  }).join('');

  // ── Empty state ──
  if(port.length===0){
    document.getElementById('main').innerHTML=
      '<div class="dash-wrap">'+
      '<div id="de-regime-banner" class="dash-ctx-card" style="margin-bottom:20px"><div class="dash-ctx-loading">// Cargando contexto de mercado…</div></div>'+

      '<div role="button" tabindex="0" class="dash-action-btn" onclick="setPage(\'screener\')"><div style="margin-bottom:5px;color:var(--grn)">'+icon('screener','ico-lg')+'</div><div style="font-size:12px;font-weight:600;color:var(--bright)">Screener Pro</div><div style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace;margin-top:2px">Filtra oportunidades</div></div>'+
      '</div></div></div>';
    dashLoadContext();
    return;
  }

  // ── KPI cards ──

// Superficie asesora embebida: sugerencia de rebalanceo dentro de la vista de
// Portfolio (no en una pagina estatica aparte). Solo aparece si el usuario fijo
// objetivos de verdad — sin objetivos guardados el rebalanceo por defecto iguala
// el peso actual (desvio cero) y la sugerencia seria ruido. Umbral 2% para no
// alertar por micro-desvios.
function portRebalHint(port,totM){
  if(!port||!port.length||!(totM>0)) return '';
  if(!Object.keys((REBAL&&REBAL.targets)||{}).length){ try{rebalLoadTargets();}catch(e){} }
  var targets=(REBAL&&REBAL.targets)||{};
  if(!Object.keys(targets).length) return '';
  var drifts=[];
  port.forEach(function(h){
    var t=targets[h.t]; if(t==null) return;
    var cur=getLivePrice(h.t)||h.cur||0;
    var curW=h.sh*cur/totM*100;
    var diff=curW-t; // + sobreponderado, - subponderado vs objetivo
    if(Math.abs(diff)>=2) drifts.push({t:h.t,diff:diff});
  });
  if(!drifts.length) return ''; // alineado con los objetivos
  drifts.sort(function(a,b){return Math.abs(b.diff)-Math.abs(a.diff);});
  var top=drifts[0];
  var dir=top.diff>0?'sobreponderado':'subponderado';
  return '<div class="fos-card" style="padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-left:3px solid var(--amber)">'+
    statusDot('🟡',12)+
    '<div style="flex:1;min-width:200px;font-size:12px;color:var(--text);line-height:1.5">'+
      '<b>Rebalanceo sugerido:</b> '+drifts.length+' posición'+(drifts.length!==1?'es se desviaron':' se desvió')+' de tus objetivos'+
      ' <span style="color:var(--text3)">(mayor: '+esc(top.t)+' '+(top.diff>0?'+':'')+top.diff.toFixed(1)+'%, '+dir+')</span>.'+
    '</div>'+
    '<button class="btn" style="border-color:var(--amber);color:var(--amber)" onclick="setPage(\'rebal\')">'+icon('rebal')+' Ver ajustes →</button>'+
  '</div>';
}

  S.capital=Math.max(0,parseFloat(v)||0);
  persist(); // no re-render needed — input keeps its value
}
function resetPort(){
  if(confirm("¿Restaurar portfolio demo?")){
    S.portfolio=JSON.parse(JSON.stringify(DEF_PORT));
    S.nextId=10;persist();renderMain();
  }
}

// ── BITÁCORA (Transaction Log) ─────────────────────────────────
function renderBitacora(){
  loadTrades();loadAlerts();
  var trades=S.trades.slice().sort(function(a,b){return b.id-a.id;});

  // Apply filters
  if(S.tradeFilter.ticker!=="ALL") trades=trades.filter(function(t){return t.ticker===S.tradeFilter.ticker;});
  if(S.tradeFilter.type!=="ALL") trades=trades.filter(function(t){return t.type===S.tradeFilter.type;});

  // Summary stats
  var totalInvested=S.trades.filter(function(t){return t.type==='buy';}).reduce(function(s,t){return s+t.amount;},0);
  var totalRealized=S.trades.filter(function(t){return t.type==='sell'&&t.pnl;}).reduce(function(s,t){return s+(t.pnl||0);},0);
  var totalDivs=S.trades.filter(function(t){return t.type==='dividend';}).reduce(function(s,t){return s+t.amount;},0);
  // Trading stats
  var sells=S.trades.filter(function(t){return t.type==='sell'&&t.pnl!=null;});
  var winners=sells.filter(function(t){return t.pnl>0;});
  var losers=sells.filter(function(t){return t.pnl<0;});
  var winRate=sells.length?Math.round(winners.length/sells.length*100):null;
  var avgGain=winners.length?winners.reduce(function(s,t){return s+t.pnl;},0)/winners.length:null;
  var avgLoss=losers.length?Math.abs(losers.reduce(function(s,t){return s+t.pnl;},0)/losers.length):null;
  var profitFactor=(avgGain&&avgLoss&&losers.length&&winners.length)?(winners.reduce(function(s,t){return s+t.pnl;},0)/Math.abs(losers.reduce(function(s,t){return s+t.pnl;},0))):null;
  var totalCash=S.trades.reduce(function(s,t){
    if(t.type==='deposit') return s+t.amount;
    if(t.type==='withdrawal') return s-t.amount;
    if(t.type==='buy') return s-t.amount;
    if(t.type==='sell') return s+t.amount;
    if(t.type==='dividend') return s+t.amount;
    return s;
  },S.capital);

  // Unique tickers for filter
  var tickers=["ALL"].concat(Array.from(new Set(S.trades.map(function(t){return t.ticker||'—';}))).filter(function(x){return x!=='—';}));

  var typeLabel={buy:'Compra',sell:'Venta',deposit:'Depósito',withdrawal:'Retiro',dividend:'Dividendo'};
  var typeColor={buy:'var(--grn)',sell:'var(--red)',deposit:'var(--blue)',withdrawal:'var(--amber)',dividend:'var(--grn)'};

  var rows=trades.length?trades.map(function(t){
    var tc=typeColor[t.type]||'var(--text)';
    var tl='<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+tc+';margin-right:5px"></span>'+(typeLabel[t.type]||t.type);
    var pnlHtml=t.pnl!=null?'<span style="color:'+(t.pnl>=0?'var(--pos)':'var(--neg)')+';">'+(t.pnl>=0?'+':'')+'$'+fmt(t.pnl)+'</span>':'—';
    return '<tr>'+
      '<td style="color:var(--text2);font-size:11px">'+t.date+'</td>'+
      '<td style="font-weight:700;color:var(--bright)">'+(t.ticker||'—')+'</td>'+
      '<td><span style="font-size:11px;font-weight:600;color:'+tc+'">'+tl+'</span></td>'+
      '<td class="col-sec">'+(t.price?'$'+fmtD(t.price):'—')+'</td>'+
      '<td class="col-sec">'+(t.qty?fmtD(t.qty):'—')+'</td>'+
      '<td style="font-weight:600">$'+fmt(t.amount)+'</td>'+
      '<td class="col-sec" style="font-size:11px;color:var(--text3)">'+(t.rsi||'—')+'</td>'+
      '<td>'+pnlHtml+'</td>'+
      '<td class="col-sec" style="font-size:11px;color:var(--text2);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.note)+'</td>'+
      '<td><button class="btn btn-r" style="padding:2px 6px;font-size:11px" onclick="deleteTrade('+t.id+')" aria-label="Eliminar">'+icon('trash')+'</button></td>'+
      '</tr>';
  }).join(""):'<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--text3)">Sin operaciones registradas todavía.<br><span style="font-size:11px">Usá el botón "Registrar operación" en Portfolio.</span></td></tr>';

  document.getElementById("main").innerHTML=
    _ph('Seguir · Bitácora','Bitácora','// Historial completo de operaciones · P&L realizado','<button class="btn" onclick="openModal(\'addtrade\')">+ Registrar operación</button><button class="btn" style="margin-left:6px" onclick="exportTradesCSV()">'+icon('download')+'CSV</button>')+

    // KPI summary
    // 1 respuesta (¿gano con lo que ya cerre?) + 3 apoyos. El conteo de
    // operaciones pasa al subtitulo del heroe: es contexto del P&L, no un KPI.
    '<div class="krow-hero">'+
    kpi("P&L Realizado",(totalRealized>=0?"▲ +":"▼ ")+"$"+fmt(Math.abs(totalRealized)),
        S.trades.length+" operaciones cerradas",totalRealized>=0?"g":"r","hero")+
    kpi("Total Invertido","$"+fmt(totalInvested),"acumulado","n")+
    kpi("Dividendos Recib.","$"+fmt(totalDivs),"cobrados","n")+
    kpi("Cash Disponible","$"+fmt(Math.max(0,totalCash)),"estimado","n")+
    '</div>'+
    // Trading performance stats
    (sells.length>=2?
    '<div class="cb"><div class="st"><div class="stbar"></div>Performance de Trading</div>'+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">'+
    '<div style="text-align:center;padding:10px;background:var(--card2);border-radius:var(--r-md);border:1px solid var(--border)">'+
      '<div style="font-size:18px;font-weight:700;color:'+(winRate>=50?'var(--pos)':'var(--neg)')+'">'+winRate+'%</div>'+
      '<div style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace">WIN RATE</div>'+
      '<div style="font-size:11px;color:var(--text3);margin-top:2px">'+winners.length+'W / '+losers.length+'L</div>'+
    '</div>'+
    '<div style="text-align:center;padding:10px;background:var(--card2);border-radius:var(--r-md);border:1px solid var(--border)">'+
      '<div style="font-size:18px;font-weight:700;color:'+(profitFactor&&profitFactor>=1?'var(--pos)':'var(--neg)')+'">'+
        (profitFactor!=null?profitFactor.toFixed(2):'—')+'</div>'+
      '<div style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace">PROFIT FACTOR</div>'+
      '<div style="font-size:11px;color:var(--text3);margin-top:2px">&gt;1.0 = rentable</div>'+
    '</div>'+
    '<div style="text-align:center;padding:10px;background:var(--card2);border-radius:var(--r-md);border:1px solid var(--border)">'+
      '<div style="font-size:18px;font-weight:700;color:var(--grn)">'+
        (avgGain!=null?'+$'+fmt(avgGain):'—')+'</div>'+
      '<div style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace">AVG GANANCIA</div>'+
      '<div style="font-size:11px;color:var(--text3);margin-top:2px">por trade ganador</div>'+
    '</div>'+
    '<div style="text-align:center;padding:10px;background:var(--card2);border-radius:var(--r-md);border:1px solid var(--border)">'+
      '<div style="font-size:18px;font-weight:700;color:var(--red)">'+
        (avgLoss!=null?'-$'+fmt(avgLoss):'—')+'</div>'+
      '<div style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace">AVG PÉRDIDA</div>'+
      '<div style="font-size:11px;color:var(--text3);margin-top:2px">por trade perdedor</div>'+
    '</div>'+
    '</div></div>'
    :'')+

    // Filters
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">'+
    '<span style="font-size:11px;color:var(--text2)">Filtrar:</span>'+
    '<select class="inp" style="width:auto;padding:4px 8px;font-size:11px" onchange="S.tradeFilter.ticker=this.value;renderBitacora()">'+
    tickers.map(function(t){return '<option value="'+esc(t)+'"'+(S.tradeFilter.ticker===t?' selected':'')+'>'+esc(t)+'</option>';}).join("")+
    '</select>'+
    '<select class="inp" style="width:auto;padding:4px 8px;font-size:11px" onchange="S.tradeFilter.type=this.value;renderBitacora()">'+
    ['ALL','buy','sell','deposit','withdrawal','dividend'].map(function(v){
      var l={ALL:'Todos los tipos',buy:'Compras',sell:'Ventas',deposit:'Depósitos',withdrawal:'Retiros',dividend:'Dividendos'};
      return '<option value="'+v+'"'+(S.tradeFilter.type===v?' selected':'')+'>'+l[v]+'</option>';
    }).join("")+
    '</select>'+
    (S.tradeFilter.ticker!=='ALL'||S.tradeFilter.type!=='ALL'?'<button class="btn" style="font-size:11px;padding:3px 8px" onclick="S.tradeFilter={ticker:\'ALL\',type:\'ALL\'};renderBitacora()">✕ Limpiar</button>':'')+
    '</div>'+

    // Table
    // En movil se esconden Precio/Qty/RSI/Nota (detalle): quedan Fecha, Ticker,
    // Tipo, Monto, P&L y la accion — lo que responde "que paso y como me fue".
    '<div class="tw"><table><thead><tr>'+
    '<th>Fecha</th><th>Ticker</th><th>Tipo</th><th class="col-sec">Precio</th><th class="col-sec">Qty</th><th>Monto</th><th class="col-sec">RSI</th><th>P&L</th><th class="col-sec">Nota</th><th></th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+

    // Dividendos recibidos + Costo promedio ponderado — mismo peso conceptual
    // (dos resúmenes acotados "de un vistazo"), emparejados en .grid2 cuando
    // ambos existen para que no compitan apilados a ancho completo; si sólo
    // uno tiene datos, ese queda solo a ancho completo (no dejar una columna
    // vacía en el grid).
    (function(){
      var divs=S.trades.filter(function(t){return t.type==='dividend';});
      var divsHtml='';
      if(divs.length){
        var totalDivs=divs.reduce(function(s,t){return s+t.amount;},0);
        var byTicker={};
        divs.forEach(function(d){
          if(!byTicker[d.ticker]) byTicker[d.ticker]={ticker:d.ticker,count:0,total:0};
          byTicker[d.ticker].count++;byTicker[d.ticker].total+=d.amount;
        });
        var byMonth={};
        divs.forEach(function(d){
          var m=d.date?d.date.substring(0,7):'?';
          if(!byMonth[m]) byMonth[m]=0;byMonth[m]+=d.amount;
        });
        var tickerChips=Object.values(byTicker).sort(function(a,b){return b.total-a.total;}).map(function(d){
          return '<div style="background:var(--card2);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 14px;min-width:120px">'+
            '<div style="font-weight:700;color:var(--bright);font-size:12px">'+d.ticker+'</div>'+
            '<div style="font-size:11px;color:var(--grn)"><b>$'+fmt(d.total)+'</b></div>'+
            '<div style="font-size:11px;color:var(--text3)">'+d.count+' pago'+(d.count>1?'s':'')+'</div>'+
          '</div>';
        }).join('');
        var monthRows=Object.keys(byMonth).sort().reverse().slice(0,6).map(function(m){
          var amt=byMonth[m];
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)">'+
            '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--text2)">'+m+'</span>'+
            '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;font-weight:700;color:var(--grn)">+$'+fmt(amt)+'</span>'+
          '</div>';
        }).join('');
        divsHtml='<div style="background:var(--card2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+
            '<h3 style="font-size:13px;margin:0;color:var(--text2)">'+icon('cash')+' Dividendos recibidos</h3>'+
            '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:14px;font-weight:700;color:var(--grn)">+$'+fmt(totalDivs)+'</span>'+
          '</div>'+
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+tickerChips+'</div>'+
          '<div style="font-size:11px;font-family:\'IBM Plex Mono\',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Por mes</div>'+
          monthRows+
        '</div>';
      }

      var costHtml='';
      if(S.trades.length){
        var costChips=Array.from(new Set(S.trades.filter(function(t){return t.type==='buy';}).map(function(t){return t.ticker;}))).map(function(tkr){
          var buys=S.trades.filter(function(t){return t.ticker===tkr&&t.type==='buy';});
          var sells=S.trades.filter(function(t){return t.ticker===tkr&&t.type==='sell';});
          var totalQ=buys.reduce(function(s,t){return s+t.qty;},0)-sells.reduce(function(s,t){return s+t.qty;},0);
          var totalAmt=buys.reduce(function(s,t){return s+t.amount;},0);
          var avgCost=buys.reduce(function(s,t){return s+t.qty;},0)>0?totalAmt/buys.reduce(function(s,t){return s+t.qty;},0):0;
          var realPnl=realizedPnlFor(tkr);
          if(totalQ<=0&&realPnl===0) return '';
          return '<div style="background:var(--card2);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;min-width:150px">'+
            '<div style="font-weight:700;color:var(--bright);margin-bottom:4px">'+tkr+'</div>'+
            '<div style="font-size:11px;color:var(--text2)">Costo prom: <b style="color:var(--bright)">$'+fmtD(avgCost)+'</b></div>'+
            '<div style="font-size:11px;color:var(--text2)">Shares: <b>'+fmtD(totalQ)+'</b></div>'+
            (realPnl!==0?'<div style="font-size:11px;color:'+(realPnl>=0?'var(--pos)':'var(--neg)')+'">P&L real: '+(realPnl>=0?'+':'')+'$'+fmt(realPnl)+'</div>':'')+
            '</div>';
        }).join("");
        if(costChips){
          costHtml='<div style="background:var(--card2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px">'+
            '<h3 style="font-size:13px;margin:0 0 12px;color:var(--text2)">'+icon('volume')+' Costo promedio ponderado por posición</h3>'+
            '<div style="display:flex;gap:8px;flex-wrap:wrap">'+costChips+'</div>'+
          '</div>';
        }
      }

      if(divsHtml&&costHtml) return '<div class="grid2" style="margin-top:18px">'+divsHtml+costHtml+'</div>';
      if(divsHtml) return '<div style="margin-top:18px">'+divsHtml+'</div>';
      if(costHtml) return '<div style="margin-top:18px">'+costHtml+'</div>';
      return '';
    })();
}

function deleteTrade(id){
  if(!confirm("¿Eliminar esta operación?")) return;
  S.trades=S.trades.filter(function(t){return t.id!==id;});
  persistTrades();renderBitacora();
}

function exportTradesCSV(){
  if(!S.trades.length){showToast("No hay operaciones para exportar.","warning");return;}
  var rows=[["ID","Fecha","Ticker","Tipo","Precio","Qty","Monto","RSI","P&L","Nota"]];
  S.trades.slice().sort(function(a,b){return b.id-a.id;}).forEach(function(t){
    rows.push([t.id,t.date,t.ticker||'',t.type,t.price||'',t.qty||'',t.amount,t.rsi||'',t.pnl!=null?t.pnl:'',t.note||'']);
  });
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
  a.download="bitacora-"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
}

function exportScreenerCSV(){
  var results=S.screenerResults.filter(function(r){return !r.error;});
  if(!results.length){showToast("No hay resultados para exportar.","warning");return;}
  var rows=[["Ticker","Precio","Score DE","Acción","RSI","PQ Score","Entrada","Stop","R:R","Sector RS"]];
  results.sort(function(a,b){return b.score-a.score;}).forEach(function(s){
    rows.push([s.ticker,s.last,s.score,s.action,s.rsi,s.pqScore!=null?s.pqScore:'',s.entry,s.stop,s.rr,s.sectorRS?s.sectorRS.etf+' '+s.sectorRS.label:'']);
  });
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
  a.download="screener-"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
}

  document.getElementById("main").innerHTML=

    // Igual que Portfolio: en movil se esconden las columnas secundarias

  var idx=S.watchlist.indexOf(t);
  S.watchlist=S.watchlist.filter(function(x){return x!==t;});

// ── MARKET BAR ─────────────────────────────────────────────────
// _barFetched pasó de booleano "ya lo intenté" a createLoadGate() el
// 13-sep-2026: la version vieja marcaba _barFetched=true tambien dentro del
// catch(e) de fallo, asi que un solo timeout de /api/marketbar dejaba los
// indices (S&P/Dow/Nasdaq/VIX/Bitcoin) en "sin dato" para el resto de la
// sesion, sin reintentar nunca — bug confirmado navegando: a veces cargaban,
// a veces se quedaban pegados. El gate reintenta solo despues de 20s si el
// intento anterior fallo, en vez de rendirse para siempre.
var MARKET_BAR=[];
var _barGate=createLoadGate(20000);
function barIsLoading(){ return _barGate.isLoading(); }

async function fetchMarketBar(){
  if(!_USE_EDGE) return;
  try{
    var cached=JSON.parse(localStorage.getItem('mv_market_bar')||'null');
    if(cached&&(Date.now()-cached.ts)<3*60*1000&&cached.items&&cached.items.length){
      MARKET_BAR=cached.items;return;
    }
  }catch(e){/* silent */}
  try{
    await _barGate.run(async function(){
      var res=await fetchWithTimeout('/api/marketbar',7000);
      if(!res.ok) throw new Error('marketbar '+res.status);
      var data=await res.json();
      if(data.items&&data.items.length){
        MARKET_BAR=data.items;
        localStorage.setItem('mv_market_bar',JSON.stringify({ts:Date.now(),items:MARKET_BAR}));
      }
      return data;
    });
  }catch(e){ if(e&&e.message!=='cooldown') trackError('marketbar',e); }
}

// _newsFetched: mismo fix que _barGate arriba — antes era una bandera que se
// marcaba true tambien en el catch(e) de fallo, dejando el feed de noticias
// (y por eso tambien MARKET_BAR, ver mercadoHoyBody) sin reintentar nunca

async function fetchLiveNews(){
  if(!_USE_EDGE) return;

      LIVE_NEWS=cached.items;return;
    }
  }catch(e){/* silent */}
  try{
    await _newsGate.run(async function(){
      var tickers=['SPY','QQQ','NVDA','AAPL','AMZN','META','MSFT','GLD','BTC-USD'];
      S.portfolio.slice(0,5).forEach(function(h){if(tickers.indexOf(h.t)<0)tickers.unshift(h.t);});

// ── TIMESTAMP HELPERS ──────────────────────────────────────────
function relTime(hoursAgo){
  if(hoursAgo<1) return 'hace '+Math.round(hoursAgo*60)+'m';
  if(hoursAgo<24) return 'hace '+Math.round(hoursAgo)+'h';
  if(hoursAgo<48) return 'hace 1 día';
  return 'hace '+Math.round(hoursAgo/24)+' días';
}

function saveNewsCache(data){
  try{localStorage.setItem('mv_news_cache',JSON.stringify({ts:Date.now(),data:data}));}catch(e){/* silent */}
}
function loadNewsCache(){
  try{
    var c=localStorage.getItem('mv_news_cache');
    if(!c) return null;
    var p=JSON.parse(c);
    // Valid for 2 hours
    if(Date.now()-p.ts < 2*60*60*1000) return p.data;
  }catch(e){/* silent */}
  return null;
}

// ── INDICADORES (Pro) ──────────────────────────────────────────
// Las columnas RSI y SMA20 mostraban '—' hardcodeado: el calculo nunca se hizo.
// TI.rsi y _smaLast ya existian. Se carga bajo demanda con el mismo patron que
// loadCapitalData: cache por ticker, una pasada asincrona y re-render.
var IND_CACHE={};
var _indLoading=false;
async function loadIndData(){
  if(_indLoading) return;
  var tickers=S.portfolio.map(function(h){return h.t;});
  var pendientes=tickers.filter(function(t){return IND_CACHE[t]===undefined;});
  if(!pendientes.length) return;
  _indLoading=true;
  for(var i=0;i<pendientes.length;i++){
    var t=pendientes[i];
    try{
      var hist=await fetchHistory(t,'6mo');
      var closes=(hist||[]).map(function(d){return d.close;}).filter(function(c){return c>0;});
      if(closes.length<21){ IND_CACHE[t]={rsi:null,sma20:null}; continue; }
      var rsiArr=TI.rsi(closes,14);
      var ultimoRsi=null;
      for(var k=rsiArr.length-1;k>=0;k--){ if(rsiArr[k]!=null){ ultimoRsi=rsiArr[k]; break; } }
      IND_CACHE[t]={rsi:ultimoRsi, sma20:_smaLast(closes,20)};
    }catch(e){
      // Antes esto tambien escribia IND_CACHE[t]={rsi:null,sma20:null} en el
      // catch, indistinguible del caso "no hay suficiente historia". Un
      // fallo transitorio de red (fetchHistory) quedaba entonces cacheado
      // para siempre como "sin dato" (columna quedaba en '—' o '…' sin
      // reintentar jamas al volver a la pantalla). No cachear nada en el
      // fallo: "pendientes" lo vuelve a intentar la proxima vez que se llame
      // loadIndData() (siguiente visita a Indicadores).
    }
  }
  _indLoading=false;
  if(S.page==='ind') renderInd();
}

// ── RISK (Pro) ─────────────────────────────────────────────────
// Riesgo y Position Builder resolvian LA MISMA ecuacion de sizing:
//   renderRisk:  ps = rA/_r*h.cur           con rA = capital*0.02
//   pbCompute:   posSize = riskAmt/riskPct  con riskPct = (price-stop)/price

    // En movil quedan Activo/Risk $/Tamaño/R:R — la salida real de la calculadora

var BT={tab:'journal',ticker:'SPY',range:'1y',fast:20,slow:50,capital:10000,running:false,result:null};

function renderBack(){

function btRenderJournal(sells){
  if(!sells.length){
    return '<div class="cb" style="text-align:center;padding:40px 20px;color:var(--text3)">'+
      '<div style="width:32px;height:32px;margin:0 auto 12px">'+icon('clipboard','ico-lg')+'</div>'+
      '<div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:6px">Sin operaciones cerradas aún</div>'+
      '<div style="font-size:12px">Registra trades con P&L en tu Bitácora y aparecerán aquí analizadas automáticamente.</div>'+
      '<button class="btn" style="margin-top:16px" onclick="setPage(\'bitacora\')">Ir a Bitácora →</button></div>';
  }

  var wins=sells.filter(function(t){return t.pnl>0;});
  var losses=sells.filter(function(t){return t.pnl<=0;});
  var totalPnl=sells.reduce(function(s,t){return s+(t.pnl||0);},0);
  var avgWin=wins.length?wins.reduce(function(s,t){return s+t.pnl;},0)/wins.length:0;
  var avgLoss=losses.length?Math.abs(losses.reduce(function(s,t){return s+t.pnl;},0)/losses.length):0;
  var profitFactor=(avgLoss&&losses.length&&wins.length)?(wins.reduce(function(s,t){return s+t.pnl;},0)/Math.abs(losses.reduce(function(s,t){return s+t.pnl;},0))):null;
  var winRate=sells.length?wins.length/sells.length:0;
  var expectancy=winRate*avgWin-(1-winRate)*avgLoss;

  // per-ticker breakdown
  var byTicker={};
  sells.forEach(function(t){
    var tk=t.ticker||'—';
    if(!byTicker[tk]) byTicker[tk]={wins:0,losses:0,pnl:0,trades:0};
    byTicker[tk].trades++;
    byTicker[tk].pnl+=(t.pnl||0);
    if(t.pnl>0) byTicker[tk].wins++; else byTicker[tk].losses++;
  });
  var tkRows=Object.keys(byTicker).sort(function(a,b){return byTicker[b].pnl-byTicker[a].pnl;}).map(function(tk){
    var r=byTicker[tk];
    var wr=r.trades?r.wins/r.trades:0;
    return '<tr>'+
      '<td style="font-weight:600;color:var(--bright);cursor:pointer" role="button" tabindex="0" onclick="openDrawer(\''+tk+'\',0)">'+tk+' <span style="font-size:11px">↗</span></td>'+
      '<td style="color:var(--text3)">'+r.trades+'</td>'+
      '<td style="color:var(--text3)">'+r.wins+'/'+r.losses+'</td>'+
      '<td style="color:'+(wr>=0.5?'var(--pos)':'var(--neg)')+'">'+pct(wr)+'</td>'+
      '<td style="font-weight:700;color:'+(r.pnl>=0?'var(--pos)':'var(--neg)')+'">'+( r.pnl>=0?'+':'')+'$'+fmt(Math.abs(r.pnl))+'</td></tr>';
  }).join('');

  // equity curve from sorted sells by id
  var sorted=sells.slice().sort(function(a,b){return a.id-b.id;});
  var cum=0;var eqData=sorted.map(function(t){cum+=(t.pnl||0);return cum;});
  var eqMin=Math.min.apply(null,[0].concat(eqData));
  var eqMax=Math.max.apply(null,eqData);
  var eqRng=eqMax-eqMin||1;
  var eqBars=eqData.map(function(v){
    var h=Math.max(2,((v-eqMin)/eqRng*80)).toFixed(0);
    return '<div style="flex:1;min-width:4px;background:'+(v>=0?'var(--pos)':'var(--neg)')+';opacity:.8;border-radius:2px 2px 0 0;height:'+h+'px;align-self:flex-end"></div>';
  }).join('');

  // max drawdown
  var peak=0;var maxDD=0;
  eqData.forEach(function(v){if(v>peak)peak=v;var dd=peak-v;if(dd>maxDD)maxDD=dd;});

  return '<div class="krow">'+
    kpi("Operaciones",sells.length,wins.length+" ganadoras","n")+
    kpi("Win Rate",pct(winRate),wins.length+"/"+sells.length,winRate>=0.5?"g":"r")+
    kpi("P&L Total",D(totalPnl),totalPnl>=0?"Positivo":"Negativo",totalPnl>=0?"g":"r")+
    kpi("Expectativa",D(expectancy),"por trade",expectancy>=0?"g":"r")+
    kpi("Profit Factor",profitFactor!=null?profitFactor.toFixed(2):"—","ratio gana/pierde",profitFactor&&profitFactor>=1.5?"g":profitFactor&&profitFactor>=1?"a":"r")+
    kpi("Max Drawdown",D(maxDD),"caída máxima acumulada","r")+
    '</div>'+
    '<div class="cb">'+
    '<div class="st"><div class="stbar"></div>Equity Curve — trades reales de tu Bitácora</div>'+
    '<div style="display:flex;gap:2px;height:80px;align-items:flex-end;padding:4px">'+eqBars+'</div>'+
    '</div>'+
    '<div class="cb">'+
    '<div class="st"><div class="stbar"></div>Rendimiento por Activo</div>'+
    '<div class="tw"><table><thead><tr><th>Activo</th><th>Trades</th><th>W/L</th><th>Win Rate</th><th>P&L</th></tr></thead>'+
    '<tbody>'+tkRows+'</tbody></table></div></div>'+
    '<div style="font-size:11px;color:var(--text3);text-align:center;margin-top:8px">Análisis basado en '+sells.length+' operaciones cerradas con P&L registrado en tu Bitácora.</div>';
}

  var rows=res.trades;
  var eqMin=Math.min.apply(null,[res.capital].concat(rows.map(function(r){return r.cum;})));
  var eqMax=Math.max.apply(null,[res.capital].concat(rows.map(function(r){return r.cum;})));
  var eqRng=eqMax-eqMin||1;
  var eqBars=rows.map(function(r){
    var h=Math.max(2,((r.cum-eqMin)/eqRng*80)).toFixed(0);
    return '<div title="'+r.date+' $'+fmt(r.cum)+'" style="flex:1;min-width:3px;background:'+(r.cum>=res.capital?'var(--pos)':'var(--neg)')+';opacity:.8;border-radius:2px 2px 0 0;height:'+h+'px;align-self:flex-end"></div>';
