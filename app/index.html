/* Fonts loaded async via <link> in <head> — no render-blocking @import */

/* ── NATIVE FEEL: CHASIS ──────────────────────────────────────────────

* { -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
button, a, label, summary, [role="button"], [role="tab"] {
  touch-action: manipulation;
}
nav, header, footer, button, .btn, [role="button"], [role="tab"] {

}

input, select, textarea { font-size: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .btn:active, [role="button"]:active { transform: scale(.97); transition: transform .06s; }
}

/* ── TOKENS ── */
:root {
  /* Colores — modo claro (idéntico a FinanceOS light) */
  /* ── Marca: azul tinta ───────────────────────────────────────────────
     Era verde, el mismo hex que la ganancia. Compartir color con la semantica
     hacia que el color no dijera nada: boton y "+$400" eran identicos. Verde y
     rojo quedan reservados a resultado (--pos/--neg), y la marca se mueve a un
     hue que no compite con el P&L. Los nombres --grn* se conservan a proposito:
     renombrar 260 usos anadiria riesgo sin cambiar nada visual. */
  /* ── Paleta de marca MOY IQ ("El Instrumento") — alineada a financeos-app ── */
  --grn:       #14213D; /* Navy — marca/estructura */
  /* Superficies solidas de CTA: Latón, SIEMPRE con texto Navy encima (nunca
     blanco — falla AA sobre Latón). Ver los 3 usos de --grn-solid más abajo,
     ya migrados a color:var(--grn) en vez de color:#fff. */
  --grn-solid: #B8863B;
  --grn-bg:    rgba(20,33,61,0.07);
  --grn-lt:    rgba(20,33,61,0.14);
  --grn-d:     #0D1730;

  --laton:      #B8863B;
  --laton-700:  #8A6329; /* texto/íconos sobre Papel — AA */

  --red:       #A23E2E;
  --red-bg:    rgba(162,62,46,0.08);
  --red-lt:    #F3DAD5;

  --amber:     #9C5419;
  --amber-bg:  rgba(201,122,61,0.12);

  /* Alias de fondos/bordes de estado usados en .sigb/.rtab y badges inline.
     Antes se referenciaban sin definir (--gbg/--gborder/--ambg/--amborder)
     y caian a `initial` -> cajas sin fondo ni borde. */
  --gbg:       var(--grn-bg);
  --gborder:   var(--grn-lt);
  --ambg:      var(--amber-bg);
  --amborder:  var(--amber);

  /* ── Semantica de resultado ──────────────────────────────────────────
     Ganancia y perdida. Verde = único color positivo/éxito del brand book;
     rojo/error para pérdida. Convención universal en finanzas, no cambia. */
  --pos:       #356E57;
  --neg:       #A23E2E;

  /* Aliases usados en JS inline styles */
  --green:     #356E57;
  --orange:    #9C5419;
  --orange-bg: rgba(201,122,61,0.12);
  --orange-bd: #E3C08F;

  --blue:      #3E5A78;
  --blue-bg:   rgba(91,122,153,0.12);

  /* Superficies — Papel */
  --bg:        #F1EEE6;
  --bg2:       #FAF8F2;
  --card:      #FAF8F2;
  --card2:     #F1EEE6;
  --card3:     #F5F2EA;
  --card4:     #E4DFD1;

  /* Texto — Navy */
  --text:      #4A4739;
  --text2:     #63604F;
  --text3:     #63604F;
  --bright:    #14213D;
  --white:     #ffffff;

  /* Bordes */
  --border:    rgba(20,33,61,0.10);
  --border2:   rgba(20,33,61,0.18);
  --border3:   rgba(20,33,61,0.24);

  /* Sombras */
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.05);

  /* Radios */
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  18px;
  --r-xl:  24px;

  /* Escala de espaciado — base 2px.
     Se eligio 2 y no 4 a partir de medir el CSS existente: el 85% de las
     declaraciones ya caia en multiplos de 2, pero solo el 47% en multiplos de
     4, y los tres valores mas usados (14px, 10px y 6px) son pares fuera del
     grid de 4. Forzar escala estricta de 4 habria movido 94 declaraciones:
     eso no es un refactor, es un rediseno. Con base 2 se elimina la
     arbitrariedad real (los 32 valores impares) sin tocar la composicion. */
  --suite-h: 0px;    /* la franja de suite se elimino; se conserva el token porque .sb y #topbar lo descuentan */
  --topbar-h: 60px;  /* alto de la banda de mercado (#topbar, fixed): el nav superior lo reserva */
  --sp-1:  2px;
  --sp-2:  4px;
  --sp-3:  6px;
  --sp-4:  8px;
  --sp-5:  10px;
  --sp-6:  12px;
  --sp-7:  14px;
  --sp-8:  16px;
  --sp-10: 20px;
  --sp-12: 24px;
  --sp-14: 28px;
  --sp-16: 32px;
  --sp-20: 40px;
  --sp-24: 48px;

  /* Sidebar */
  --sb-w:  0px;
}

/* ── DARK MODE ── */
[data-theme="dark"] {
  --grn:       #F1EEE6; /* Papel funciona como "primario" claro sobre fondo Navy oscuro */
  --grn-solid: #CC9A52; /* Latón para datos/CTA sobre Navy oscuro — texto Navy encima */
  --grn-bg:    rgba(241,238,230,0.08);
  --grn-lt:    rgba(241,238,230,0.16);

  --amber:     #E0975A;

  --pos:       #74C2A3;

  /* Aliases dark mode */

}

/* ── PAGE HEADER ── */
/* Cabecera de modulo. Conviven dos formas de escribirla — _ph() genera .ph
   (17 usos) y otros modulos ponen .fos-module-header a mano (9 usos) — pero son

   desincronizan. Antes renderizaban distinto: .ph a 24/20 y fos-module-header
   a 20/20, porque la regla #main > div le pisaba su padding. */

.fos-module-header {
  display: flex;

  font-size: 27px;

.krow {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap:10px;
  margin-bottom:20px;
}
.kpi {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  padding:14px 16px;
  box-shadow: var(--shadow-sm);
}
.kl {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  margin-bottom:6px;
}
.kv {
  font-size: 20px;
  font-weight: 600;
  color: var(--bright);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.ks {
  font-size: 11px;
  margin-top:4px;
  font-family: 'IBM Plex Mono', monospace;
}
.ks.pos { color: var(--pos); }
.ks.neg { color: var(--neg); }
.ks.neu { color: var(--text3); }

/* KPI color accents — borde izquierdo sutil */
.kg { border-left: 2px solid var(--grn); }
.kr { border-left: 2px solid var(--red); }
.ka { border-left: 2px solid var(--amber); }
/* El valor tambien hereda el color semantico (--pos/--neg), no solo el borde.
   Antes cada pantalla que queria el numero en verde/rojo tenia que envolverlo
   a mano (asi lo hacia renderDash) y las que no lo hacian se quedaban en
   negro — el mismo concepto (P&L) se leia distinto segun la pantalla. */
.kg .kv { color: var(--pos); }
.kr .kv { color: var(--neg); }
.kb { border-left: 2px solid var(--blue); }
/* Rail neutro: para datos sin estado semántico (una magnitud no es "positiva") */
.kn { border-left: 2px solid var(--border2); }

/* ── FRANJA DE SUITE ─────────────────────────────────────────────
   Usa tokens para funcionar en ambos temas. z-index 60 y no 9999: solo debe
   quedar por encima del contenido, nunca del drawer ni de los modales. */
/* #topbar y .sb son position:fixed con top:0, es decir anclados al VIEWPORT,
   no al final de esta franja. Se pintaban encima de ella: el fondo oscuro del
   topbar (var(--bg2)) era la banda negra que tapaba la parte superior.
   Se fija una altura conocida y los tres elementos la descuentan. */
.suite-nav {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 0 var(--sp-7);
  height: var(--suite-h);
  background: var(--bg);
  border-bottom: 0.5px solid var(--border);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; letter-spacing: .4px;
  position: fixed; top: 0; left: 0; right: 0; z-index: 120;
}
.suite-home    { color: var(--text3); text-decoration: none; transition: color .15s cubic-bezier(.23,1,.32,1); }
.suite-home:hover { color: var(--text); }
.suite-sep     { color: var(--border2); }
.suite-current { color: var(--text2); }

/* Barra de fuerza (score) — las clases .sbar/.sf se usaban en sbar() pero no
   tenian CSS, asi que la columna 'Fuerza' salia vacia. */
.sbar { display:inline-block; width:60px; height:6px; background:var(--card3); border-radius:3px; overflow:hidden; vertical-align:middle; }
.sf   { display:block; height:100%; border-radius:3px; }

/* ── CHIPS DE WATCHLIST ──────────────────────────────────────────
   La clase .wtag se generaba en el HTML pero NO existia en el CSS: eran
   <span> desnudos, sin padding ni borde, separados solo por el espacio del
   texto. De ahi que los tickers aparecieran pegados unos a otros. */
.wtag-grid {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin-bottom: var(--sp-5);
}
.wtag {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-5);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-sm);
  background: var(--card2);
  color: var(--text2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  line-height: 1.4;
  cursor: pointer;
  user-select: none;
  transition: border-color .15s cubic-bezier(.23,1,.32,1),
              color .15s cubic-bezier(.23,1,.32,1),
              background-color .15s cubic-bezier(.23,1,.32,1);
}
.wtag::after { content: "+"; color: var(--text3); font-weight: 700; }
.wtag:hover { border-color: var(--grn); color: var(--bright); background: var(--card3); }
.wtag:hover::after { color: var(--grn); }
.wtag:active { transform: scale(.97); }
@media (pointer: coarse) { .wtag { min-height: 44px; } }
/* Jerarquía 1 respuesta -> 3 apoyos */
.krow-hero {
  display: grid;
  grid-template-columns: 1.7fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}
.kpi.hero { padding:18px 20px; }
.kpi.hero .kl { font-size: 11px; }
.kpi.hero .kv { font-size: 34px; line-height: 1.1; }
.kpi.hero .ks { font-size: 12px; margin-top:4px; }
@media (max-width: 900px) { .krow-hero { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .krow-hero { grid-template-columns: 1fr; } }

/* ── CARD BOX ── */
/* ── CARD: identidad visual unica ──────────────────────────────────
   .cb (card con padding) y .fos-card (card estructurada/flush) eran dos
   "sistemas" con bordes y sombras distintos; moverse entre pantallas cruzaba
   una costura visible. Ahora comparten UNA base (borde/radio/sombra/fondo) y
   solo difieren en el relleno: .cb trae padding+margen por defecto; .fos-card
   queda flush para cards con su propia estructura interna (header+body/tabla). */
.cb, .fos-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.cb {
  /* Padding de card unificado al token --sp-8 (16px): antes 18px 20px off-scale.
     Ahora .cb y las fos-card de contenido comparten el mismo relleno. */
  padding:var(--sp-8);
  /* Unica fuente del espaciado de este componente: antes 41 usos de .cb
     llevaban margenes inline de 10/12/14/16px que pisaban esta regla, asi que
     tarjetas identicas quedaban a distancias distintas segun quien las escribio. */
  margin-bottom:var(--sp-7);
}

/* ── SECTION TITLE ── */
.st {
  /* Mismo look que .fos-section-label (mono 9px): eran dos labels de seccion
     con tipografia distinta (Inter 10px vs mono 9px). Ahora leen igual en toda
     la app; la barra .stbar ya coincidia con .fos-section-label::before. */
  display: flex;
  align-items: center;
  gap:8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text3);
  margin-bottom:14px;
}
.stbar {
  width: 3px; height: 12px;
  background: var(--grn);
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── TABLE ── */
.tw {
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
  margin-bottom:14px;
}
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
thead th {
  text-align: left;
  padding:10px 14px;
  cursor: pointer;
  user-select: none;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  background: var(--card2);
  border-bottom: 0.5px solid var(--border2);
  white-space: nowrap;
}
td {
  padding:8px 14px;
  font-size: 12px;
  border-bottom: 0.5px solid var(--border);
  font-variant-numeric: tabular-nums;
  color: var(--text);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
.trow:hover td { background: var(--card3); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap:4px;
  padding:6px 12px;
  border-radius: var(--r-sm);
  border: 0.5px solid var(--border2);
  background: var(--card);
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  font-family: 'IBM Plex Sans', sans-serif;
  cursor: pointer;
  transition: border-color .12s cubic-bezier(.23,1,.32,1),
              color .12s cubic-bezier(.23,1,.32,1),
              background-color .12s cubic-bezier(.23,1,.32,1);
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--grn);
  color: var(--grn);
  background: var(--grn-bg);
}
.btn-big {
  display: inline-flex; align-items: center; gap:6px;
  padding:8px 16px;
  border-radius: var(--r-sm);
  border: none;
  background: var(--grn-solid);
  color: #14213D;
  font-size: 12px;
  font-weight: 600;
  font-family: 'IBM Plex Sans', sans-serif;
  cursor: pointer;
  transition: background .12s, transform .1s;
  white-space: nowrap;
}
.btn-big:hover { background: var(--grn-d); transform: translateY(-1px); }
.btn-big:active { transform: translateY(0); }
.btn-big:disabled { opacity:.5; cursor:not-allowed; transform:none; }

/* ── INPUTS ── */
.inp {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-sm);
  padding:8px 10px;
  font-size: 12px;
  font-family: 'IBM Plex Sans', sans-serif;
  color: var(--bright);
  outline: none;
  transition: border-color .12s;
  width: 100%;
}
.inp:focus { border-color: var(--grn); box-shadow: 0 0 0 3px var(--grn-bg); }

/* ── BADGES ── */
.badge {
  display: inline-block;
  padding:2px 8px;
  border-radius:var(--r-xl);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  font-family: 'IBM Plex Mono', monospace;
}
.badge.buy  { background: var(--grn-bg); color: var(--grn); }
.badge.hold { background: var(--amber-bg); color: var(--amber); }
.badge.sell { background: var(--red-bg); color: var(--red); }

/* ── LIVE BADGE ── */
.live-badge {
  display: inline-flex; align-items: center; gap:4px;
  padding:4px 10px;
  border-radius:var(--r-xl);
  font-size: 11px;
  font-weight: 500;
  font-family: 'IBM Plex Mono', monospace;
  background: var(--grn-bg);
  color: var(--grn);
  border: 0.5px solid var(--grn-lt);
}
.live-badge.loading { background: var(--amber-bg); color: var(--amber); border-color: #fde68a; }
.live-badge.error   { background: var(--red-bg);   color: var(--red);   border-color: var(--red-lt); }
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse-dot 2s ease infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── SCORE BAR ── */
.score-bar {
  height: 3px;
  background: var(--card3);
  border-radius: 2px;
  overflow: hidden;
  margin-top:4px;
}
.score-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .4s ease;
}
.score-fill.high { background: var(--grn); }
.score-fill.mid  { background: var(--amber); }
.score-fill.low  { background: var(--red); }

/* ── TABS ── */
.tabs {
  display: flex;
  gap:2px;
  margin-bottom:18px;
  border-bottom: 0.5px solid var(--border2);
}
.tab-btn {
  padding:8px 14px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  font-weight: 500;
  font-family: 'IBM Plex Sans', sans-serif;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom:-0.4px;
  transition: color .12s, border-color .12s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.act {
  color: var(--grn);
  border-bottom-color: var(--grn);
}

/* ── MODAL / OVERLAY ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding:20px;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-xl);
  padding:28px;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  position: relative;
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
}
.modal h2 {
  font-size: 17px;
  font-weight: 600;
  color: var(--bright);
  margin-bottom:6px;
  letter-spacing: -.3px;
}
.modal .modal-sub, .modal .msub {
  font-size: 12px;
  color: var(--text2);
  margin-bottom:22px;
  line-height: 1.5;
}
/* .ifu — modificador de input a ancho completo (siempre usado como "inp ifu") */
.inp.ifu { width: 100%; box-sizing: border-box; }
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 0.5px solid var(--border2);
  background: var(--card2);
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  font-size: 14px;
  transition: background .12s;
}
.modal-close:hover { background: var(--red-bg); color: var(--red); }

/* ── DRAWER ── */
.dov {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.2);
  z-index: 200;
  backdrop-filter: blur(2px);
}
.drw {
  position: fixed;
  top: 0; right: -440px;
  width: 420px;
  max-width: 100%;
  height: 100vh; height: 100dvh;
  background: var(--card);
  border-left: 0.5px solid var(--border2);
  z-index: 201;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  transition: right .25s cubic-bezier(.4,0,.2,1);
  overflow: visible;
}
.drw.open { right: 0; }
@media (max-width: 480px) {
  .drw {
    top: auto;
    bottom: -92vh;
    bottom: -92dvh;
    right: 0; left: 0;
    width: 100%;
    height: 92vh;
    height: 92dvh;
    border-left: none;
    border-radius:var(--r-xl) 16px 0 0;
    border-top: 1px solid var(--border);
    transition: bottom .3s cubic-bezier(.4,0,.2,1);
  }
  .drw.open { bottom: 0; right: 0; }
  .drw::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin:10px auto 0;
    flex-shrink: 0;
  }
}
.drw.open ~ .dov { display: block; }
.drwh {
  padding:18px 20px;
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.drwb {
  flex: 1;
  overflow-y: auto;
  padding:18px 20px;
}

/* ── SPINNER ── */
.spin {
  width: 20px; height: 20px;
  border: 2px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
.sk-pulse {
  background: linear-gradient(90deg, var(--card2) 25%, var(--card3,#2a2a3a) 50%, var(--card2) 75%);
  background-size: 200% 100%;
  animation: sk-shimmer 1.4s infinite;
}
@keyframes sk-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes sk-dot {
  from { opacity: .3; transform: scale(.8); }
  to   { opacity: 1;  transform: scale(1.2); }
}
.spin-sm {
  width: 12px; height: 12px;
  border-width: 1.5px;
  border: 1.5px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── SKELETON LOADER ── */
.skel {
  background: linear-gradient(90deg, var(--card3) 25%, var(--card4) 50%, var(--card3) 75%);
  background-size: 200% 100%;
  animation: skel-load 1.4s ease infinite;
  border-radius: 4px;
}
@keyframes skel-load { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }

/* ── GRID LAYOUTS ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap:14px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap:14px; }
.g-sidebar { display: grid; grid-template-columns: 220px 1fr; gap:16px; align-items: start; }
.dload {
  display: flex; align-items: center; justify-content: center;
  gap:10px; padding:40px;
  color: var(--text3); font-size: 12px;
  font-family: 'IBM Plex Mono', monospace;
}

/* ── SKELETON SCREENS ── */
@keyframes skel-shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skel-line {
  border-radius: 4px;
  background: linear-gradient(90deg, var(--card3) 25%, var(--card4) 50%, var(--card3) 75%);
  background-size: 800px 100%;
  animation: skel-shimmer 1.4s ease-in-out infinite;
}
.skel-card {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius:var(--r-lg);
  padding:14px 16px;
  box-shadow: var(--shadow-sm);
}
/* ── DISCLAIMER LEGAL ── */
.disclaimer-bar {
  position: fixed;
  bottom: env(safe-area-inset-bottom, 0px);
  left: var(--sb-w);
  right: 0;
  z-index: 200;
  height: 30px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  background: var(--amber-bg);
  border-top: 0.5px solid rgba(180,83,9,.15);
  padding: 0 28px;
  font-size: 11px;
  color: var(--amber);
  font-family: 'IBM Plex Mono', monospace;
}

/* ── ALERT SAAS GRID ── */
.mgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap:12px;
  margin-top:4px;
}
.mc {
  background: var(--card2);
  border: 0.5px solid var(--border);
  border-radius: var(--r-md);
  padding:14px;
}

/* ── WELCOME / LOGIN ── */
.welcome-wrap {
  min-height: 100vh; min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--bg);
  padding:0 24px 40px;
}
.welcome-hero {
  width: 100%;
  max-width: 900px;
  padding:64px 0 40px;
  text-align: center;
}
.welcome-hero h1 {
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 700;
  color: var(--bright);
  letter-spacing: -.03em;
  line-height: 1.15;
  margin-bottom:14px;
}
.welcome-hero h1 span { color: var(--grn); }
.welcome-hero p {
  font-size: 16px;
  color: var(--text2);
  line-height: 1.65;
  max-width: 520px;
  margin:0 auto 32px;
}
.welcome-feats {
  display: flex;
  gap:16px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom:48px;
}
.welcome-feat {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  padding:20px 22px;
  max-width: 220px;
  text-align: left;
  box-shadow: var(--shadow-sm);
}
.welcome-feat-icon { font-size: 22px; margin-bottom:10px; }
.welcome-feat h3 { font-size: 13px; font-weight: 600; color: var(--bright); margin-bottom:4px; }
.welcome-feat p { font-size: 12px; color: var(--text2); line-height: 1.5; margin:0; }
.welcome-plans {
  display: flex;
  gap:14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom:48px;
}
.welcome-plan {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--r-lg);
  padding:22px 24px;
  min-width: 200px;
  text-align: center;
}
.welcome-plan.featured {
  border-color: var(--grn);
  background: var(--grn-bg);
}
.welcome-plan-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom:8px; }
.welcome-plan.featured .welcome-plan-name { color: var(--grn); }
.welcome-plan-price { font-size: 28px; font-weight: 700; color: var(--bright); letter-spacing: -.02em; }
.welcome-plan-price sup { font-size: 14px; font-weight: 500; }
.welcome-plan-price small { font-size: 13px; font-weight: 400; color: var(--text2); }
.welcome-plan-desc { font-size: 12px; color: var(--text2); margin:8px 0 0; line-height: 1.5; }
.welcome-box {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-xl);
  padding:40px 36px;
  max-width: 380px;
  width: 100%;
  box-shadow: var(--shadow-md);
}
.welcome-wrap-b {
  min-height: 100vh; min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr;
  align-items: start;
  background: var(--bg);
  padding:40px 24px 48px;
  gap:32px;
  max-width: 1000px;
  margin:0 auto;
  width: 100%;
}
@media(min-width:768px){
  .welcome-wrap-b { grid-template-columns: 3fr 2fr; gap:48px; align-items: center; }
}
.welcome-col-left { display: flex; flex-direction: column; }
.welcome-col-right { display: flex; flex-direction: column; }
.welcome-ctx-cards { display: flex; gap:10px; flex-wrap: wrap; margin-bottom:24px; }
.welcome-ctx-card {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius:var(--r-md);
  padding:10px 14px;
  min-width: 110px;
  flex: 1;
}
.welcome-logo {
  display: flex; align-items: center; gap:10px;
  margin-bottom:28px;
}
.welcome-icon {
  width: 36px; height: 36px;
  background: var(--grn-solid);
  border-radius: var(--r-sm);
  display: flex; align-items:center; justify-content:center;
  font-size: 13px; font-weight: 700;

}
.welcome-title {
  font-size: 17px; font-weight: 600;
  color: var(--bright); letter-spacing: -.3px;
}
.welcome-sub { font-size: 11px; color: var(--text3); margin-top:1px; }

/* ── WELCOME v3 ────────────────────────────────────────── */
.wv3-outer{min-height: 100vh; min-height: 100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;isolation:isolate}
/* Fondo ASCII animado del hero. Se implementa nativo (canvas 2D + JetBrains
   Mono, la fuente que ya carga la pagina) en vez de instalar un componente de
   registro: este proyecto no tiene React ni build step, y el codigo de ese
   componente no es auditable sin cuenta en el registro.
   Va detras del contenido y no captura eventos. */
/* Globo: textura de fondo del hero, anclado a la izquierda y detras del texto.
   Opacidad baja a proposito — es ambiente, no debe disputarle contraste al
   contenido. El mask lo desvanece antes de la columna de texto. */
#globe-bg{
  position:absolute; top:50%; left:0; transform:translate(-22%,-50%);
  width:min(760px,72vw); height:min(760px,72vw);
  z-index:-1; pointer-events:none; opacity:.62;
  -webkit-mask-image:radial-gradient(circle at 44% 50%, #000 46%, transparent 82%);
  mask-image:radial-gradient(circle at 44% 50%, #000 46%, transparent 82%);
}
/* Sin animacion para quien la desactivo por accesibilidad: se oculta el canvas
   y queda un degradado estatico del mismo tono. */
@media (prefers-reduced-motion: reduce){
  #globe-bg{display:none}
  .wv3-outer{background:radial-gradient(90% 70% at 12% 50%, var(--grn-bg) 0%, var(--bg) 62%)}
}
@media (max-width:900px){
  /* En movil el texto ocupa todo el ancho: el globo estorbaria la lectura. */
  #globe-bg{opacity:.28; transform:translate(-38%,-50%)}
}
.wv3-wrap{flex:1;display:grid;grid-template-columns:1fr;gap:32px;align-items:center;padding:28px 24px 20px;max-width:1100px;margin:0 auto;width:100%}
@media(min-width:900px){.wv3-wrap{grid-template-columns:3fr 2fr;gap:48px;padding:32px 40px 24px}}
.wv3-left{display:flex;flex-direction:column;gap:22px;max-width:560px}
.wv3-right{display:flex;flex-direction:column;align-items:center}
.wv3-badge{display:inline-flex;align-items:center;gap:8px;background:var(--grn-bg);border:1px solid var(--grn-lt);border-radius:var(--r-xl);padding:4px 12px;align-self:flex-start}
.wv3-badge span{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--grn);letter-spacing:.5px}
.wv3-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);flex-shrink:0;animation:wv3pulse 2s ease-in-out infinite}
@keyframes wv3pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.wv3-h1{font-size:clamp(28px,4.5vw,46px);font-weight:700;color:var(--bright);letter-spacing:-.03em;line-height:1.15;margin:0}
.wv3-sub{font-size:15px;color:var(--text2);line-height:1.7;max-width:480px;margin:0}
.wv3-ctx-label{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.wv3-ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wv3-ctx-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px}
.wv3-ctx-ttl{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.wv3-ctx-val{font-size:14px;font-weight:700;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:6px}
.wv3-ctx-hint{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);margin-top:2px}
.wv3-scores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wv3-score-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px}
.wv3-score-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wv3-score-ticker{font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--bright)}
.wv3-score-circle{width:34px;height:34px;border-radius:50%;border:1px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'IBM Plex Mono',monospace;flex-shrink:0}
.wv3-score-rsi{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text2);margin-bottom:4px}
.wv3-score-smas{display:flex;gap:8px;font-size:11px;font-family:'IBM Plex Mono',monospace}
.wv3-scores-note{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);margin-top:6px}
.wv3-feats{display:flex;flex-direction:column;gap:12px}
.wv3-feat{display:flex;align-items:flex-start;gap:10px}
.wv3-feat-icon{flex-shrink:0;margin-top:2px;color:var(--grn);display:flex}
.wv3-feat-icon .ico{width:18px;height:18px}
.wv3-feat-title{font-size:13px;font-weight:600;color:var(--bright);margin-bottom:2px}
.wv3-feat-desc{font-size:12px;color:var(--text2);line-height:1.5}
.wv3-disc{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);line-height:1.7}
.wv3-auth-card{background:var(--card);border:0.5px solid var(--border2);border-radius:var(--r-xl);padding:28px 28px 24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.wv3-auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.wv3-auth-icon{width:34px;height:34px;border-radius:var(--r-md);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wv3-auth-name{font-size:15px;color:var(--text)}
.wv3-auth-name b{color:var(--grn);font-weight:700}
.wv3-tabs{display:grid;grid-template-columns:1fr 1fr;position:relative;background:var(--bg2);border-radius:var(--r-md);padding:4px;margin-bottom:20px}
.wv3-tab-slider{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);background:var(--card);border-radius:var(--r-sm);box-shadow:0 2px 8px rgba(0,0,0,.28);transition:transform .25s cubic-bezier(.4,0,.2,1);pointer-events:none}
.wv3-tab-slider.r{transform:translateX(calc(100% + 4px))}
.wv3-tab-btn{position:relative;z-index:1;padding:8px 0;font-size:12px;font-weight:500;background:transparent;border:none;cursor:pointer;transition:color .15s;font-family:inherit;width:100%}
.wv3-tab-btn.active{color:var(--bright)}
.wv3-tab-btn:not(.active){color:var(--text2)}
.wv3-panel{display:none;flex-direction:column;gap:12px}
.wv3-panel.show{display:flex}
.wv3-field-label{display:block;font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-family:'IBM Plex Mono',monospace}
.wv3-field-wrap{position:relative}
/* 16px es el minimo que evita que iOS haga zoom al enfocar el campo.
   El padding sube a 12px para que la altura llegue al minimo tactil de 44px. */
.wv3-field-wrap input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;font-size:16px;color:var(--bright);outline:none;transition:border-color .15s cubic-bezier(.23,1,.32,1),box-shadow .15s cubic-bezier(.23,1,.32,1);box-sizing:border-box;font-family:inherit}
.wv3-field-wrap input:focus-visible{border-color:var(--grn);box-shadow:0 0 0 3px var(--grn-bg)}
.wv3-field-wrap input::placeholder{color:var(--text3)}
/* padding ampliado para alcanzar el area tactil minima sin cambiar el tamano visual */
.wv3-eye-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);padding:14px 10px;line-height:1;min-height:44px;display:flex;align-items:center}
.wv3-eye-btn:hover{color:var(--text)}
.wv3-forgot{text-align:right;margin-top:4px}
.wv3-forgot a{font-size:11px;color:var(--grn);text-decoration:none}
.wv3-forgot a:hover{text-decoration:underline}
.wv3-submit{width:100%;border-radius:var(--r-md);padding:12px;font-size:13px;font-weight:600;color:#14213D;background:var(--grn-solid);border:none;cursor:pointer;transition:opacity .15s,transform .08s;box-shadow:0 6px 20px -8px var(--grn);font-family:inherit}
.wv3-submit:hover{opacity:.9;transform:translateY(-1px)}
.wv3-submit:active{transform:scale(.98)}
.wv3-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.wv3-err{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--red);display:none;line-height:1.5}
.wv3-legal{font-size:11px;color:var(--text3);text-align:center;line-height:1.6}
.wv3-legal a{color:var(--grn);text-decoration:none;cursor:pointer}
.wv3-legal a:hover{text-decoration:underline}
.wv3-check-row{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.wv3-check-row input[type=checkbox]{margin-top:2px;width:14px;height:14px;accent-color:var(--grn);flex-shrink:0;cursor:pointer}
.wv3-check-txt{font-size:11px;color:var(--text2);line-height:1.5}
.wv3-check-txt a{color:var(--grn);text-decoration:none;cursor:pointer}
.wv3-pricing{margin-top:14px;text-align:center;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);line-height:1.9}
.wv3-pricing .wv3-grn{color:var(--grn)}
.wv3-footer{padding:10px 24px;text-align:center;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3)}

.form-label {
  display: block;
  font-size: 11px; font-weight: 500;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom:6px;
}
.form-group { margin-bottom:14px; }
.form-error {
  font-size: 11px; color: var(--red);
  margin-top:6px;
  font-family: 'IBM Plex Mono', monospace;
  display: none;
}

/* ── DARK MODE TOGGLE ── */
.theme-toggle {
  width: 32px; height: 18px;
  border-radius:var(--r-md);
  background: var(--border2);
  border: none; cursor: pointer;
  position: relative;
  transition: background .2s;
  flex-shrink: 0;
}
/* Area de toque real de 44x44: el switch visual queda en 32x18, el hit-area
   invisible lo rodea (native-feel: area-de-toque). */
.theme-toggle::before {
  content: '';
  position: absolute;
  inset: -13px -6px;
}
.theme-toggle.on { background: var(--grn); }
.theme-toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s;
  box-shadow: var(--shadow-sm);
}
.theme-toggle.on::after { transform: translateX(14px); }

/* ── UPGRADE PLAN BADGE ── */
.plan-badge {
  display: inline-flex; align-items: center; gap:4px;
  padding:2px 8px;
  border-radius:var(--r-xl);
  font-size: 11px;
  font-weight: 600;
  font-family: 'IBM Plex Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.plan-free  { background: var(--card3); color: var(--text2); }
.plan-trial { background: var(--amber-bg); color: var(--amber); }
.plan-pro   { background: var(--grn-bg); color: var(--grn); }
.plan-teams { background: var(--blue-bg); color: var(--blue); }

/* ── PAYWALL ── */
.paywall {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 400px; text-align: center;
  padding:40px;
}
.paywall-icon { font-size: 40px; margin-bottom:16px; }
.paywall h2 { font-size: 18px; font-weight: 600; color: var(--bright); margin-bottom:8px; }
.paywall p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom:24px; max-width: 360px; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  :root { --sb-w: 0px; }
  .sb {
    transform: translateX(-220px);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
    width: 220px;
    z-index: 400;
  }
  .sb.mobile-open { transform: translateX(0); }
  /* En movil se apilan: barra de tabs (56px) + franja de aviso (30px). */
  .main { margin-left:0; padding-bottom:calc(56px + 30px + env(safe-area-inset-bottom, 0px)); }
  .ph { padding:14px 16px 12px; }
  .page-body { padding:16px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .g-sidebar { grid-template-columns: 1fr; }
  /* responsive collapse for inline 2-col grids with a fixed px sidebar */
  .resp2 { grid-template-columns: 1fr !important; }
  .resp2 > div[style*="border-right"] { border-right: none !important; }
  .grid2 { grid-template-columns: 1fr !important; }
  .krow { grid-template-columns: repeat(2,1fr); }
  table { font-size: 11px; }
  td, th { padding:8px 10px; }
  .tw { overflow-x: auto; min-width: 0; }
  /* La tabla de portfolio tiene 11 columnas: a 375px queda ilegible incluso con
     scroll horizontal. En movil se ocultan las secundarias y quedan las 5 que
     responden "¿cuanto tengo y como va?": Activo, Precio, Δ Hoy, P&L y acciones.
     El detalle completo sigue disponible al abrir el activo. */
  .col-sec { display: none; }
  /* permite que los tracks grid 1fr encojan bajo contenido nowrap (evita overflow) */
  .dash-body, .dash-body > div, .dash-wrap, .fos-card, .resp2, .resp2 > div { min-width: 0; }
  .fos-card { overflow-x: auto; }
  /* headers de módulo: que el botón/acción baje de línea en vez de desbordar */
  .fos-module-header { flex-wrap: wrap; gap:8px; }
  .hbg-btn { display:flex!important; }
  .sb-backdrop { display:block; }
  #mobile-header { display: flex!important; }
  .disclaimer-bar { left: 0; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
  #mob-tab-bar { display: flex!important; }
  /* ph-right: wrap on small screens so buttons don't overflow */
  .ph-right { flex-wrap: wrap; gap:6px; }
  /* btn-big full width inside modals and locked banners */
  .modal .btn-big, .modal-box .btn-big { width: 100%; }
  /* suite nav: tighten padding */
  body > div:first-child { padding:6px 12px !important; }
  body > div:first-child a:first-child { display: none; }
}
#mob-tab-bar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(60px + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
  background: var(--bg2);
  border-top: 1px solid var(--border);
  z-index: 350;
  align-items: stretch;
}
.mob-tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap:4px; flex: 1; cursor: pointer; padding:0;
  color: var(--text3); font-size: 11px; font-family: 'IBM Plex Mono', monospace;
  letter-spacing: .5px; text-transform: uppercase;
  border: none; background: transparent; transition: color .15s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.mob-tab.act { color: var(--grn); }
.mob-tab.act::before {
  content: '';
  position: absolute;
  top: 5px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--grn);
}
.mob-tab svg { width: 20px; height: 20px; }
@media (min-width: 769px) {
  #mobile-header { display: none!important; }
  #topbar {
    display: flex!important;
    align-items: center;
    position: fixed;
    top: var(--suite-h);
    left: var(--sb-w);
    right: 0;
    height: 52px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding:0 20px;
    gap:10px;
    z-index: 50;
  }
  /* Ya no reserva el hueco de las bandas fijas: ahora lo hace #mainnav, que va
     encima de .main dentro de la misma columna. Mantenerlo aqui lo contaba dos
     veces y dejaba 86px muertos entre el nav y la cabecera del modulo. */
  .main { margin-top: 0; }
}
#topbar { display: none; }
/* La banda de mercado crece con --topbar-h y centra su contenido: antes su alto
   lo fijaba solo el contenido (~52px) y dejaba un hueco bajo la reserva. */
body:not(.no-auth) #topbar { min-height: var(--topbar-h); box-sizing: border-box; }
/* Banda de mercado: scroll horizontal sin barra visible — es una franja de 52px
   y una scrollbar nativa se comeria un tercio de su alto. */
.mkt-strip { scrollbar-width: none; -ms-overflow-style: none; }
.mkt-strip::-webkit-scrollbar { display: none; }
/* ── Navegacion superior (sustituye al sidebar) ── */
#mainnav { display:none; }
/* #topbar (la banda de mercado) es position:fixed a top:34px con 52px de alto y
   z-index 50, asi que esta fuera del flujo y tapaba la primera fila del nav.
   El nav reserva esa altura y se fija justo debajo. */
body:not(.no-auth) #mainnav {
  display:block; position:sticky; top:calc(var(--suite-h) + var(--topbar-h)); z-index:40;
  margin-top:var(--topbar-h);
  background:var(--bg); border-bottom:1px solid var(--border);
}
/* Movil: el nav de grupos deja de ocupar la pantalla permanentemente (competia
   con el tab bar inferior) y pasa a ser un drawer lateral, como en cualquier
   app instalada. Se abre con el boton hamburguesa — antes controlaba un
   sidebar (#sb) que ya no se muestra nunca (display:none!important mas
   abajo), asi que tocarlo oscurecia la pantalla sin mostrar nada. */
@media (max-width: 768px) {
  body:not(.no-auth) #mainnav {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: min(300px, 84vw);
    height: 100dvh;
    margin-top: 0;
    z-index: 401;
    box-shadow: var(--shadow-md);
    overflow-y: auto;
    transform: translateX(-101%);
    transition: transform .22s ease;
    padding-top: env(safe-area-inset-top, 0px);
  }
  body:not(.no-auth) #mainnav.mobile-open { transform: translateX(0); }
  #mainnav .mn-row { flex-direction: column; align-items: stretch; padding: 16px; gap: var(--sp-4); }
  #mainnav .mn-items { flex-direction: column; }
  #mainnav .mn-sub { flex-direction: column; align-items: stretch; padding: 0 16px 16px; }
}
.mn-row { display:flex; align-items:center; gap:var(--sp-6); padding:var(--sp-5) 28px; }
.mn-brand { display:flex; align-items:center; gap:var(--sp-4); font-size:13px; color:var(--text2); flex-shrink:0; }
.mn-brand b { color:var(--bright); font-weight:600; }
.mn-brand-i {
  width:26px; height:26px; border-radius:var(--r-sm); overflow:hidden;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.mn-items { display:flex; gap:var(--sp-1); flex:1; flex-wrap:wrap; }
.mn-item {
  background:none; border:none; cursor:pointer; padding:var(--sp-4) var(--sp-6);
  border-radius:var(--r-sm); font-family:inherit; font-size:13px; color:var(--text2);
  white-space:nowrap; transition:background .15s, color .15s;
}
.mn-item:hover { background:var(--card2); color:var(--bright); }
.mn-item.act { color:var(--bright); font-weight:600; background:var(--grn-bg); }
.mn-cfg { flex-shrink:0; font-size:15px; }
/* Dos columnas para pares de cajas (Escenarios / R:R en Riesgo). Se usaba
   class="grid2" sin ninguna regla, asi que las cajas caian apiladas a lo ancho;
   el usuario lo veia como scroll innecesario. Colapsa a 1 columna en el media
   query de <=900px. */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }

/* Enlace de vuelta a la suite, junto al engranaje: agrupa "salir de la app" y
   "configuracion", que es donde el usuario los busca. */
.mn-suite { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.4px; text-decoration:none; }
/* En movil se queda solo la flecha: ocultar el enlace entero dejaria la vuelta
   a la suite sin ningun acceso, que era justo lo que daba la franja eliminada. */
@media (max-width: 760px){ .mn-suite span { display:none; } }
/* Segunda fila: destinos secundarios del grupo activo, con el mismo lenguaje
   visual que los accesos rapidos del Dashboard (pastilla con borde e icono) y
   alineados a la derecha. Solo aparece cuando el grupo tiene mas de un destino. */
.mn-sub { display:flex; gap:var(--sp-2); padding:0 28px var(--sp-4); flex-wrap:wrap;
          align-items:center; justify-content:flex-end; }
.mn-sub-lbl { margin-right:auto; font-family:'IBM Plex Mono',monospace; font-size:11px;
              letter-spacing:1px; text-transform:uppercase; color:var(--text3); }
.mn-subitem {
  display:inline-flex; align-items:center; gap:var(--sp-3);
  background:var(--card); border:1px solid var(--border); border-radius:var(--r-md);

/* ── AREA TACTIL ─────────────────────────────────────────────────
   Los botones de accion de tabla usan padding:2px inline y quedan muy por
   debajo del minimo tactil de 44px. Solo se agrandan en dispositivos de puntero
   grueso: en escritorio con raton la densidad se conserva intacta.
   No se usa la tecnica de area invisible ampliada porque estos botones van
   adyacentes (editar junto a borrar) y las areas se solaparian: el usuario
   pulsaria borrar apuntando a editar. */
@media (pointer: coarse) {

/* ── INDICADOR DE FOCO ───────────────────────────────────────────
   Varios controles declaran outline:none inline dentro de plantillas JS, lo que
   deja a quien navega con teclado sin saber donde esta. Una regla normal no los
   alcanza (inline gana), asi que se restaura con !important sobre :focus-visible
   — solo se ve al navegar con teclado, no al hacer clic con el raton. */
:focus-visible {
  outline: 2px solid var(--grn) !important;
  outline-offset: 2px !important;
  border-radius: inherit;
}

/* ── MOVIMIENTO REDUCIDO ─────────────────────────────────────────
   Se usa !important a proposito: es lo unico que tambien neutraliza las
   transiciones declaradas inline (style="...transition:.15s") dentro de las
   plantillas JS, que no se pueden alcanzar desde una hoja de estilos normal.
   No se anula la animacion por completo: se conservan los cambios de opacidad
   (ayudan a comprender el cambio de estado) y solo se elimina el movimiento. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .spin, .spin-sm { animation: none !important; }
}

function trackError(context, err, extra){

    var key=context+'|'+((err&&err.message)||String(err)||'').slice(0,60);
    var now=Date.now();
    if(_errSeen[key]&&(now-_errSeen[key])<60000) return; // máx 1/min por error
    _errSeen[key]=now;
    var props=Object.assign({context:context, message:(err&&err.message)||String(err||'unknown'), online:navigator.onLine}, extra||{});
    track('api_error', props);
    if(window.console&&console.warn) console.warn('[trackError] '+context, err);
  }catch(e){/* nunca romper el flujo por telemetría */}
}
// Captura global de errores JS no controlados → observabilidad app-wide
window.addEventListener('error', function(ev){
  trackError('uncaught', ev.error||new Error(ev.message), {file:(ev.filename||'').split('/').pop(), line:ev.lineno});
});
window.addEventListener('unhandledrejection', function(ev){
  trackError('promise', ev.reason||new Error('unhandled_rejection'));
});

function addAlert(ticker,tipo,trigger){
  ticker=(ticker||'').toUpperCase().trim();
  if(!/^[A-Z0-9.\-^=]{1,15}$/.test(ticker)){ showToast('Ticker inválido','error'); return false; }
  var t=parseFloat(trigger);
  if(!isFinite(t)||t<=0){ showToast('El precio objetivo debe ser mayor que 0','error'); return false; }
  if(tipo!=='Max'&&tipo!=='Min'){ showToast('Tipo de alerta inválido','error'); return false; }
  var plan=planOf();
  if(plan.maxA<999 && S.alerts.length>=plan.maxA){
    showToast('Plan Free: máximo '+plan.maxA+' alertas. Elimina una o mejora a Pro.','warning');
    return false;
  }
  if(S.alerts.some(function(a){return a.asset===ticker&&a.type===tipo&&a.trigger===t;})){
    showToast('Ya tienes esa misma alerta','warning'); return false;
  }
  S.alerts.push({id:S.alertNextId++,asset:ticker,type:tipo,trigger:t,createdAt:Date.now()});
  persistAlerts();
  ensureNotifyPermission();
  showToast('Alerta creada para '+ticker);
  return true;
}
function delAlert(id){
  S.alerts=S.alerts.filter(function(a){return a.id!==id;});
  persistAlerts();
  showToast('Alerta eliminada','warning');

}

// Evalua TODAS las alertas contra el precio vivo actual y notifica las que se
// disparan. Antes las alertas solo se evaluaban al abrir su pestaña, asi que la
// funcion nunca cumplia su proposito. Ahora corre en el loop de quotes (cada 5
// min y en el arranque). Debounce: una alerta disparada marca a.notified y no
// vuelve a avisar hasta que el precio se despeja (deja de cumplir la condicion),
// evitando spam en cada tick. Devuelve cuantas se dispararon en esta pasada.
function checkAlerts(){
  if(!S.alerts||!S.alerts.length) return 0;
  var fired=0, changed=false;
  S.alerts.forEach(function(a){
    var cur=getLivePrice(a.asset);
    if(!(isFinite(cur)&&cur>0)) return;
    var hit=a.type==='Max'?cur>=a.trigger:cur<=a.trigger;
    if(hit&&!a.notified){
      a.notified=true; a.triggeredAt=Date.now(); a.triggeredPrice=cur; changed=true; fired++;
      notifyAlert(a,cur);
    }else if(!hit&&a.notified){
      a.notified=false; changed=true; // condicion despejada: se re-arma
    }
  });
  if(changed){ persistAlerts(); if(S.page==='alert'){ try{renderMain();}catch(e){} } }
  return fired;
}
function notifyAlert(a,cur){
  var dir=a.type==='Max'?'subió a':'bajó a';
  var msg=a.asset+' '+dir+' $'+cur.toFixed(2)+' · objetivo '+a.type+' $'+a.trigger;
  try{ if(typeof showToast==='function') showToast(icon('alert')+' '+msg); }catch(e){}
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('Alerta · '+a.asset, {body:msg, tag:'alert-'+a.id, icon:'/icon-192.png'});
    }
  }catch(e){}
  try{ if(typeof track==='function') track('alert_triggered',{asset:a.asset,type:a.type}); }catch(e){}
}
// Pide permiso de notificacion una vez, dentro de un gesto del usuario (al crear
// una alerta). Si lo niega, las alertas siguen avisando por toast in-app.
function ensureNotifyPermission(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      var p=Notification.requestPermission();
      if(p&&p.then) p.then(function(){ if(S.page==='alert'){ try{renderMain();}catch(e){} } });
    }
  }catch(e){}
}

// ── COST BASIS — weighted average per ticker from trade log ──
function realizedPnlFor(ticker){
  var avgCost=null,shares=0,realized=0,buyCosts=[];
  S.trades.filter(function(t){return t.ticker===ticker;}).sort(function(a,b){return a.id-b.id;}).forEach(function(t){
    if(t.type==='buy'){buyCosts.push({qty:t.qty,price:t.amount/t.qty});shares+=t.qty;}
    else if(t.type==='sell'){var cost=buyCosts.length?buyCosts.reduce(function(s,b){return s+b.price*b.qty;},0)/buyCosts.reduce(function(s,b){return s+b.qty;},0):0;realized+=(t.amount/t.qty-cost)*t.qty;shares-=t.qty;}
  });
  return realized;
}

// localStorage API cache — 20 min TTL, keyed by url
var _API_CACHE_TTL=20*60*1000;
function _cacheGet(key){
  try{
    var raw=localStorage.getItem('_apic_'+key);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(Date.now()-o.ts>_API_CACHE_TTL){localStorage.removeItem('_apic_'+key);return null;}
    return o.data;
  }catch(e){return null;}
}
function _cacheSet(key,data){
  try{
    var full='_apic_'+key;
    localStorage.setItem(full,JSON.stringify({ts:Date.now(),data:data}));
    // LRU eviction: keep at most 30 _apic_ keys; remove oldest first
    var keys=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('_apic_'))keys.push(k);}
    if(keys.length>30){
      var sorted=keys.map(function(k){try{return{k:k,ts:JSON.parse(localStorage.getItem(k)).ts};}catch(e){return{k:k,ts:0};}});
      sorted.sort(function(a,b){return a.ts-b.ts;});
      sorted.slice(0,sorted.length-30).forEach(function(e){localStorage.removeItem(e.k);});
    }
  }catch(e){}
}

function fetchWithTimeout(url,ms){
  ms=ms||8000;
  return new Promise(function(resolve,reject){
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort();reject(new Error('Timeout '+ms+'ms'));},ms);
    fetch(url,{signal:ctrl.signal}).then(function(r){clearTimeout(timer);resolve(r);}).catch(function(e){clearTimeout(timer);reject(e);});
  });
}

// fetchQuote — single live price via /api/quote edge function
async function fetchQuote(ticker){
  try{
    var ckey='q_'+ticker;
    var cached=_cacheGet(ckey);
    if(cached){fetchStats.ok++;return cached;}
    var res;
    if(_USE_EDGE){
      res=await fetchWithTimeout('/api/quote?ticker='+encodeURIComponent(ticker),5000);
    } else {
      // local dev fallback
      var rawUrl='https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range=1d';
      res=await fetchWithTimeout('https://api.allorigins.win/raw?url='+encodeURIComponent(rawUrl),7000);
    }
    if(!res||!res.ok) throw new Error('HTTP '+(res?res.status:'no response'));
    var json=await res.json();
    var q;
    if(_USE_EDGE){
      q=json[ticker.toUpperCase()];
      if(!q) throw new Error('no data');
    } else {
      var m=json.chart&&json.chart.result&&json.chart.result[0]&&json.chart.result[0].meta;
      if(!m||!m.regularMarketPrice) throw new Error('no meta');
      var price=m.regularMarketPrice; var prev=m.chartPreviousClose||m.previousClose||price;
      q={ticker:ticker,price:price,prevClose:prev,change:price-prev,changePct:prev?(price-prev)/prev:0,
         volume:m.regularMarketVolume||0,marketCap:0,high52:m.fiftyTwoWeekHigh||null,
         low52:m.fiftyTwoWeekLow||0,currency:m.currency||'USD'};
    }
    var out={ticker:ticker,price:q.price,prevClose:q.prevClose,
             change:q.change,changePct:q.changePct,volume:q.volume||0,
             marketCap:q.marketCap||0,high52:q.high52||null,
             low52:q.low52||0,exchange:'',marketState:'REGULAR'};
    _cacheSet(ckey,out);fetchStats.ok++;fetchStats.lastOk=Date.now();
    return out;
  }catch(e){fetchStats.fail++;fetchStats.lastErr=e.message;return null;}
}

      var stored=localStorage.getItem(lsKey);
      if(stored){
        var parsed=JSON.parse(stored);
        if(parsed&&parsed.ts&&(Date.now()-parsed.ts)<300000&&parsed.data&&parsed.data.length>5){
          _cacheSet(ckey,parsed.data);fetchStats.ok++;return parsed.data;
        }
      }
    }catch(e){}
    // 3. Network fetch
    var res;
    if(_USE_EDGE){
      res=await fetchWithTimeout('/api/history?ticker='+encodeURIComponent(ticker)+'&range='+r+'&interval=1d',8000);
    } else {
      var rawUrl='https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range='+r+'&includePrePost=false';
      res=await fetchWithTimeout('https://api.allorigins.win/raw?url='+encodeURIComponent(rawUrl),9000);
    }
    if(!res||!res.ok) throw new Error('HTTP '+(res?res.status:'no response'));
    var json=await res.json();
    var data;
    if(_USE_EDGE){
      // /api/history returns {ticker,range,interval,data:[{date,open,high,low,close,volume}]}
      if(!json.data||!json.data.length) throw new Error('no data');
      data=json.data.map(function(d,i){
        return {date:new Date(d.date).toLocaleDateString('es-CL',{month:'short',day:'numeric'}),
                ts:Math.floor(new Date(d.date).getTime()/1000),
                open:d.open,high:d.high,low:d.low,close:d.close,vol:d.volume,p:i+1};
      }).filter(function(d){return d.close>0;});
    } else {
      // raw Yahoo Finance format
      var result=json.chart&&json.chart.result&&json.chart.result[0];
      if(!result||!result.timestamp) throw new Error('no result');
      var ts=result.timestamp;
      var q2=result.indicators&&result.indicators.quote&&result.indicators.quote[0];
      if(!q2) throw new Error('no quote');
      data=[];
      for(var i=0;i<ts.length;i++){
        if(q2.close[i]!=null&&q2.close[i]>0){
          data.push({date:new Date(ts[i]*1000).toLocaleDateString('es-CL',{month:'short',day:'numeric'}),
                     open:q2.open[i]||q2.close[i],high:q2.high[i]||q2.close[i],
                     low:q2.low[i]||q2.close[i],close:q2.close[i],vol:q2.volume[i]||0,p:i+1});
        }
      }
    }
    if(!data||data.length<5) throw new Error('insufficient data');
    _cacheSet(ckey,data);
    // Persist to localStorage so next page load is instant
    try{localStorage.setItem('fh_'+ticker+'_'+r,JSON.stringify({ts:Date.now(),data:data}));}catch(e){}
    fetchStats.ok++;fetchStats.lastOk=Date.now();
    return data;
  }catch(e){fetchStats.fail++;fetchStats.lastErr=e.message;return null;}
}

async function refreshLive(tickers,manual){
  if(liveLoading&&!manual) return;
  if(_liveAbortCtrl) _liveAbortCtrl.abort();
  _liveAbortCtrl=new AbortController();
  var mySignal=_liveAbortCtrl.signal;
  liveLoading=true;
  liveFailed=false;
  // Spinner on all refresh buttons
  document.querySelectorAll('.refresh-btn').forEach(function(b){
    b.innerHTML='<span class="spin-sm"></span>';b.disabled=true;
  });
  try{
    var gotAny=false;
    var isVercel=_USE_EDGE;

    // Holdings marcadas type==="Crypto" en Portfolio van por /api/crypto
    // (CoinGecko) en vez de /api/quote (Yahoo) — ver api/crypto.js. Watchlist
    // y ALL_SIG no tienen noción de tipo hoy, así que siguen 100% por Yahoo.
    var cryptoTickers=tickers.filter(function(t){
      return S.portfolio.some(function(h){return h.t===t&&h.type==='Crypto';});
    });
    var stockTickers=tickers.filter(function(t){return cryptoTickers.indexOf(t)<0;});

    if(isVercel){
      // /api/quote recorta a 10 tickers por peticion. Antes se enviaban TODOS
      // en una sola URL: el servidor devolvia solo los 10 primeros, gotAny se
      // ponia en true y el fallback nunca corria, asi que del 11 en adelante
      // ninguna posicion recibia precio (ni valor actual, ni P&L, ni retorno).
      // Ahora se pide en trozos de 10 y se recorren todos.
      try{
        for(var qi=0; qi<stockTickers.length; qi+=10){
          if(mySignal.aborted) return;
          var trozo=stockTickers.slice(qi, qi+10);
          var batchRes=await fetchWithTimeout('/api/quote?ticker='+trozo.join(','),6000);
          var batchData=await batchRes.json();
          Object.keys(batchData).forEach(function(t){
            var q=batchData[t];
            if(q&&q.price){
              LIVE[t]=q;
              S.portfolio.forEach(function(h){if(h.t===t)h.cur=q.price;});
              ALL_SIG.forEach(function(s){if(s.t===t)s.p=q.price;});
              gotAny=true;
            }
          });
          if(gotAny) updateLivePricesInDOM();
        }
      }catch(e){if(mySignal.aborted) return;/* fall through to individual fetches */}

      if(cryptoTickers.length&&!mySignal.aborted){
        try{
          var cRes=await fetchWithTimeout('/api/crypto?symbols='+cryptoTickers.join(','),6000);
          var cData=await cRes.json();
          Object.keys(cData).forEach(function(t){
            var q=cData[t];
            if(q&&q.price){
              LIVE[t]=q;
              S.portfolio.forEach(function(h){if(h.t===t)h.cur=q.price;});
              gotAny=true;
            }
          });
          updateLivePricesInDOM();
        }catch(e){if(mySignal.aborted) return;/* precios crypto quedan sin refrescar, resto sigue */}
      }
    }

    if(mySignal.aborted) return;
    if(!gotAny){
      // Fallback: individual fetches with batching (solo acciones/ETF — las
      // crypto ya se intentaron arriba vía /api/crypto, fetchQuote no las resuelve)
      var BATCH_SIZE=6;
      for(var bi=0;bi<stockTickers.length;bi+=BATCH_SIZE){
        var batch=stockTickers.slice(bi,bi+BATCH_SIZE);
        var results=await Promise.allSettled(batch.map(function(t){return fetchQuote(t);}));
        results.forEach(function(r,i){
          if(r.status==="fulfilled"&&r.value){
            var t=batch[i];
            LIVE[t]=r.value;
            S.portfolio.forEach(function(h){if(h.t===t)h.cur=r.value.price;});
            ALL_SIG.forEach(function(s){if(s.t===t)s.p=r.value.price;});
            gotAny=true;
          }
        });
        if(gotAny) updateLivePricesInDOM();
      }
    }
    if(gotAny){
      liveUpdated=Date.now();liveFailed=false;liveFromCache=false;
      try{localStorage.setItem('mv_prices_cache',JSON.stringify({ts:Date.now(),live:LIVE}));}catch(e){/* silent */}
    } else {
      liveFailed=true;
      trackError('quotes',new Error('no_prices_returned'),{tickers:tickers.length}); // Yahoo no devolvió precios
      // Load from cache on complete failure
      try{
        var c=JSON.parse(localStorage.getItem('mv_prices_cache')||'null');
        if(c&&(Date.now()-c.ts)<LIVE_CACHE_TTL){
          Object.assign(LIVE,c.live);
          liveFromCache=true;liveUpdated=c.ts;
          S.portfolio.forEach(function(h){if(LIVE[h.t])h.cur=LIVE[h.t].price;});
        }
      }catch(e){/* silent */}
    }
  }catch(e){liveFailed=true;trackError('quotes',e);}
  liveLoading=false;
  // Restore refresh buttons
  var updStr=liveUpdated?new Date(liveUpdated).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'—';
  document.querySelectorAll('.refresh-btn').forEach(function(b){
    b.innerHTML='↻';b.disabled=false;
    b.title='Actualizado: '+updStr+(liveFailed?' · Error de conexión':liveFromCache?' · Datos cacheados':'');
  });
  updateLiveBadge();
  updateLivePricesInDOM();
}

// ── TI ─────────────────────────────────────────────────────────
var TI={
  sma:function(p,n){return p.map(function(_,i){return i<n-1?null:p.slice(i-n+1,i+1).reduce(function(a,b){return a+b;},0)/n;});},
  ema:function(p,n){var k=2/(n+1),r=[p[0]];for(var i=1;i<p.length;i++)r.push(p[i]*k+r[i-1]*(1-k));return r;},
  rsi:function(p,n){
    n=n||14;if(p.length<n+1)return p.map(function(){return 50;});
    var d=p.slice(1).map(function(v,i){return v-p[i];});
    var g=d.map(function(c){return Math.max(c,0);});
    var l=d.map(function(c){return Math.abs(Math.min(c,0));});
    var ag=g.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    var al=l.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    var res=[];for(var j=0;j<=n;j++)res.push(50);
    for(var i=n;i<d.length;i++){ag=(ag*(n-1)+g[i])/n;al=(al*(n-1)+l[i])/n;res.push(al===0?100:100-100/(1+ag/al));}
    return res;
  },
  macd:function(p){
    var e12=this.ema(p,12),e26=this.ema(p,26);
    var line=e12.map(function(v,i){return v-e26[i];});
    var sig=this.ema(line,9);
    return{line:line,signal:sig,hist:line.map(function(v,i){return v-sig[i];})};
  },
  bb:function(p,n,m){
    n=n||20;m=m||2;
    var sma=this.sma(p,n);
    return p.map(function(_,i){
      if(!sma[i])return{mid:null,upper:null,lower:null};
      var sl=p.slice(Math.max(0,i-n+1),i+1);
      var avg=sma[i];
      var std=Math.sqrt(sl.reduce(function(s,v){return s+(v-avg)*(v-avg);},0)/sl.length);
      return{mid:avg,upper:avg+m*std,lower:avg-m*std};
    });
  },
  atr:function(highs,lows,closes,n){
    n=n||14;
    var tr=highs.map(function(h,i){
      if(i===0)return h-lows[i];
      return Math.max(h-lows[i],Math.abs(h-closes[i-1]),Math.abs(lows[i]-closes[i-1]));
    });
    // El array debe tener un elemento por vela para que atr[i] corresponda a
    // closes[i]. Antes arrancaba con un solo null y quedaba de longitud
    // tr.length-n+2: indexar en closes.length-1 devolvia undefined y el NaN se
    // propagaba al R:R del motor y a los health scores.
    var result=new Array(n-1).fill(null);          // indices 0..n-2 sin ATR aun
    var atr0=tr.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    result.push(atr0);                              // indice n-1
    for(var i=n;i<tr.length;i++){atr0=(atr0*(n-1)+tr[i])/n;result.push(atr0);}
    return result;                                  // longitud == tr.length
  }
};

function svgLine(data,keys,colors,W,H){
  W=W||420;H=H||120;
  if(!data||!data.length)return '<div style="height:'+H+'px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px">Sin datos</div>';
  var allVals=[];
  keys.forEach(function(k){data.forEach(function(d){if(d[k]!=null)allVals.push(d[k]);});});
  if(!allVals.length)return "";
  var minV=Math.min.apply(null,allVals)-5;
  var maxV=Math.max.apply(null,allVals)+5;
  var rng=maxV-minV||1;
  // Con un solo dato (primer tick del dia) data.length-1 era 0 y las
  // coordenadas salian NaN: el chart se pintaba vacio.
  var _den=Math.max(1,data.length-1);
  var xS=function(i){return (i/_den)*W;};
  var yS=function(v){return H-((v-minV)/(rng||1))*H;};
  var paths="";
  keys.forEach(function(k,ki){
    var pts=[];
    data.forEach(function(d,i){if(d[k]!=null)pts.push(xS(i).toFixed(1)+","+yS(d[k]).toFixed(1));});
    if(pts.length<2)return;
    var sw=ki===0?2:1.5;
    var da=ki>0?"stroke-dasharray='4 2'":"";
    var op=ki>2?"opacity='0.5'":"";
    paths+="<polyline points='"+pts.join(" ")+"' fill='none' stroke='"+colors[ki]+"' stroke-width='"+sw+"' stroke-linecap='round' stroke-linejoin='round' "+da+" "+op+"/>";
  });
  var grid=[.25,.5,.75].map(function(p){var y=(H*p).toFixed(1);var v=(minV+rng*(1-p)).toFixed(0);return "<line x1='0' y1='"+y+"' x2='"+W+"' y2='"+y+"' stroke='rgba(255,255,255,.04)' stroke-width='1'/><text x='2' y='"+(parseFloat(y)-2)+"' fill='#3d5278' font-size='8' font-family='IBM Plex Mono'>$"+v+"</text>";}).join("");
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px'>"+grid+paths+"</svg>";
}

function svgBars(data,key,W,H,zero,refLines){
  W=W||420;H=H||80;zero=zero||0;refLines=refLines||[];
  var vals=data.map(function(d){return d[key];}).filter(function(v){return v!=null;});
  if(!vals.length)return "";
  var allRef=refLines.map(function(r){return r.val;});
  var minV=Math.min.apply(null,vals.concat([zero]).concat(allRef));
  var maxV=Math.max.apply(null,vals.concat([zero]).concat(allRef));
  var rng=maxV-minV||1;
  var bw=W/data.length;
  var bars=data.map(function(d,i){
    if(d[key]==null)return "";
    var pos=d[key]>=zero;
    var bh=Math.abs(d[key]-zero)/rng*H;
    var y=pos?((maxV-d[key])/rng*H):((maxV-zero)/rng*H);
    return "<rect x='"+(i*bw+1).toFixed(1)+"' y='"+y.toFixed(1)+"' width='"+(bw-2).toFixed(1)+"' height='"+bh.toFixed(1)+"' fill='"+(pos?"var(--pos)":"var(--neg)")+"' opacity='.8' rx='1'/>";
  }).join("");
  var zy=((maxV-zero)/rng*H).toFixed(1);
  var refSvg=refLines.map(function(r){
    var ry=((maxV-r.val)/rng*H).toFixed(1);
    return "<line x1='0' y1='"+ry+"' x2='"+W+"' y2='"+ry+"' stroke='"+r.color+"' stroke-width='1' stroke-dasharray='4 3'/>";
  }).join("");
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px'><line x1='0' y1='"+zy+"' x2='"+W+"' y2='"+zy+"' stroke='rgba(255,255,255,.1)' stroke-width='1'/>"+refSvg+bars+"</svg>";
}

function loadLWScript(){
  if(_lwLoaded) return Promise.resolve();
  if(_lwLoadPromise) return _lwLoadPromise;
  _lwLoadPromise=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    // Same-origin (auto-hospedado) en vez de cdn.jsdelivr.net: mismo motivo que
    // Supabase — un CDN bloqueado dejaba los charts sin cargar.
    s.src='/vendor-lightweight-charts.js';
    s.onload=function(){_lwLoaded=true;resolve();};
    s.onerror=reject;
    document.head.appendChild(s);
  });
  return _lwLoadPromise;
}

      height:60,
      layout:{background:{type:'solid',color:bgColor},textColor:textColor},
      grid:{vertLines:{color:gridColor},horzLines:{color:gridColor}},
      timeScale:{timeVisible:false,borderColor:'rgba(255,255,255,0.07)'},
      rightPriceScale:{borderColor:'rgba(255,255,255,0.07)'},
      crosshair:{mode:LW.CrosshairMode.Hidden},
    });
    var volChart=_lwChartVol;
    var volSeries=volChart.addHistogramSeries({
      color:'rgba(255,255,255,0.15)',priceFormat:{type:'volume'},priceScaleId:'',
    });
    volSeries.setData(bars.map(function(d){return {time:d.ts,value:d.vol||0,color:d.close>=d.open?'rgba(34,197,94,0.3)':'rgba(239,68,68,0.3)'};}));
    volChart.timeScale().fitContent();

    // Sync x-axis scroll between both charts
    chart.timeScale().subscribeVisibleLogicalRangeChange(function(r){if(r)volChart.timeScale().setVisibleLogicalRange(r);});

    // Reflow al cambiar el ancho (resize/rotacion): los charts se crean con
    // ancho fijo. Un observer sobre el contenedor reajusta ambos; se desconecta
    // en closeDrawer para no quedar observando un drawer cerrado.
    if(_lwResizeObs){try{_lwResizeObs.disconnect();}catch(e){}}
    if(window.ResizeObserver){
      _lwResizeObs=new ResizeObserver(function(){
        var w=mainEl.clientWidth||mainEl.offsetWidth;
        if(!w) return;
        try{if(_lwChartMain)_lwChartMain.applyOptions({width:w});}catch(e){}
        try{if(_lwChartVol)_lwChartVol.applyOptions({width:volEl.clientWidth||w});}catch(e){}
      });
      _lwResizeObs.observe(mainEl);
    }
  }).catch(function(){});
}

function genFallback(basePrice,days){
  var data=[];var p=basePrice*0.88;
  for(var i=0;i<days;i++){
    var chg=(Math.random()-0.48)*p*0.022;
    var c=Math.max(p+chg,1);
    data.push({date:"D"+(i+1),open:p,high:Math.max(p,c)*1.005,low:Math.min(p,c)*0.995,close:c,vol:Math.floor(Math.random()*50e6+10e6),p:i+1,_synthetic:true});
    p=c;
  }
  data[data.length-1].close=basePrice;
  return data;
}

function dist52wCell(cur,lq){
  var low=lq&&lq.low52;

  // fijo se leia '+-3%'.
  return '<span style="font-weight:600;font-size:11px;color:'+col+'" title="Mínimo 52 semanas: $'+fmtD(low)+'">'+(d>=0?'+':'')+d.toFixed(0)+'%</span>';

var _tblSort={col:null,asc:true,tbl:null};
function tblSortBy(tbl,col){
  if(_tblSort.tbl===tbl&&_tblSort.col===col){_tblSort.asc=!_tblSort.asc;}
  else{_tblSort.tbl=tbl;_tblSort.col=col;_tblSort.asc=false;}
  var tbody=document.querySelector('#tbl-'+tbl+' tbody');
  if(!tbody) return;
  var rows=Array.from(tbody.querySelectorAll('tr'));
  rows.sort(function(a,b){
    var ca=a.getAttribute('data-'+col)||'';
    var cb=b.getAttribute('data-'+col)||'';
    var na=parseFloat(ca),nb=parseFloat(cb);
    var va=isNaN(na)?ca.toLowerCase():na;
    var vb=isNaN(nb)?cb.toLowerCase():nb;
    if(va<vb) return _tblSort.asc?-1:1;
    if(va>vb) return _tblSort.asc?1:-1;
    return 0;
  });
  rows.forEach(function(r){tbody.appendChild(r);});
  // Update header indicators
  document.querySelectorAll('#tbl-'+tbl+' th[data-sort]').forEach(function(th){
    var arrow=th.getAttribute('data-sort')===col?(_tblSort.asc?' ↑':' ↓'):'';
    th.setAttribute('data-arrow',arrow);
    th.querySelector('.sarrow').textContent=arrow;
  });
}
function sortTh(tbl,col,label,tip){
  return '<th data-sort="'+col+'" onclick="tblSortBy(\''+tbl+'\',\''+col+'\')" style="cursor:pointer;white-space:nowrap"'+(tip?' title="'+tip+'"':'')+'>'+label+' <span class="sarrow"></span></th>';
}
function showToast(msg,type,undoFn){
  var c=document.getElementById('toast-container');
  if(!c) return;
  var t=document.createElement('div');
  t.className='toast '+(type||'success');
  var icon=type==='error'?'✕':type==='warning'?'⚠':type==='info'?'ℹ':'✓';
  var iconEl=document.createElement('span');iconEl.textContent=icon+' ';
  var msgEl=document.createElement('span');msgEl.textContent=msg;
  t.appendChild(iconEl);t.appendChild(msgEl);
  function dismiss(){ t.classList.remove('show'); setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},300); }
  // Acciones reversibles (quitar de watchlist, etc.) dan mas tiempo y un boton
  // real en vez de depender de que el usuario lea el toast antes de que se vaya.
  if(undoFn){
    var undoBtn=document.createElement('button');
    undoBtn.type='button';
    undoBtn.className='toast-undo';
    undoBtn.textContent='Deshacer';
    undoBtn.onclick=function(){ undoFn(); dismiss(); };
    t.appendChild(undoBtn);
  }
  c.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(dismiss, undoFn?5000:3000);
}
