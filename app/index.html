  S.missingConsents=missing;
  S.consentGateRequired=missing.length>0;
}

// Load profile + portfolio + watchlist from Supabase for the logged-in user.
//
// sbLoadUserData(authUser) es la funcion publica: de-duplica llamadas
// concurrentes para el mismo usuario. Todo login/registro/vuelta de Google
// dispara DOS invocaciones para el mismo evento — boot()/doLogin()/doRegister()
// la llaman directo, y sb.auth.onAuthStateChange (SIGNED_IN) la llama de
// nuevo para el MISMO evento (comportamiento normal del SDK). Sin este guard,
// las dos corrian en paralelo pisandose el mismo estado global (window.cgConfirm/
// window._cgResolve del consent gate, el mismo #mroot, los mismos inserts a
// portfolio_holdings/watchlist/consents) — eso producia un 409 (insert
// duplicado) y, peor, un freeze real del render al pisarse las dos el mismo
// modal. Reproducido en vivo el 12-sep: signup nuevo -> consent gate ->
// "Confirmar y continuar" -> pagina congelada (hasta un JSON.stringify vacio
// via CDP se colgaba, senal de deadlock real, no solo una promesa lenta).
// Guard extraido a app/lib/async-guards.js (createDedupeCache) el 12-sep-2026
// al armar la suite de tests — misma logica, ahora testeable sin DOM/Supabase.
var _sbLoadUserDataGuard=createDedupeCache();
function sbLoadUserData(authUser){
  return _sbLoadUserDataGuard.run(authUser.id,function(){ return _sbLoadUserDataImpl(authUser); });
}
async function _sbLoadUserDataImpl(authUser){
  try{
    // Timeout de 8s en las 3 queries de abajo: ninguna tenia guardia — un
    // cuelgue de Supabase en cualquiera de ellas freezaba sbLoadUserData (y
    // con el, boot()/render()) para siempre, misma clase de falla ya
    // corregida en el fetch de /api/check-plan mas abajo.
    var profRes=await withTimeout(
      sb.from("profiles").select("*").eq("id",authUser.id).single(),
      8000
    );
    var prof=profRes.data;

    var holdRes=await withTimeout(
      sb.from("portfolio_holdings").select("*").eq("user_id",authUser.id).order("id"),
      8000
    );
    var holdings=(holdRes.data||[]).map(rowToHolding);

    var wlRes=await withTimeout(
      sb.from("watchlist").select("ticker").eq("user_id",authUser.id),
      8000
    );
    var watch=(wlRes.data||[]).map(function(r){return r.ticker;});

    // Verify plan server-side to prevent client-side bypass (S.user.plan='pro' in console)
    var verifiedPlan=(prof&&prof.plan)||"free";
    try{
      // Timeout de 8s: mismo riesgo — getSession() sin guardia podia colgar
      // esta rama entera antes de llegar al fetch de check-plan (que ya
      // tiene su propio timeout desde hoy).
      var sess=await withTimeout(sb.auth.getSession(),8000);
      var tok=sess&&sess.data&&sess.data.session&&sess.data.session.access_token;
      if(tok){
        // Timeout de 8s: fetch() no tiene limite propio — si /api/check-plan
        // se cuelga (cold start, Supabase lento), este await nunca resolvia
        // y dejaba sbLoadUserData (y con el, boot()) girando para siempre.
        // El catch de abajo ya manejaba errores rapidos, no un cuelgue mudo.
        var cpRes=await withTimeout(
          fetch('/api/check-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})}),
          8000
        );
        if(cpRes.ok){var cpData=await cpRes.json();if(cpData&&cpData.valid){verifiedPlan=cpData.plan;if(cpData.trialUsed!==undefined)S._trialUsedFromServer=cpData.trialUsed;}}
      }
    }catch(e){/* fallback to DB value already set above */}
    S.user={
      id:authUser.id, email:authUser.email,
      name:(prof&&prof.name)||authUser.email.split("@")[0],
      plan:verifiedPlan,
      trialStarted:(prof&&prof.trial_started_at)?new Date(prof.trial_started_at).getTime():null,
      trialUsed:S._trialUsedFromServer||false
    };
    delete S._trialUsedFromServer;
    S.capital=(prof&&prof.capital)?Number(prof.capital):100000;

    if(holdings.length>0){
      S.portfolio=holdings;
      S.nextId=Math.max.apply(null,holdings.map(function(h){return h.id;}))+1;
    } else {
      // First login: seed Supabase with demo portfolio so the account isn't empty
      await sbSeedPortfolio(authUser.id);
      S.portfolio=JSON.parse(JSON.stringify(DEF_PORT));
      S.nextId=Math.max.apply(null,DEF_PORT.map(function(h){return h.id;}))+1;
    }
    S.watchlist=watch.length>0?watch:[...DEF_WATCH];
    loadTrades();loadAlerts();
    fetchFXLatam();
    // F1-07: consent gate — only active when CONSENT_GATE_ENABLED is true.
    // When false, no query to public.consents is made and no modal is shown.
    if(CONSENT_GATE_ENABLED){
      await checkConsentGate(authUser.id);
      if(S.consentGateRequired){
        // Awaits here until user accepts — resolves only after successful insert.
        // render() is called by the caller (boot/onAuthStateChange) after this resolves.
        await showConsentGate(authUser.id);
        return; // prevent setTimeout(checkOnboarding) while gate was open; caller triggers render()
      }
    }
    setTimeout(checkOnboarding,600);
  }catch(e){
    console.error("sbLoadUserData failed",e);
    // Fallback to defaults so the app still renders
    S.user={id:authUser.id,email:authUser.email,name:authUser.email.split("@")[0],plan:"free"};
    S.portfolio=JSON.parse(JSON.stringify(DEF_PORT));
    S.watchlist=[...DEF_WATCH];
    loadTrades();loadAlerts();
  }
}

// Seed initial portfolio rows for a brand-new account

  try{

    });
    await sb.from("portfolio_holdings").insert(rows);

function wv3CountUp(targetId, finalVal, delay){
  var el=document.getElementById(targetId);
  if(!el) return;

  // requestAnimationFrame no dispara en pestañas ocultas: si la pagina se abre
  // en segundo plano (cmd+click, sesion restaurada) el contador queda congelado
  // a mitad y muestra un numero falso (ej. 13 en lugar de 78). El valor mostrado
  // debe ser siempre el real, asi que sin animacion se escribe el final directo.
  var sinAnimacion = document.hidden ||
    (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if(sinAnimacion){ el.textContent = finalVal; return; }

  var dur=700, startTime=null, terminado=false;
  function finalizar(){
    if(terminado) return;
    terminado = true;
    el.textContent = finalVal;
    document.removeEventListener('visibilitychange', alOcultar);
  }
  function alOcultar(){ if(document.hidden) finalizar(); }
  document.addEventListener('visibilitychange', alOcultar);

  setTimeout(function(){
    if(terminado) return;
    requestAnimationFrame(function tick(ts){
      if(terminado) return;
      if(!startTime) startTime=ts;
      var p=Math.min(1,(ts-startTime)/dur);
      var eased=1-Math.pow(1-p,3);
      el.textContent=Math.round(finalVal*eased);
      if(p<1) requestAnimationFrame(tick); else finalizar();
    });
  }, delay);
}

async function doLogin(){
  var e=document.getElementById("le").value.trim();
  var p=document.getElementById("lp").value;
  var err=document.getElementById("lerr");
  var btn=document.getElementById("lbtn");
  if(!e||!p){err.style.display="block";err.textContent="Ingresa email y contraseña.";return;}
  // Defensa: si la libreria de Supabase no cargo (p.ej. CDN bloqueado o un SW
  // que rompio el <script>), sb es null y signInWithPassword lanzaria y el boton
  // se quedaria colgado. Avisar claro en vez de colgar.
  if(typeof sb==='undefined'||!sb||!sb.auth){
    err.style.display="block";
    err.textContent="No se pudo cargar el servicio de autenticación. Recarga la página (Cmd/Ctrl+Shift+R). Si persiste, desactiva extensiones que bloqueen CDNs.";
    return;
  }
  if(btn){btn.disabled=true;btn.textContent="Entrando...";}
  // Timeout de 15s: si signInWithPassword se cuelga (p.ej. proyecto Supabase
  // pausado o sin red), el boton se quedaba en "Entrando..." para siempre sin
  // mensaje. Ahora siempre se resuelve y avisa.
  var res;
  try{
    res=await withTimeout(sb.auth.signInWithPassword({email:e,password:p}),15000);
  }catch(netErr){
    if(btn){btn.disabled=false;btn.textContent="Entrar";}
    err.style.display="block";
    err.textContent='No se pudo conectar con el servidor de autenticación (se agotó el tiempo). Puede que el proyecto Supabase esté pausado o sin conexión. Reintenta en un momento.';
    return;
  }
  if(btn){btn.disabled=false;btn.textContent="Entrar";}
  if(res.error){
    // Antes se ocultaba TODO error como "Credenciales incorrectas", asi que el
    // usuario no distinguia contrasena mala de email sin confirmar o cuenta
    // deshabilitada. Ahora se mapea el motivo real de Supabase.
    var m=(res.error&&res.error.message)||'';
    var friendly='Email o contraseña incorrectos.';
    if(/email not confirmed/i.test(m)) friendly='Tu email aún no está confirmado. Revisa tu correo (incluida la carpeta de spam) por el enlace de confirmación.';
    else if(/invalid login credentials/i.test(m)) friendly='Email o contraseña incorrectos.';
    else if(/banned|disabled|blocked|user.*not.*allowed/i.test(m)) friendly='Esta cuenta está deshabilitada. Escríbenos a soporte para reactivarla.';
    else if(/rate limit|too many/i.test(m)) friendly='Demasiados intentos. Espera un minuto y reintenta.';
    else if(/network|fetch|timeout/i.test(m)) friendly='Sin conexión con el servidor. Revisa tu internet y reintenta.';
    else if(m) friendly=m; // motivo real en vez de ocultarlo
    err.style.display="block";
    err.textContent=friendly;
    return;
  }
  try{
    await sbLoadUserData(res.data.user);
  }catch(le){
    // El login fue OK pero cargar el perfil fallo (p.ej. RLS/permisos o perfil
    // faltante). Se informa en vez de dejar una pantalla rota.
    err.style.display="block";
    err.textContent='Entraste, pero no se pudo cargar tu perfil ('+((le&&le.message)||'error')+'). Reintenta o contacta soporte.';
    return;
  }
  trackIdentify(S.user); track('login');
  document.getElementById("mroot").innerHTML="";
  render();
}

async function doRegister(){
  var name=(document.getElementById("rn")?document.getElementById("rn").value:"").trim();
  var e=document.getElementById("re").value.trim();
  var p=document.getElementById("rp").value;
  var disc=document.getElementById("rdisc");
  var err=document.getElementById("rerr");
  var btn=document.getElementById("rbtn");
  if(!name||!e||!p){err.style.display="block";err.textContent="Completa todos los campos.";return;}
  if(p.length<6){err.style.display="block";err.textContent="La contraseña debe tener al menos 6 caracteres.";return;}
  if(!disc.checked){err.style.display="block";err.textContent="Debes aceptar el aviso educativo para continuar.";return;}
  if(btn){btn.disabled=true;btn.textContent="Creando cuenta...";}
  // Timeout de 15s: mismo patron que doLogin (mas arriba) — si signUp se
  // cuelga (p.ej. proyecto Supabase pausado o sin red), el boton se quedaba
  // en "Creando cuenta..." para siempre sin mensaje. Ahora siempre se
  // resuelve y avisa.
  var res;
  try{
    res=await withTimeout(sb.auth.signUp({email:e,password:p,options:{data:{name:name}}}),15000);
  }catch(netErr){
    if(btn){btn.disabled=false;btn.textContent="Crear cuenta";}
    err.style.display="block";
    err.textContent='No se pudo conectar con el servidor de autenticación (se agotó el tiempo). Puede que el proyecto Supabase esté pausado o sin conexión. Reintenta en un momento.';
    return;
  }
  if(btn){btn.disabled=false;btn.textContent="Crear cuenta";}
  if(res.error){
    err.style.display="block";
    err.textContent=res.error.message.indexOf("already")>=0?"Ya existe una cuenta con ese email.":"Error: "+res.error.message;
    return;
  }
  if(res.data.session){
    // Activate 14-day trial for new accounts
    await sb.from("profiles").update({trial_started_at:new Date().toISOString()}).eq("id",res.data.user.id);
    await sbLoadUserData(res.data.user);
    trackIdentify(S.user); track('signup');
    document.getElementById("mroot").innerHTML="";
    render();
  }else{
    err.style.display="block";
    err.style.color="var(--grn)";
    err.textContent="Cuenta creada. Revisa tu email para confirmar antes de entrar.";
  }
}

async function doGoogleAuth(){
  if(typeof sb==='undefined'||!sb||!sb.auth){
    showToast('No se pudo cargar el servicio de autenticación. Recarga la página.','error');
    return;
  }
  // signInWithOAuth redirige a Google y vuelve a esta misma URL; el listener
  // onAuthStateChange (SIGNED_IN) ya maneja la sesión resultante igual que un
  // login por password — no hace falta lógica de callback aparte acá.
  await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+window.location.pathname}});
}

async function logout(){

  LIVE={};REBAL.targets={};DIVS.data={};
  S.portfolio=JSON.parse(JSON.stringify(DEF_PORT));
  S.watchlist=[...DEF_WATCH];
  render();
}

// have their own granular CRUD functions (sbAddHolding, sbDeleteHolding, etc.)
var _persistTimer=null;
function persist(){
  var el=document.getElementById("saved");
  if(el){el.classList.add("show");setTimeout(function(){el.classList.remove("show");},1400);}

  if(_persistTimer) clearTimeout(_persistTimer);
  _persistTimer=setTimeout(function(){
    sb.from("profiles").update({capital:S.capital}).eq("id",S.user.id).then(function(){},function(e){console.error("persist capital failed",e);});
  },600);
}

async function sbAddHolding(h){
  if(!S.user||!S.user.id) return h.id;
  var res=await sb.from("portfolio_holdings").insert({
    user_id:S.user.id, ticker:h.t, asset_type:h.type, shares:h.sh, avg_cost:h.cost, note:h.note||""
  }).select().single();
  if(res.error){ console.error("sbAddHolding failed",res.error); return null; }
  return res.data.id;
}
async function sbUpdateHolding(h){
  if(!S.user||!S.user.id) return;
  var res=await sb.from("portfolio_holdings").update({
    ticker:h.t, asset_type:h.type, shares:h.sh, avg_cost:h.cost, note:h.note||""
  }).eq("id",h.id).eq("user_id",S.user.id);
  if(res.error) console.error("sbUpdateHolding failed",res.error);
}
async function sbDeleteHolding(id){
  if(!S.user||!S.user.id) return;
  var res=await sb.from("portfolio_holdings").delete().eq("id",id).eq("user_id",S.user.id);
  if(res.error) console.error("sbDeleteHolding failed",res.error);

async function sbAddWatch(ticker){

(async function boot(){
  document.getElementById('main').innerHTML='<div class="dload"><div class="spin"></div>Cargando MOY IQ Invest...</div>';
  // Timeout de 10s: igual que doLogin (mas arriba), si getSession() se cuelga
  // (intercambio OAuth interrumpido, proyecto Supabase pausado, storage de auth
  // corrupto) la app entera quedaba congelada en este spinner para siempre, sin
  // mensaje ni forma de salir. Con el timeout, cae al render() de mas abajo.
  try{
    var sess=await withTimeout(sb.auth.getSession(),10000);
    if(sess.data.session&&sess.data.session.user){
      await sbLoadUserData(sess.data.session.user);
    }
  }catch(e){ console.error("boot session check failed",e); }
  render();
  if(S.user) bootLiveData(); // arranca carga de precios live (portfolio/watchlist/señales)

  // ── Retorno post-pago de Stripe ──
  try{
    var qp=new URLSearchParams(window.location.search);
    if(qp.get('upgraded')==='1'){
      track('upgrade_success');
      if(typeof showToast==='function') showToast('¡Bienvenido a Pro! '+icon('confetti')+' Tu suscripción está activa.','success');
      // El webhook actualiza el plan en Supabase; recargar datos por si hubo demora
      try{ var s2=await sb.auth.getSession(); if(s2.data.session&&s2.data.session.user){ await sbLoadUserData(s2.data.session.user); render(); } }catch(e){}
      history.replaceState({}, '', '/app'); // limpia el query param
    } else if(qp.get('upgrade_cancelled')==='1'){
      track('upgrade_cancelled');
      history.replaceState({}, '', '/app');
    }
  }catch(e){}
})();

sb.auth.onAuthStateChange(function(event,session){
  if(event==="SIGNED_OUT"){
    S.user=null;S.page="dash";
    render();
  } else if(event==="SIGNED_IN"&&session&&session.user){
    sbLoadUserData(session.user).then(function(){ render(); bootLiveData(); });
  }
});
