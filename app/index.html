  }
  if(S.alerts.some(function(a){return a.asset===ticker&&a.type===tipo&&a.trigger===t;})){
    showToast('Ya tienes esa misma alerta','warning'); return false;
  }
  S.alerts.push({id:S.alertNextId++,asset:ticker,type:tipo,trigger:t,createdAt:Date.now()});
  persistAlerts();
  ensureNotifyPermission();
  showToast('Alerta creada para '+ticker);
  return true;
}
function delAlert(id){
  // Mismo patron de undo que rmWatch() en watchlist: guardar la alerta y su
  // posicion antes de filtrar, para poder reinsertarla si el usuario deshace.
  var idx=S.alerts.findIndex(function(a){return a.id===id;});
  var removed=idx>=0?S.alerts[idx]:null;
  S.alerts=S.alerts.filter(function(a){return a.id!==id;});
  persistAlerts();
  showToast('Alerta eliminada','warning',function(){
    if(removed&&S.alerts.indexOf(removed)<0){
      S.alerts.splice(Math.min(idx,S.alerts.length),0,removed);
      persistAlerts();
      showToast('Alerta restaurada');
      renderAlert();
    }
  });
  renderAlert();
}

// Evalua TODAS las alertas contra el precio vivo actual y notifica las que se
// disparan. Antes las alertas solo se evaluaban al abrir su pestaña, asi que la
// funcion nunca cumplia su proposito. Ahora corre en el loop de quotes (cada 5
// min y en el arranque). Debounce: una alerta disparada marca a.notified y no
// vuelve a avisar hasta que el precio se despeja (deja de cumplir la condicion),
// evitando spam en cada tick. Devuelve cuantas se dispararon en esta pasada.
function checkAlerts(){
  if(!S.alerts||!S.alerts.length) return 0;
  var fired=0, changed=false;
  S.alerts.forEach(function(a){
    var cur=getLivePrice(a.asset);
    if(!(isFinite(cur)&&cur>0)) return;
    var hit=a.type==='Max'?cur>=a.trigger:cur<=a.trigger;
    if(hit&&!a.notified){
      a.notified=true; a.triggeredAt=Date.now(); a.triggeredPrice=cur; changed=true; fired++;
      notifyAlert(a,cur);
    }else if(!hit&&a.notified){
      a.notified=false; changed=true; // condicion despejada: se re-arma
    }
  });
  if(changed){ persistAlerts(); if(S.page==='alert'){ try{renderMain();}catch(e){} } }
  return fired;
}
function notifyAlert(a,cur){
  var dir=a.type==='Max'?'subió a':'bajó a';
  var msg=a.asset+' '+dir+' $'+cur.toFixed(2)+' · objetivo '+a.type+' $'+a.trigger;
  try{ if(typeof showToast==='function') showToast(icon('alert')+' '+msg); }catch(e){}
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('Alerta · '+a.asset, {body:msg, tag:'alert-'+a.id, icon:'/icon-192.png'});
    }
  }catch(e){}
  try{ if(typeof track==='function') track('alert_triggered',{asset:a.asset,type:a.type}); }catch(e){}
}
// Pide permiso de notificacion una vez, dentro de un gesto del usuario (al crear
// una alerta). Si lo niega, las alertas siguen avisando por toast in-app.
function ensureNotifyPermission(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      var p=Notification.requestPermission();
      if(p&&p.then) p.then(function(){ if(S.page==='alert'){ try{renderMain();}catch(e){} } });
    }
  }catch(e){}
}

// ── COST BASIS — weighted average per ticker from trade log ──
function realizedPnlFor(ticker){
  var avgCost=null,shares=0,realized=0,buyCosts=[];
  S.trades.filter(function(t){return t.ticker===ticker;}).sort(function(a,b){return a.id-b.id;}).forEach(function(t){
    if(t.type==='buy'){buyCosts.push({qty:t.qty,price:t.amount/t.qty});shares+=t.qty;}
    else if(t.type==='sell'){var cost=buyCosts.length?buyCosts.reduce(function(s,b){return s+b.price*b.qty;},0)/buyCosts.reduce(function(s,b){return s+b.qty;},0):0;realized+=(t.amount/t.qty-cost)*t.qty;shares-=t.qty;}
  });
  return realized;
}

// localStorage API cache — 20 min TTL, keyed by url
var _API_CACHE_TTL=20*60*1000;
function _cacheGet(key){
  try{
    var raw=localStorage.getItem('_apic_'+key);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(Date.now()-o.ts>_API_CACHE_TTL){localStorage.removeItem('_apic_'+key);return null;}
    return o.data;
  }catch(e){return null;}
}
function _cacheSet(key,data){
  try{
    var full='_apic_'+key;
    localStorage.setItem(full,JSON.stringify({ts:Date.now(),data:data}));
    // LRU eviction: keep at most 30 _apic_ keys; remove oldest first
    var keys=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('_apic_'))keys.push(k);}
    if(keys.length>30){
      var sorted=keys.map(function(k){try{return{k:k,ts:JSON.parse(localStorage.getItem(k)).ts};}catch(e){return{k:k,ts:0};}});
      sorted.sort(function(a,b){return a.ts-b.ts;});
      sorted.slice(0,sorted.length-30).forEach(function(e){localStorage.removeItem(e.k);});
    }
  }catch(e){}
}

function fetchWithTimeout(url,ms){
  ms=ms||8000;
  return new Promise(function(resolve,reject){
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort();reject(new Error('Timeout '+ms+'ms'));},ms);
    fetch(url,{signal:ctrl.signal}).then(function(r){clearTimeout(timer);resolve(r);}).catch(function(e){clearTimeout(timer);reject(e);});
  });
}

var _histInflight={};
function fetchHistory(ticker,range){

  if(_histInflight[k]) return _histInflight[k];
  var p=_fetchHistoryImpl(ticker,range);

async function _fetchHistoryImpl(ticker,range){
  try{
    var r=range||'3mo';
    var ckey='h_'+ticker+'_'+r;
    // 1. In-memory cache (fastest path)
    var cached=_cacheGet(ckey);
    if(cached){fetchStats.ok++;return cached;}
    // 2. localStorage cache — survives page reload, 5-min TTL
    try{
      var lsKey='fh_'+ticker+'_'+r;
      var stored=localStorage.getItem(lsKey);
      if(stored){
        var parsed=JSON.parse(stored);
        if(parsed&&parsed.ts&&(Date.now()-parsed.ts)<300000&&parsed.data&&parsed.data.length>5){
          _cacheSet(ckey,parsed.data);fetchStats.ok++;return parsed.data;
        }
      }
    }catch(e){}
    // 3. Network fetch
    var res;
    if(_USE_EDGE){
      res=await fetchWithTimeout('/api/history?ticker='+encodeURIComponent(ticker)+'&range='+r+'&interval=1d',8000);
    } else {
      var rawUrl='https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range='+r+'&includePrePost=false';
      res=await fetchWithTimeout('https://api.allorigins.win/raw?url='+encodeURIComponent(rawUrl),9000);
    }
    if(!res||!res.ok) throw new Error('HTTP '+(res?res.status:'no response'));
    var json=await res.json();
    var data;
    if(_USE_EDGE){
      // /api/history returns {ticker,range,interval,data:[{date,open,high,low,close,volume}]}
      if(!json.data||!json.data.length) throw new Error('no data');
      data=json.data.map(function(d,i){
        return {date:new Date(d.date).toLocaleDateString('es-CL',{month:'short',day:'numeric'}),
                ts:Math.floor(new Date(d.date).getTime()/1000),
                open:d.open,high:d.high,low:d.low,close:d.close,vol:d.volume,p:i+1};
      }).filter(function(d){return d.close>0;});
    } else {
      // raw Yahoo Finance format
      var result=json.chart&&json.chart.result&&json.chart.result[0];
      if(!result||!result.timestamp) throw new Error('no result');
      var ts=result.timestamp;
      var q2=result.indicators&&result.indicators.quote&&result.indicators.quote[0];
      if(!q2) throw new Error('no quote');
      data=[];
      for(var i=0;i<ts.length;i++){
        if(q2.close[i]!=null&&q2.close[i]>0){
          data.push({date:new Date(ts[i]*1000).toLocaleDateString('es-CL',{month:'short',day:'numeric'}),
                     open:q2.open[i]||q2.close[i],high:q2.high[i]||q2.close[i],
                     low:q2.low[i]||q2.close[i],close:q2.close[i],vol:q2.volume[i]||0,p:i+1});
        }
      }
    }
    if(!data||data.length<5) throw new Error('insufficient data');
    _cacheSet(ckey,data);
    // Persist to localStorage so next page load is instant
    try{localStorage.setItem('fh_'+ticker+'_'+r,JSON.stringify({ts:Date.now(),data:data}));}catch(e){}
    fetchStats.ok++;fetchStats.lastOk=Date.now();
    return data;
  }catch(e){fetchStats.fail++;fetchStats.lastErr=e.message;return null;}
}

async function refreshLive(tickers,manual){
  if(liveLoading&&!manual) return;
  if(_liveAbortCtrl) _liveAbortCtrl.abort();
  _liveAbortCtrl=new AbortController();
  var mySignal=_liveAbortCtrl.signal;
  liveLoading=true;
  liveFailed=false;
  // Spinner on all refresh buttons
  document.querySelectorAll('.refresh-btn').forEach(function(b){
    b.innerHTML='<span class="spin-sm"></span>';b.disabled=true;
  });
  try{
    var gotAny=false;
    var isVercel=_USE_EDGE;

    // Holdings marcadas type==="Crypto" en Portfolio van por /api/crypto
    // (CoinGecko) en vez de /api/quote (Yahoo) — ver api/crypto.js. Watchlist
    // y ALL_SIG no tienen noción de tipo hoy, así que siguen 100% por Yahoo.
    var cryptoTickers=tickers.filter(function(t){
      return S.portfolio.some(function(h){return h.t===t&&h.type==='Crypto';});
    });
    var stockTickers=tickers.filter(function(t){return cryptoTickers.indexOf(t)<0;});

    if(isVercel){
      // /api/quote recorta a 10 tickers por peticion. Antes se enviaban TODOS
      // en una sola URL: el servidor devolvia solo los 10 primeros, gotAny se
      // ponia en true y el fallback nunca corria, asi que del 11 en adelante
      // ninguna posicion recibia precio (ni valor actual, ni P&L, ni retorno).
      // Ahora se pide en trozos de 10 y se recorren todos.
      try{
        for(var qi=0; qi<stockTickers.length; qi+=10){
          if(mySignal.aborted) return;
          var trozo=stockTickers.slice(qi, qi+10);
          var batchRes=await fetchWithTimeout('/api/quote?ticker='+trozo.join(','),6000);
          var batchData=await batchRes.json();
          Object.keys(batchData).forEach(function(t){
            var q=batchData[t];
            if(q&&q.price){
              LIVE[t]=q;
              S.portfolio.forEach(function(h){if(h.t===t)h.cur=q.price;});
              ALL_SIG.forEach(function(s){if(s.t===t)s.p=q.price;});
              gotAny=true;
            }
          });
          if(gotAny) updateLivePricesInDOM();
        }
      }catch(e){if(mySignal.aborted) return;/* fall through to individual fetches */}

      if(cryptoTickers.length&&!mySignal.aborted){
        try{
          var cRes=await fetchWithTimeout('/api/crypto?symbols='+cryptoTickers.join(','),6000);
          var cData=await cRes.json();
          Object.keys(cData).forEach(function(t){
            var q=cData[t];
            if(q&&q.price){
              LIVE[t]=q;
              S.portfolio.forEach(function(h){if(h.t===t)h.cur=q.price;});
              gotAny=true;
            }
          });
          updateLivePricesInDOM();
        }catch(e){if(mySignal.aborted) return;/* precios crypto quedan sin refrescar, resto sigue */}
      }
    }

    if(mySignal.aborted) return;
    if(!gotAny){
      // Fallback: individual fetches with batching (solo acciones/ETF — las
      // crypto ya se intentaron arriba vía /api/crypto, fetchQuote no las resuelve)
      var BATCH_SIZE=6;
      for(var bi=0;bi<stockTickers.length;bi+=BATCH_SIZE){
        var batch=stockTickers.slice(bi,bi+BATCH_SIZE);
        var results=await Promise.allSettled(batch.map(function(t){return fetchQuote(t);}));
        results.forEach(function(r,i){
          if(r.status==="fulfilled"&&r.value){
            var t=batch[i];
            LIVE[t]=r.value;
            S.portfolio.forEach(function(h){if(h.t===t)h.cur=r.value.price;});
            ALL_SIG.forEach(function(s){if(s.t===t)s.p=r.value.price;});
            gotAny=true;
          }
        });
        if(gotAny) updateLivePricesInDOM();
      }
    }
    if(gotAny){
      liveUpdated=Date.now();liveFailed=false;liveFromCache=false;
      try{localStorage.setItem('mv_prices_cache',JSON.stringify({ts:Date.now(),live:LIVE}));}catch(e){/* silent */}
    } else {
      liveFailed=true;
      trackError('quotes',new Error('no_prices_returned'),{tickers:tickers.length}); // Yahoo no devolvió precios
      // Load from cache on complete failure
      try{
        var c=JSON.parse(localStorage.getItem('mv_prices_cache')||'null');
        if(c&&(Date.now()-c.ts)<LIVE_CACHE_TTL){
          Object.assign(LIVE,c.live);
          liveFromCache=true;liveUpdated=c.ts;
          S.portfolio.forEach(function(h){if(LIVE[h.t])h.cur=LIVE[h.t].price;});
        }
      }catch(e){/* silent */}
    }
  }catch(e){liveFailed=true;trackError('quotes',e);}
  liveLoading=false;
  // Restore refresh buttons
  var updStr=liveUpdated?new Date(liveUpdated).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'—';
  document.querySelectorAll('.refresh-btn').forEach(function(b){
    b.innerHTML='↻';b.disabled=false;
    b.title='Actualizado: '+updStr+(liveFailed?' · Error de conexión':liveFromCache?' · Datos cacheados':'');
  });
  updateLiveBadge();
  updateLivePricesInDOM();
}

// ── TI ─────────────────────────────────────────────────────────
var TI={
  sma:function(p,n){return p.map(function(_,i){return i<n-1?null:p.slice(i-n+1,i+1).reduce(function(a,b){return a+b;},0)/n;});},
  ema:function(p,n){var k=2/(n+1),r=[p[0]];for(var i=1;i<p.length;i++)r.push(p[i]*k+r[i-1]*(1-k));return r;},
  // Fase 3: una sola implementacion del RSI (app/lib/readings.js, con tests).
  rsi:function(p,n){ return rsiSeries(p,n||14); },
  macd:function(p){
    var e12=this.ema(p,12),e26=this.ema(p,26);
    var line=e12.map(function(v,i){return v-e26[i];});
    var sig=this.ema(line,9);
    return{line:line,signal:sig,hist:line.map(function(v,i){return v-sig[i];})};
  },
  bb:function(p,n,m){
    n=n||20;m=m||2;
    var sma=this.sma(p,n);
    return p.map(function(_,i){
      if(!sma[i])return{mid:null,upper:null,lower:null};
      var sl=p.slice(Math.max(0,i-n+1),i+1);
      var avg=sma[i];
      var std=Math.sqrt(sl.reduce(function(s,v){return s+(v-avg)*(v-avg);},0)/sl.length);
      return{mid:avg,upper:avg+m*std,lower:avg-m*std};
    });
  },
  atr:function(highs,lows,closes,n){
    n=n||14;
    var tr=highs.map(function(h,i){
      if(i===0)return h-lows[i];
      return Math.max(h-lows[i],Math.abs(h-closes[i-1]),Math.abs(lows[i]-closes[i-1]));
    });
    // El array debe tener un elemento por vela para que atr[i] corresponda a
    // closes[i]. Antes arrancaba con un solo null y quedaba de longitud
    // tr.length-n+2: indexar en closes.length-1 devolvia undefined y el NaN se
    // propagaba al R:R del motor y a los health scores.
    var result=new Array(n-1).fill(null);          // indices 0..n-2 sin ATR aun
    var atr0=tr.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    result.push(atr0);                              // indice n-1
    for(var i=n;i<tr.length;i++){atr0=(atr0*(n-1)+tr[i])/n;result.push(atr0);}
    return result;                                  // longitud == tr.length
  }
};

// ── SVG CHARTS ─────────────────────────────────────────────────
function svgLine(data,keys,colors,W,H){
  W=W||420;H=H||120;
  if(!data||!data.length)return '<div style="height:'+H+'px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px">Sin datos</div>';
  var allVals=[];
  keys.forEach(function(k){data.forEach(function(d){if(d[k]!=null)allVals.push(d[k]);});});
  if(!allVals.length)return "";
  var minV=Math.min.apply(null,allVals)-5;
  var maxV=Math.max.apply(null,allVals)+5;
  var rng=maxV-minV||1;
  // Con un solo dato (primer tick del dia) data.length-1 era 0 y las
  // coordenadas salian NaN: el chart se pintaba vacio.
  var _den=Math.max(1,data.length-1);
  var xS=function(i){return (i/_den)*W;};
  var yS=function(v){return H-((v-minV)/(rng||1))*H;};
  var paths="";
  keys.forEach(function(k,ki){
    var pts=[];
    data.forEach(function(d,i){if(d[k]!=null)pts.push(xS(i).toFixed(1)+","+yS(d[k]).toFixed(1));});
    if(pts.length<2)return;
    var sw=ki===0?2:1.5;
    var da=ki>0?"stroke-dasharray='4 2'":"";
    var op=ki>2?"opacity='0.5'":"";
    paths+="<polyline points='"+pts.join(" ")+"' fill='none' stroke='"+colors[ki]+"' stroke-width='"+sw+"' stroke-linecap='round' stroke-linejoin='round' "+da+" "+op+"/>";
  });
  var grid=[.25,.5,.75].map(function(p){var y=(H*p).toFixed(1);var v=(minV+rng*(1-p)).toFixed(0);return "<line x1='0' y1='"+y+"' x2='"+W+"' y2='"+y+"' stroke='rgba(255,255,255,.04)' stroke-width='1'/><text x='2' y='"+(parseFloat(y)-2)+"' fill='#3d5278' font-size='8' font-family='IBM Plex Mono'>$"+v+"</text>";}).join("");
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px'>"+grid+paths+"</svg>";
}

function svgBars(data,key,W,H,zero,refLines){
  W=W||420;H=H||80;zero=zero||0;refLines=refLines||[];
  var vals=data.map(function(d){return d[key];}).filter(function(v){return v!=null;});
  if(!vals.length)return "";
  var allRef=refLines.map(function(r){return r.val;});
  var minV=Math.min.apply(null,vals.concat([zero]).concat(allRef));
  var maxV=Math.max.apply(null,vals.concat([zero]).concat(allRef));
  var rng=maxV-minV||1;
  var bw=W/data.length;
  var bars=data.map(function(d,i){
    if(d[key]==null)return "";
    var pos=d[key]>=zero;
    var bh=Math.abs(d[key]-zero)/rng*H;
    var y=pos?((maxV-d[key])/rng*H):((maxV-zero)/rng*H);
    return "<rect x='"+(i*bw+1).toFixed(1)+"' y='"+y.toFixed(1)+"' width='"+(bw-2).toFixed(1)+"' height='"+bh.toFixed(1)+"' fill='"+(pos?"var(--pos)":"var(--neg)")+"' opacity='.8' rx='1'/>";
  }).join("");
  var zy=((maxV-zero)/rng*H).toFixed(1);
  var refSvg=refLines.map(function(r){
    var ry=((maxV-r.val)/rng*H).toFixed(1);
    return "<line x1='0' y1='"+ry+"' x2='"+W+"' y2='"+ry+"' stroke='"+r.color+"' stroke-width='1' stroke-dasharray='4 3'/>";
  }).join("");
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px'><line x1='0' y1='"+zy+"' x2='"+W+"' y2='"+zy+"' stroke='rgba(255,255,255,.1)' stroke-width='1'/>"+refSvg+bars+"</svg>";
}

// ── LIGHTWEIGHT CHARTS (Candlestick) ───────────────────────────
var _lwLoaded=false;
var _lwLoadPromise=null;
var _lwChartMain=null;
var _lwChartVol=null;
var _lwResizeObs=null;

function loadLWScript(){
  if(_lwLoaded) return Promise.resolve();
  if(_lwLoadPromise) return _lwLoadPromise;
  _lwLoadPromise=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    // Same-origin (auto-hospedado) en vez de cdn.jsdelivr.net: mismo motivo que
    // Supabase — un CDN bloqueado dejaba los charts sin cargar.
    s.src='/vendor-lightweight-charts.js';
    s.onload=function(){_lwLoaded=true;resolve();};
    s.onerror=reject;
    document.head.appendChild(s);
  });
  return _lwLoadPromise;
}

function renderLWCharts(hist,sma20,sma50,bbArr,sma200){
  loadLWScript().then(function(){
    var LW=window.LightweightCharts;
    if(!LW) return;
    var mainEl=document.getElementById('lw-chart-main');
    var volEl=document.getElementById('lw-chart-vol');
    if(!mainEl||!volEl) return;
    if(_lwChartMain){try{_lwChartMain.remove();}catch(e){} _lwChartMain=null;}
    if(_lwChartVol){try{_lwChartVol.remove();}catch(e){} _lwChartVol=null;}
    // Filter valid OHLCV bars
    var bars=hist.filter(function(d){return d.ts&&d.open&&d.high&&d.low&&d.close;});
    if(!bars.length) return;

    // I07: colores de la paleta (--pos/--neg) y atribución en el pie, no sobre el gráfico.
    var _cs=getComputedStyle(document.documentElement);
    var _tok=function(n,f){ var v=(_cs.getPropertyValue(n)||'').trim(); return v||f; };
    var bgColor=_tok('--card','#FAF8F2');
    var textColor=_tok('--text2','#63604F');
    var gridColor=_tok('--border','rgba(20,33,61,0.10)');
    var posC=_tok('--pos','#356E57'), negC=_tok('--neg','#A23E2E');

    _lwChartMain=LW.createChart(mainEl,{
      width:mainEl.clientWidth||mainEl.offsetWidth||300,
      height:210,
      layout:{background:{type:'solid',color:bgColor},textColor:textColor,fontFamily:"'IBM Plex Mono',monospace",fontSize:11,attributionLogo:false},
      grid:{vertLines:{color:gridColor},horzLines:{color:gridColor}},
      crosshair:{mode:LW.CrosshairMode.Normal},
      timeScale:{timeVisible:false,borderColor:'rgba(255,255,255,0.07)'},
      rightPriceScale:{borderColor:'rgba(255,255,255,0.07)'},
    });
    var chart=_lwChartMain;

    var candleSeries=chart.addCandlestickSeries({
      upColor:posC,downColor:negC,wickUpColor:posC,wickDownColor:negC,
      borderVisible:false,
    });
    candleSeries.setData(bars.map(function(d){return {time:d.ts,open:d.open,high:d.high,low:d.low,close:d.close};}));

    var s20Data=bars.map(function(d,i){return sma20[i]!=null?{time:d.ts,value:sma20[i]}:null;}).filter(Boolean);
    if(s20Data.length){
      var s20s=chart.addLineSeries({color:'#f59e0b',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      s20s.setData(s20Data);
    }
    var s50Data=bars.map(function(d,i){return sma50[i]!=null?{time:d.ts,value:sma50[i]}:null;}).filter(Boolean);
    if(s50Data.length){
      var s50s=chart.addLineSeries({color:'#3d8ef8',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      s50s.setData(s50Data);
    }
    if(sma200&&sma200.length){
      var s200Data=bars.map(function(d,i){return sma200[i]!=null?{time:d.ts,value:sma200[i]}:null;}).filter(Boolean);
      if(s200Data.length){
        var s200s=chart.addLineSeries({color:'#a855f7',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
        s200s.setData(s200Data);
      }
    }
    if(bbArr&&bbArr.length){
      var bbUpData=bars.map(function(d,i){return bbArr[i]&&bbArr[i].upper!=null?{time:d.ts,value:bbArr[i].upper}:null;}).filter(Boolean);
      var bbLoData=bars.map(function(d,i){return bbArr[i]&&bbArr[i].lower!=null?{time:d.ts,value:bbArr[i].lower}:null;}).filter(Boolean);
      if(bbUpData.length){
        var bbUs=chart.addLineSeries({color:'rgba(61,142,248,0.3)',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,lineStyle:2});
        bbUs.setData(bbUpData);
      }
      if(bbLoData.length){
        var bbLs=chart.addLineSeries({color:'rgba(61,142,248,0.3)',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,lineStyle:2});
        bbLs.setData(bbLoData);
      }
    }
    chart.timeScale().fitContent();

    // Volume chart
    _lwChartVol=LW.createChart(volEl,{
      width:volEl.clientWidth||volEl.offsetWidth||300,
      height:60,
      layout:{background:{type:'solid',color:bgColor},textColor:textColor,attributionLogo:false},
      grid:{vertLines:{color:gridColor},horzLines:{color:gridColor}},
      timeScale:{timeVisible:false,borderColor:'rgba(255,255,255,0.07)'},
      rightPriceScale:{borderColor:'rgba(255,255,255,0.07)'},
      crosshair:{mode:LW.CrosshairMode.Hidden},
    });
    var volChart=_lwChartVol;
    var volSeries=volChart.addHistogramSeries({
      color:'rgba(255,255,255,0.15)',priceFormat:{type:'volume'},priceScaleId:'',
    });
    volSeries.setData(bars.map(function(d){return {time:d.ts,value:d.vol||0,color:d.close>=d.open?'rgba(34,197,94,0.3)':'rgba(239,68,68,0.3)'};}));
    volChart.timeScale().fitContent();

    // Sync x-axis scroll between both charts
    chart.timeScale().subscribeVisibleLogicalRangeChange(function(r){if(r)volChart.timeScale().setVisibleLogicalRange(r);});

    // Reflow al cambiar el ancho (resize/rotacion): los charts se crean con
    // ancho fijo. Un observer sobre el contenedor reajusta ambos; se desconecta
    // en closeDrawer para no quedar observando un drawer cerrado.
    if(_lwResizeObs){try{_lwResizeObs.disconnect();}catch(e){}}
    if(window.ResizeObserver){
      _lwResizeObs=new ResizeObserver(function(){
        var w=mainEl.clientWidth||mainEl.offsetWidth;
        if(!w) return;
        try{if(_lwChartMain)_lwChartMain.applyOptions({width:w});}catch(e){}
        try{if(_lwChartVol)_lwChartVol.applyOptions({width:volEl.clientWidth||w});}catch(e){}
      });
      _lwResizeObs.observe(mainEl);
    }
  }).catch(function(){});
}

function genFallback(basePrice,days){
  var data=[];var p=basePrice*0.88;
  for(var i=0;i<days;i++){
    var chg=(Math.random()-0.48)*p*0.022;
    var c=Math.max(p+chg,1);
    data.push({date:"D"+(i+1),open:p,high:Math.max(p,c)*1.005,low:Math.min(p,c)*0.995,close:c,vol:Math.floor(Math.random()*50e6+10e6),p:i+1,_synthetic:true});
    p=c;
  }
  data[data.length-1].close=basePrice;
  return data;
}

// del minimo, mas 'barato' esta respecto a su propio rango anual. Varia por
// ticker, a diferencia de la columna anterior que daba 8.7% fijo para todos.
function dist52wCell(cur,lq){
  var low=lq&&lq.low52;
  if(!cur||!low||low<=0) return '<span style="color:var(--text3)">—</span>';
  var d=(cur/low-1)*100;
  // cerca del minimo = verde (descuento); lejos = neutro
  var col=d<15?'var(--grn)':d<40?'var(--amber)':'var(--text3)';
  // El signo se calcula: el precio puede quedar POR DEBAJO del minimo de 52
  // semanas cuando ese minimo aun no refleja la sesion actual, y con el '+'
  // fijo se leia '+-3%'.
  return '<span style="font-weight:600;font-size:11px;color:'+col+'" title="Mínimo 52 semanas: $'+fmtD(low)+'">'+(d>=0?'+':'')+d.toFixed(0)+'%</span>';

// ── TABLE SORTING ────────────────────────────────────────────────
var _tblSort={col:null,asc:true,tbl:null};
function tblSortBy(tbl,col){
  if(_tblSort.tbl===tbl&&_tblSort.col===col){_tblSort.asc=!_tblSort.asc;}
  else{_tblSort.tbl=tbl;_tblSort.col=col;_tblSort.asc=false;}
  var tbody=document.querySelector('#tbl-'+tbl+' tbody');
  if(!tbody) return;
  var rows=Array.from(tbody.querySelectorAll('tr'));
  rows.sort(function(a,b){
    var ca=a.getAttribute('data-'+col)||'';
    var cb=b.getAttribute('data-'+col)||'';
    var na=parseFloat(ca),nb=parseFloat(cb);
    var va=isNaN(na)?ca.toLowerCase():na;
    var vb=isNaN(nb)?cb.toLowerCase():nb;
    if(va<vb) return _tblSort.asc?-1:1;
    if(va>vb) return _tblSort.asc?1:-1;
    return 0;
  });
  rows.forEach(function(r){tbody.appendChild(r);});
  // Update header indicators
  document.querySelectorAll('#tbl-'+tbl+' th[data-sort]').forEach(function(th){
    var arrow=th.getAttribute('data-sort')===col?(_tblSort.asc?' ↑':' ↓'):'';
    th.setAttribute('data-arrow',arrow);
    th.querySelector('.sarrow').textContent=arrow;
  });
}
function sortTh(tbl,col,label,tip){
  return '<th data-sort="'+col+'" role="button" tabindex="0" onclick="tblSortBy(\''+tbl+'\',\''+col+'\')" style="cursor:pointer;white-space:nowrap"'+(tip?' title="'+tip+'"':'')+'>'+label+' <span class="sarrow"></span></th>';
}
function showToast(msg,type,undoFn){
  var c=document.getElementById('toast-container');
  if(!c) return;
  var t=document.createElement('div');
  t.className='toast '+(type||'success');
  var ico=type==='error'?'close':type==='warning'?'alert':type==='info'?'help':'check';
  var iconEl=document.createElement('span');iconEl.className='toast-ico';iconEl.innerHTML=icon(ico);
  var msgEl=document.createElement('span');msgEl.textContent=msg;
  t.appendChild(iconEl);t.appendChild(msgEl);
  function dismiss(){ t.classList.remove('show'); setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},300); }
  // Acciones reversibles (quitar de watchlist, etc.) dan mas tiempo y un boton
  // real en vez de depender de que el usuario lea el toast antes de que se vaya.
  if(undoFn){
    var undoBtn=document.createElement('button');
    undoBtn.type='button';
    undoBtn.className='toast-undo';
    undoBtn.textContent='Deshacer';
    undoBtn.onclick=function(){ undoFn(); dismiss(); };
    t.appendChild(undoBtn);
  }
  c.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(dismiss, undoFn?5000:3000);
}

function resolvePage(p){
  p=String(p||'dash');
  if(p.indexOf('/')>0){
    var parts=p.split('/'), d=DEST.find(function(x){return x.id===parts[0];});
    var tb=d&&d.tabs.find(function(t){return t.slug===parts[1];});
    if(tb) return tb.page;
    p=parts[0];
  }
  if(PAGE_ALIAS[p]) return PAGE_ALIAS[p];
  for(var i=0;i<DEST.length;i++) for(var j=0;j<DEST[i].tabs.length;j++) if(DEST[i].tabs[j].page===p) return p;
  if(DEST_ACCOUNT[p]) return p;
  return 'dash';
}

  for(var i=0;i<DEST.length;i++){

    if(tb) return {dest:DEST[i],tab:tb};
  }
  return {dest:null,tab:null,account:DEST_ACCOUNT[page]||null};

// Buscador: tickers del portafolio, de la lista, del universo de referencia,
// de los presets de Descubrir y los nombres conocidos. Acepta cualquier ticker
// escrito aunque no este en la lista.
var GS={items:[],idx:-1};
function gsUniverse(){
  var out=[], seen={};
  function add(t,src){
    t=String(t||'').toUpperCase().trim(); if(!t||seen[t]) return;
    seen[t]=1; out.push({t:t,name:TICKER_NAMES[t]||'',src:src||''});
  }
  (S.portfolio||[]).forEach(function(h){add(h.t,'En tu portafolio');});
  navWatchTickers().forEach(function(t){add(t,'En tu lista');});
  ALL_SIG.forEach(function(x){add(x.t);});
  SCREENER_PRESET_TICKERS.forEach(function(t){add(t);});
  Object.keys(TICKER_NAMES).forEach(function(t){add(t);});
  return out;
}
function gsMatches(q){
  var all=gsUniverse();
  q=String(q||'').trim();
  if(!q) return all.filter(function(x){return x.src;}).slice(0,8);
  var Q=q.toUpperCase(), ql=q.toLowerCase();
  var a=[],b=[],c=[];
  all.forEach(function(x){
    if(x.t===Q||x.t.indexOf(Q)===0) a.push(x);
    else if(x.t.indexOf(Q)>0) b.push(x);
    else if(x.name&&x.name.toLowerCase().indexOf(ql)>=0) c.push(x);
  });
  var res=a.concat(b,c).slice(0,7);
  // Cualquier ticker escrito se puede abrir: va al final si hay coincidencias.
  if(/^[A-Z0-9.\-=^]{1,12}$/.test(Q)&&!res.some(function(x){return x.t===Q;})) res.push({t:Q,name:'',src:'',typed:true});
  return res;
}
function gsInput(){
  var inp=document.getElementById('gs-in'); if(!inp) return;
  GS.items=gsMatches(inp.value); GS.idx=GS.items.length&&inp.value.trim()?0:-1;
  gsPaint();
}
function gsPaint(){
  var list=document.getElementById('gs-list'), inp=document.getElementById('gs-in');
  if(!list||!inp) return;
  if(!GS.items.length){
    var q=inp.value.trim();
    list.innerHTML=q?'':'<li class="gs-empty" role="presentation">Escribe un ticker, por ejemplo AAPL o SPY</li>';
    list.hidden=!!q;
    inp.setAttribute('aria-expanded',String(!list.hidden)); inp.removeAttribute('aria-activedescendant');
    return;
  }
  list.innerHTML=GS.items.map(function(x,i){
    var on=i===GS.idx;
    return '<li role="option" id="gs-opt-'+i+'" class="gs-opt'+(on?' on':'')+'" aria-selected="'+on+'" onmousedown="event.preventDefault()" onclick="gsPick('+i+')">'+
      '<span class="gs-t">'+esc(x.t)+'</span>'+
      '<span class="gs-n">'+(x.typed?'Abrir la ficha de '+esc(x.t):esc(x.name||''))+'</span>'+
      (x.src?'<span class="gs-s">'+esc(x.src)+'</span>':'')+'</li>';
  }).join('');
  list.hidden=false;
  inp.setAttribute('aria-expanded','true');
  if(GS.idx>=0) inp.setAttribute('aria-activedescendant','gs-opt-'+GS.idx); else inp.removeAttribute('aria-activedescendant');
}
function gsClose(){
  var list=document.getElementById('gs-list'), inp=document.getElementById('gs-in');
  if(list){ list.hidden=true; list.innerHTML=''; }
  if(inp){ inp.setAttribute('aria-expanded','false'); inp.removeAttribute('aria-activedescendant'); }
  GS.items=[]; GS.idx=-1;
}
function gsBlur(){ setTimeout(function(){ var a=document.activeElement; if(!a||!a.closest||!a.closest('#gs')) { gsClose(); } },120); }
function gsPick(i){
  var x=GS.items[i]; if(!x) return;
  gsGo(x.t);
}
function gsGo(t){
  t=String(t||'').toUpperCase().trim(); if(!t) return;
  var inp=document.getElementById('gs-in');
  if(inp){ inp.value=''; inp.blur(); }
  gsClose(); gsCloseMobile();
  navOpenTicker(t);
}
function gsKey(e){
  var inp=e.target;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!GS.items.length) return;
    e.preventDefault();
    var n=GS.items.length;
    GS.idx=e.key==='ArrowDown'?(GS.idx+1)%n:(GS.idx<=0?n-1:GS.idx-1);
    gsPaint();
  } else if(e.key==='Enter'){
    e.preventDefault();
    if(GS.idx>=0&&GS.items[GS.idx]) gsPick(GS.idx);
    else if(inp.value.trim()) gsGo(inp.value);
  } else if(e.key==='Escape'){
    e.stopPropagation();
    if(inp.value){ inp.value=''; gsInput(); }
    else { gsClose(); gsCloseMobile(); inp.blur(); }
  }
}
function gsFocus(){
  if(window.innerWidth<1024){ gsOpenMobile(); return; }
  var inp=document.getElementById('gs-in'); if(inp){ inp.focus(); inp.select(); }
}
function gsOpenMobile(){
  var tb=document.getElementById('topbar'); if(!tb) return;
  tb.classList.add('gs-open');
  var inp=document.getElementById('gs-in'); if(inp) setTimeout(function(){ inp.focus(); },0);
}
function gsCloseMobile(){
  var tb=document.getElementById('topbar'); if(!tb||!tb.classList.contains('gs-open')) return;
  tb.classList.remove('gs-open');
  gsClose();
  var b=tb.querySelector('.tb-search'); if(b&&window.innerWidth<1024) b.focus();
}

  if(e.key==='ArrowDown'){ e.preventDefault(); its[(i+1)%its.length].focus(); }

  else if(e.key==='Home'){ e.preventDefault(); its[0].focus(); }
  else if(e.key==='End'){ e.preventDefault(); its[its.length-1].focus(); }
  else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); acctClose(true); }
  else if(e.key==='Tab'){ acctClose(); }
}

function ptabKey(e){
  var keys=['ArrowLeft','ArrowRight','Home','End'];

  var tabs=Array.prototype.slice.call(document.querySelectorAll('#pagehead .ptab'));
  var i=tabs.indexOf(document.activeElement); if(i<0) return;

  var n=e.key==='ArrowRight'?(i+1)%tabs.length:e.key==='ArrowLeft'?(i-1+tabs.length)%tabs.length:e.key==='Home'?0:tabs.length-1;
  var page=tabs[n].id.replace('ptab-','');
  setPage(page);
  var nt=document.getElementById('ptab-'+page); if(nt) nt.focus();
}

function dedupeMainHeader(){
  var m=document.getElementById('main'); if(!m||!S.user) return;
  if(m.querySelector('[data-shell-dedup]')) return;
  var h=m.querySelector('.ph, .fos-module-header, .dash-page-header'); if(!h) return;
  h.setAttribute('data-shell-dedup','1');

  // Si solo quedaron piezas ocultas (p. ej. la frescura que Hoy muestra solo
  // en el movil), la cabecera no ocupa lugar.
  var visible=Array.prototype.some.call(h.querySelectorAll('*'),function(x){ return x.children.length===0&&x.offsetParent!==null&&(x.textContent.trim()||/^(BUTTON|INPUT|SELECT|A)$/.test(x.tagName)); });
  if(!visible) h.classList.add('ph-empty');

// Mini grafica de la banda de mercado. La version que vivia dentro de Contexto
// usaba #00b050/#ff4444 hardcodeados, que ya no son los colores de la paleta:
// esta usa los tokens semanticos --pos/--neg.
function bandSpark(pts,isUp){
  if(!pts||pts.length<2) return '';
  var validos=pts.filter(function(v){return v!==null&&v!==undefined&&isFinite(v);});
  if(validos.length<2) return '';
  var w=52,h=16;
  var mn=Math.min.apply(null,validos), mx=Math.max.apply(null,validos), rng=(mx-mn)||1;
  var coords=validos.map(function(v,i){
    return (i/(validos.length-1)*w).toFixed(1)+','+(h-(v-mn)/rng*h).toFixed(1);
  }).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true" style="display:block;flex-shrink:0">'+
    '<polyline points="'+coords+'" fill="none" stroke="'+(isUp?'var(--pos)':'var(--neg)')+'" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

var _modalLastFocus=null;
function openModal(t,data){
  // Guarda el foco previo para restaurarlo al cerrar (a11y: el foco no debe
  // perderse al abrir/cerrar un dialogo).
  // En el ejemplo, "Nueva posición" sale primero del ejemplo: lo que se
  // agregue tiene que ir al portafolio real, no al ficticio.
  if(S.demoMode&&(t==='addpos'||t==='importcsv')){ exitDemo(); }
  _modalLastFocus=document.activeElement;
  closeDrawer();S.modal=t;S.editPos=data||null;if(t==='upgrade')track('paywall_view');renderModal();
}
function closeModal(){
  S.modal=null;S.editPos=null;
  document.getElementById("mroot").innerHTML="";
  // Restaura el foco al elemento que abrio el modal.
  if(_modalLastFocus&&typeof _modalLastFocus.focus==='function'){try{_modalLastFocus.focus();}catch(e){}}
  _modalLastFocus=null;
  // Only re-render the current page content, not sidebar
  renderMain();
}
// Foco inicial + trap de Tab dentro del modal (role=dialog aria-modal sin trap
// es un defecto conocido: Tab se escapaba al fondo). Se llama tras renderizar.
function _setupModalFocus(){
  var mr=document.getElementById("mroot");
  var modal=mr&&mr.querySelector(".modal, .modal-box");
  if(!modal) return;
  var SEL='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function focusables(){
    return Array.prototype.slice.call(modal.querySelectorAll(SEL)).filter(function(el){return el.offsetParent!==null;});
  }
  setTimeout(function(){
    if(modal.contains(document.activeElement)) return; // re-render con foco ya dentro
    var first=modal.querySelector("input:not([type=hidden]),textarea,select")||focusables()[0];
    if(first){try{first.focus();}catch(e){}}
  },30);
  modal.addEventListener("keydown",function(e){
    if(e.key!=="Tab") return;
    var f=focusables(); if(!f.length) return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
}

async function deGetSectorRS(ticker){

async function deGetRegime(){
  // Return from cache if < 30 min old
  if(DE_CACHE.regime&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.regime;
  var hist=await fetchHistory('SPY','1y');
  if(!hist||hist.length<55){return{regime:'neutral',label:'Sin datos',color:'var(--text2)',spy:null,sma200:null};}
  var closes=hist.map(function(d){return d.close;});
  var sma200arr=TI.sma(closes,Math.min(200,closes.length));
  var sma50arr =TI.sma(closes,Math.min(50,closes.length));
  var last=closes[closes.length-1];
  var s200=sma200arr[sma200arr.length-1];
  var s50 =sma50arr[sma50arr.length-1];
  var regime,label,color,emoji,desc;
  var pct200=(last-s200)/s200;
  if(last>s200&&s50>s200&&pct200>0.01){
    regime='risk_on';label='Tendencia alcista';color='var(--grn)';emoji='pos';
    desc='SPY y su media de 50 días están sobre la media de 200 días.';
  }else if(last<s200&&s50<s200){
    regime='risk_off';label='Tendencia bajista';color='var(--red)';emoji='neg';
    desc='SPY y su media de 50 días están bajo la media de 200 días.';
  }else{
    regime='neutral';label='En transición';color='var(--amber)';emoji='warn';
    desc='SPY está entre sus medias de 50 y 200 días.';
  }
  var result={regime:regime,label:label,color:color,emoji:emoji,desc:desc,spy:last,sma200:s200,sma50:s50,pct200:pct200,hist:hist};
  DE_CACHE.regime=result;DE_CACHE.lastFetch=Date.now();
  return result;
}

function drawSPYMiniChart(regime){
  try{
    var canvas=document.getElementById('spy-mini-chart');
    if(!canvas) return;
    var ctx=canvas.getContext('2d');
    var rawHist=regime&&regime.hist;
    // Work on a copy sorted oldest→newest — do not mutate regime.hist
    // Se ordenaba por la fecha ya formateada ("jun. 5"), que es alfabetica:
    // "dic." caia antes que "ene.". Se ordena por el timestamp original.
    var hist=rawHist?rawHist.slice().sort(function(a,b){
      var ta=a.t||a.ts||Date.parse(a.date)||0, tb=b.t||b.ts||Date.parse(b.date)||0;
      return ta-tb;
    }):[];
    var closes=hist.map(function(d){return d.close;});
    var hasSMA200=closes.length>=200;
    // Status label
    var statusEl=document.getElementById('spy-mini-status');
    if(statusEl){
      if(!closes.length){statusEl.textContent='No se pudo cargar el contexto SPY.';}
      else if(!hasSMA200){statusEl.textContent='SMA200 no disponible — datos insuficientes.';}
      else{statusEl.textContent=closes[closes.length-1]>=regime.sma200?'SPY sobre SMA200':'SPY bajo SMA200';}
    }
    if(!hasSMA200||!closes.length) return;
    // Compute full SMA200 array (only real 200-period values — no Math.min shortcut)
    var smaArr=[];
    for(var i=0;i<closes.length;i++){
      if(i<199){smaArr.push(null);}
      else{var sum=0;for(var j=i-199;j<=i;j++) sum+=closes[j];smaArr.push(sum/200);}
    }
    // Size canvas for retina
    var dpr=window.devicePixelRatio||1;
    var W=canvas.offsetWidth||canvas.parentElement.offsetWidth||300;
    var H=76;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.scale(dpr,dpr);
    // Price range across both series
    var validSma=smaArr.filter(function(v){return v!=null;});
    var allV=closes.concat(validSma);
    var minP=Math.min.apply(null,allV), maxP=Math.max.apply(null,allV);
    var rng=maxP-minP||1;
    function xOf(i){return 1+(W-2)*(i/(closes.length-1));}
    function yOf(v){return H-4-(H-8)*((v-minP)/rng);}
    // SMA200 line
    ctx.beginPath(); ctx.strokeStyle=regime.color||'#f59e0b'; ctx.lineWidth=1.5;
    var firstSma=true;
    smaArr.forEach(function(v,i){
      if(v==null) return;
      if(firstSma){ctx.moveTo(xOf(i),yOf(v));firstSma=false;}else ctx.lineTo(xOf(i),yOf(v));
    });
    ctx.stroke();
    // SPY price line
    ctx.beginPath(); ctx.strokeStyle='rgba(226,232,240,.85)'; ctx.lineWidth=1.5;
    closes.forEach(function(v,i){if(i===0)ctx.moveTo(xOf(i),yOf(v));else ctx.lineTo(xOf(i),yOf(v));});
    ctx.stroke();
    // Current price dot
    var lx=xOf(closes.length-1),ly=yOf(closes[closes.length-1]);
    ctx.beginPath(); ctx.arc(lx,ly,3,0,Math.PI*2); ctx.fillStyle='rgba(226,232,240,.9)'; ctx.fill();
  }catch(e){
    var fb=document.getElementById('spy-mini-fallback');
    if(fb) fb.style.display='block';
    var mc=document.getElementById('spy-mini-chart');
    if(mc) mc.style.display='none';
  }
}

// ── ALL_SIG DINAMICO ─────────────────────────────────────────────
// ALL_SIG nacio como array estatico: 20 tickers con sig y sc escritos a mano
// que nunca se recalculaban. Convivia con deScoreTicker, el motor real, asi que
// el MISMO ticker podia mostrar 89 en Senales y otro numero en Screener sin que
// nada lo explicara. Esto lo unifica: un solo motor para toda la app.
// Coste acotado: fetchHistory ya cachea en localStorage y deScoreTicker tiene
// DE_CACHE con 30 min de TTL, asi que 20 tickers no son 20 llamadas por carga.
var ALL_SIG_REAL=false;              // true cuando los scores vienen del motor
// _allSigLoading era un booleano simple: loadAllSigScores() solo se llamaba
// una vez (setTimeout de bootLiveData). Si esa unica pasada fallaba para
// TODOS los tickers (guardar quedaba vacio — ej. una interrupcion de red al
// cargar), ALL_SIG_REAL nunca pasaba a true y "Foco de hoy"/Senales/
// Indicadores quedaban en "Calculando señales técnicas…" el resto de la
// sesion, sin reintentar. createLoadGate reintenta solo tras un cooldown, y
// dashFocoCard/renderSig/renderInd ahora piden la carga ellos mismos si hace
// falta (ver allSigIsLoading()) en vez de depender de un solo disparo en boot.
var _allSigGate=createLoadGate(20000);
function allSigIsLoading(){ return _allSigGate.isLoading(); }
var ALL_SIG_TTL=30*60*1000;

function _allSigKey(){ return 'sig_scores_'+(S.user&&S.user.id||'demo'); }

function _allSigFromCache(){
  try{
    var raw=localStorage.getItem(_allSigKey());
    if(!raw) return false;
    var o=JSON.parse(raw);
    if(!o||!o.v||o.v<2||!o.ts||(Date.now()-o.ts)>ALL_SIG_TTL) return false;
    var n=0;
    ALL_SIG.forEach(function(x){
      var v=o.d[x.t];
      if(v){ x.sig=v.sig; x.rsi=v.rsi; n++; }
    });
    if(n>0){ ALL_SIG_REAL=true; return true; }
  }catch(e){}
  return false;
}

// Suma al universo los tickers de la watchlist y del portafolio, para que
// sus tablas muestren tendencia y RSI reales y no un "—".
function _allSigIncluirUniverso(){
  var add=function(t){ if(t&&!ALL_SIG.some(function(x){return x.t===t;})) ALL_SIG.push({t:t,sig:null,rsi:null}); };
  (S.watchlist||[]).forEach(function(w){ add(typeof w==='string'?w:(w&&w.ticker)); });
  (S.portfolio||[]).forEach(function(h){ if(h.type!=='Crypto') add(h.t); });
}

// I11: Panorama solo necesita lo que la persona sigue (portafolio + lista).
// El universo de referencia completo se calcula al entrar a Analizar.
var MINE_SIG_REAL=false, _mineSigLoading=false;
function _mineTickers(){
  var out=[];
  (S.portfolio||[]).forEach(function(h){ if(h.type!=='Crypto'&&out.indexOf(h.t)<0) out.push(h.t); });
  (S.watchlist||[]).forEach(function(t){ if(out.indexOf(t)<0) out.push(t); });
  return out;
}
async function loadMineSigScores(){
  if(_mineSigLoading||MINE_SIG_REAL||ALL_SIG_REAL) return;
  _mineSigLoading=true;
  try{
    _allSigIncluirUniverso();
    var ts=_mineTickers(), n=0;
    for(var i=0;i<ts.length;i++){
      try{
        var r=await deScoreTicker(ts[i]);
        var x=ALL_SIG.find(function(y){return y.t===ts[i];});
        if(r&&x){ x.sig=r.trend; x.rsi=r.rsi; n++; }
      }catch(e){}
    }
    if(n>0){ MINE_SIG_REAL=true; if(S.page==='dash'){ try{ renderMain(); }catch(e){} } }
  }finally{ _mineSigLoading=false; }
}
function isAnalizarPage(){ return ['sig','decision','ind','screener','comp'].indexOf(S.page)>=0; }

async function loadAllSigScores(force){
  _allSigIncluirUniverso();
  if(!force && _allSigFromCache()){ return; }
  try{
    await _allSigGate.run(async function(){
      var guardar={};
      for(var i=0;i<ALL_SIG.length;i++){
        var x=ALL_SIG[i];
        try{
          var r=await deScoreTicker(x.t);
          if(r){
            x.sig=r.trend; x.rsi=r.rsi;
            guardar[x.t]={sig:x.sig,rsi:x.rsi};
          }
        }catch(e){/* un ticker que falla no detiene al resto */}
      }
      if(!Object.keys(guardar).length){
        throw new Error('sin datos reales — reintentar');
      }
      ALL_SIG_REAL=true;
      try{ localStorage.setItem(_allSigKey(),JSON.stringify({v:2,ts:Date.now(),d:guardar})); }catch(e){}
      if(['sig','dash','ind','watch'].indexOf(S.page)>=0){ try{ renderMain(); }catch(e){} }
      return guardar;
    });
  }catch(e){/* cooldown o fallo real: el proximo render que necesite ALL_SIG_REAL reintenta */}
}

// Fase 3: UNA serie diaria de un año por ticker, compartida por las lecturas
// (Mi lista, ficha, Mercado) y el grafico de la ficha. Asi el RSI coincide en
// todas las vistas.
var _daily1y={};
function getDaily1y(ticker){
  var c=_daily1y[ticker];
  if(c&&c.data&&(Date.now()-c.ts)<DE_CACHE_TTL) return Promise.resolve(c.data);
  if(c&&c.p) return c.p;
  var p=fetchHistory(ticker,'1y').then(function(h){
    if(h&&h.length>5&&!h[0]._synthetic){ _daily1y[ticker]={data:h,ts:Date.now()}; return h; }
    delete _daily1y[ticker]; return h;
  }).catch(function(){ delete _daily1y[ticker]; return null; });
  _daily1y[ticker]={p:p,ts:Date.now()};
  return p;
}
// Relanzamiento v2 (T18): el motor ya no suma puntos en una nota de 0 a 100
// ni propone niveles de entrada/stop/objetivo. Calcula cada indicador con un
// año de historia y devuelve una lectura por indicador (app/lib/readings.js).
async function deScoreTicker(ticker){
  if(DE_CACHE.scores[ticker]&&(Date.now()-(DE_CACHE.scores[ticker]._ts||0))<DE_CACHE_TTL)return DE_CACHE.scores[ticker];
  var hist=await getDaily1y(ticker);
  if(!hist||hist.length<30)return null;
  var closes=hist.map(function(d){return d.close;});
  var highs=hist.map(function(d){return d.high;});
  var lows=hist.map(function(d){return d.low;});
  var vols=hist.map(function(d){return d.vol;});
  var last=closes[closes.length-1];

  var s50arr=TI.sma(closes,Math.min(50,closes.length));var s50v=s50arr[s50arr.length-1];
  var s200v=closes.length>=200?(function(){var a=TI.sma(closes,200);return a[a.length-1];}()):null;
  var rsi=lastRsi(closes,14);
  var macd=TI.macd(closes);var mhist=macd.hist;
  var mLast=mhist[mhist.length-1];var mPrev=mhist[mhist.length-2];
  var avgVol=vols.slice(-20).reduce(function(a,b){return a+b;},0)/20;
  var lastVol=vols[vols.length-1];
  var volRatio=avgVol>0?lastVol/avgVol:null;
  var atrArr=TI.atr(highs,lows,closes,14);var atr=atrArr[atrArr.length-1]||null;
  var high52=Math.max.apply(null,highs.slice(-Math.min(252,highs.length)));
  var low52=Math.min.apply(null,lows.slice(-Math.min(252,lows.length)).filter(function(v){return v>0;}));
  var sectorRS=null;
  try{ sectorRS=await deGetSectorRS(ticker); }catch(e){}

  var trend=classifyTrend(last,s50v,s200v);
  var readings=buildReadings({last:last,rsi:rsi,s50:s50v,s200:s200v,macdHist:mLast,macdPrev:mPrev,volRatio:volRatio,high52:high52,atr:atr});
  var result={ticker:ticker,last:last,rsi:isFinite(rsi)?Math.round(rsi):null,trend:trend,trendLabel:trendLabel(trend),
    readings:readings,sectorRS:sectorRS,atr:atr,s50v:s50v,s200v:s200v,high52:high52,low52:low52,
    macdHist:mLast,macdPrev:mPrev,volRatio:volRatio,_ts:Date.now()};
  DE_CACHE.scores[ticker]=result;
  return result;
}

  // Los filtros re-pintan al terminar una busqueda async: solo si la persona
  // sigue en Descubrir (antes pisaba #main en cualquier pantalla).
  if(S.page!=='screener') return;

// ── LISTA › MI LISTA (fase 3) ─────────────────────────────────────────
// Una tabla con las lecturas de cada activo que sigues. Todo sale de
// deScoreTicker (app/lib/readings.js + una sola serie diaria de un año por
// ticker, getDaily1y), la misma fuente que la ficha y Mercado.
var LI={loading:{},timer:null};
function liQueue(tickers){
  var pend=tickers.filter(function(t){var c=DE_CACHE.scores[t];return !c&&!LI.loading[t];});
  if(!pend.length) return;
  var idx=0;
  function next(){
    if(idx>=pend.length) return;
    var t=pend[idx++]; LI.loading[t]=true;
    deScoreTicker(t).catch(function(){return null;}).then(function(r){
      LI.loading[t]=false; if(!r) LI.loading[t]='fail';
      clearTimeout(LI.timer);
      LI.timer=setTimeout(function(){ if(S.page==='watch') renderMain(); },150);
      next();
    });
  }
  next(); next(); next();
}
function trendTag(code){
  if(!code) return '<span class="port-muted">—</span>';
  var ic=code==='UP'?'ind':code==='DOWN'?'trend-down':'sig';
  return '<span class="trend-tag t-'+code.toLowerCase()+'">'+icon(ic,'ico-inline')+trendLabel(code)+'</span>';
}
function rsiTxt(rsi){
  if(rsi==null||!isFinite(rsi)) return '<span class="port-muted">—</span>';
  var z=rsiZone(rsi);
  return '<span class="num">'+Math.round(rsi)+'</span> <span class="li-word">'+(z.key==='mid'?'neutral':z.key==='high'?'sobre 70':'bajo 30')+'</span>';
}
function macdTxt(h,prev){
  if(h==null||!isFinite(h)) return '<span class="port-muted">—</span>';
  var fuerza=(prev!=null&&isFinite(prev))?(Math.abs(h)>=Math.abs(prev)?'':' · pierde fuerza'):'';
  return '<span class="li-word">'+(h>=0?'Sobre cero':'Bajo cero')+fuerza+'</span>';
}
function volTxt(r){
  if(r==null||!isFinite(r)) return '<span class="port-muted">—</span>';
  var d=(r-1)*100;
  return '<span class="num">'+(d>=0?'+':'\u2212')+Math.abs(d).toFixed(0)+'\u00a0%</span>';
}
function rangeTxt(last,lo,hi){
  if(!(hi>lo)||!isFinite(last)) return '<span class="port-muted">—</span>';
  var p=Math.max(0,Math.min(1,(last-lo)/(hi-lo)));
  return '<span class="li-range" title="Mínimo '+fmtUSD(lo)+' · máximo '+fmtUSD(hi)+'"><i style="left:'+(p*100).toFixed(0)+'%"></i></span><span class="num li-rp">'+Math.round(p*100)+'\u00a0%</span>';
}
function alertsOf(t){ return (S.alerts||[]).filter(function(a){return a.asset===t;}); }
function bellCell(t,price){
  var al=alertsOf(t);
  if(al.length){
    var a=al[0];
    return '<button type="button" class="li-bell on" onclick="event.stopPropagation();setPage(\'alert\')" aria-label="Alerta de '+esc(t)+': '+(a.type==='Max'?'sube a ':'baja a ')+fmtUSD(a.trigger)+'. Ver alertas">'+
      icon('alert','ico-inline')+'<span class="num">'+(a.type==='Max'?'≥ ':'≤ ')+fmtUSD(a.trigger)+'</span>'+(al.length>1?'<span class="li-word"> +'+(al.length-1)+'</span>':'')+'</button>';
  }
  return '<button type="button" class="li-bell" onclick="event.stopPropagation();openModal(\'addalert\',{t:\''+esc(t)+'\',price:'+(price||0)+'})" aria-label="Crear alerta de '+esc(t)+'" title="Crear alerta">'+icon('alert','ico-inline')+'<span class="li-word">Crear</span></button>';
}
function liName(t){ var q=LIVE[t]; return TICKER_NAMES[t]||(q&&(q.name||q.shortName||q.longName))||''; }
function liSetFilter(f){ S.sigFilter=f; renderMain(); }
function renderWatch(){
  var main=document.getElementById('main');
  var wl=navWatchTickers();
  var head='<div class="fos-module-header"><div><div class="fos-module-sub">Los activos que sigues, con cada indicador por separado. Lecturas de datos históricos, no recomendaciones. <span class="fresh-m live-badge-wrap">'+liveBadge()+'</span></div></div></div>';
  var follow='<button type="button" class="btn-big" onclick="gsFocus()">'+icon('plus')+' Seguir un activo</button>';
  if(!wl.length){
    main.innerHTML=head+'<div class="port-wrap pv"><div class="mv-empty"><div class="mv-empty-i">'+icon('watch','ico-lg')+'</div>'+
      '<h2>Todavía no sigues ningún activo</h2>'+
      '<p>Busca un ticker o una empresa, abre su ficha y toca "Seguir". Aquí vas a ver su tendencia, RSI, MACD, volumen y en qué parte de su rango anual está, y podrás crearle una alerta.</p>'+
      follow+'</div></div>';
    return;
  }
  liQueue(wl);
  var rows=wl.map(function(t){
    var d=DE_CACHE.scores[t]||null, q=LIVE[t];
    var price=q&&q.price>0?q.price:(d?d.last:null);
    return {t:t,d:d,q:q,price:price,trend:d?d.trend:null};
  });
  var counts={ALL:rows.length,UP:0,MIX:0,DOWN:0};
  rows.forEach(function(r){ if(r.trend) counts[r.trend]++; });
  var f=['ALL','UP','MIX','DOWN'].indexOf(S.sigFilter)>=0?S.sigFilter:'ALL';
  var shown=f==='ALL'?rows:rows.filter(function(r){return r.trend===f;});
  var chips='<div class="li-chips" role="group" aria-label="Filtrar por tendencia">'+[['ALL','Todos'],['UP','Sobre sus medias'],['MIX','Tendencia mixta'],['DOWN','Bajo sus medias']].map(function(c){
    return '<button type="button" class="tab'+(f===c[0]?' act':'')+'" aria-pressed="'+(f===c[0])+'" onclick="liSetFilter(\''+c[0]+'\')">'+c[1]+' <span class="num">'+counts[c[0]]+'</span></button>';
  }).join('')+'</div>';
  function pending(r){ return LI.loading[r.t]===true||(!r.d&&LI.loading[r.t]!=='fail'); }
  var calc='<span class="port-muted">calculando…</span>', nod='<span class="port-muted">sin datos</span>';
  var trs=shown.map(function(r){
    var d=r.d, p=pending(r);
    var cell=function(html){ return d?html:(p?calc:nod); };
    return '<tr class="trow" onclick="navOpenTicker(\''+esc(r.t)+'\')">'+
      '<td class="port-asset"><button type="button" class="port-tk" onclick="event.stopPropagation();navOpenTicker(\''+esc(r.t)+'\')" aria-label="Abrir la ficha de '+esc(r.t)+'">'+esc(r.t)+'</button><span class="port-sub">'+esc(liName(r.t))+'</span></td>'+
      '<td class="num port-strong">'+(r.price?fmtUSD(r.price):'—')+'</td>'+
      '<td>'+chgCell(r.q)+'</td>'+
      '<td>'+cell(trendTag(d&&d.trend))+'</td>'+
      '<td>'+cell(rsiTxt(d&&d.rsi))+'</td>'+
      '<td>'+cell(macdTxt(d&&d.macdHist,d&&d.macdPrev))+'</td>'+
      '<td>'+cell(volTxt(d&&d.volRatio))+'</td>'+
      '<td>'+cell(rangeTxt(d&&d.last,d&&d.low52,d&&d.high52))+'</td>'+
      '<td>'+bellCell(r.t,r.price)+'</td>'+
      '<td><button type="button" class="btn port-ib" onclick="event.stopPropagation();rmWatch(\''+esc(r.t)+'\')" aria-label="Dejar de seguir '+esc(r.t)+'" title="Dejar de seguir">'+icon('close')+'</button></td></tr>';
  }).join('')||'<tr><td colspan="10" class="port-muted" style="padding:20px;text-align:center">Ningún activo de tu lista está en este grupo.</td></tr>';
  var table='<div class="tw li-tw"><table class="fos-table port-table li-table"><thead><tr>'+
    '<th>Activo</th><th>Precio</th><th>Hoy</th><th title="Precio frente a sus medias de 50 y 200 días">Tendencia</th><th title="RSI (14): entre 30 y 70 es zona neutral">RSI</th>'+
    '<th title="Histograma MACD (12, 26, 9)">MACD</th><th title="Volumen de hoy frente al promedio de 20 días">Volumen</th><th title="Dónde está el precio entre el mínimo y el máximo del último año">52 semanas</th><th>Alerta</th><th><span class="sr-only">Quitar</span></th></tr></thead><tbody>'+trs+'</tbody></table></div>';
  var stack='<ul class="port-stack li-stack">'+shown.map(function(r){
    var d=r.d, p=pending(r);
    return '<li class="ps-row">'+
      '<button type="button" class="ps-main" onclick="navOpenTicker(\''+esc(r.t)+'\')" aria-label="Abrir la ficha de '+esc(r.t)+'">'+
        '<span class="ps-l1"><span class="ps-t">'+esc(r.t)+'</span><span class="num">'+(r.price?fmtUSD(r.price):'—')+'</span>'+chgCell(r.q)+'</span>'+
        '<span class="ps-l2">'+(d?trendTag(d.trend)+'<span>RSI '+rsiTxt(d.rsi)+'</span>':(p?calc:nod))+'</span>'+
      '</button>'+bellCell(r.t,r.price)+'</li>';
  }).join('')+'</ul>';
  main.innerHTML=head+'<div class="port-wrap pv">'+
    '<div class="port-bar">'+follow+'</div>'+chips+table+stack+
    '<p class="port-muted">Indicadores con un año de cierres diarios. Toca un activo para ver su gráfico y cada lectura con su rango. Las alertas se guardan solo en este navegador.</p>'+
    '</div>';
}

// ── LISTA › ALERTAS ──
function renderAlert(){
  var plan=planOf();
  var rows=S.alerts.map(function(a){
    var cur=getLivePrice(a.asset);
    var tiene=isFinite(cur)&&cur>0;
    var hit=tiene&&(a.type==="Max"?cur>=a.trigger:cur<=a.trigger);
    var dist=tiene?(a.type==="Max"?(a.trigger-cur)/cur:(cur-a.trigger)/cur):null;
    return {id:a.id,asset:a.asset,type:a.type,trigger:a.trigger,cur:cur,tiene:tiene,hit:hit,dist:dist};
  });
  var hits=rows.filter(function(r){return r.hit;});
  var head='<div class="fos-module-header"><div><div class="fos-module-sub">Un aviso cuando un activo cruza el precio que definas</div></div></div>';
  var note='<p class="local-note" role="note"><b>Se guardan solo en este navegador.</b> No se sincronizan con tu cuenta ni con otros dispositivos, y se pierden si borras los datos del navegador. Se revisan cada 5 minutos mientras la app está abierta.</p>';
  var perm=('Notification' in window)?Notification.permission:'unsupported';
  var notif=perm==='default'
    ?'<div class="port-note"><p>Activa las notificaciones para recibir el aviso aunque estés en otra pestaña.</p><button type="button" class="btn" onclick="ensureNotifyPermission()">'+icon('alert')+' Activar notificaciones</button></div>'
    :perm==='denied'?'<p class="port-muted">Las notificaciones del navegador están bloqueadas: verás los avisos dentro de la app.</p>':'';
  var crear=(plan.maxA>=999||S.alerts.length<plan.maxA)?'<button type="button" class="btn-big" onclick="openModal(\'addalert\')">'+icon('plus')+' Nueva alerta</button>':'';
  if(!rows.length){
    document.getElementById('main').innerHTML=head+'<div class="port-wrap pv">'+note+
      '<div class="mv-empty"><div class="mv-empty-i">'+icon('alert','ico-lg')+'</div><h2>Todavía no tienes alertas</h2>'+
      '<p>Crea una para saber cuándo un activo sube o baja al precio que te interesa. También puedes crearla desde la campana de Mi lista o desde la ficha de un activo.</p>'+crear+'</div>'+notif+'</div>';
    return;
  }
  var trs=rows.map(function(r){
    return '<tr class="trow" onclick="navOpenTicker(\''+esc(r.asset)+'\')">'+
      '<td><button type="button" class="port-tk" onclick="event.stopPropagation();navOpenTicker(\''+esc(r.asset)+'\')">'+esc(r.asset)+'</button></td>'+
      '<td>'+(r.type==='Max'?'Sube a':'Baja a')+'</td>'+
      '<td class="num">'+fmtUSD(r.trigger)+'</td>'+
      '<td class="num port-strong">'+(r.tiene?fmtUSD(r.cur):'<span class="port-muted">sin precio</span>')+'</td>'+
      '<td class="num">'+(r.dist!=null&&!r.hit?fmtPctN(r.dist*100,1):'—')+'</td>'+
      '<td>'+(r.hit?warnTag('Alcanzada'):'<span class="li-word">'+icon('check','ico-inline')+' En seguimiento</span>')+'</td>'+
      '<td><button type="button" class="btn btn-r port-ib" onclick="event.stopPropagation();delAlert('+r.id+')" aria-label="Eliminar alerta de '+esc(r.asset)+'" title="Eliminar">'+icon('trash')+'</button></td></tr>';
  }).join('');
  var stack='<ul class="port-stack">'+rows.map(function(r){
    return '<li class="ps-row"><button type="button" class="ps-main" onclick="navOpenTicker(\''+esc(r.asset)+'\')">'+
      '<span class="ps-l1"><span class="ps-t">'+esc(r.asset)+'</span><span>'+(r.type==='Max'?'Sube a ':'Baja a ')+'<b class="num">'+fmtUSD(r.trigger)+'</b></span></span>'+
      '<span class="ps-l2"><span>Ahora <b class="num">'+(r.tiene?fmtUSD(r.cur):'sin precio')+'</b></span>'+(r.hit?warnTag('Alcanzada'):'<span>Falta <b class="num">'+(r.dist!=null?fmtPctN(r.dist*100,1):'—')+'</b></span>')+'</span></button>'+
      '<button type="button" class="btn btn-r port-ib" onclick="delAlert('+r.id+')" aria-label="Eliminar alerta de '+esc(r.asset)+'">'+icon('trash')+'</button></li>';
  }).join('')+'</ul>';
  document.getElementById('main').innerHTML=head+'<div class="port-wrap pv">'+
    '<section class="pband" aria-label="Resumen de alertas">'+
      movCell('En seguimiento',rows.length-hits.length,'')+movCell('Alcanzadas',hits.length,hits.length?'el precio ya cruzó tu nivel':'',hits.length?'neg':'')+
      movCell('Activos',Array.from(new Set(rows.map(function(r){return r.asset;}))).length,'')+movCell('Revisión','cada 5 min','mientras la app está abierta')+
    '</section>'+
    '<div class="port-bar">'+crear+'</div>'+note+notif+
    '<div class="tw li-tw"><table class="fos-table port-table"><thead><tr><th>Activo</th><th>Condición</th><th>Nivel</th><th>Precio ahora</th><th title="Cuánto falta para llegar al nivel">Falta</th><th>Estado</th><th><span class="sr-only">Eliminar</span></th></tr></thead><tbody>'+trs+'</tbody></table></div>'+stack+
    '</div>';
}

function scrPresetTickers(p){ return p[0]==='ref'?ALL_SIG.map(function(x){return x.t;}).join(' '):p[2]; }
function scrPreset(id){
  var p=SCR_PRESETS.find(function(x){return x[0]===id;}); if(!p) return;
  S.screenerPreset=id;
  S.screenerTickers=scrPresetTickers(p);
  var ta=document.getElementById('scr-tickers'); if(ta) ta.value=S.screenerTickers;
  screenerRun();
}
function screenerSetPreset(tickerStr){ S.screenerPreset=null; S.screenerTickers=tickerStr; screenerRun(); }
function scrReadInputs(){
  var ta=document.getElementById('scr-tickers'); if(ta) S.screenerTickers=ta.value.trim();
  S.screenerFilters.rsiMin=Math.max(0,parseInt((document.getElementById('scr-rsiMin')||{}).value||0)||0);
  var mx=parseInt((document.getElementById('scr-rsiMax')||{}).value||100); S.screenerFilters.rsiMax=isFinite(mx)?Math.min(100,mx):100;
  S.screenerFilters.action=(document.getElementById('scr-action')||{}).value||'ALL';
}
function screenerApplyFilters(){ scrReadInputs(); renderScreenerBody(); }
function scrRowFollow(t){ addWatch(t); renderScreenerBody(); }
function renderScreenerSection(){
  var f=S.screenerFilters, running=S.screenerRunning, results=S.screenerResults||[];
  var presets='<div class="li-chips" role="group" aria-label="Listas de ejemplo">'+SCR_PRESETS.map(function(p){
    var on=S.screenerPreset===p[0];
    return '<button type="button" class="tab'+(on?' act':'')+'" aria-pressed="'+on+'" onclick="scrPreset(\''+p[0]+'\')"'+(running?' disabled':'')+'>'+p[1]+'</button>';
  }).join('')+'</div>';
  var form='<div class="scr-form">'+
    '<label class="scr-f scr-tk"><span>Tickers, separados por espacio o coma</span><textarea id="scr-tickers" class="inp" rows="2" spellcheck="false" autocapitalize="characters">'+esc(S.screenerTickers||'')+'</textarea></label>'+
    '<label class="scr-f"><span>RSI mínimo</span><input id="scr-rsiMin" class="inp num" type="number" min="0" max="100" value="'+f.rsiMin+'"/></label>'+
    '<label class="scr-f"><span>RSI máximo</span><input id="scr-rsiMax" class="inp num" type="number" min="0" max="100" value="'+f.rsiMax+'"/></label>'+
    '<label class="scr-f"><span>Tendencia</span><select id="scr-action" class="inp">'+[['ALL','Todas'],['UP','Sobre sus medias'],['MIX','Tendencia mixta'],['DOWN','Bajo sus medias']].map(function(a){return '<option value="'+a[0]+'"'+(f.action===a[0]?' selected':'')+'>'+a[1]+'</option>';}).join('')+'</select></label>'+
    '<div class="scr-acts"><button type="button" class="btn-big" onclick="screenerRun()"'+(running?' disabled':'')+'>'+(running?'Analizando…':'Analizar')+'</button>'+
    '<button type="button" class="btn" onclick="screenerApplyFilters()"'+(results.length?'':' disabled')+'>Aplicar filtros</button></div></div>';
  var out='';
  if(running&&!results.length) out='<p class="port-muted"><span class="spin-sm"></span> Analizando '+(S.screenerTotal||'')+' activos…</p>';
  else if(!results.length) out='<p class="port-muted">Elige una lista de arriba o escribe tus tickers y toca Analizar.</p>';
  else {
    var ok=results.filter(function(r){return !r.error;});
    var errs=results.filter(function(r){return r.error;});
    var filt=ok.filter(function(r){
      if(r.rsi!=null&&(r.rsi<f.rsiMin||r.rsi>f.rsiMax)) return false;
      if(f.action!=='ALL'&&r.trend!==f.action) return false;
      return true;
    }).sort(function(a,b){return a.ticker<b.ticker?-1:1;});
    var trs=filt.map(function(s){
      var d200=s.s200v?(s.last-s.s200v)/s.s200v:null;
      var seguido=navWatchTickers().indexOf(s.ticker)>=0;
      return '<tr class="trow" onclick="openDrawer(\''+esc(s.ticker)+'\','+s.last+')">'+
        '<td class="port-asset"><button type="button" class="port-tk" onclick="event.stopPropagation();openDrawer(\''+esc(s.ticker)+'\','+s.last+')">'+esc(s.ticker)+'</button><span class="port-sub">'+esc(TICKER_NAMES[s.ticker]||'')+'</span></td>'+
        '<td class="num port-strong">'+fmtUSD(s.last)+'</td>'+
        '<td>'+trendTag(s.trend)+'</td><td>'+rsiTxt(s.rsi)+'</td>'+
        '<td class="num '+(d200==null?'':d200>=0?'pos':'neg')+'">'+(d200==null?'—':(d200>=0?'+':'\u2212')+Math.abs(d200*100).toFixed(1)+'\u00a0%')+'</td>'+
        '<td>'+macdTxt(s.macdHist,s.macdPrev)+'</td>'+
        '<td>'+(seguido?'<span class="li-word">'+icon('check','ico-inline')+' Siguiendo</span>':'<button type="button" class="btn scr-follow" onclick="event.stopPropagation();scrRowFollow(\''+esc(s.ticker)+'\')">'+icon('plus')+' Seguir</button>')+'</td></tr>';
    }).join('')||'<tr><td colspan="7" class="port-muted" style="padding:20px;text-align:center">Ningún resultado cumple los filtros.</td></tr>';
    out='<div class="scr-meta"><span>'+filt.length+(filt.length===1?' resultado':' resultados')+' de '+ok.length+' analizados'+(running?' · analizando '+(S.screenerTotal-results.length)+' más…':'')+'</span>'+
      '<button type="button" class="btn" onclick="exportScreenerCSV()">'+icon('download')+' Exportar CSV</button></div>'+
      '<div class="tw"><table class="fos-table port-table"><thead><tr><th>Activo</th><th>Precio</th><th>Tendencia</th><th>RSI</th><th title="Distancia a la media de 200 días">Frente a 200 días</th><th>MACD</th><th><span class="sr-only">Seguir</span></th></tr></thead><tbody>'+trs+'</tbody></table></div>'+
      (errs.length?'<p class="port-muted">Sin datos: '+errs.map(function(e){return esc(e.ticker)+' ('+esc(e.reason||'sin datos')+')';}).join(', ')+'</p>':'');
  }
  return '<div class="fos-module-header"><div><div class="fos-module-sub">Filtra activos por tendencia y RSI. Lecturas de datos históricos, no recomendaciones.</div></div></div>'+
    '<div class="port-wrap pv">'+presets+form+out+'</div>';
}
function screenerRun(){
  if(S.screenerRunning) return; // evita corridas simultaneas (filas duplicadas)
  scrReadInputs();
  var seen={}, list=String(S.screenerTickers||'').split(/[\s,]+/).map(function(t){return t.trim().toUpperCase();}).filter(function(t){ if(!t||seen[t]) return false; seen[t]=1; return true; });
  if(!list.length){ showToast('Escribe al menos un ticker','warning'); return; }
  var run=(S.screenerRunId||0)+1; S.screenerRunId=run;
  S.screenerResults=[]; S.screenerRunning=true; S.screenerTotal=list.length;
  renderScreenerBody();
  function timeout(ms){return new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);});}
  var idx=0, done=0;
  function push(r){ if(S.screenerRunId!==run) return; S.screenerResults.push(r); clearTimeout(S._scrT); S._scrT=setTimeout(renderScreenerBody,120); }
  function next(){
    if(idx>=list.length) return Promise.resolve();
    var t=list[idx++];
    return Promise.race([deScoreTicker(t),timeout(12000)]).then(function(r){
      push(r?r:{ticker:t,error:true,reason:'no encontrado o sin historia suficiente'});
    }).catch(function(err){
      push({ticker:t,error:true,reason:(err&&err.message==='timeout')?'tardó demasiado':'error al obtener datos'});
    }).then(next);
  }
  Promise.all([next(),next(),next(),next()]).then(function(){
    if(S.screenerRunId!==run) return;
    S.screenerRunning=false; renderScreenerBody();
  });
}

// Abre el Billing Portal de Stripe. El token va en el cuerpo; el servidor
// resuelve el customer_id del perfil, el cliente nunca lo maneja.
async function abrirPortalPago(){
  var btn=document.getElementById('btn-portal');
  if(btn){ btn.disabled=true; btn.textContent='Abriendo…'; }
  try{
    var sess=await sb.auth.getSession();
    var tok=sess&&sess.data&&sess.data.session&&sess.data.session.access_token;
    if(!tok){ showToast('Debes iniciar sesión','error'); return; }
    var res=await fetch('/api/billing-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})});
    var data=await res.json().catch(function(){return {};});
    if(res.ok&&data.url){ window.location.href=data.url; return; }
    showToast(data.error||'No se pudo abrir el portal de pago','error');
  }catch(e){ showToast('Error de conexión','error'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Gestionar o cancelar suscripción'; } }
}

// ── GLOBO DEL HERO ───────────────────────────────────────────────────────
// Globo de puntos dibujado en canvas 2D. Se implementa nativo en vez de
// instalar cobe desde un registro externo: este proyecto no tiene React ni
// build step, y el codigo del componente de aquel registro no es auditable
// sin cuenta. La malla se genera con espiral de Fibonacci (puntos repartidos
// uniformemente sobre la esfera, sin acumularse en los polos) y se rota sobre
// el eje Y; los puntos de la cara oculta se descartan por su normal.
var _globeRAF=null, _globeObs=null;
function globeBgStart(){
  var cv=document.getElementById('globe-bg');
  if(!cv) return;
  // Igual que el hero anterior: renderWelcome puede ejecutarse varias veces y
  // cada vez crea un canvas nuevo. Sin cancelar, el bucle viejo seguiria vivo
  // sobre un canvas desechado y bloquearia el arranque del nuevo.
  if(_globeRAF){ cancelAnimationFrame(_globeRAF); _globeRAF=null; }
  if(_globeObs){ try{ _globeObs.disconnect(); }catch(e){} _globeObs=null; }
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx=cv.getContext('2d'); if(!ctx) return;

  var N=2600, pts=[], phi=Math.PI*(3-Math.sqrt(5));
  for(var i=0;i<N;i++){
    var y=1-(i/(N-1))*2, r=Math.sqrt(Math.max(0,1-y*y)), th=phi*i;
    pts.push([Math.cos(th)*r, y, Math.sin(th)*r]);
  }

  var t=0, dpr=1, W=0, H=0, R=0;
  function medir(){
    var rc=cv.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1,rc.width); H=Math.max(1,rc.height);
    cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    R=Math.min(W,H)*0.42;
  }
  function tinte(){
    var cs=getComputedStyle(document.documentElement);
    return (cs.getPropertyValue('--grn')||'#d8c9a3').trim();
  }
  var col=tinte();

  function pinta(){
    ctx.clearRect(0,0,W,H);
    var cx=W/2, cy=H/2;
    var ct=Math.cos(t), st=Math.sin(t);
    // Inclinacion fija del eje: un globo perfectamente vertical lee como circulo
    var tilt=-0.38, ctl=Math.cos(tilt), stl=Math.sin(tilt);
    for(var i=0;i<N;i++){
      var p=pts[i];
      var x=p[0]*ct - p[2]*st;
      var z=p[0]*st + p[2]*ct;
      var y=p[1]*ctl - z*stl;
      z=p[1]*stl + z*ctl;
      if(z<0) continue;               // cara oculta
      var d=0.55+0.45*z;              // los puntos del frente pesan mas
      ctx.globalAlpha=d*d;
      ctx.fillStyle=col;
      var s=d*2.0;
      ctx.fillRect(cx+x*R-s/2, cy+y*R-s/2, s, s);
    }
    ctx.globalAlpha=1;
    t+=0.0022;
    _globeRAF=requestAnimationFrame(pinta);
  }
  function arranca(){ if(!_globeRAF){ col=tinte(); _globeRAF=requestAnimationFrame(pinta); } }
  function para(){ if(_globeRAF){ cancelAnimationFrame(_globeRAF); _globeRAF=null; } }

  medir();
  window.addEventListener('resize',medir,{passive:true});
  // No gastar bateria pintando lo que no se ve.
  try{
    _globeObs=new IntersectionObserver(function(e){ e[0].isIntersecting?arranca():para(); });
    _globeObs.observe(cv);
  }catch(e){ arranca(); }
  document.addEventListener('visibilitychange',function(){ document.hidden?para():arranca(); });
  arranca();
}

// ── DASHBOARD ──────────────────────────────────────────────────
// ── ÍNDICES ───────────────────────────────────────────────────────────────
// Extraida de mercadoHoyBody() para poder ubicarla junto a Top Señales y
// Portafolio en renderDash() (antes solo vivia en el rail de "Mercado hoy").
// Los valores de partida eran cifras reales de 2024 hardcodeadas (VIX 16.8,
// Bitcoin $97.400...). Como marketbar no devolvia VIX ni BTC, esos dos se
// mostraban con datos de hace mas de un ano SIN ninguna marca de que eran
// estaticos. Un dato viejo presentado como actual es peor que un hueco: ahora
// el valor arranca vacio y solo se rellena si llega de la API.
function indicesCard(){
  // Antes esta tarjeta dependia por completo de que mercadoHoyBody() se
  // renderizara despues en el mismo pase (mismo array MARKET_BAR) para
  // disparar el fetch — si algun dia se renderiza indicesCard() sola, se
  // quedaba en "sin dato" para siempre sin que nada la rellenara. Ahora pide
  // los datos ella misma si hace falta (fetchMarketBar ya es idempotente:
  // cache localStorage + createLoadGate evitan pedidos duplicados).
  if(!MARKET_BAR.length && !barIsLoading()){
    // Solo re-renderiza si fetchMarketBar trajo datos nuevos de verdad — si
    // no, un cooldown activo o _USE_EDGE=false resuelven "false" en cada
    // llamada y renderMain() se disparaba en loop apretado (bug real,
    // reproducido corriendo la app: ver historial de este archivo).
    fetchMarketBar().then(function(ok){ if(ok) renderMain(); }).catch(function(){});
  }
  var IDX_MAP={
    '^GSPC':  {n:'S&P 500',    v:null,c:null,up:null},
    '^IXIC':  {n:'NASDAQ',     v:null,c:null,up:null},
    '^DJI':   {n:'Dow 30',     v:null,c:null,up:null},
    '^VIX':   {n:'VIX',        v:null,c:null,up:null},
    'BTC-USD':{n:'Bitcoin USD',v:null,c:null,up:null}
  };
  if(MARKET_BAR.length){
    MARKET_BAR.forEach(function(b){
      if(!IDX_MAP[b.sym]||!isFinite(b.price)) return;
      var isUp=(b.changePct||0)>=0;
      var pct=(isUp?'+':'\u2212')+fmtD(Math.abs(b.changePct||0))+'\u00a0%';
      var val=b.sym==='BTC-USD'?'$'+fmt(b.price):b.sym==='^VIX'?fmtD(b.price):b.price>=1000?fmt(b.price):fmtD(b.price);
      IDX_MAP[b.sym]={n:IDX_MAP[b.sym].n,v:val,c:pct,up:isUp};
    });
  }
  var IDXS=[IDX_MAP['^GSPC'],IDX_MAP['^IXIC'],IDX_MAP['^DJI'],IDX_MAP['^VIX'],IDX_MAP['BTC-USD']];
  // "sin dato" antes era el unico estado posible cuando v es null, sin
  // distinguir "todavia no llego la respuesta" de "se intento y fallo". Ahora
  // que fetchMarketBar() reintenta solo (createLoadGate), vale la pena que la
  // UI lo refleje: "cargando…" mientras el fetch esta en vuelo.
  var idxPlaceholder=barIsLoading()?'cargando…':'sin dato';
  var idxRows=IDXS.map(function(x){
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">'+
      '<span style="font-size:11px;font-weight:600;color:var(--bright);font-family:\'IBM Plex Mono\',monospace">'+x.n+'</span>'+
      '<div style="display:flex;gap:8px;align-items:baseline">'+
      '<span style="font-size:11px;color:'+(x.v?'var(--bright)':'var(--text3)')+';font-family:\'IBM Plex Mono\',monospace">'+(x.v||idxPlaceholder)+'</span>'+
      (x.c?'<span style="font-size:11px;font-weight:700;font-family:\'IBM Plex Mono\',monospace;color:'+(x.up?'var(--pos)':'var(--neg)')+'">'+x.c+'</span>':'')+
      '</div></div>';
  }).join('');
  return '<div class="fos-card" style="overflow:hidden">'+
    '<div style="padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:space-between">'+
      '<h2 class="fos-section-label" style="margin:0">Índices</h2>'+
      '<span style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace" title="La fuente de índices no informa la hora de cada dato">Con retraso de la fuente</span>'+
    '</div>'+
    '<div style="padding:4px 14px 8px">'+idxRows+'</div>'+
  '</div>';
}
