// Vivia dentro de Contexto. Al consolidar Contexto en el Dashboard se extrae a
// funcion propia en vez de duplicar el widget en dos pantallas.
function moversCard(){
  var MOVERS=[
    {t:"NVDA",last:878,chg:1.4},{t:"AAPL",last:196.5,chg:3.1},
    {t:"GOOGL",last:191,chg:5.4},{t:"TSLA",last:247,chg:2.4},
    {t:"AMZN",last:199,chg:1.2},{t:"META",last:522,chg:-4.1}
  ];
  // Los precios de partida son de relleno; se sustituyen por LIVE cuando llega.
  // Se marca cuales siguen siendo de relleno para no presentarlos como actuales.
  var conDato=0;
  MOVERS.forEach(function(m){
    if(LIVE[m.t]){ m.last=LIVE[m.t].price; m.chg=(LIVE[m.t].changePct||0)*100; m.live=true; conDato++; }
  });
  var upd=liveUpdated?('Yahoo Finance · '+timeAgo(liveUpdated)):'Cargando…';
  var filas=MOVERS.map(function(m){
    var pos=m.chg>=0;
    return '<div role="button" tabindex="0" onclick="openDrawer(\''+m.t+'\','+m.last+')" style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);cursor:pointer">'+
      '<span style="font-size:12px;font-weight:700;color:var(--bright);flex:1;font-family:\'IBM Plex Mono\',monospace">'+m.t+'</span>'+
      (m.live
        ? '<span style="font-size:11px;color:var(--text);font-family:\'IBM Plex Mono\',monospace;width:60px;text-align:right">'+m.last.toFixed(2)+'</span>'+
          '<span style="font-size:11px;font-weight:700;font-family:\'IBM Plex Mono\',monospace;width:56px;text-align:right;color:'+(pos?'var(--pos)':'var(--neg)')+'">'+(pos?'+':'')+m.chg.toFixed(2)+'%</span>'
        : '<span style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace;width:116px;text-align:right">sin dato</span>')+
      '</div>';
  }).join('');
  // flex:1: es la ultima tarjeta del rail de contexto en el grid de Panorama
  // (junto a Top Señales/Portafolio y las noticias) — sin esto, si esa fila
  // termina mas abajo por las otras columnas, el rail queda corto y deja un
  // hueco de fondo de pagina debajo. Con flex:1 absorbe ese sobrante.
  return '<div class="cb" style="padding:0;overflow:hidden;flex:1">'+
    '<div style="padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card2);display:flex;justify-content:space-between;align-items:center">'+
      '<h2 class="fos-section-label" style="margin:0">Mayores movimientos</h2>'+
      '<span style="font-size:11px;color:var(--text3);font-family:\'IBM Plex Mono\',monospace">'+(conDato?upd:'sin datos en vivo')+'</span>'+
    '</div>'+filas+'</div>';
}

// "Foco de hoy": tarjeta decision-first al tope del dashboard. Surface, desde
// datos REALES (ALL_SIG del motor + watchlist + portafolio), 1-2 cosas concretas
// para revisar hoy. Solo usa señales cuando el scoring real ya corrio
// (ALL_SIG_REAL); si no, muestra un estado de carga. Encuadre educativo: son
// señales técnicas "para revisar", no recomendaciones de compra/venta.
function dashFocoCard(port){
  // Relanzamiento v2: antes listaba "candidatos" con señal alcista en la
  // watchlist (para comprar) y bajista en el portafolio (para vender). Ahora
  // solo describe datos de lo que la persona ya sigue, sin sugerir operaciones.
  if(!ALL_SIG_REAL && !MINE_SIG_REAL){
    loadMineSigScores().catch(function(){});
  }
  var inPort={}; (port||[]).forEach(function(h){inPort[h.t]=true;});
  var wl=S.watchlist||[];
  var bajo=[], extremos=[];
  if(ALL_SIG_REAL||MINE_SIG_REAL){
    ALL_SIG.forEach(function(s){
      var mio=inPort[s.t]||wl.indexOf(s.t)>=0;
      if(!mio) return;
      if(inPort[s.t]&&s.sig==='DOWN') bajo.push(s);
      if(s.rsi!=null&&(s.rsi>=70||s.rsi<=30)) extremos.push(s);
    });
  }
  function tkChips(arr,conRsi){
    return arr.slice(0,6).map(function(s){
      return '<button class="btn" style="font-size:11px;padding:3px 9px" onclick="openDrawer(\''+s.t+'\','+getLivePrice(s.t)+')">'+s.t+(conRsi?' · RSI '+s.rsi:'')+'</button>';
    }).join('');

var _CCY_BY_REGION={CL:'CLP',MX:'MXN',CO:'COP',AR:'ARS',PE:'PEN'};
function localCcy(){
  if(USER_CURRENCY&&USER_CURRENCY!=='USD') return USER_CURRENCY;
  var m=/-([A-Z]{2})$/i.exec(LOC); var c=m&&_CCY_BY_REGION[m[1].toUpperCase()];
  return c||null;
}
function fxIn(usd,ccy){
  var r=FX_RATES[ccy]; if(!r||!isFinite(usd)) return '';
  return (usd<0?'\u2212':'')+(FX_SYMBOLS[ccy]||'$')+fmt(Math.round(Math.abs(usd*r)))+' '+ccy;
}
// Valor, Hoy y Total con precios en vivo. Hoy usa el cambio diario de cada
// cotización; las posiciones sin precio todavía no suman a "Hoy".
function dashTotals(port){
  var value=0,cost=0,day=0,priced=0;
  port.forEach(function(h){
    var lq=LIVE[h.t];
    var px=lq&&lq.price>0?lq.price:null;
    cost+=h.sh*h.cost;
    value+=h.sh*(px||h.cost);
    if(px){ priced++; var cp=lq.changePct||0; var prev=px/(1+cp); day+=h.sh*(px-prev); }
  });
  return {value:value,cost:cost,total:value-cost,totalPct:cost>0?(value-cost)/cost:0,day:day,dayPct:(value-day)>0?day/(value-day):0,priced:priced,missing:port.length-priced};
}
function dashRiskCard(port){
  var lim=riskConcentrationLimit();
  var real=HOLDINGS_STOP===true;
  var rows=port.map(function(h){ return {t:h.t,sh:h.sh,cur:(LIVE[h.t]&&LIVE[h.t].price)||h.cur||h.cost,stop:h.stop}; });
  var rs=computeRiskAtStop(rows,S.capital>0?S.capital:0,lim,{estimateMissing:!real});
  var top=rs.rows.slice().sort(function(a,b){return b.weight-a.weight;})[0];
  var base=S.capital>0?'del capital':'del portafolio';
  return '<button class="m10-risk" onclick="setPage(\'risk\')" aria-label="Tu riesgo hoy: abrir Portafolio, Posiciones">'+
    '<div class="m10-h">Tu riesgo hoy</div>'+
    '<div class="m10-risk-v num">'+fmtUSD(-rs.totalRisk,0)+'<span>'+fmtPctN(rs.totalRiskPct*100,1)+' '+base+' si todos los stops se activan</span></div>'+
    '<ul class="m10-risk-l">'+
    (real
      ?'<li>'+(rs.noStopCount?rs.noStopCount+(rs.noStopCount===1?' posición sin stop: no se cuenta en este total':' posiciones sin stop: no se cuentan en este total'):'Todas tus posiciones tienen stop')+'</li>'
      :'<li>Sin stops guardados: se estima con −8 % bajo el precio de cada posición</li>')+
    (top?'<li>Mayor peso: <b>'+esc(top.t)+'</b> con '+fmtPctN(top.weight*100,0)+(top.overLimit?' · supera tu límite de '+fmtPctN(lim*100,0):'')+'</li>':'')+
    '</ul><span class="m10-link">Ver en Posiciones</span></button>';
}

var FOS_AI_HABILITADA = false;

// Revertir al layout anterior: localStorage.setItem('fos_port_kpi_v1','1')

// Superficie asesora embebida: sugerencia de rebalanceo dentro de la vista de
// Portfolio (no en una pagina estatica aparte). Solo aparece si el usuario fijo
// objetivos de verdad — sin objetivos guardados el rebalanceo por defecto iguala
// el peso actual (desvio cero) y la sugerencia seria ruido. Umbral 2% para no
// alertar por micro-desvios.
function portRebalHint(port,totM){
  if(!port||!port.length||!(totM>0)) return '';
  if(!Object.keys((REBAL&&REBAL.targets)||{}).length){ try{rebalLoadTargets();}catch(e){} }
  var targets=(REBAL&&REBAL.targets)||{};
  if(!Object.keys(targets).length) return '';
  var drifts=[];
  port.forEach(function(h){
    var t=targets[h.t]; if(t==null) return;
    var cur=getLivePrice(h.t)||h.cur||0;
    var curW=h.sh*cur/totM*100;
    var diff=curW-t; // + sobre el objetivo, - bajo el objetivo
    if(Math.abs(diff)>=2) drifts.push({t:h.t,diff:diff});
  });
  if(!drifts.length) return ''; // alineado con los objetivos
  drifts.sort(function(a,b){return Math.abs(b.diff)-Math.abs(a.diff);});
  var top=drifts[0];
  // Fondo tenue completo, sin franja lateral. Lleva a Portafolio › Objetivos.
  return '<div class="port-note" role="note">'+statusDot('warn',12)+
    '<p><b>Fuera de tus objetivos:</b> '+drifts.length+(drifts.length!==1?' posiciones se desviaron':' posición se desvió')+
    ' más de 2 puntos. La mayor es '+esc(top.t)+' ('+(top.diff>0?'+':'−')+Math.abs(top.diff).toLocaleString(LOC,{maximumFractionDigits:1})+' puntos '+(top.diff>0?'sobre':'bajo')+' su objetivo).</p>'+
    '<button type="button" class="btn" onclick="setPage(\'rebal\')">Ver objetivos</button></div>';
}

// Una sola tabla con el riesgo al stop adentro (antes vivia en la pestaña
// Riesgo). Los montos se guardan en USD; el selector de moneda convierte
// todas las cifras de dinero de la banda y de la tabla.
var PORT={capEdit:false,editRow:null,divOpen:false,corrLoading:false};
var PORT_CCY=['USD','CLP','MXN','COP','ARS','PEN'];
function ccyRate(){ return FX_RATES[USER_CURRENCY]||1; }
// Dinero en la moneda elegida. dec: decimales (por defecto 2 en USD/MXN/PEN y
// 0 en CLP/COP/ARS). signed: antepone + a los positivos.
function money(usd,dec,signed){
  if(usd==null||!isFinite(usd)) return '—';
  var c=USER_CURRENCY, v=usd*ccyRate();
  if(dec==null) dec=(c==='CLP'||c==='COP'||c==='ARS')?0:2;
  if(c==='CLP'||c==='COP'||c==='ARS') dec=0;
  var s=Math.abs(v).toLocaleString(LOC,{minimumFractionDigits:dec,maximumFractionDigits:dec});
  var sym=FX_SYMBOLS[c]||'$';
  return (v<0?'−':(signed&&v>0?'+':''))+sym+s;
}
function ccyNote(){
  if(USER_CURRENCY==='USD') return '';
  return '<p class="port-ccy-note">Cifras en '+USER_CURRENCY+' · 1 USD = '+fmt(ccyRate())+' '+USER_CURRENCY+' · tus montos se guardan en USD</p>';
}
function portIsCrypto(h){ return h.type==='Crypto'||/-USD$/.test(String(h.t||'')); }
function portTypeLabel(t){ return {Stock:'Acción',ETF:'ETF',Crypto:'Cripto'}[t]||t||''; }
function portCapSave(){

function portAddMenu(open){
  var m=document.getElementById('port-add-menu'), b=document.getElementById('port-add-btn'); if(!m||!b) return;

  m.hidden=!o; b.setAttribute('aria-expanded',String(o));

}
function portAddKey(e){
  var its=Array.prototype.slice.call(document.querySelectorAll('#port-add-menu [role=menuitem]'));
  var i=its.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){ e.preventDefault(); its[(i+1)%its.length].focus(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); its[(i<=0?its.length:i)-1].focus(); }
  else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); portAddMenu(false); var b=document.getElementById('port-add-btn'); if(b) b.focus(); }
  else if(e.key==='Tab'){ portAddMenu(false); }

async function portLoadCorr(){
  var port=S.portfolio.slice(0,planOf().maxT);
  if(port.length<2||PORT.corrLoading) return;
  var tickers=port.map(function(h){return h.t;}).slice(0,8);
  if(tickers.every(function(t){return dHistCache[t+'_60']&&dHistCache[t+'_60'].length>5;})) return;
  PORT.corrLoading=true;
  await Promise.all(tickers.map(async function(t){
    var k=t+'_60';
    if(!dHistCache[k]){
      try{ var h=await fetchHistory(t,'2mo'); if(h&&h.length>5) dHistCache[k]=h; }catch(e){}
    }
  }));
  PORT.corrLoading=false;
  PORT.corrTried=true;
  if(S.page==='port') renderMain();
}
function portDiversificacion(port){
  var corr;
  if(port.length<2) corr='<p class="port-muted">La correlación necesita al menos dos posiciones.</p>';
  else {
    var tickers=port.map(function(h){return h.t;}).slice(0,8);
    var loaded=tickers.every(function(t){return dHistCache[t+'_60']&&dHistCache[t+'_60'].length>5;});
    if(loaded) corr=renderCorrelationMatrix(port);
    else if(PORT.corrTried&&!PORT.corrLoading) corr='<p class="port-muted">No se pudo cargar la historia de precios para calcular la correlación. <button type="button" class="linkbtn" onclick="PORT.corrTried=false;portLoadCorr()">Reintentar</button></p>';
    else corr='<p class="port-muted"><span class="spin-sm"></span> Calculando la correlación con dos meses de cierres…</p>';
  }
  return '<details class="port-div"'+(PORT.divOpen?' open':'')+' ontoggle="portDivToggle(this)">'+
    '<summary>Diversificación</summary>'+
    '<div class="port-div-b">'+dashAllocBar(port)+
    '<h3 class="port-h3">Correlación entre tus posiciones</h3>'+
    '<p class="port-muted">Cómo se movieron juntos sus precios en los últimos dos meses: 1 es igual, 0 es independiente, −1 es opuesto.</p>'+corr+
    '</div></details>';
}

function renderPort(){
  var plan=planOf();
  if(!S.portfolio.length){
    document.getElementById("main").innerHTML=seedCleanupBanner()+firstRunEmpty();
    return;
  }
  var port=S.portfolio.slice(0,plan.maxT);
  port.forEach(function(h){h.cur=LIVE[h.t]?LIVE[h.t].price:(h.cur||h.cost);});
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var totP=totM-totC;
  var cap=S.capital>0?S.capital:0;
  var lim=riskConcentrationLimit();
  var realStops=HOLDINGS_STOP===true;
  var rs=computeRiskAtStop(port.map(function(h){return {t:h.t,sh:h.sh,cur:h.cur,stop:h.stop};}),cap,lim,{estimateMissing:!realStops});
  var mayor=rs.rows.slice().sort(function(a,b){return b.weight-a.weight;})[0];
  var mayorH=mayor&&port.find(function(h){return h.t===mayor.t;});
  var alt=(mayor&&mayor.overLimit&&mayorH)?concentrationAlternative(mayorH.cur,mayorH.sh,totM,lim):null;
  var rate=ccyRate();

  // ── Banda de resumen ──

    ?'≈ $'+fmt(Math.round(totM*(FX_RATES.CLP||0)))+' CLP'
    :'≈ '+fmtUSD(totM,0)+' USD';
  var riskSub=rs.rows.length
    ?fmtPctN(rs.totalRiskPct*100,1)+(cap>0?' del capital':' del portafolio')+
      (realStops
        ?(rs.noStopCount?' · '+rs.noStopCount+(rs.noStopCount===1?' posición sin stop, no suma':' posiciones sin stop, no suman'):'')

    '<div class="pband-c"><div class="pband-l">Mayor peso</div><div class="pband-v">'+(mayor?esc(mayor.t)+' <span class="num">'+fmtPctN(mayor.weight*100,0)+'</span>':'—')+'</div>'+

  }

    var r=rsByT[h.t]||{};

// ── PORTAFOLIO › MOVIMIENTOS (ex Bitácora + Analizador de Bitácora) ──────
// Las operaciones se guardan en este navegador (persistTrades). El rendimiento
// junta lo que calculaban la Bitácora y el analizador del simulador: tasa de
// acierto, factor de beneficio, promedios, resultado medio, mayor caída y el
// detalle por activo.
function movStats(sells){
  var wins=sells.filter(function(t){return t.pnl>0;});
  var losses=sells.filter(function(t){return t.pnl<0;});
  var sumW=wins.reduce(function(s,t){return s+t.pnl;},0);
  var sumL=Math.abs(losses.reduce(function(s,t){return s+t.pnl;},0));
  var total=sells.reduce(function(s,t){return s+(t.pnl||0);},0);
  var sorted=sells.slice().sort(function(a,b){return (a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:a.id-b.id;});
  var cum=0,peak=0,maxDD=0;
  sorted.forEach(function(t){ cum+=(t.pnl||0); if(cum>peak) peak=cum; if(peak-cum>maxDD) maxDD=peak-cum; });
  var byT={};
  sells.forEach(function(t){
    var k=t.ticker||'—';
    if(!byT[k]) byT[k]={t:k,n:0,w:0,l:0,pnl:0};
    byT[k].n++; byT[k].pnl+=(t.pnl||0);
    if(t.pnl>0) byT[k].w++; else if(t.pnl<0) byT[k].l++;
  });
  return {
    n:sells.length, wins:wins.length, losses:losses.length,
    winRate:sells.length?wins.length/sells.length:null,
    profitFactor:(sumL>0&&wins.length)?sumW/sumL:null,
    avgWin:wins.length?sumW/wins.length:null,
    avgLoss:losses.length?sumL/losses.length:null,
    avgPerTrade:sells.length?total/sells.length:null,
    maxDD:maxDD, total:total,
    byTicker:Object.keys(byT).map(function(k){return byT[k];}).sort(function(a,b){return b.pnl-a.pnl;})
  };
}

// ── INVESTIGAR (combinado) ────────────────────────────────────────────────
// Watchlist, Screener y Comparador vivian como 3 paginas separadas que se
// pisaban entre si en #main — Walter pidio verlas las 3 sin click extra.
// Probamos apiladas (3 filas) y las 3 en columnas (3 lado a lado) antes de
// esta: Walter termino pidiendo el hibrido — Watchlist y Comparador arriba,
// lado a lado (2 columnas verticales), Screener abajo ocupando todo el ancho
// (1 fila horizontal). Screener es la mas ancha de las 3 (tabla de 10
// columnas + textarea de tickers), asi que es la que mejor entra full-width
// en vez de compartir columna. Comparador (grid interno 220px+520px de
// grafico) sigue con su propio overflow-x:auto por si a un ancho de columna
// angosto igual no entra completo.
// S.page sigue siendo 'watch'/'screener'/'comp' (nav, deep links, locks de
// plan por seccion) — solo cambia CUAL de las 3 se autoscrollea al entrar.
var _invLastFocus=null;
function renderInvestigar(focus){
  focus = (focus==='screener'||focus==='comp')?focus:'watch';
  var jumpBtn=function(id,label){
    return '<button class="btn" style="font-size:11px" onclick="document.getElementById(\'inv-'+id+'\').scrollIntoView({behavior:\'smooth\',block:\'start\',inline:\'nearest\'})">'+label+'</button>';
  };
  document.getElementById('main').innerHTML=
    '<div class="fos-module-header"><div><div class="fos-module-crumb">Investigar</div><h1 class="fos-module-title">Investigar</h1><div class="fos-module-sub">Lista de seguimiento, buscador y comparador en una sola pantalla</div></div><div class="ph-right">'+
      jumpBtn('watch','Lista')+' '+jumpBtn('screener','Buscador')+' '+jumpBtn('comp','Comparador')+
    '</div></div>'+
    // align-items:start (no el stretch por default de grid): Watchlist y
    // Comparador tienen alturas muy distintas entre si (la Watchlist crece
    // con la cantidad de tickers, el Comparador tiene una altura casi fija)
    // — stretch dejaria un hueco de fondo de pagina debajo del mas corto,
    // como paso en Panorama antes de agregarle flex:1 a proposito alli.
    '<div class="resp2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:16px">'+
      '<div id="inv-watch">'+renderWatchSection()+'</div>'+
      '<div id="inv-comp" style="overflow-x:auto">'+renderCompSection()+'</div>'+
    '</div>'+
    '<div id="inv-screener">'+renderScreenerSection()+'</div>';

  investigarWatchPostRender();

  // Solo autoscrollea en la entrada real a esa seccion (S.page cambio hacia
  // ella) — sin este chequeo, cada re-render interno disparado por el propio
  // Screener/Comparador (tipear un ticker, aplicar filtros, compLoad) volvia
  // a saltar el scroll y le tironeaba la pantalla al usuario a mitad de uso.
  if(focus!=='watch' && focus!==_invLastFocus){
    var el=document.getElementById('inv-'+focus);
    if(el) setTimeout(function(){ el.scrollIntoView({behavior:'smooth',block:'start',inline:'nearest'}); },30);
  }
  _invLastFocus=focus;
}

// Watchlist ahora se ve siempre en las 3 sub-paginas de Investigar (ver
// renderInvestigar): un re-render debe dispararse desde cualquiera de las
// tres, no solo desde 'watch' — antes de renderInvestigar cada una vivia
// aislada y este chequeo bastaba con 'watch'.
function isInvestigarPage(p){ p=p||S.page; return p==='watch'||p==='screener'||p==='comp'; }
function addWatch(t){
  if(S.watchlist.indexOf(t)<0){
    S.watchlist.push(t);persist();
    sbAddWatch(t);
    showToast(t+' agregado a tu lista');
    if(isInvestigarPage()) renderMain();
  }
}
// Pasa por addWatch: antes empujaba el ticker solo en memoria y no lo
// guardaba en Supabase (al recargar desaparecia).
function addCustomW(){var t=(document.getElementById("wc").value||"").toUpperCase().trim();if(t.length>=1&&t.length<=6&&S.watchlist.indexOf(t)<0){addWatch(t);}}
function rmWatch(t){
  // A diferencia de borrar una posicion del portfolio (que pide confirmacion),
  // sacar un ticker de la watchlist es reversible al toque: se puede deshacer
  // desde el propio toast en vez de interrumpir con un modal.
  var idx=S.watchlist.indexOf(t);
  S.watchlist=S.watchlist.filter(function(x){return x!==t;});
  persist();
  sbRmWatch(t);
  showToast(t+' quitado de tu lista','warning',function(){
    if(S.watchlist.indexOf(t)<0){
      S.watchlist.splice(Math.min(idx,S.watchlist.length),0,t);
      persist();
      sbAddWatch(t);
      showToast(t+' restaurado');
      if(isInvestigarPage()) renderMain();
    }
  });
  if(isInvestigarPage()) renderMain();
}

var LIVE_NEWS=[];

// ── MARKET BAR ─────────────────────────────────────────────────
// _barFetched pasó de booleano "ya lo intenté" a createLoadGate() el
// 13-sep-2026: la version vieja marcaba _barFetched=true tambien dentro del
// catch(e) de fallo, asi que un solo timeout de /api/marketbar dejaba los
// indices (S&P/Dow/Nasdaq/VIX/Bitcoin) en "sin dato" para el resto de la
// sesion, sin reintentar nunca — bug confirmado navegando: a veces cargaban,
// a veces se quedaban pegados. El gate reintenta solo despues de 20s si el
// intento anterior fallo, en vez de rendirse para siempre.
var MARKET_BAR=[];
var _barGate=createLoadGate(20000);
function barIsLoading(){ return _barGate.isLoading(); }

// Devuelve true solo si MARKET_BAR quedo con datos nuevos (cache valida o
// fetch exitoso) — false en cualquier otro caso (cooldown, _USE_EDGE=false,
// fallo de red). Antes esta funcion siempre "resolvia" (nunca rechazaba al
// caller, tragaba sus propios errores) y mercadoHoyBody() llamaba
// renderMain() en el .then() incondicionalmente — eso recreaba el mismo
// "render -> pedir datos -> settle casi instantaneo -> renderMain -> render
// de nuevo" en bucle apretado cada vez que la respuesta no tenia datos
// (cooldown activo o _USE_EDGE=false), sin importar que el gate ya evitara
// llamadas de red repetidas. El valor de retorno le permite al caller no
// volver a renderizar cuando no hubo nada nuevo que mostrar.
async function fetchMarketBar(){
  try{
    var cached=JSON.parse(localStorage.getItem('mv_market_bar')||'null');
    if(cached&&(Date.now()-cached.ts)<3*60*1000&&cached.items&&cached.items.length){
      MARKET_BAR=cached.items;return true;
    }
  }catch(e){/* silent */}
  try{
    await _barGate.run(async function(){
      // _USE_EDGE=false (dominio sin funciones edge, ej. localhost o un
      // preview fuera de la lista) tiene que pasar por el gate igual que un
      // fallo de red real — si no, _barGate.isLoading() nunca refleja nada
      // y el caller reintenta en cada render (ver nota de retorno arriba).
      if(!_USE_EDGE) throw new Error('edge_unavailable');
      var res=await fetchWithTimeout('/api/marketbar',7000);
      if(!res.ok) throw new Error('marketbar '+res.status);
      var data=await res.json();
      if(data.items&&data.items.length){
        MARKET_BAR=data.items;
        localStorage.setItem('mv_market_bar',JSON.stringify({ts:Date.now(),items:MARKET_BAR}));
      }
      return data;
    });
    return MARKET_BAR.length>0;
  }catch(e){
    if(e&&e.message!=='cooldown'&&e.message!=='edge_unavailable') trackError('marketbar',e);
    return false;
  }
}

// _newsFetched: mismo fix que _barGate arriba — antes era una bandera que se
// marcaba true tambien en el catch(e) de fallo, dejando el feed de noticias
// (y por eso tambien MARKET_BAR, ver mercadoHoyBody) sin reintentar nunca
// mas tras un solo error de red.
var _newsGate=createLoadGate(20000);
function newsIsLoading(){ return _newsGate.isLoading(); }

// Mismo contrato de retorno que fetchMarketBar (ver su comentario): true
// solo si LIVE_NEWS quedo con datos nuevos, false en cooldown/fallo/
// _USE_EDGE=false — para que el caller no re-renderice sin necesidad.
async function fetchLiveNews(){
  // Check localStorage cache first (15 min TTL)
  try{
    var cached=JSON.parse(localStorage.getItem('mv_live_news')||'null');
    if(cached&&(Date.now()-cached.ts)<15*60*1000&&cached.items.length){
      LIVE_NEWS=cached.items;return true;
    }
  }catch(e){/* silent */}
  try{
    await _newsGate.run(async function(){
      if(!_USE_EDGE) throw new Error('edge_unavailable');
      var tickers=['SPY','QQQ','NVDA','AAPL','AMZN','META','MSFT','GLD','BTC-USD'];
      S.portfolio.slice(0,5).forEach(function(h){if(tickers.indexOf(h.t)<0)tickers.unshift(h.t);});
      var res=await fetchWithTimeout('/api/news?tickers='+tickers.slice(0,12).join(','),8000);
      if(!res.ok) throw new Error('news api '+res.status);
      var data=await res.json();
      if(data.items&&data.items.length){
        LIVE_NEWS=data.items;
        localStorage.setItem('mv_live_news',JSON.stringify({ts:Date.now(),items:LIVE_NEWS}));
      }
      return data;
    });
    return LIVE_NEWS.length>0;
  }catch(e){
    if(e&&e.message!=='cooldown'&&e.message!=='edge_unavailable') trackError('news',e);
    return false;
  }
}

function getNewsData(){
  // Solo noticias en vivo. Ya no se anexa NEWS_DATA (era ficticio): si el feed
  // no responde se devuelve [] y la vista muestra un empty state honesto.
  return LIVE_NEWS.length?LIVE_NEWS.slice():[];
}

// ── TIMESTAMP HELPERS ──────────────────────────────────────────
function relTime(hoursAgo){
  if(hoursAgo<1) return 'hace '+Math.round(hoursAgo*60)+'m';
  if(hoursAgo<24) return 'hace '+Math.round(hoursAgo)+'h';
  if(hoursAgo<48) return 'hace 1 día';
  return 'hace '+Math.round(hoursAgo/24)+' días';
}

function saveNewsCache(data){
  try{localStorage.setItem('mv_news_cache',JSON.stringify({ts:Date.now(),data:data}));}catch(e){/* silent */}
}
function loadNewsCache(){
  try{
    var c=localStorage.getItem('mv_news_cache');
    if(!c) return null;
    var p=JSON.parse(c);
    // Valid for 2 hours
    if(Date.now()-p.ts < 2*60*60*1000) return p.data;
  }catch(e){/* silent */}
  return null;
}

// Antes era renderNews() (pagina Contexto propia). Ahora Contexto vive DENTRO
// del Dashboard como banda "Mercado hoy": esta funcion devuelve solo el cuerpo
// (filtros + feed + indices), sin el header de pagina, para que renderDash lo
// incruste. Sigue disparando la carga de noticias/indices en cada visita en
// la que no hay datos y no hay un intento en curso — antes solo se disparaba
// "en la primera visita" (banderas _newsFetched/_barFetched que quedaban en
// true para siempre tras un fallo, ver createLoadGate arriba). Ahora
// fetchLiveNews()/fetchMarketBar() son responsables de no repetir trabajo
// (cache localStorage + gate con cooldown) asi que es seguro pedirselos en
// cada render mientras no haya dato.
function mercadoHoyBody(){

  // datos nuevos — de lo contrario (cooldown, _USE_EDGE=false, fallo real)

  if(!LIVE_NEWS.length && !newsIsLoading()){
    fetchLiveNews().then(function(ok){ if(ok) renderMain(); }).catch(function(){});
  }
  if(!MARKET_BAR.length && !barIsLoading()){
    fetchMarketBar().then(function(ok){ if(ok) renderMain(); }).catch(function(){});
  }
  _newsFetched=true; // solo controla el copy "Cargando…" vs "Reintentando…" abajo

  function newsDomain(link){
    try{return new URL(link).hostname.replace('www.','');}catch(e){return '';}
  }
  function newsFavicon(link,sz){
    var d=newsDomain(link);
    return d?'https://www.google.com/s2/favicons?domain='+d+'&sz='+(sz||32):'';
  }
  var catEmoji={Fed:'bank',Earnings:'sig',Geopolítica:'macro',Macro:'ind','IA & Tech':'robot'};
  var catGrad={
    Fed:'linear-gradient(160deg,#1a0a2e,#2d1060)',

    Geopolítica:'linear-gradient(160deg,#2a0a0a,#3d1010)',

    'IA & Tech':'linear-gradient(160deg,#1a1200,#2d2000)'

  // ── Tag + impact styles ───────────────────────────────────────

    Fed:'background:rgba(139,92,246,.12);color:#a78bfa',
    Earnings:'background:rgba(38,166,91,.12);color:var(--grn)',
    Geopolítica:'background:rgba(232,65,66,.12);color:var(--red)',
    Macro:'background:rgba(61,142,248,.12);color:var(--blue)',
    'IA & Tech':'background:rgba(247,147,26,.12);color:var(--amber)'
  };

    if(sym==='BTC-USD') return '$'+Number(price).toLocaleString('en-US',{maximumFractionDigits:0});

    if(price>=100)   return Number(price).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    return Number(price).toFixed(2);
  }
  function fmtBarChg(change,changePct){
    if(change===null||change===undefined) return '';
    var sign=change>=0?'+':'';
    return sign+(typeof changePct==='number'?changePct.toFixed(2)+'%':change.toFixed(2));

// Las columnas RSI y SMA20 mostraban '—' hardcodeado: el calculo nunca se hizo.
// TI.rsi y _smaLast ya existian. Se carga bajo demanda con el mismo patron que
// loadCapitalData: cache por ticker, una pasada asincrona y re-render.
var IND_CACHE={};
var _indLoading=false;
// Cooldown de 20s tras un intento que no resolvio NINGUN ticker — mismo
// numero que _barGate/_newsGate/_allSigGate. Sin esto: renderInd() llama a
// loadIndData() al final de cada render; si fetchHistory falla para todo
// (red caida, rate limit), loadIndData() no cachea nada a proposito (para
// poder reintentar despues) y llamaba a renderInd() de nuevo al terminar —
// que volvia a llamar loadIndData() de nuevo, sin ninguna pausa entre
// intentos: un loop apretado de renderInd<->loadIndData sin fin, reproducido
// corriendo la app real (no hacia falta ni un fallo de red: local sin las
// funciones edge de Vercel ya lo disparaba). El cooldown no evita reintentar
// — solo evita que el reintento sea instantaneo.
var _indLastFailAt=0;
var IND_COOLDOWN_MS=20000;
async function loadIndData(){
  if(_indLoading) return;
  if(_indLastFailAt && (Date.now()-_indLastFailAt)<IND_COOLDOWN_MS) return;
  var tickers=S.portfolio.map(function(h){return h.t;});
  var pendientes=tickers.filter(function(t){return IND_CACHE[t]===undefined;});
  if(!pendientes.length) return;
  _indLoading=true;
  var algunoResuelto=false;
  for(var i=0;i<pendientes.length;i++){
    var t=pendientes[i];
    try{
      var hist=await fetchHistory(t,'6mo');
      var closes=(hist||[]).map(function(d){return d.close;}).filter(function(c){return c>0;});
      if(closes.length<21){ IND_CACHE[t]={rsi:null,sma20:null}; algunoResuelto=true; continue; }
      var rsiArr=TI.rsi(closes,14);
      var ultimoRsi=null;
      for(var k=rsiArr.length-1;k>=0;k--){ if(rsiArr[k]!=null){ ultimoRsi=rsiArr[k]; break; } }
      IND_CACHE[t]={rsi:ultimoRsi, sma20:_smaLast(closes,20)};
      algunoResuelto=true;
    }catch(e){
      // Antes esto tambien escribia IND_CACHE[t]={rsi:null,sma20:null} en el
      // catch, indistinguible del caso "no hay suficiente historia". Un
      // fallo transitorio de red (fetchHistory) quedaba entonces cacheado
      // para siempre como "sin dato" (columna quedaba en '—' o '…' sin
      // reintentar jamas al volver a la pantalla). No cachear nada en el
      // fallo: "pendientes" lo vuelve a intentar la proxima vez que se llame
      // loadIndData() (siguiente visita a Indicadores, o tras el cooldown).
    }
  }
  _indLoading=false;
  if(algunoResuelto){
    _indLastFailAt=0;
    if(S.page==='ind') renderInd();
  }else{
    // Nada resolvio: entra en cooldown y NO se re-renderiza a si misma — sin
    // esto, S.page==='ind' seguiria siendo true y renderInd() volveria a
    // llamar loadIndData() de inmediato, defeando el proposito del cooldown.
    _indLastFailAt=Date.now();
  }
}

async function riskSetStop(id,val){
  var h=S.portfolio.find(function(x){return x.id===id;});
  if(!h) return;
  var v=parseFloat(val);
  var prev=h.stop;
  h.stop=v>0?v:null;
  if(S.demoMode){ renderMain(); return; }
  var ok=await sbUpdateHolding(h);
  if(ok===false){ h.stop=prev; showToast('No se pudo guardar el stop. Revisa tu conexión.','error'); }
  else showToast(h.stop?'Stop de '+h.t+' guardado':'Stop de '+h.t+' quitado');
  renderMain();
}

function btRenderJournal(sells){
  if(!sells.length){
    return '<div class="cb" style="text-align:center;padding:40px 20px;color:var(--text3)">'+
      '<div style="width:32px;height:32px;margin:0 auto 12px">'+icon('clipboard','ico-lg')+'</div>'+
      '<div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:6px">Sin operaciones cerradas aún</div>'+
      '<div style="font-size:12px">Registra trades con P&L en tu Bitácora y aparecerán aquí analizadas automáticamente.</div>'+
      '<button class="btn" style="margin-top:16px" onclick="setPage(\'bitacora\')">Ir a Bitácora →</button></div>';
  }

  var wins=sells.filter(function(t){return t.pnl>0;});
  var losses=sells.filter(function(t){return t.pnl<=0;});
  var totalPnl=sells.reduce(function(s,t){return s+(t.pnl||0);},0);
  var avgWin=wins.length?wins.reduce(function(s,t){return s+t.pnl;},0)/wins.length:0;
  var avgLoss=losses.length?Math.abs(losses.reduce(function(s,t){return s+t.pnl;},0)/losses.length):0;
  var profitFactor=(avgLoss&&losses.length&&wins.length)?(wins.reduce(function(s,t){return s+t.pnl;},0)/Math.abs(losses.reduce(function(s,t){return s+t.pnl;},0))):null;
  var winRate=sells.length?wins.length/sells.length:0;
  var expectancy=winRate*avgWin-(1-winRate)*avgLoss;

  // per-ticker breakdown
  var byTicker={};
  sells.forEach(function(t){
    var tk=t.ticker||'—';
    if(!byTicker[tk]) byTicker[tk]={wins:0,losses:0,pnl:0,trades:0};
    byTicker[tk].trades++;
    byTicker[tk].pnl+=(t.pnl||0);
    if(t.pnl>0) byTicker[tk].wins++; else byTicker[tk].losses++;
  });
  var tkRows=Object.keys(byTicker).sort(function(a,b){return byTicker[b].pnl-byTicker[a].pnl;}).map(function(tk){
    var r=byTicker[tk];

      '<td style="color:var(--text3)">'+r.trades+'</td>'+

      '<td style="color:'+(wr>=0.5?'var(--pos)':'var(--neg)')+'">'+pct(wr)+'</td>'+
      '<td style="font-weight:700;color:'+(r.pnl>=0?'var(--pos)':'var(--neg)')+'">'+( r.pnl>=0?'+':'')+'$'+fmt(Math.abs(r.pnl))+'</td></tr>';
  }).join('');

  // equity curve from sorted sells by id
  var sorted=sells.slice().sort(function(a,b){return a.id-b.id;});

  var eqMax=Math.max.apply(null,eqData);

  var eqBars=eqData.map(function(v){

  // max drawdown
  var peak=0;var maxDD=0;

  return '<div class="krow">'+
    kpi("Operaciones",sells.length,wins.length+" ganadoras","n")+
    kpi("Win Rate",pct(winRate),wins.length+"/"+sells.length,winRate>=0.5?"g":"r")+

    kpi("Profit Factor",profitFactor!=null?profitFactor.toFixed(2):"—","ratio gana/pierde",profitFactor&&profitFactor>=1.5?"g":profitFactor&&profitFactor>=1?"a":"r")+
    kpi("Max Drawdown",D(maxDD),"caída máxima acumulada","r")+
    '</div>'+
    '<div class="cb">'+
    '<div class="st"><div class="stbar"></div>Equity Curve — trades reales de tu Bitácora</div>'+
    '<div style="display:flex;gap:2px;height:80px;align-items:flex-end;padding:4px">'+eqBars+'</div>'+
    '</div>'+
    '<div class="cb">'+
    '<div class="st"><div class="stbar"></div>Rendimiento por Activo</div>'+
    '<div class="tw"><table class="fos-table"><thead><tr><th>Activo</th><th>Trades</th><th>W/L</th><th>Win Rate</th><th>P&L</th></tr></thead>'+
    '<tbody>'+tkRows+'</tbody></table></div></div>'+

async function btRunSim(){
  if(BT.running) return;
  var ticker=(BT.ticker||'SPY').toUpperCase().trim();
  var fast=BT.fast||20;var slow=BT.slow||50;var capital=BT.capital||10000;
  if(fast>=slow){showToast('La SMA rápida debe ser menor a la SMA lenta.','warn');return;}
  BT.running=true;BT.result=null;renderBack();
  try{
    var hist=await fetchHistory(ticker,BT.range||'1y');
    if(!hist||hist.length<slow+10){BT.result={error:'No hay suficientes datos históricos para '+ticker+' con SMA'+slow+'. Intenta con un período mayor o ticker diferente.'};BT.running=false;renderBack();return;}
    var closes=hist.map(function(d){return d.close;});
    // calc SMAs
    function sma(arr,n,i){if(i<n-1)return null;var s=0;for(var j=i-n+1;j<=i;j++)s+=arr[j];return s/n;}
    var trades=[];var pos=null;var equity=capital;
    var winPnls=[];var lossPnls=[];
    for(var i=slow;i<closes.length;i++){
      var f=sma(closes,fast,i);var s2=sma(closes,slow,i);
      var fp=sma(closes,fast,i-1);var sp=sma(closes,slow,i-1);
      if(!f||!s2||!fp||!sp) continue;
      // golden cross → buy
      if(fp<=sp&&f>s2&&!pos){
        var units=Math.floor(equity/closes[i]);
        if(units<1) continue;
        pos={price:closes[i],units:units,cost:closes[i]*units};
        trades.push({date:hist[i].date||('d'+i),type:'buy',price:closes[i],pnl:null,cum:equity});
      }
      // death cross → sell
      else if(fp>=sp&&f<s2&&pos){
        var exitPrice=closes[i];
        var pnl=(exitPrice-pos.price)*pos.units;
        equity+=pnl;
        if(pnl>0) winPnls.push(pnl); else lossPnls.push(Math.abs(pnl));
        trades.push({date:hist[i].date||('d'+i),type:'sell',price:exitPrice,pnl:pnl,cum:equity});
        pos=null;
      }
    }
    // close open position at last price
    if(pos&&closes.length){
      var lastP=closes[closes.length-1];
      var pnl=(lastP-pos.price)*pos.units;
      equity+=pnl;
      if(pnl>0) winPnls.push(pnl); else lossPnls.push(Math.abs(pnl));
      trades.push({date:'Hoy',type:'sell',price:lastP,pnl:pnl,cum:equity});
      pos=null;
    }
    var sells2=trades.filter(function(r){return r.type==='sell';});
    var wins2=winPnls.length;
    var profitFactor2=(lossPnls.length&&lossPnls.reduce(function(s,v){return s+v;},0)>0)?(winPnls.reduce(function(s,v){return s+v;},0)/lossPnls.reduce(function(s,v){return s+v;},0)):null;
    var peak2=capital;var maxDD2=0;
    trades.forEach(function(r){if(r.cum>peak2)peak2=r.cum;var dd=peak2-r.cum;if(dd>maxDD2)maxDD2=dd;});
    BT.result={
      capital:capital,finalCapital:equity,
      totalReturn:(equity-capital)/capital,
      trades:trades,
      totalTrades:sells2.length,
      wins:wins2,
      winRate:sells2.length?wins2/sells2.length:0,
      profitFactor:profitFactor2,
      maxDrawdown:maxDD2,
      maxDrawdownPct:peak2>0?maxDD2/peak2:0
    };
  } catch(e){
    BT.result={error:'Error al obtener datos: '+e.message};
  }
  BT.running=false;renderBack();
}

async function confirmDeleteAccount(){

    if(!res.ok||!data.ok){

    if(typeof stopBoot==='function') stopBoot();

    if(btn){ btn.textContent='Eliminar mis datos de Invest'; daSync(); }
  }
}

// Niveles propuestos a partir de datos que la app YA tiene del usuario, para no
// fijar el objetivo a ciegas. Cada chip dice de donde sale el numero: sin la
// razon visible seria un numero magico y el usuario no podria juzgarlo.
// Solo se ofrecen niveles coherentes con la direccion elegida: un objetivo por
// encima del precio actual no tiene sentido en una alerta de bajada.
function alSugerencias(tk,ty,cur){
  var cont=document.getElementById('al-sug'); if(!cont) return;
  var sug=[];
  try{
    var pos=(S.portfolio||[]).find(function(h){return h.t===tk;});
    if(pos&&pos.cost>0) sug.push({v:pos.cost, txt:'tu coste medio'});
    var lq=(typeof LIVE==='object')?LIVE[tk]:null;
    if(lq&&lq.low52>0) sug.push({v:lq.low52, txt:'mínimo 52 semanas'});
    if(cur>0){
      sug.push({v:cur*0.9,  txt:'−10% desde hoy'});
      sug.push({v:cur*1.1,  txt:'+10% desde hoy'});
    }
  }catch(e){}
  // Max = avisar al subir -> solo niveles por encima. Min = al bajar -> por debajo.
  sug=sug.filter(function(s){
    return isFinite(s.v)&&s.v>0&&(ty==='Max'? s.v>cur : s.v<cur);
  });
  // Quitar duplicados muy proximos entre si (mismo nivel por dos motivos)
  var vistos=[];
  sug=sug.filter(function(s){
    var dup=vistos.some(function(v){return Math.abs(v-s.v)/s.v<0.005;});

    return !dup;
  });
  if(!sug.length){ cont.innerHTML=''; return; }
  cont.innerHTML='<div style="font-size:11px;color:var(--text3);margin-bottom:5px">Niveles sugeridos según tus datos</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:5px">'+
    sug.map(function(s){
      return '<button type="button" class="btn" style="padding:3px 9px;font-size:11px" '+
        'onclick="document.getElementById(\'al-pr\').value='+s.v.toFixed(2)+';alSync()">'+
        '$'+fmtD(s.v)+' <span style="color:var(--text3)">· '+s.txt+'</span></button>';
    }).join('')+'</div>';
}

// Autofill "Precio actual" en el modal de posición. Type==="Crypto" usa
// /api/crypto (CoinGecko); el resto sigue por /api/quote (Yahoo) via fetchQuote.
// Compartida entre el input de ticker y el select de tipo: cambiar cualquiera
// de los dos debe re-resolver el precio con la fuente correcta.
function posAutofillPrice(){
  var tEl=document.getElementById('pt'),tyEl=document.getElementById('pty'),el=document.getElementById('pcur');
  if(!tEl||!el)return;
  var t=(tEl.value||"").toUpperCase().trim();
  if(!t)return;
  var isCrypto=tyEl&&tyEl.value==='Crypto';
  if(LIVE[t]&&!isCrypto){el.value=LIVE[t].price.toFixed(2);return;}
  var p=isCrypto?fetchCryptoQuote(t):fetchQuote(t);
  p.then(function(q){
    if(!q)return;
    // Ticker y tipo pedidos en esta llamada — el usuario pudo haber tipeado
    // otro ticker o cambiado Stock↔Crypto mientras la request estaba en vuelo.
    // Sin este chequeo, una respuesta de Yahoo que tarda más que la de
    // CoinGecko (o viceversa) puede llegar después y pisar el precio correcto
    // con uno de la fuente equivocada (mismo ticker, forma de datos distinta).
    var tNow=document.getElementById('pt'),tyNow=document.getElementById('pty');
    if(!tNow||!el)return;
    var curT=(tNow.value||"").toUpperCase().trim();
    var curIsCrypto=tyNow&&tyNow.value==='Crypto';
    if(curT!==t||curIsCrypto!==isCrypto)return;
    LIVE[t]=q;el.value=q.price.toFixed(2);
  });
}

async function savePos(id){
  var t=(document.getElementById("pt").value||"").toUpperCase().trim();
  var type=document.getElementById("pty").value;
  var sh=parseFloat(document.getElementById("ps").value||"");
  var cost=parseFloat(document.getElementById("pc").value||"");
  var cur=parseFloat(document.getElementById("pcur").value||"");
  var stopEl=document.getElementById("pstop");
  var stop=stopEl?parseFloat(stopEl.value||""):NaN;
  stop=stop>0?stop:null;
  var err=document.getElementById("perr");
  if(!t){err.style.display="block";err.textContent="Ticker requerido";return;}
  if(!sh||sh<=0){err.style.display="block";err.textContent="Unidades no válidas";return;}
  if(!cost||cost<=0){err.style.display="block";err.textContent="Precio de entrada inválido";return;}
  if(!cur||cur<=0) cur=(LIVE[t]&&LIVE[t].price)||cost; // sin cotización aún: se usa la entrada hasta que llegue
  if(id===-1){
    var h={id:S.nextId++,t:t,type:type,sh:sh,cost:cost,cur:cur,stop:stop};
    S.portfolio.push(h);
    sbAddHolding(h).then(function(realId){if(realId){h.id=realId;persist();}}).catch(function(){});
  } else {
    var idx=S.portfolio.findIndex(function(p){return p.id===id;});
    if(idx>=0){
      S.portfolio[idx]=Object.assign({},S.portfolio[idx],{type:type,sh:sh,cost:cost,cur:cur},stopEl?{stop:stop}:{});
      sbUpdateHolding(S.portfolio[idx]);
    }
  }
  persist();
  REBAL.targets={}; // reset rebalancing targets when portfolio changes
  S.modal=null;S.editPos=null;
  document.getElementById("mroot").innerHTML="";
  showToast(id===-1?'Posición agregada':'Posición actualizada');
  renderMain(); // fast partial re-render
}

function saveTrade(){
  var type=document.getElementById("tr_type").value;
  var ticker=(document.getElementById("tr_ticker").value||"").toUpperCase().trim();
  var price=parseFloat(document.getElementById("tr_price").value||"");
  var qty=parseFloat(document.getElementById("tr_qty").value||"");
  var amount=parseFloat(document.getElementById("tr_amount").value||"");
  var date=document.getElementById("tr_date").value;
  var rsi=parseFloat(document.getElementById("tr_rsi").value||"")||null;
  var note=document.getElementById("tr_note").value.trim();
  var err=document.getElementById("trerr");

  var needsTicker=["buy","sell","dividend"].indexOf(type)>=0;
  if(needsTicker&&!ticker){err.style.display="block";err.textContent="Escribe el ticker.";return;}
  if(!amount||amount<=0){err.style.display="block";err.textContent="Escribe el monto total.";return;}
  if(!date){err.style.display="block";err.textContent="Elige la fecha.";return;}

  // For buy/sell compute qty if missing
  if(["buy","sell"].indexOf(type)>=0&&(!qty||qty<=0)&&price>0) qty=amount/price;

  // Fase 3: la operacion AJUSTA la posicion (app/lib/holdings.js). El
  // resultado de una venta se mide contra la entrada de la posicion.
  var pos=ticker?S.portfolio.find(function(h){return h.t===ticker;}):null;
  var adj=(type==='buy'||type==='sell')&&ticker?applyTrade(pos||null,{type:type,qty:qty,price:price,amount:amount}):{action:'none'};
  var pnl=(type==='sell'&&adj.pnl!=null)?adj.pnl:null;

  loadTrades();loadAlerts();
  S.trades.push({
    id:S.tradeNextId++,
    ticker:needsTicker?ticker:null,
    type:type,
    date:date,
    price:price||null,
    qty:qty||null,
    amount:amount,
    rsi:rsi,
    note:note,
    pnl:pnl,
  });
  persistTrades();

  var creoPosicion=false, cerrar=null;
  if(adj.action==='create'){
    var nuevo={id:S.nextId++, t:ticker, type:/-USD$/.test(ticker)?'Crypto':'Stock', sh:adj.sh, cost:adj.cost, cur:price||adj.cost, stop:null};
    S.portfolio.push(nuevo);
    creoPosicion=true;
    if(typeof sbAddHolding==='function'&&!S.demoMode){
      sbAddHolding(nuevo).then(function(realId){ if(realId){ nuevo.id=realId; persist(); } }).catch(function(){});
    }
    persist();
  } else if(adj.action==='update'&&pos){
    // Mismo objeto que leen Posiciones, Hoy y la ficha: el stop queda intacto.
    pos.sh=adj.sh; pos.cost=adj.cost;
    if(!S.demoMode) sbUpdateHolding(pos);
    persist();
  } else if(adj.action==='close'&&pos){
    // Vendio todas las unidades: se confirma con el mismo flujo de "Eliminar".
    cerrar=pos;
  }

  closeModal();
  showToast(creoPosicion?ticker+' agregado a tu portafolio':'Operación registrada en Movimientos');
  setPage("bitacora");
  if(cerrar){ showToast('Vendiste todas tus unidades de '+ticker+'. Confirma si la quitas del portafolio.','info'); openModal('delpos',cerrar); }
}

function pearson(a,b){
  var n=Math.min(a.length,b.length);
  if(n<5) return null;
  var ax=a.slice(-n),bx=b.slice(-n);
  var ma=ax.reduce(function(s,v){return s+v;},0)/n;
  var mb=bx.reduce(function(s,v){return s+v;},0)/n;
  var num=0,da=0,db=0;
  for(var i=0;i<n;i++){var ra=ax[i]-ma,rb=bx[i]-mb;num+=ra*rb;da+=ra*ra;db+=rb*rb;}
  var denom=Math.sqrt(da)*Math.sqrt(db);
  return denom===0?null:num/denom;
}

function corrColor(r){

  if(r>0.7) return 'rgba(239,68,68,0.5)';
  if(r>0.4) return 'rgba(234,179,8,0.4)';
  if(r>0.1) return 'rgba(255,255,255,0.08)';
  if(r>-0.1) return 'rgba(255,255,255,0.04)';
  if(r>-0.4) return 'rgba(59,130,246,0.2)';
  return 'rgba(34,197,94,0.3)';
}

// Copia de seguridad completa: todo vive en localStorage, un borrado de
// navegador lo pierde todo. Serializa lo esencial y permite restaurarlo.
function exportBackup(){
  var data={
    _v:1, _fecha:new Date().toISOString(),
    portfolio:S.portfolio, trades:S.trades, watchlist:S.watchlist,
    capitalPlan:S.capitalPlan, capital:S.capital,
    rebalTargets:(REBAL&&REBAL.targets)||{}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='moyiq-invest-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  showToast('Copia de seguridad descargada');
}
function importBackup(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d||typeof d!=='object') throw new Error('formato');
      if(Array.isArray(d.portfolio)) S.portfolio=d.portfolio;
      if(Array.isArray(d.trades)) S.trades=d.trades;
      if(Array.isArray(d.watchlist)) S.watchlist=d.watchlist;
      if(d.capitalPlan) S.capitalPlan=d.capitalPlan;
      if(typeof d.capital==='number') S.capital=d.capital;
      if(d.profile&&typeof radarSaveProfile==='function') radarSaveProfile(d.profile);
      if(d.rebalTargets&&typeof REBAL==='object'){ REBAL.targets=d.rebalTargets; if(typeof rebalSaveTargets==='function') rebalSaveTargets(); }
      if(typeof persist==='function') persist();
      if(typeof persistTrades==='function') persistTrades();
      if(typeof _capSave==='function') _capSave();
      showToast('Copia restaurada correctamente');
      renderMain();
    }catch(err){ showToast('Archivo no válido','error'); }
  };
  reader.readAsText(file);
}
function exportCSV(){
  var port=S.portfolio;
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var rows=[['Ticker','Tipo','Unidades','Entrada','Precio Actual','Valor','P&L $','Retorno %','Peso %','Fecha']];
  var date=new Date().toLocaleDateString('es-CL');
  port.forEach(function(h){
    var pnl=h.sh*(h.cur-h.cost);
    var ret=h.cost>0?(h.cur-h.cost)/h.cost*100:0;   // coste 0 daba Infinity%
    var w=(h.sh*h.cur)/(totM||1)*100;
    rows.push([h.t,h.type,h.sh,h.cost.toFixed(2),h.cur.toFixed(2),(h.sh*h.cur).toFixed(2),pnl.toFixed(2),ret.toFixed(2),w.toFixed(2),date]);
  });
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var tPnl=port.reduce(function(s,h){return s+h.sh*(h.cur-h.cost);},0);
  rows.push(['TOTAL','','','','',totM.toFixed(2),tPnl.toFixed(2),((tPnl/(totC||1))*100).toFixed(2),'100','']);
  var csv=rows.map(function(r){
    return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');
  }).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='moyiq-invest-'+new Date().toISOString().split('T')[0]+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}


// ── CALCULADORA "CON TU REGLA DE RIESGO" (M12 · I04) ───────────────────────
// Pantalla propia (page 'pb', Decidir → Calculadora). Calcula unidades enteras
// (decimales solo para cripto), exposición, pérdida al stop y escenarios en
// múltiplos de R con computeSizing() de app/lib/risk.js. Recalcula al teclear
// sin repintar el formulario (el foco no salta).
var PB={ticker:'',price:0,capital:0,risk:2,stop:0,computed:null};

function pbIsCrypto(t){ return /-USD$/.test(String(t||'').toUpperCase()); }
function pbCapitalDefault(){ return (S.capital>0)?S.capital:0; }
function pbRuleDefault(){ return (typeof riskRulePct==='function')?riskRulePct():2; }

// Abre la calculadora con un ticker (y su precio si se conoce).
function openCalculator(ticker,price){
  ticker=String(ticker||'').toUpperCase().trim();
  PB.ticker=ticker; PB.stop=0; PB.computed=null;
  var own=S.portfolio.find(function(h){return h.t===ticker;});
  if(own&&own.stop>0) PB.stop=own.stop;
  PB.price=(price>0?price:0)||(LIVE[ticker]&&LIVE[ticker].price)||0;
  // Fase 3: siempre con el capital y la regla guardados (Ajustes).
  PB.capital=pbCapitalDefault(); PB.risk=pbRuleDefault();
  closeDrawer();
  setPage('pb');
  if(!PB.price&&ticker) pbFetchPrice();
}

function _pbField(id,label,attrs,hint){
  return '<div class="calc-field"><label for="'+id+'">'+label+'</label><input id="'+id+'" class="inp" '+attrs+'/>'+(hint?'<div class="calc-hint">'+hint+'</div>':'')+'</div>';
}

  if(!PB.capital) PB.capital=pbCapitalDefault();
  if(!PB.risk) PB.risk=pbRuleDefault();
  var picks=S.portfolio.slice(0,8).map(function(h){
    return '<button class="calc-pick" onclick="pbFill(\''+esc(h.t)+'\')">'+esc(h.t)+'</button>';
  }).join('');
  var est=PB.price>0?fmtD(PB.price*(1-RISK_DEFAULT_STOP_PCT)):'';
  document.getElementById("main").innerHTML=

    '<div class="calc-grid">'+
    '<section class="cb calc-form" aria-label="Datos de la posición">'+
    (picks?'<div class="calc-picks"><span>Desde tu portafolio</span>'+picks+'</div>':'')+
    '<div class="calc-row">'+
    _pbField('pb-ticker','Ticker','style="text-transform:uppercase" placeholder="AAPL" maxlength="15" autocomplete="off" value="'+esc(PB.ticker)+'" onchange="PB.ticker=this.value.toUpperCase().trim();pbFetchPrice()"')+
    _pbField('pb-price','Entrada (USD)','type="number" inputmode="decimal" step="0.01" min="0" placeholder="234,12" value="'+(PB.price||'')+'" oninput="PB.price=parseFloat(this.value)||0;pbCalc()"')+
    '</div>'+
    _pbField('pb-stop','Stop (USD)','type="number" inputmode="decimal" step="0.01" min="0" placeholder="'+(est?'Sin stop: se estima '+est:'Precio donde saldrías')+'" value="'+(PB.stop||'')+'" oninput="PB.stop=parseFloat(this.value)||0;pbCalc()"',
      'Si lo dejas vacío se usa −8 % bajo la entrada, como estimación.')+
    '<div class="calc-row">'+
    _pbField('pb-capital','Capital (USD)','type="number" inputmode="decimal" step="any" min="0" placeholder="Tu capital" value="'+(PB.capital||'')+'" oninput="PB.capital=parseFloat(this.value)||0;pbCalc()"',
      S.capital>0?'':'<a href="#" onclick="setPage(\'settings\');return false">Defínelo en Configuración</a> para no escribirlo cada vez.')+
    _pbField('pb-risk','Tu regla: % del capital','type="number" inputmode="decimal" step="0.25" min="0.1" max="10" value="'+(PB.risk||'')+'" oninput="PB.risk=parseFloat(this.value)||0;pbCalc()"')+
    '</div>'+
    '</section>'+
    '<section id="calc-result" class="cb calc-result" aria-live="polite" aria-label="Resultado"></section>'+
    '</div>'+
    '<section id="calc-plans"></section>'+
    '<div class="calc-legal"><b>Herramienta educativa.</b> Es un cálculo con tus datos y tu regla, no una instrucción ni una recomendación de inversión. La decisión es tuya.</div>';

function pbFill(ticker){
  PB.ticker=ticker; PB.stop=0;
  var own=S.portfolio.find(function(h){return h.t===ticker;});
  if(own&&own.stop>0) PB.stop=own.stop;
  PB.price=(LIVE[ticker]&&LIVE[ticker].price)||(own&&own.cur)||0;
  renderPBBody();
  if(!PB.price) pbFetchPrice();
}

function pbFetchPrice(){
  var t=(PB.ticker||'').toUpperCase().trim();
  if(!t) return;
  var done=function(q){
    if(!q||!(q.price>0)||PB.ticker!==t) return;
    LIVE[t]=q; PB.price=+q.price.toFixed(2);
    var el=document.getElementById('pb-price'); if(el) el.value=PB.price;
    pbCalc();
  };
  if(LIVE[t]&&LIVE[t].price) return done(LIVE[t]);
  (pbIsCrypto(t)?fetchCryptoQuote(t):fetchQuote(t)).then(done).catch(function(){});
}

function pbCalc(){
  var box=document.getElementById('calc-result');
  if(!box) return;
  var t=(PB.ticker||'').toUpperCase().trim();
  var c=computeSizing({capital:PB.capital,riskPct:PB.risk,entry:PB.price,stop:PB.stop,
    limit:(typeof riskConcentrationLimit==='function'?riskConcentrationLimit():RISK_CONCENTRATION_LIMIT),fractional:pbIsCrypto(t)});
  PB.computed=c.error?null:Object.assign({ticker:t},c);
  if(c.error){
    var msg={
      'no-entry':'Escribe el ticker y la entrada para calcular.',
      'no-capital':'Escribe tu capital. Sin capital no hay regla que aplicar.',
      'no-risk':'Escribe qué porcentaje de tu capital estás dispuesto a perder en esta posición.',
      'stop-not-below-price':'El stop tiene que quedar por debajo de la entrada.'
    }[c.error]||'Revisa los datos.';
    box.innerHTML='<div class="calc-empty">'+icon('calc','ico-xl')+'<p>'+msg+'</p></div>';
    return;
  }
  var unitWord=pbIsCrypto(t)?'unidades':(c.units===1?'unidad':'unidades');
  var conc=c.concentration;
  var concHtml=conc
    ?'<div class="conc-warn" role="note"><b>Supera tu límite de concentración del '+Math.round(conc.limit*100)+' %</b> ('+Math.round(conc.weight*100)+' % de tu capital). '+
      (conc.maxUnits>0?'Con '+fmtUnits(conc.maxUnits)+' unidades quedarías en '+Math.round(conc.weightAtMax*100)+' %.':'A este precio, ni una unidad entera cabe en el límite.')+'</div>'
    :'';
  var rows=c.rTable.map(function(r){
    return '<tr><th scope="row">'+r.label+'</th><td class="num">'+fmtUSD(r.price)+'</td><td class="num" style="color:'+(r.pnl<0?'var(--neg)':'var(--pos)')+'">'+(r.pnl>0?'+':'')+fmtUSD(r.pnl,0)+'</td></tr>';

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────────
// Los controles construidos sobre <div role="button" tabindex="0"> no reciben
// activacion por teclado nativa como un <button>. Un unico manejador delegado
// los cubre a todos en lugar de repetir onkeydown en cada plantilla JS.
// Va en su propio listener y ANTES del guard de sesion: activar un control no
// es un atajo de la app, y varios de estos controles viven en la pantalla de
// acceso, donde todavia no hay S.user.
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  var ctrl=document.activeElement;
  if(!ctrl||!ctrl.getAttribute) return;
  if(ctrl.getAttribute('role')==='button'&&ctrl.tagName!=='BUTTON'){
    e.preventDefault();
    ctrl.click();
  }
});

document.addEventListener('keydown',function(e){
  if(!S.user) return;
  // Escape debe cerrar modal aunque el foco este en un input (ej. da-confirm
  // en el modal de borrado de cuenta) — por eso va ANTES del early-return de
  // INPUT/TEXTAREA que corta los atajos de letra. Usa closeModal() cuando hay
  // un modal abierto para que limpie S.modal y restaure el foco previo.
  if(e.key==='Escape'){
    if(S.modal){closeModal();return;}
    document.getElementById('mroot').innerHTML='';
    acctClose(); gsCloseMobile();
    closeDrawer();
    if(document.getElementById('ai-panel'))
      document.getElementById('ai-panel').style.transform='translateX(100%)';
    return;
  }
  // Cmd/Ctrl+K abre el buscador incluso desde un campo de texto.
  if((e.metaKey||e.ctrlKey)&&!e.altKey&&(e.key==='k'||e.key==='K')){ e.preventDefault(); gsFocus(); return; }
  var tag=e.target&&e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(e.target&&e.target.isContentEditable)) return;
  if(e.key==='/'&&!e.altKey&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); gsFocus(); return; }
  if(e.key==='?'){showShortcuts();return;}
  // Alt+1..5: los 5 destinos. Se lee e.code porque en macOS Alt+1 escribe "¡".
  var m=/^Digit([1-5])$/.exec(e.code||'');
  if(e.altKey&&!e.metaKey&&!e.ctrlKey&&m){
    e.preventDefault();
    goDest(DEST[+m[1]-1].id);
    return;
  }
  if(e.key==='r'&&e.ctrlKey){e.preventDefault();manualRefresh();}
});

    var minY=Math.min.apply(null,allY)-3, maxY=Math.max.apply(null,allY)+3, rng=(maxY-minY)||1;
    var xS=function(i,n){return i/Math.max(n-1,1)*(W-70);}, yS=function(v){return H-((v-minY)/rng)*H;};
    var grid='';
    var step=rng>80?20:rng>40?10:5;

      var mean=rets.reduce(function(a,b){return a+b;},0)/(rets.length||1);
      var vol=Math.sqrt(rets.reduce(function(a,r){return a+(r-mean)*(r-mean);},0)/(rets.length||1));
      return {t:s.t,color:s.color,ret:s.pts[s.pts.length-1].y,vol:vol,sharpe:vol>0?(mean/vol)*Math.sqrt(252):0,
        maxR:Math.max.apply(null,s.pts.map(function(p){return p.y;})),minR:Math.min.apply(null,s.pts.map(function(p){return p.y;})),rets:rets};

      var r=pearson(a.slice(-n),b.slice(-n));

    }
    if(pares.length) stats+='<h3 class="port-h3">Correlación de los rendimientos diarios</h3><div class="tw"><table class="fos-table port-table"><thead><tr><th>Par</th><th>Correlación</th><th>Lectura</th></tr></thead><tbody>'+pares.join('')+'</tbody></table></div>'+
      '<p class="port-muted">1 es igual, 0 es independiente, −1 es opuesto.</p>';
  }
  var legend='<div class="cmp-legend">'+COMP.tickers.map(function(t,i){return '<span><i style="background:'+colors[i]+'"></i>'+esc(t)+'</span>';}).join('')+
    (COMP.tickers.indexOf('SPY')<0?'<button type="button" class="tab'+(COMP.showSPY?' act':'')+'" aria-pressed="'+!!COMP.showSPY+'" onclick="COMP.showSPY=!COMP.showSPY;renderComp()"><i class="cmp-dash"></i>Referencia: SPY</button>':'')+'</div>';

async function compLoad(){
  if(COMP.loading) return;
  COMP.tickers=COMP.tickers.filter(function(t){return t&&t.trim().length>0;});
  if(COMP.tickers.length<2){showToast('Selecciona al menos 2 tickers','warning');return;}
  COMP.loading=true;COMP.data={};COMP.spy=null;COMP.synthetic=[];renderComp();
  var rangeMap={30:'1mo',60:'3mo',90:'3mo',130:'6mo',365:'1y',1095:'5y'}; // 2mo y 3y no existen en Yahoo: devolvian 400
  var rng=rangeMap[COMP.range]||'3mo';
  try{
    var promises=COMP.tickers.map(function(t){
      return fetchHistory(t,rng).then(function(hist){
        if(hist&&hist.length>5){COMP.data[t]=hist;}
        else{COMP.data[t]=genFallback(getLivePrice(t)||100,COMP.range);if(COMP.synthetic.indexOf(t)<0)COMP.synthetic.push(t);}
        if(!LIVE[t]) return fetchQuote(t).then(function(q){if(q) LIVE[t]=q;});
      }).catch(function(){COMP.data[t]=genFallback(getLivePrice(t)||100,COMP.range);if(COMP.synthetic.indexOf(t)<0)COMP.synthetic.push(t);});
    });
    // Fetch SPY benchmark unless already comparing it
    var spyPromise=COMP.tickers.indexOf('SPY')<0
      ?fetchHistory('SPY',rng).then(function(h){if(h&&h.length>5)COMP.spy=h;}).catch(function(){})
      :Promise.resolve();
    await Promise.all(promises.concat([spyPromise]));
  }catch(e){/* silent */}
  COMP.loading=false;renderComp();
}

var DIVS={data:{},loading:false,key:'',failed:0,asked:0};
function divsKey(){ return S.portfolio.map(function(h){return h.t;}).sort().join(','); }
async function loadDivData(){
  if(DIVS.loading) return;
  var tickers=[];
  S.portfolio.forEach(function(h){if(tickers.indexOf(h.t)<0)tickers.push(h.t);});
  if(!tickers.length) return;
  DIVS.loading=true; DIVS.key=divsKey(); DIVS.failed=0; DIVS.asked=tickers.length;
  if(S.page==='divs') renderMain();
  await Promise.allSettled(tickers.map(function(t){
    return fetchFundamentals(t).then(function(f){
      if(!f){ DIVS.failed++; return; }
      var price=getLivePrice(t)||0;
      var dy=f.dividendYield||0;                 // fracción (0.025 = 2.5%)
      var annual=(dy&&price)?dy*price:0;         // $ anual por acción
      DIVS.data[t]={
        dividendYield:dy,
        trailingAnnualDividendRate:annual,
        dividendRate:annual?annual/4:0           // default trimestral (la mayoría US)
      };
    }).catch(function(){ DIVS.failed++; });
  }));
  DIVS.loading=false;
  if(S.page==='divs') renderMain();
}
