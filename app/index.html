/* ═══════════════════════════════════════════════════════════════════
   MOY IQ INVEST — Sistema de diseño alineado con FinanceOS Pro
   MAXNOVA & LUCI Global LLC · v2.2
   Tipografía: Inter + IBM Plex Mono
   Paleta: mismos tokens que FinanceOS globals.css
   ═══════════════════════════════════════════════════════════════════ */

/* Fonts loaded async via <link> in <head> — no render-blocking @import */

/* ── NATIVE FEEL: CHASIS ──────────────────────────────────────────────
   Elimina los "tells" que delatan pagina web en vez de app instalada.
   Ver skill native-feel / references/tells.md. */
* { -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
button, a, label, summary, [role="button"], [role="tab"] {
  touch-action: manipulation;
}
nav, header, footer, button, .btn, [role="button"], [role="tab"] {
  -webkit-user-select: none;
  user-select: none;
}
img { -webkit-user-drag: none; user-select: none; }
input, select, textarea { font-size: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .btn:active, [role="button"]:active { transform: scale(.97); transition: transform .06s; }
}

/* ── TOKENS ── */
:root {
  /* Colores — modo claro (idéntico a FinanceOS light) */
  /* ── Marca: azul tinta ───────────────────────────────────────────────
     Era verde, el mismo hex que la ganancia. Compartir color con la semantica
     hacia que el color no dijera nada: boton y "+$400" eran identicos. Verde y
     rojo quedan reservados a resultado (--pos/--neg), y la marca se mueve a un
     hue que no compite con el P&L. Los nombres --grn* se conservan a proposito:
     renombrar 260 usos anadiria riesgo sin cambiar nada visual. */
  /* ── Paleta de marca MOY IQ ("El Instrumento") — alineada a financeos-app ── */
  --grn:       #14213D; /* Navy — marca/estructura */
  /* Superficies solidas de CTA: Latón, SIEMPRE con texto Navy encima (nunca
     blanco — falla AA sobre Latón). Ver los 3 usos de --grn-solid más abajo,
     ya migrados a color:var(--grn) en vez de color:#fff. */
  --grn-solid: #B8863B;
  --grn-bg:    rgba(20,33,61,0.07);
  --grn-lt:    rgba(20,33,61,0.14);
  --grn-d:     #0D1730;

  --laton:      #B8863B;
  --laton-700:  #8A6329; /* texto/íconos sobre Papel — AA */

  --red:       #A23E2E;
  --red-bg:    rgba(162,62,46,0.08);
  --red-lt:    #F3DAD5;

  --amber:     #9C5419;
  --amber-bg:  rgba(201,122,61,0.12);

  /* Alias de fondos/bordes de estado usados en .sigb/.rtab y badges inline.
     Antes se referenciaban sin definir (--gbg/--gborder/--ambg/--amborder)
     y caian a `initial` -> cajas sin fondo ni borde. */
  --gbg:       var(--grn-bg);
  --gborder:   var(--grn-lt);
  --ambg:      var(--amber-bg);
  --amborder:  var(--amber);

  /* ── Semantica de resultado ──────────────────────────────────────────
     Ganancia y perdida. Verde = único color positivo/éxito del brand book;
     rojo/error para pérdida. Convención universal en finanzas, no cambia. */
  --pos:       #356E57;
  --neg:       #A23E2E;

  /* Aliases usados en JS inline styles */
  --green:     #356E57;
  --orange:    #9C5419;
  --orange-bg: rgba(201,122,61,0.12);
  --orange-bd: #E3C08F;

  --blue:      #3E5A78;
  --blue-bg:   rgba(91,122,153,0.12);

  /* Superficies — Papel */
  --bg:        #F1EEE6;
  --bg2:       #FAF8F2;
  --card:      #FAF8F2;
  --card2:     #F1EEE6;
  --card3:     #F5F2EA;
  --card4:     #E4DFD1;

  /* Texto — Navy */
  --text:      #4A4739;
  --text2:     #63604F;
  --text3:     #63604F;
  --bright:    #14213D;
  --white:     #ffffff;

  /* Bordes */
  --border:    rgba(20,33,61,0.10);
  --border2:   rgba(20,33,61,0.18);
  --border3:   rgba(20,33,61,0.24);

  /* Sombras */
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.05);

  /* Radios */
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  12px; /* brand book: radios de 12px como maximo */
  --r-xl:  12px;

  /* Escala de espaciado — base 2px.
     Se eligio 2 y no 4 a partir de medir el CSS existente: el 85% de las
     declaraciones ya caia en multiplos de 2, pero solo el 47% en multiplos de
     4, y los tres valores mas usados (14px, 10px y 6px) son pares fuera del
     grid de 4. Forzar escala estricta de 4 habria movido 94 declaraciones:
     eso no es un refactor, es un rediseno. Con base 2 se elimina la
     arbitrariedad real (los 32 valores impares) sin tocar la composicion. */
  --suite-h: 0px;    /* la franja de suite se elimino; se conserva el token porque .sb y #topbar lo descuentan */
  --sp-1:  2px;
  --sp-2:  4px;
  --sp-3:  6px;
  --sp-4:  8px;
  --sp-5:  10px;
  --sp-6:  12px;
  --sp-7:  14px;
  --sp-8:  16px;
  --sp-10: 20px;
  --sp-12: 24px;
  --sp-14: 28px;
  --sp-16: 32px;
  --sp-20: 40px;
  --sp-24: 48px;

  /* Sidebar */
  --sb-w:  0px;
}

/* ── DARK MODE ── */
[data-theme="dark"] {
  --grn:       #F1EEE6; /* Papel funciona como "primario" claro sobre fondo Navy oscuro */
  --grn-solid: #CC9A52; /* Latón para datos/CTA sobre Navy oscuro — texto Navy encima */
  --grn-bg:    rgba(241,238,230,0.08);
  --grn-lt:    rgba(241,238,230,0.16);
  --grn-d:     #FAF8F2;

  --laton:      #CC9A52;
  --laton-700:  #E3C592;

  --red:       #C96856;
  --red-bg:    rgba(201,104,86,0.16);
  --red-lt:    #4A2A22;

  --amber:     #E0975A;
  --amber-bg:  rgba(224,151,90,0.16);

  /* Semantica de resultado en oscuro — verde único positivo/éxito. */
  --pos:       #74C2A3;
  --neg:       #C96856;

  /* Aliases dark mode */
  --green:     #74C2A3;
  --orange:    #E0975A;
  --orange-bg: rgba(224,151,90,0.16);
  --orange-bd: #6B4A2A;

  --blue:      #89A6C2;
  --blue-bg:   rgba(137,166,194,0.16);

  --bg:        #12161F;
  --bg2:       #181D29;
  --card:      #181D29;
  --card2:     #1D2331;
  --card3:     #242B3B;
  --card4:     #2D3547;

  --text:      #C7C2B2;
  --text2:     #9C9784;
  --text3:     #9C9784;
  --bright:    #FAF8F2;
  --white:     #f1f5f9;

  --border:    rgba(228,223,209,0.10);
  --border2:   rgba(228,223,209,0.18);
  --border3:   rgba(228,223,209,0.26);

  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
}

/* ── RESET ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { font-size:14px; -webkit-text-size-adjust:100%; }

body {
  font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh; min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

/* ── LAYOUT ── */
/* Marco de la app (reestructura v3): barra lateral + columna de contenido.
   Las reglas viven en "APP SHELL" al final de esta hoja. */

/* ── MAIN CONTENT ── */
.main {
  flex: 1;
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── PAGE HEADER ── */
/* Cabecera de modulo. Conviven dos formas de escribirla — _ph() genera .ph
   (17 usos) y otros modulos ponen .fos-module-header a mano (9 usos) — pero son
   el mismo componente, asi que comparten una unica regla en vez de dos que se
   desincronizan. Antes renderizaban distinto: .ph a 24/20 y fos-module-header
   a 20/20, porque la regla #main > div le pisaba su padding. */
.ph,
.fos-module-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding:16px var(--content-px) 12px;
  gap:16px;
  flex-wrap: wrap;
}
.ph-crumb {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  margin-bottom:6px;
}
.ph h1, .ph h2 {
  /* Mismo titulo de pagina que .fos-module-title (Instrument Sans serif): antes eran
     3 estilos distintos (Inter 24, Inter 26, Instrument Sans 27) y el H1 cambiaba de
     familia/tamano al moverse entre modulos. El h2 es para _ph() llamado con
     tag:'h2' — secciones que viven dentro de una pagina mas grande con su
     propio h1 (ej. Screener/Comparador dentro de Investigar), mismo look. */
  font-family: 'Instrument Sans', Georgia, sans-serif;
  font-size: 27px;
  font-weight: 600;
  color: var(--bright);
  letter-spacing: -.01em;
  line-height: 1.12;
  margin:0 0 4px;
}
.sub-txt {
  font-size: 13px;
  color: var(--text2);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  margin:0;
  line-height: 1.5;
}
.ph-right {
  display: flex;
  align-items: center;
  gap:8px;
  flex-wrap: wrap;
  flex-shrink: 0;
  padding-top:4px;
}

/* ── PAGE BODY ── */
.page-body {
  padding:24px 28px;
  flex: 1;
}

/* ── KPI CARDS ── */
.krow {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap:10px;
  margin-bottom:20px;
}
.kpi {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  padding:14px 16px;
  box-shadow: var(--shadow-sm);
}
.kl {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  margin-bottom:6px;
}
.kv {
  font-size: 20px;
  font-weight: 600;
  color: var(--bright);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.ks {
  font-size: 11px;
  margin-top:4px;
  font-family: 'IBM Plex Mono', monospace;
}
.ks.pos { color: var(--pos); }
.ks.neg { color: var(--neg); }
.ks.neu { color: var(--text3); }

/* KPI color accents — borde izquierdo sutil */
.kg { border-left: 2px solid var(--grn); }
.kr { border-left: 2px solid var(--red); }
.ka { border-left: 2px solid var(--amber); }
/* El valor tambien hereda el color semantico (--pos/--neg), no solo el borde.
   Antes cada pantalla que queria el numero en verde/rojo tenia que envolverlo
   a mano (asi lo hacia renderDash) y las que no lo hacian se quedaban en
   negro — el mismo concepto (P&L) se leia distinto segun la pantalla. */
.kg .kv { color: var(--pos); }
.kr .kv { color: var(--neg); }
.kb { border-left: 2px solid var(--blue); }
/* Rail neutro: para datos sin estado semántico (una magnitud no es "positiva") */
.kn { border-left: 2px solid var(--border2); }

/* ── FRANJA DE SUITE ─────────────────────────────────────────────
   Usa tokens para funcionar en ambos temas. z-index 60 y no 9999: solo debe
   quedar por encima del contenido, nunca del drawer ni de los modales. */
/* #topbar y .sb son position:fixed con top:0, es decir anclados al VIEWPORT,
   no al final de esta franja. Se pintaban encima de ella: el fondo oscuro del
   topbar (var(--bg2)) era la banda negra que tapaba la parte superior.
   Se fija una altura conocida y los tres elementos la descuentan. */
.suite-nav {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 0 var(--sp-7);
  height: var(--suite-h);
  background: var(--bg);
  border-bottom: 0.5px solid var(--border);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; letter-spacing: .4px;
  position: fixed; top: 0; left: 0; right: 0; z-index: 120;
}
.suite-home    { color: var(--text3); text-decoration: none; transition: color .15s cubic-bezier(.23,1,.32,1); }
.suite-home:hover { color: var(--text); }
.suite-sep     { color: var(--border2); }
.suite-current { color: var(--text2); }

/* Barra de fuerza (score) — las clases .sbar/.sf se usaban en sbar() pero no
   tenian CSS, asi que la columna 'Fuerza' salia vacia. */
.sbar { display:inline-block; width:60px; height:6px; background:var(--card3); border-radius:3px; overflow:hidden; vertical-align:middle; }
.sf   { display:block; height:100%; border-radius:3px; }

/* ── CHIPS DE WATCHLIST ──────────────────────────────────────────
   La clase .wtag se generaba en el HTML pero NO existia en el CSS: eran
   <span> desnudos, sin padding ni borde, separados solo por el espacio del
   texto. De ahi que los tickers aparecieran pegados unos a otros. */
.wtag-grid {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin-bottom: var(--sp-5);
}
.wtag {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-5);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-sm);
  background: var(--card2);
  color: var(--text2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  line-height: 1.4;
  cursor: pointer;
  user-select: none;
  transition: border-color .15s cubic-bezier(.23,1,.32,1),
              color .15s cubic-bezier(.23,1,.32,1),
              background-color .15s cubic-bezier(.23,1,.32,1);
}
.wtag::after { content: "+"; color: var(--text3); font-weight: 700; }
.wtag:hover { border-color: var(--grn); color: var(--bright); background: var(--card3); }
.wtag:hover::after { color: var(--grn); }
.wtag:active { transform: scale(.97); }
@media (pointer: coarse) { .wtag { min-height: 44px; } }
/* Jerarquía 1 respuesta -> 3 apoyos */
.krow-hero {
  display: grid;
  grid-template-columns: 1.7fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}
.kpi.hero { padding:18px 20px; }
.kpi.hero .kl { font-size: 11px; }
.kpi.hero .kv { font-size: 34px; line-height: 1.1; }
.kpi.hero .ks { font-size: 12px; margin-top:4px; }
@media (max-width: 900px) { .krow-hero { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .krow-hero { grid-template-columns: 1fr; } }

/* ── CARD BOX ── */
/* ── CARD: identidad visual unica ──────────────────────────────────
   .cb (card con padding) y .fos-card (card estructurada/flush) eran dos
   "sistemas" con bordes y sombras distintos; moverse entre pantallas cruzaba
   una costura visible. Ahora comparten UNA base (borde/radio/sombra/fondo) y
   solo difieren en el relleno: .cb trae padding+margen por defecto; .fos-card
   queda flush para cards con su propia estructura interna (header+body/tabla). */
.cb, .fos-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.cb {
  /* Padding de card unificado al token --sp-8 (16px): antes 18px 20px off-scale.
     Ahora .cb y las fos-card de contenido comparten el mismo relleno. */
  padding:var(--sp-8);
  /* Unica fuente del espaciado de este componente: antes 41 usos de .cb
     llevaban margenes inline de 10/12/14/16px que pisaban esta regla, asi que
     tarjetas identicas quedaban a distancias distintas segun quien las escribio. */
  margin-bottom:var(--sp-7);
}

/* ── SECTION TITLE ── */
.st {
  /* Mismo look que .fos-section-label (mono 9px): eran dos labels de seccion
     con tipografia distinta (Inter 10px vs mono 9px). Ahora leen igual en toda
     la app; la barra .stbar ya coincidia con .fos-section-label::before. */
  display: flex;
  align-items: center;
  gap:8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text3);
  margin-bottom:14px;
}
.stbar {
  width: 3px; height: 12px;
  background: var(--grn);
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── TABLE ── */
.tw {
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
  margin-bottom:14px;
}
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
thead th {
  text-align: left;
  padding:10px 14px;
  cursor: pointer;
  user-select: none;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  background: var(--card2);
  border-bottom: 0.5px solid var(--border2);
  white-space: nowrap;
}
td {
  padding:8px 14px;
  font-size: 12px;
  border-bottom: 0.5px solid var(--border);
  font-variant-numeric: tabular-nums;
  color: var(--text);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
.trow:hover td { background: var(--card3); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap:4px;
  padding:6px 12px;
  border-radius: var(--r-sm);
  border: 0.5px solid var(--border2);
  background: var(--card);
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  font-family: 'IBM Plex Sans', sans-serif;
  cursor: pointer;
  transition: border-color .12s cubic-bezier(.23,1,.32,1),
              color .12s cubic-bezier(.23,1,.32,1),
              background-color .12s cubic-bezier(.23,1,.32,1);
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--grn);
  color: var(--grn);
  background: var(--grn-bg);
}
.btn-big {
  display: inline-flex; align-items: center; gap:6px;
  padding:8px 16px;
  border-radius: var(--r-sm);
  border: none;
  background: var(--grn-solid);
  color: #14213D;
  font-size: 12px;
  font-weight: 600;
  font-family: 'IBM Plex Sans', sans-serif;
  cursor: pointer;
  transition: background .12s, transform .1s;
  white-space: nowrap;
}
/* Antes pasaba a Navy con texto Navy encima (texto invisible al pasar el puntero). */
.btn-big:hover { background: var(--grn-solid); filter: brightness(.93); transform: translateY(-1px); }
.btn-big:active { transform: translateY(0); }
.btn-big:disabled { opacity:.5; cursor:not-allowed; transform:none; }

/* ── INPUTS ── */
.inp {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-sm);
  padding:8px 10px;
  font-size: 12px;
  font-family: 'IBM Plex Sans', sans-serif;
  color: var(--bright);
  outline: none;
  transition: border-color .12s;
  width: 100%;
}
.inp:focus { border-color: var(--grn); box-shadow: 0 0 0 3px var(--grn-bg); }

/* ── BADGES ── */
.badge {
  display: inline-block;
  padding:2px 8px;
  border-radius:var(--r-xl);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  font-family: 'IBM Plex Mono', monospace;
}
.badge.buy  { background: var(--grn-bg); color: var(--grn); }
.badge.hold { background: var(--amber-bg); color: var(--amber); }
.badge.sell { background: var(--red-bg); color: var(--red); }

/* ── LECTURAS POR INDICADOR (relanzamiento v2, T18) ── */
.badge{white-space:nowrap}
.rd-list{display:flex;flex-direction:column;gap:0;margin:0}
.rd-row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;padding:8px 0;border-bottom:1px solid var(--border)}
.rd-row:last-child{border-bottom:none}
.rd-lbl{font-size:12px;font-weight:600;color:var(--bright);margin:0}
.rd-rng{display:block;font-size:11px;font-weight:400;color:var(--text3);margin-top:1px}
.rd-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;margin:0;white-space:nowrap}
.rd-txt{grid-column:1 / -1;font-size:12px;color:var(--text2);line-height:1.5;margin:0}
.rd-panel{background:var(--card2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px}
.rd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;font-size:11px;color:var(--text3)}
.rd-foot{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5}
.fresh-tag{font-size:11px;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.conc-warn{margin-top:10px;padding:9px 12px;border:1px solid var(--amber);border-radius:var(--r-sm);font-size:12px;color:var(--text);line-height:1.5}
.conc-warn b{color:var(--amber)}
/* ── LIVE BADGE ── */
.live-badge {
  display: inline-flex; align-items: center; gap:4px;
  padding:4px 10px;
  border-radius:var(--r-xl);
  font-size: 11px;
  font-weight: 500;
  font-family: 'IBM Plex Mono', monospace;
  background: var(--grn-bg);
  color: var(--grn);
  border: 0.5px solid var(--grn-lt);
}
.live-badge.loading { background: var(--amber-bg); color: var(--amber); border-color: #fde68a; }
.live-badge.error   { background: var(--red-bg);   color: var(--red);   border-color: var(--red-lt); }
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse-dot 2s ease infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── SCORE BAR ── */
.score-bar {
  height: 3px;
  background: var(--card3);
  border-radius: 2px;
  overflow: hidden;
  margin-top:4px;
}
.score-fill {
  height: 100%;
  width: 100%;
  border-radius: 2px;
  transform-origin: left;
  transition: transform .4s ease;
}
.score-fill.high { background: var(--grn); }
.score-fill.mid  { background: var(--amber); }
.score-fill.low  { background: var(--red); }

/* ── TABS ── */
.tabs {
  display: flex;
  gap:2px;
  margin-bottom:18px;
  border-bottom: 0.5px solid var(--border2);
}
.tab-btn {
  padding:8px 14px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  font-weight: 500;
  font-family: 'IBM Plex Sans', sans-serif;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom:-0.4px;
  transition: color .12s, border-color .12s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.act {
  color: var(--grn);
  border-bottom-color: var(--grn);
}

/* ── MODAL / OVERLAY ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding:20px;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-xl);
  padding:28px;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  position: relative;
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
}
.modal h2 {
  font-size: 17px;
  font-weight: 600;
  color: var(--bright);
  margin-bottom:6px;
  letter-spacing: -.3px;
}
.modal .modal-sub, .modal .msub {
  font-size: 12px;
  color: var(--text2);
  margin-bottom:22px;
  line-height: 1.5;
}
/* .ifu — modificador de input a ancho completo (siempre usado como "inp ifu") */
.inp.ifu { width: 100%; box-sizing: border-box; }
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 0.5px solid var(--border2);
  background: var(--card2);
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  font-size: 14px;
  transition: background .12s;
}
.modal-close:hover { background: var(--red-bg); color: var(--red); }

/* ── DRAWER ── */
.dov {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.2);
  z-index: 200;
  backdrop-filter: blur(2px);
}
.drw {
  position: fixed;
  top: 0; right: -440px;
  width: 420px;
  max-width: 100%;
  height: 100vh; height: 100dvh;
  background: var(--card);
  border-left: 0.5px solid var(--border2);
  z-index: 201;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  transition: right .25s cubic-bezier(.4,0,.2,1);
  overflow: visible;
}
.drw.open { right: 0; }
@media (max-width: 480px) {
  .drw {
    top: auto;
    bottom: -92vh;
    bottom: -92dvh;
    right: 0; left: 0;
    width: 100%;
    height: 92vh;
    height: 92dvh;
    border-left: none;
    border-radius:var(--r-xl) 16px 0 0;
    border-top: 1px solid var(--border);
    transition: bottom .3s cubic-bezier(.4,0,.2,1);
  }
  .drw.open { bottom: 0; right: 0; }
  .drw::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin:10px auto 0;
    flex-shrink: 0;
  }
}
.drw.open ~ .dov, .dov.open { display: block; }
.drwh {
  padding:18px 20px;
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.drwb {
  flex: 1;
  overflow-y: auto;
  padding:18px 20px;
}

/* ── SPINNER ── */
.spin {
  width: 20px; height: 20px;
  border: 2px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
.sk-pulse {
  background: linear-gradient(90deg, var(--card2) 25%, var(--card3,#2a2a3a) 50%, var(--card2) 75%);
  background-size: 200% 100%;
  animation: sk-shimmer 1.4s infinite;
}
@keyframes sk-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes sk-dot {
  from { opacity: .3; transform: scale(.8); }
  to   { opacity: 1;  transform: scale(1.2); }
}
.spin-sm {
  width: 12px; height: 12px;
  border-width: 1.5px;
  border: 1.5px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── SKELETON LOADER ── */
.skel {
  background: linear-gradient(90deg, var(--card3) 25%, var(--card4) 50%, var(--card3) 75%);
  background-size: 200% 100%;
  animation: skel-load 1.4s ease infinite;
  border-radius: 4px;
}
@keyframes skel-load { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }

/* ── GRID LAYOUTS ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap:14px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap:14px; }
.g-sidebar { display: grid; grid-template-columns: 220px 1fr; gap:16px; align-items: start; }
.dload {
  display: flex; align-items: center; justify-content: center;
  gap:10px; padding:40px;
  color: var(--text3); font-size: 12px;
  font-family: 'IBM Plex Mono', monospace;
}

/* ── SKELETON SCREENS ── */
@keyframes skel-shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skel-line {
  border-radius: 4px;
  background: linear-gradient(90deg, var(--card3) 25%, var(--card4) 50%, var(--card3) 75%);
  background-size: 800px 100%;
  animation: skel-shimmer 1.4s ease-in-out infinite;
}
.skel-card {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius:var(--r-lg);
  padding:14px 16px;
  box-shadow: var(--shadow-sm);
}
/* ── ALERT SAAS GRID ── */
.mgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap:12px;
  margin-top:4px;
}
.mc {
  background: var(--card2);
  border: 0.5px solid var(--border);
  border-radius: var(--r-md);
  padding:14px;
}

/* ── WELCOME / LOGIN ── */
.welcome-wrap {
  min-height: 100vh; min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--bg);
  padding:0 24px 40px;
}
.welcome-hero {
  width: 100%;
  max-width: 900px;
  padding:64px 0 40px;
  text-align: center;
}
.welcome-hero h1 {
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 700;
  color: var(--bright);
  letter-spacing: -.03em;
  line-height: 1.15;
  margin-bottom:14px;
}
.welcome-hero h1 span { color: var(--grn); }
.welcome-hero p {
  font-size: 16px;
  color: var(--text2);
  line-height: 1.65;
  max-width: 520px;
  margin:0 auto 32px;
}
.welcome-feats {
  display: flex;
  gap:16px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom:48px;
}
.welcome-feat {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  padding:20px 22px;
  max-width: 220px;
  text-align: left;
  box-shadow: var(--shadow-sm);
}
.welcome-feat-icon { font-size: 22px; margin-bottom:10px; }
.welcome-feat h3 { font-size: 13px; font-weight: 600; color: var(--bright); margin-bottom:4px; }
.welcome-feat p { font-size: 12px; color: var(--text2); line-height: 1.5; margin:0; }
.welcome-plans {
  display: flex;
  gap:14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom:48px;
}
.welcome-plan {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--r-lg);
  padding:22px 24px;
  min-width: 200px;
  text-align: center;
}
.welcome-plan.featured {
  border-color: var(--grn);
  background: var(--grn-bg);
}
.welcome-plan-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom:8px; }
.welcome-plan.featured .welcome-plan-name { color: var(--grn); }
.welcome-plan-price { font-size: 28px; font-weight: 700; color: var(--bright); letter-spacing: -.02em; }
.welcome-plan-price sup { font-size: 14px; font-weight: 500; }
.welcome-plan-price small { font-size: 13px; font-weight: 400; color: var(--text2); }
.welcome-plan-desc { font-size: 12px; color: var(--text2); margin:8px 0 0; line-height: 1.5; }
.welcome-box {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-xl);
  padding:40px 36px;
  max-width: 380px;
  width: 100%;
  box-shadow: var(--shadow-md);
}
.welcome-wrap-b {
  min-height: 100vh; min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr;
  align-items: start;
  background: var(--bg);
  padding:40px 24px 48px;
  gap:32px;
  max-width: 1000px;
  margin:0 auto;
  width: 100%;
}
@media(min-width:768px){
  .welcome-wrap-b { grid-template-columns: 3fr 2fr; gap:48px; align-items: center; }
}
.welcome-col-left { display: flex; flex-direction: column; }
.welcome-col-right { display: flex; flex-direction: column; }
.welcome-ctx-cards { display: flex; gap:10px; flex-wrap: wrap; margin-bottom:24px; }
.welcome-ctx-card {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius:var(--r-md);
  padding:10px 14px;
  min-width: 110px;
  flex: 1;
}
.welcome-logo {
  display: flex; align-items: center; gap:10px;
  margin-bottom:28px;
}
.welcome-icon {
  width: 36px; height: 36px;
  background: var(--grn-solid);
  border-radius: var(--r-sm);
  display: flex; align-items:center; justify-content:center;
  font-size: 13px; font-weight: 700;
  color: #14213D;
}
.welcome-title {
  font-size: 17px; font-weight: 600;
  color: var(--bright); letter-spacing: -.3px;
}
.welcome-sub { font-size: 11px; color: var(--text3); margin-top:1px; }

/* ── WELCOME v3 ────────────────────────────────────────── */
.wv3-outer{min-height: 100vh; min-height: 100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;isolation:isolate}
/* Fondo ASCII animado del hero. Se implementa nativo (canvas 2D + JetBrains
   Mono, la fuente que ya carga la pagina) en vez de instalar un componente de
   registro: este proyecto no tiene React ni build step, y el codigo de ese
   componente no es auditable sin cuenta en el registro.
   Va detras del contenido y no captura eventos. */
/* Globo: textura de fondo del hero, anclado a la izquierda y detras del texto.
   Opacidad baja a proposito — es ambiente, no debe disputarle contraste al
   contenido. El mask lo desvanece antes de la columna de texto. */
#globe-bg{
  position:absolute; top:50%; left:0; transform:translate(-22%,-50%);
  width:min(760px,72vw); height:min(760px,72vw);
  z-index:-1; pointer-events:none; opacity:.62;
  -webkit-mask-image:radial-gradient(circle at 44% 50%, #000 46%, transparent 82%);
  mask-image:radial-gradient(circle at 44% 50%, #000 46%, transparent 82%);
}
/* Sin animacion para quien la desactivo por accesibilidad: se oculta el canvas
   y queda un degradado estatico del mismo tono. */
@media (prefers-reduced-motion: reduce){
  #globe-bg{display:none}
  .wv3-outer{background:radial-gradient(90% 70% at 12% 50%, var(--grn-bg) 0%, var(--bg) 62%)}
}
@media (max-width:900px){
  /* En movil el texto ocupa todo el ancho: el globo estorbaria la lectura. */
  #globe-bg{opacity:.28; transform:translate(-38%,-50%)}
}
.wv3-wrap{flex:1;display:grid;grid-template-columns:1fr;gap:32px;align-items:center;padding:28px 24px 20px;max-width:1100px;margin:0 auto;width:100%}
@media(min-width:900px){.wv3-wrap{grid-template-columns:3fr 2fr;gap:48px;padding:32px 40px 24px}}
.wv3-left{display:flex;flex-direction:column;gap:22px;max-width:560px}
.wv3-right{display:flex;flex-direction:column;align-items:center}
.wv3-badge{display:inline-flex;align-items:center;gap:8px;background:var(--grn-bg);border:1px solid var(--grn-lt);border-radius:var(--r-xl);padding:4px 12px;align-self:flex-start}
.wv3-badge span{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--grn);letter-spacing:.5px}
.wv3-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);flex-shrink:0;animation:wv3pulse 2s ease-in-out infinite}
@keyframes wv3pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.wv3-h1{font-size:clamp(28px,4.5vw,46px);font-weight:700;color:var(--bright);letter-spacing:-.03em;line-height:1.15;margin:0}
.wv3-sub{font-size:15px;color:var(--text2);line-height:1.7;max-width:480px;margin:0}
.wv3-ctx-label{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.wv3-ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wv3-ctx-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px}
.wv3-ctx-ttl{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.wv3-ctx-val{font-size:14px;font-weight:700;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:6px}
.wv3-ctx-hint{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);margin-top:2px}
.wv3-scores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wv3-score-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px}
.wv3-score-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wv3-score-ticker{font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--bright)}
.wv3-score-circle{width:34px;height:34px;border-radius:50%;border:1px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'IBM Plex Mono',monospace;flex-shrink:0}
.wv3-score-rsi{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text2);margin-bottom:4px}
.wv3-score-smas{display:flex;gap:8px;font-size:11px;font-family:'IBM Plex Mono',monospace}
.wv3-scores-note{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);margin-top:6px}
.wv3-feats{display:flex;flex-direction:column;gap:12px}
.wv3-feat{display:flex;align-items:flex-start;gap:10px}
.wv3-feat-icon{flex-shrink:0;margin-top:2px;color:var(--grn);display:flex}
.wv3-feat-icon .ico{width:18px;height:18px}
.wv3-feat-title{font-size:13px;font-weight:600;color:var(--bright);margin-bottom:2px}
.wv3-feat-desc{font-size:12px;color:var(--text2);line-height:1.5}
.wv3-disc{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);line-height:1.7}
.wv3-auth-card{background:var(--card);border:0.5px solid var(--border2);border-radius:var(--r-xl);padding:28px 28px 24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.wv3-auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.wv3-auth-icon{width:34px;height:34px;border-radius:var(--r-md);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wv3-auth-name{font-size:15px;color:var(--text)}
.wv3-auth-name b{color:var(--grn);font-weight:700}
.wv3-tabs{display:grid;grid-template-columns:1fr 1fr;position:relative;background:var(--bg2);border-radius:var(--r-md);padding:4px;margin-bottom:20px}
.wv3-tab-slider{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);background:var(--card);border-radius:var(--r-sm);box-shadow:0 2px 8px rgba(0,0,0,.28);transition:transform .25s cubic-bezier(.4,0,.2,1);pointer-events:none}
.wv3-tab-slider.r{transform:translateX(calc(100% + 4px))}
.wv3-tab-btn{position:relative;z-index:1;padding:8px 0;font-size:12px;font-weight:500;background:transparent;border:none;cursor:pointer;transition:color .15s;font-family:inherit;width:100%}
.wv3-tab-btn.active{color:var(--bright)}
.wv3-tab-btn:not(.active){color:var(--text2)}
.wv3-panel{display:none;flex-direction:column;gap:12px}
.wv3-panel.show{display:flex}
.wv3-field-label{display:block;font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-family:'IBM Plex Mono',monospace}
.wv3-field-wrap{position:relative}
/* 16px es el minimo que evita que iOS haga zoom al enfocar el campo.
   El padding sube a 12px para que la altura llegue al minimo tactil de 44px. */
.wv3-field-wrap input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;font-size:16px;color:var(--bright);outline:none;transition:border-color .15s cubic-bezier(.23,1,.32,1),box-shadow .15s cubic-bezier(.23,1,.32,1);box-sizing:border-box;font-family:inherit}
.wv3-field-wrap input:focus-visible{border-color:var(--grn);box-shadow:0 0 0 3px var(--grn-bg)}
.wv3-field-wrap input::placeholder{color:var(--text3)}
/* padding ampliado para alcanzar el area tactil minima sin cambiar el tamano visual */
.wv3-eye-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);padding:14px 10px;line-height:1;min-height:44px;display:flex;align-items:center}
.wv3-eye-btn:hover{color:var(--text)}
.wv3-forgot{text-align:right;margin-top:4px}
.wv3-forgot a{font-size:11px;color:var(--grn);text-decoration:none}
.wv3-forgot a:hover{text-decoration:underline}
.wv3-submit{width:100%;border-radius:var(--r-md);padding:12px;font-size:13px;font-weight:600;color:#14213D;background:var(--grn-solid);border:none;cursor:pointer;transition:opacity .15s,transform .08s;box-shadow:0 6px 20px -8px var(--grn);font-family:inherit}
.wv3-submit:hover{opacity:.9;transform:translateY(-1px)}
.wv3-submit:active{transform:scale(.98)}
.wv3-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.wv3-err{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--red);display:none;line-height:1.5}
.wv3-legal{font-size:11px;color:var(--text3);text-align:center;line-height:1.6}
.wv3-legal a{color:var(--grn);text-decoration:none;cursor:pointer}
.wv3-legal a:hover{text-decoration:underline}
.wv3-check-row{display:flex;align-items:flex-start;gap:10px;cursor:pointer;min-height:32px}
.wv3-check-row input[type=checkbox]{margin-top:1px;width:18px;height:18px;accent-color:var(--grn);flex-shrink:0;cursor:pointer}
.wv3-check-txt{font-size:12px;color:var(--text2);line-height:1.5}
.wv3-check-txt a{color:var(--grn);text-decoration:none;cursor:pointer}
.wv3-pricing{margin-top:14px;text-align:center;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);line-height:1.9}
.wv3-pricing .wv3-grn{color:var(--grn)}
.wv3-footer{padding:10px 24px;text-align:center;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3)}

.form-label {
  display: block;
  font-size: 11px; font-weight: 500;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom:6px;
}
.form-group { margin-bottom:14px; }
.form-error {
  font-size: 11px; color: var(--red);
  margin-top:6px;
  font-family: 'IBM Plex Mono', monospace;
  display: none;
}

/* ── DARK MODE TOGGLE ── */
.theme-toggle {
  width: 32px; height: 18px;
  border-radius:var(--r-md);
  background: var(--border2);
  border: none; cursor: pointer;
  position: relative;
  transition: background .2s;
  flex-shrink: 0;
}
/* Area de toque real de 44x44: el switch visual queda en 32x18, el hit-area
   invisible lo rodea (native-feel: area-de-toque). */
.theme-toggle::before {
  content: '';
  position: absolute;
  inset: -13px -6px;
}
.theme-toggle.on { background: var(--grn); }
.theme-toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s;
  box-shadow: var(--shadow-sm);
}
.theme-toggle.on::after { transform: translateX(14px); }

/* ── UPGRADE PLAN BADGE ── */
.plan-badge {
  display: inline-flex; align-items: center; gap:4px;
  padding:2px 8px;
  border-radius:var(--r-xl);
  font-size: 11px;
  font-weight: 600;
  font-family: 'IBM Plex Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.plan-free  { background: var(--card3); color: var(--text2); }
.plan-trial { background: var(--amber-bg); color: var(--amber); }
.plan-pro   { background: var(--grn-bg); color: var(--grn); }
.plan-teams { background: var(--blue-bg); color: var(--blue); }

/* ── PAYWALL ── */
.paywall {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 400px; text-align: center;
  padding:40px;
}
.paywall-icon { font-size: 40px; margin-bottom:16px; }
.paywall h2 { font-size: 18px; font-weight: 600; color: var(--bright); margin-bottom:8px; }
.paywall p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom:24px; max-width: 360px; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* Sin esto, CSS Grid usa min-width:auto por default en los items de .resp2 —
   una tabla ancha adentro de una columna (ej. Watchlist de Investigar, 9
   columnas) empuja su track al ancho de su contenido y le roba espacio a la
   columna vecina, en vez de dejarse achicar y scrollear por dentro. La regla
   de mas abajo que hacia esto YA existia pero solo dentro de
   @media(max-width:768px) — a 1024px/1440px (donde .resp2 sigue siendo 2-3
   columnas de verdad, no 1 columna movil) no aplicaba y la grilla se rompia.
   Bug real, confirmado midiendo con getBoundingClientRect: a 1024px el
   Comparador de Investigar quedaba aplastado a ~200px de ancho necesitando
   463px. Unconditional a proposito: no tiene sentido moverse una vez que ya
   cae a 1 columna en movil (max-width:768px, mas abajo). */
.resp2 > div { min-width: 0; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .ph { padding:14px 16px 12px; }
  .page-body { padding:16px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .g-sidebar { grid-template-columns: 1fr; }
  /* responsive collapse for inline 2-col grids with a fixed px sidebar */
  .resp2 { grid-template-columns: 1fr !important; }
  .resp2 > div[style*="border-right"] { border-right: none !important; }
  .grid2 { grid-template-columns: 1fr !important; }
  .krow { grid-template-columns: repeat(2,1fr); }
  table { font-size: 11px; }
  td, th { padding:8px 10px; }
  .tw { overflow-x: auto; min-width: 0; }
  /* La tabla de portfolio tiene 11 columnas: a 375px queda ilegible incluso con
     scroll horizontal. En movil se ocultan las secundarias y quedan las 5 que
     responden "¿cuanto tengo y como va?": Activo, Precio, Δ Hoy, P&L y acciones.
     El detalle completo sigue disponible al abrir el activo. */
  .col-sec { display: none; }
  /* permite que los tracks grid 1fr encojan bajo contenido nowrap (evita overflow) */
  .dash-body, .dash-body > div, .dash-wrap, .fos-card, .resp2, .resp2 > div { min-width: 0; }
  .fos-card { overflow-x: auto; }
  /* headers de módulo: que el botón/acción baje de línea en vez de desbordar */
  .fos-module-header { flex-wrap: wrap; gap:8px; }
  /* ph-right: wrap on small screens so buttons don't overflow */
  .ph-right { flex-wrap: wrap; gap:6px; }
  /* btn-big full width inside modals and locked banners */
  .modal .btn-big, .modal-box .btn-big { width: 100%; }
}
/* Dos columnas para pares de cajas (Escenarios / R:R en Riesgo). Se usaba
   class="grid2" sin ninguna regla, asi que las cajas caian apiladas a lo ancho;
   el usuario lo veia como scroll innecesario. Colapsa a 1 columna en el media
   query de <=900px. */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }


/* ── TOAST NOTIFICATIONS ── */
#toast-container { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); right:calc(24px + env(safe-area-inset-right, 0px)); z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast { display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:var(--r-md); font-size:12px; font-family:'IBM Plex Mono',monospace; color:#fff; min-width:220px; max-width:320px; box-shadow:0 4px 20px rgba(0,0,0,.35); opacity:0; transform:translateY(10px); transition:opacity .25s,transform .25s; pointer-events:auto; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.success { background:var(--grn); }
.toast.error { background:#ef4444; }
.toast.info { background:var(--blue); }
.toast.warning { background:var(--amber); }
.toast-undo { margin-left:auto; flex-shrink:0; background:rgba(255,255,255,.2); border:none; color:#fff; font-weight:700; font-size:11px; padding:8px 12px; border-radius:var(--r-sm); cursor:pointer; }
.toast-undo:hover { background:rgba(255,255,255,.32); }

/* ── @MEDIA PRINT (Radar PDF) ── */
@media print {
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;color:#1a1a1a!important;font-size:10pt!important}
  .sb,.ph-right,.dov,.drw{display:none!important}
  .main{margin:0!important}
  .cb{break-inside:avoid;page-break-inside:avoid;border:0.5pt solid #ddd!important;border-radius:5pt!important}
  .radar-section{break-inside:avoid;margin-bottom:10pt!important}
  @page{size:A4;margin:18mm 15mm 14mm}
}


/* Iconos de linea. stroke:currentColor hace que hereden el color del estado
   (normal / hover / activo) y del tema sin necesidad de variantes. */
.ico {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.ico-lg { width: 22px; height: 22px; }
.ico-xl { width: 40px; height: 40px; }
/* Para icon() insertado en medio de texto corrido (listas de señales unidas por
   " · ", badges de una sola línea): sin esto, el display:block de .ico fuerza
   un salto de línea dentro del flujo inline y rompe el badge. */
.ico-inline { display: inline-block; vertical-align: -2px; }

/* ── FOS PRIMITIVES ── */
.fos-pro-badge {
  display: inline-flex;
  align-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
  padding:1px 4px;
  border-radius: 4px;
  background: rgba(245,158,11,.12);
  color: var(--amber);
  border: 1px solid rgba(245,158,11,.25);
}
.fos-pill {
  display: inline-flex;
  align-items: center;
  gap:4px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding:4px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  white-space: nowrap;
}
.fos-pill--grn { background: var(--grn-bg); border-color: var(--grn-lt); color: var(--grn); }
.fos-pill--amb { background: var(--card); border-color: var(--border2); color: var(--amber); }
.fos-pill--red { background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.2); color: var(--red); }
.fos-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* ── FOS DESIGN SYSTEM ── */
/* borde/radio/sombra/fondo vienen de la base .cb,.fos-card de arriba */
.fos-card { overflow: hidden; }
.fos-section-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); margin-bottom:10px; display: flex; align-items: center; gap:8px; }
.fos-section-label::before { content: ''; display: block; width: 3px; height: 12px; background: var(--grn); border-radius: 2px; }
/* Card section titles — bigger, bolder, white */
.fos-card-title { font-size: 14px; font-weight: 700; color: var(--bright); display: flex; align-items: center; gap:8px; }
.fos-card-title::before { content: ''; display: block; width: 3px; height: 16px; background: var(--grn); border-radius: 2px; flex-shrink: 0; }
/* Page module header */
.dash-page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom:24px; }
/* Igual que .fos-module-crumb (10px MAYUSCULA con letter-spacing): antes el
   breadcrumb del dashboard era 11px minuscula y no matcheaba al resto. */
.dash-page-breadcrumb { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom:var(--sp-3); }
.dash-page-title { font-family: 'Instrument Sans', Georgia, sans-serif; font-size: 27px; font-weight: 600; color: var(--bright); margin:0; line-height: 1.12; letter-spacing: -.01em; }
.dash-page-date { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3); background: var(--card); border: 1px solid var(--border); border-radius:var(--r-md); padding:6px 14px; flex-shrink:0; }
/* .dash-quick/.dash-quick-b (4 accesos rapidos Motor/Indicadores/Riesgo/
   Screener a la altura del titulo) se eliminaron el 13-sep-2026 junto con su
   HTML — duplicaban la pestaña "Analizar" del nav y las pantallas de
   Decidir/Investigar. .dash-head-right queda (sigue envolviendo la fecha). */
.dash-head-right { display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap; justify-content:flex-end; }
.fos-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.fos-table th { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); padding:8px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
.fos-table td { padding:12px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
.fos-table tr:last-child td { border-bottom: none; }
.fos-table tr:hover td { background: var(--card3); }
.fos-score { display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;flex-shrink:0; }
.fos-score--g { background:rgba(61,190,122,.15);color:var(--grn);border:1px solid rgba(61,190,122,.3); }
.fos-score--a { background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25); }
.fos-score--r { background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25); }
/* Serif display SOLO en el titulo de modulo. El contraste serif-title /
   sans-body / mono-datos es lo que da jerarquia de tres niveles y evita que la
   app lea como "dashboard tecnico". Instrument Sans ya es fuente de marca (la landing). */
.fos-module-title { font-family: 'Instrument Sans', Georgia, sans-serif; font-size: 27px; font-weight: 600; color: var(--bright); margin:0 0 var(--sp-3); line-height: 1.12; letter-spacing: -.01em; }
.fos-module-title em { font-style: italic; }
.fos-module-crumb { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom:var(--sp-3); }
.fos-module-sub { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; color: var(--text2); margin:0; line-height: 1.5; }
/* ── DASHBOARD v2 ── */
.dash-wrap { padding:20px 24px; }
.dash-kpi { display: grid; grid-template-columns: repeat(5,1fr); gap:12px; margin-bottom:20px; }
.dash-body { display: grid; grid-template-columns: 1fr 272px; gap:16px; align-items: start; }
.dash-kpi-card { background: var(--card); border: 1px solid var(--border); border-radius:var(--r-lg); padding:18px 20px; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
.dash-kpi-card.kpi-pos { border-top: 2px solid var(--pos); }
.dash-kpi-card.kpi-neg { border-top: 2px solid var(--neg); }
.dash-kpi-card.kpi-neu { border-top: 2px solid var(--border2); }
.dash-kpi-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom:8px; }
.dash-kpi-val { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700; color: var(--bright); line-height: 1; margin-bottom:6px; }
.dash-kpi-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
.dash-ctx-card { background: var(--card); border: 1px solid var(--border); border-radius:var(--r-lg); padding:16px 18px; }
.dash-ctx-loading { font-size: 11px; color: var(--text3); font-family: 'IBM Plex Mono', monospace; padding:12px 0; }
.dash-regime-pill { display: inline-flex; align-items: center; gap:6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; padding:4px 12px; border-radius: var(--r-sm); margin:8px 0 6px; }
.dash-actions { display: grid; grid-template-columns: 1fr 1fr; gap:8px; }
.dash-action-btn { background: var(--card2); border: 1px solid var(--border); border-radius:var(--r-md); padding:12px; cursor: pointer; text-align: left; transition: border-color .15s; }
.dash-action-btn:hover { border-color: var(--grn-lt); }
@media (max-width: 1100px) { .dash-kpi { grid-template-columns: repeat(3,1fr); } }
/* Fila heroe del dashboard: P&L Total domina (1.7fr, 34px) + 4 apoyos. */
.dash-hero-row { display:grid; grid-template-columns:1.7fr 1fr 1fr 1fr; gap:12px; margin-bottom:20px; align-items:stretch; }
.dash-hero-row > .kpi { margin-bottom:0; }
@media (max-width: 1100px) { .dash-hero-row { grid-template-columns:1fr 1fr 1fr; } .dash-hero-row > .kpi.hero { grid-column:1 / -1; } }
@media (max-width: 560px) { .dash-hero-row { grid-template-columns:1fr 1fr; } .dash-hero-row > .kpi.hero { grid-column:1 / -1; } }
@media (max-width: 900px) { .dash-body { grid-template-columns: 1fr; } }
@media (max-width: 768px) {
  .dash-kpi { grid-template-columns: 1fr 1fr; }
  .dash-wrap { padding:14px 16px; }
  /* KPI: número en una línea sin recortarse (override DESPUÉS de la base) */
  .dash-kpi-card { min-width: 0; overflow: hidden; padding:12px 10px; }
  .dash-kpi-val { font-size: 15px; white-space: nowrap; letter-spacing: -0.4px; }
}

/* ── USER PILL ── */
.ua-pill {
  display: flex;
  align-items: center;
  gap:8px;
  padding:8px 8px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background .12s;
  margin-top:4px;
}
.ua-pill:hover { background: var(--card2); }
.ua-av {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--grn-bg);
  border: 1.5px solid var(--grn-lt);
  display: flex; align-items:center; justify-content:center;
  font-size: 11px; font-weight: 600;
  color: var(--grn);
  flex-shrink: 0;
}
.ua-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--bright);
}
.ua-plan {
  font-size: 11px;
  color: var(--text3);
  font-family: 'IBM Plex Mono', monospace;
}

/* ── PAGE BODY PADDING ── */
#main > *:not(.ph):not(.fos-module-header) { padding:0; }
.page-body, #main > div { }

/* content padding — .wv3-outer (pantalla de login) maneja su propio padding
   via .wv3-wrap; sin excluirla, sumaba 28px de este selector genérico a los
   24px propios y en mobile el contenido quedaba mas ancho que la pantalla
   (52px de margen izquierdo, 13px de scroll horizontal fantasma). */
/* Reestructura v3: margen lateral en vez de relleno, para que las tablas y
   tarjetas que son hijas directas de #main no toquen el borde de la ventana
   (antes el relleno quedaba DENTRO de su borde). */
#main > div:not(.ph):not(.fos-module-header):not(.wv3-outer) { padding-top:16px; padding-bottom:16px; margin-left:var(--content-px); margin-right:var(--content-px); min-width:0; }

/* ── DRAWER INNER COMPONENTS ── */
.sigb {
  display: flex; align-items: center; gap:12px;
  padding:12px 14px; border-radius:var(--r-md);
  border: 1px solid var(--border2);
  background: var(--card2); margin-bottom:14px;
}
.sigb.buy  { border-color: var(--gborder); background: var(--gbg); }
.sigb.sell { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
.sigb.hold { border-color: var(--amborder); background: var(--ambg); }

.cha { margin-bottom:14px; overflow: hidden; border-radius:var(--r-md); }
.chl {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .7px; color: var(--text3);
  font-family: 'IBM Plex Mono', monospace; margin-bottom:8px;
}

/* Tab buttons — chart / RSI / MACD / Fundamentals */
.dtab, .rtab {
  padding:4px 12px;
  border: 1px solid var(--border2);
  border-radius:var(--r-sm);
  background: var(--card2);
  color: var(--text2);
  font-size: 11px;
  font-family: 'IBM Plex Mono', monospace;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
  white-space: nowrap;
}
.dtab:hover, .rtab:hover { border-color: var(--orange-bd); color: var(--amber); }
.dtab.on { background: var(--orange-bg); color: var(--amber); border-color: var(--orange-bd); font-weight: 700; }
.rtab.on { background: var(--gbg); color: var(--grn); border-color: var(--gborder); font-weight: 700; }
div:has(>.dtab), div:has(>.rtab) {
  display: flex; flex-wrap: wrap; gap:4px; margin-bottom:10px;
}

/* Indicator 2-column grid (RSI / MACD panels) */
.ind2 {
  display: grid; grid-template-columns: 1fr 1fr;
  gap:8px; margin-bottom:14px;
}
.icard {
  background: var(--card2); border: 1px solid var(--border);
  border-radius:var(--r-md); padding:10px 12px;
}
.icl { font-size: 11px; color: var(--text3); text-transform: uppercase;
  letter-spacing: .6px; font-family: 'IBM Plex Mono', monospace; margin-bottom:4px; }

   de toque real llega a 44x44 con un hit-area invisible (mismo patron que
   theme-toggle/hbg-btn). Antes media ~24px de ancho, acción destructiva. */
.wl-rm-btn { position: relative; }

/* ── AREA TACTIL ─────────────────────────────────────────────────
   Los botones de accion de tabla usan padding:2px inline y quedan muy por
   debajo del minimo tactil de 44px. Solo se agrandan en dispositivos de puntero
   grueso: en escritorio con raton la densidad se conserva intacta.
   No se usa la tecnica de area invisible ampliada porque estos botones van
   adyacentes (editar junto a borrar) y las areas se solaparian: el usuario
   pulsaria borrar apuntando a editar. */
@media (pointer: coarse) {
  .btn, .wv3-eye-btn { min-height: 44px; }
}

/* ── INDICADOR DE FOCO ───────────────────────────────────────────
   Varios controles declaran outline:none inline dentro de plantillas JS, lo que
   deja a quien navega con teclado sin saber donde esta. Una regla normal no los
   alcanza (inline gana), asi que se restaura con !important sobre :focus-visible
   — solo se ve al navegar con teclado, no al hacer clic con el raton. */
:focus-visible {
  outline: 2px solid var(--grn) !important;
  outline-offset: 2px !important;
  border-radius: inherit;
}

/* ── MOVIMIENTO REDUCIDO ─────────────────────────────────────────
   Se usa !important a proposito: es lo unico que tambien neutraliza las
   transiciones declaradas inline (style="...transition:.15s") dentro de las
   plantillas JS, que no se pueden alcanzar desde una hoja de estilos normal.
   No se anula la animacion por completo: se conservan los cambios de opacidad
   (ayudan a comprender el cambio de estado) y solo se elimina el movimiento. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .spin, .spin-sm { animation: none !important; }
}

.skip-link { position:absolute; left:8px; top:-48px; z-index:1000; padding:10px 14px; background:var(--card); color:var(--bright); border:1px solid var(--border2); border-radius:var(--r-sm); font-size:13px; text-decoration:none; }
.skip-link:focus { top:8px; }
body.no-auth .skip-link { display:none; }

.app { display:flex; min-height:100vh; min-height:100dvh; }
.appcol { flex:1; min-width:0; display:flex; flex-direction:column; }

/* Barra lateral */
.side { display:none; }
@media (min-width: 1024px) {
  body:not(.no-auth) .side {
    display:flex; flex-direction:column; flex-shrink:0;
    position:sticky; top:0; height:100vh; height:100dvh;
    width:var(--side-w); padding:12px 12px 10px;
    background:var(--side-bg); color:var(--side-fg);
    border-right:1px solid var(--side-line);
    overflow-y:auto; overflow-x:hidden; z-index:60;
    scrollbar-width:thin;
  }
  body.side-collapsed:not(.no-auth) .side { width:var(--side-wc); padding-left:8px; padding-right:8px; }
}
.side :focus-visible { outline-color: var(--side-mark) !important; }
.side-brand { display:flex; align-items:center; gap:10px; min-height:44px; padding:0 8px 8px; color:var(--side-fg-strong); font-size:14px; white-space:nowrap; }
.side-brand img { width:28px; height:28px; border-radius:var(--r-sm); flex-shrink:0; display:block; }
.side-brand b { font-weight:600; color:var(--side-mark); }
.side-nav, .side-tk { list-style:none; margin:0; padding:0; }
.side-nav { display:flex; flex-direction:column; gap:2px; padding-bottom:12px; }
.side-item {
  position:relative; display:flex; align-items:center; gap:12px; width:100%;
  min-height:44px; padding:0 12px; border:none; border-radius:var(--r-sm);
  background:transparent; color:var(--side-fg); font:inherit; font-size:14px; font-weight:500;
  text-align:left; text-decoration:none; cursor:pointer; white-space:nowrap;
  transition:background .15s, color .15s;
}
.side-item .ico { width:20px; height:20px; }
.side-item:hover { background:var(--side-hover); color:var(--side-fg-strong); }
/* Destino actual: chip Latón de fondo + icono Latón + negrita (sin franja lateral). */
.side-item.act { background:var(--side-act); color:var(--side-fg-strong); font-weight:600; box-shadow:inset 0 0 0 1px rgba(184,134,59,.35); }
.side-item.act .ico { color:var(--side-mark); }
.side-list { border-top:1px solid var(--side-line); padding:14px 0 8px; }
.side-h { margin:0 0 6px; padding:0 12px; font-size:12px; font-weight:600; color:var(--side-fg); letter-spacing:.2px; }
.side-tk-row {
  display:grid; grid-template-columns:minmax(0,1fr) auto 62px; align-items:center; gap:8px; width:100%;
  min-height:36px; padding:0 12px; border:none; border-radius:var(--r-sm); background:transparent;
  color:var(--side-fg); font:inherit; font-size:12px; text-align:left; cursor:pointer;
}
.side-tk-row:hover { background:var(--side-hover); color:var(--side-fg-strong); }
.side-tk-t { font-weight:600; color:var(--side-fg-strong); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.side-tk-p, .side-tk-c { font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
.side-tk-c.pos { color:var(--side-pos); }
.side-tk-c.neg { color:var(--side-neg); }
.side-empty { margin:0; padding:4px 12px 8px; font-size:12px; line-height:1.5; color:var(--side-fg); }
.side-more { display:block; width:100%; min-height:36px; margin-top:4px; padding:0 12px; border:none; background:transparent; color:var(--side-mark); font:inherit; font-size:12px; font-weight:600; text-align:left; cursor:pointer; border-radius:var(--r-sm); }
.side-more:hover { background:var(--side-hover); }
.side-foot { margin-top:auto; border-top:1px solid var(--side-line); padding-top:8px; display:flex; flex-direction:column; gap:2px; }
.side-foot .side-item { font-size:13px; }
.side-chev { transition:transform .2s cubic-bezier(.23,1,.32,1); }
body.side-collapsed .side-chev { transform:rotate(180deg); }
body.side-collapsed .side-lbl, body.side-collapsed .side-list { display:none; }
body.side-collapsed .side-brand { justify-content:center; padding-left:0; padding-right:0; }
body.side-collapsed .side-item { justify-content:center; padding:0; }

/* Franja superior */
.topbar { display:none; }
body:not(.no-auth) .topbar {
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50;
  min-height:var(--topbar-h); padding:8px var(--content-px);
  background:var(--bg); border-bottom:1px solid var(--border);
}
.topbar input { -webkit-user-select:text; user-select:text; }
.tb-dest { display:none; }
.gs { position:relative; flex:1; max-width:440px; display:flex; align-items:center; }
.gs-ico { position:absolute; left:12px; color:var(--text3); pointer-events:none; display:flex; }
.gs-in {
  width:100%; height:40px; padding:0 40px 0 38px; border:1px solid var(--border2); border-radius:var(--r-md);
  background:var(--card); color:var(--bright); font:inherit; font-size:14px; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.gs-in::placeholder { color:var(--text3); }
.gs-in:focus { border-color:var(--bright); box-shadow:0 0 0 3px var(--grn-bg); }
.gs-kbd { position:absolute; right:10px; padding:1px 7px; border:1px solid var(--border2); border-radius:4px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text3); pointer-events:none; }
.gs-in:focus ~ .gs-kbd { display:none; }
.gs-close { display:none; }
.gs-list {
  position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:80; margin:0; padding:6px; list-style:none;
  background:var(--card); border:1px solid var(--border2); border-radius:var(--r-md); box-shadow:var(--shadow-lg);
  max-height:min(420px, 70vh); overflow-y:auto;
}
.gs-opt { display:grid; grid-template-columns:72px minmax(0,1fr) auto; align-items:center; gap:10px; min-height:44px; padding:0 10px; border-radius:var(--r-sm); cursor:pointer; color:var(--text); font-size:13px; }
.gs-opt:hover, .gs-opt.on { background:var(--grn-bg); }
.gs-t { font-weight:600; color:var(--bright); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gs-n { color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gs-s { font-size:12px; color:var(--text3); white-space:nowrap; }
.gs-empty { padding:10px; font-size:13px; color:var(--text2); }
.tb-fresh { margin-left:auto; white-space:nowrap; }
.tb-icon { display:none; }
.acct { position:relative; flex-shrink:0; }
.acct-btn {
  width:40px; height:40px; border-radius:var(--r-md); border:1px solid var(--border2); background:var(--card);
  color:var(--bright); font:inherit; font-size:13px; font-weight:600; letter-spacing:.3px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:border-color .15s, background .15s;
}
.acct-btn:hover, .acct-btn[aria-expanded="true"] { border-color:var(--bright); background:var(--card2); }
.acct-menu {
  position:absolute; right:0; top:calc(100% + 6px); z-index:80; min-width:232px; padding:6px;
  background:var(--card); border:1px solid var(--border2); border-radius:var(--r-md); box-shadow:var(--shadow-lg);
}
.acct-who { padding:8px 10px 10px; font-size:12px; color:var(--text2); border-bottom:1px solid var(--border); margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.acct-it { display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:0 10px; border:none; border-radius:var(--r-sm); background:transparent; color:var(--text); font:inherit; font-size:14px; text-align:left; text-decoration:none; cursor:pointer; }
.acct-it .ico { color:var(--text2); }
.acct-it:hover, .acct-it:focus-visible { background:var(--grn-bg); color:var(--bright); }
.acct-sep { height:1px; margin:6px 4px; background:var(--border); }

/* Cabecera de pagina + pestañas */
.pagehead { display:none; }
body:not(.no-auth) .pagehead { display:block; }
.pagehead-in { max-width:var(--content-max); margin:0 auto; padding:24px var(--content-px) 0; }
.pg-title { margin:0; font-family:'Instrument Sans', Georgia, sans-serif; font-size:28px; font-weight:600; line-height:1.15; letter-spacing:-.01em; color:var(--bright); }
.pagehead:not(.has-tabs) .pagehead-in { padding-bottom:4px; }
/* Un solo componente de pestañas: .ptab para destinos y .tab para filtros
   internos (Tendencia, periodos del Comparador), que eran botones sin estilo. */
.ptabs { display:flex; gap:4px; margin-top:16px; border-bottom:1px solid var(--border2); overflow-x:auto; scrollbar-width:none; }
.ptabs::-webkit-scrollbar { display:none; }
.ptab, .tab {
  position:relative; flex-shrink:0; border:none; background:transparent; cursor:pointer;
  font:inherit; color:var(--text2); white-space:nowrap; transition:color .15s, background .15s;
}
.ptab { min-height:44px; padding:0 14px; font-size:14px; font-weight:500; }
.ptab:hover { color:var(--bright); }
.ptab.act { color:var(--bright); font-weight:600; }
.ptab.act::after { content:''; position:absolute; left:10px; right:10px; bottom:-1px; height:3px; border-radius:2px 2px 0 0; background:var(--laton); }
.tab {
  min-height:32px; padding:0 12px; margin:0 4px 4px 0; font-size:12px; font-weight:500;
  border:1px solid var(--border2); border-radius:var(--r-sm); background:var(--card);
}
.tab:hover { color:var(--bright); border-color:var(--border3); }
.tab.act { color:var(--bright); font-weight:600; background:var(--grn-bg); border-color:var(--bright); }
@media (pointer: coarse) { .tab { min-height:44px; } }

.ph-empty { display:none !important; }
.mkt-to-list { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:8px 0 0; font-size:13px; color:var(--text2); }

/* Barra inferior */
#mob-tab-bar { display:none; }
@media (max-width: 1023px) {
  body:not(.no-auth) #mob-tab-bar {
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:150;
    height:calc(var(--mbar-h) + env(safe-area-inset-bottom, 0px)); padding-bottom:env(safe-area-inset-bottom, 0px);
    background:var(--bg2); border-top:1px solid var(--border);
  }
  body:not(.no-auth) .appcol { padding-bottom:calc(var(--mbar-h) + env(safe-area-inset-bottom, 0px)); }
  /* Movil: titulo del destino en la franja, buscador a pantalla completa. */
  .tb-dest { display:block; flex:1; min-width:0; font-family:'Instrument Sans', Georgia, sans-serif; font-size:20px; font-weight:600; color:var(--bright); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gs { display:none; }
  .tb-icon { display:flex; align-items:center; justify-content:center; width:44px; height:44px; border:none; border-radius:var(--r-md); background:transparent; color:var(--bright); cursor:pointer; flex-shrink:0; }
  .tb-icon .ico { width:20px; height:20px; }
  .tb-fresh { margin-left:0; }
  .acct-btn { width:44px; height:44px; }
  .topbar.gs-open .gs { display:flex; position:absolute; inset:0; max-width:none; padding:8px 8px 8px var(--content-px); background:var(--bg); gap:4px; z-index:5; }
  .topbar.gs-open .gs-ico { left:calc(var(--content-px) + 12px); top:50%; transform:translateY(-50%); }
  .topbar.gs-open .gs-in { height:44px; }
  .topbar.gs-open .gs-kbd { display:none; }
  .topbar.gs-open .gs-close { display:flex; align-items:center; justify-content:center; width:44px; height:44px; flex-shrink:0; border:none; background:transparent; color:var(--bright); cursor:pointer; border-radius:var(--r-md); }
  .topbar.gs-open .gs-list { position:fixed; top:calc(var(--topbar-h) + 4px); left:8px; right:8px; max-height:calc(100dvh - var(--topbar-h) - var(--mbar-h) - 24px); }
  .pagehead-in { padding-top:12px; }
  .pg-title { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  .ptabs { margin-top:0; margin-left:calc(var(--content-px) * -1); margin-right:calc(var(--content-px) * -1); padding:0 calc(var(--content-px) - 8px); }
  .pagehead:not(.has-tabs) .pagehead-in { padding:0; }
}
@media (max-width: 639px) { .tb-fresh { display:none; } }
.mob-tab {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  min-width:0; min-height:44px; padding:0 2px; border:none; background:transparent; cursor:pointer; position:relative;
  color:var(--text2); font:inherit; font-size:12px; font-weight:500; -webkit-tap-highlight-color:transparent;
  transition:color .15s;
}
.mob-tab .ico { width:22px; height:22px; }
.mob-tab span { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mob-tab.act { color:var(--bright); font-weight:600; }
.mob-tab.act::before { content:''; position:absolute; top:0; left:22%; right:22%; height:3px; border-radius:0 0 2px 2px; background:var(--laton); }
@media (max-width: 1023px) {
  body:not(.no-auth) #toast-container { bottom:calc(var(--mbar-h) + 16px + env(safe-area-inset-bottom, 0px)); }
}
/* La ficha del activo (hoja inferior en movil) va por encima de la barra. */
.dov { z-index:200; backdrop-filter:none; background:rgba(13,23,48,.38); }
.drw { z-index:210; }

/* ── PORTAFOLIO · fase 2 (Posiciones, Movimientos, Dividendos, Objetivos) ── */
.pv .pos { color: var(--pos); }
.pv .neg { color: var(--neg); }
.pv .warn-txt, .warn-txt { color: var(--amber); }
.warn-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--amber); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; }
.warn-tag .ico { width: 14px; height: 14px; }
.pv .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
.port-wrap { display: flex; flex-direction: column; gap: 16px; }
.port-wrap > * { margin: 0; min-width: 0; max-width: 100%; }
.pv .fos-table th { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--text2); }
.linkbtn { background: none; border: none; padding: 0; min-height: 32px; font: inherit; color: var(--blue); text-decoration: underline; cursor: pointer; }
.port-muted { font-size: 12px; line-height: 1.55; color: var(--text2); margin: 0; }
.port-h2 { margin: 8px 0 0; font-size: 16px; font-weight: 600; color: var(--bright); }
.port-h3 { margin: 4px 0 8px; font-size: 14px; font-weight: 600; color: var(--bright); }

/* Banda de resumen: una franja con divisores, no tarjetas */
.pband { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; background: var(--card); border: 1px solid var(--border2); border-radius: var(--r-md); }
.pband-6 { grid-template-columns: repeat(3, 1fr); }
.pband-c { padding: 14px 18px; min-width: 0; border-left: 1px solid var(--border); }
.pband-c:first-child { border-left: none; }
.pband-6 .pband-c:nth-child(3n+1) { border-left: none; }
.pband-6 .pband-c:nth-child(n+4) { border-top: 1px solid var(--border); }
.pband-l { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
.pband-v { font-size: 20px; font-weight: 600; color: var(--bright); line-height: 1.2; overflow-wrap: anywhere; }
.pband-hero .pband-v { font-size: 28px; }
.pband-s { font-size: 12px; color: var(--text2); line-height: 1.45; margin-top: 4px; }
@media (max-width: 1023px) {
  .pband { grid-template-columns: 1fr 1fr; }
  .pband-c:nth-child(3) { border-left: none; }
  .pband-c:nth-child(n+3) { border-top: 1px solid var(--border); }
  .pband-6 { grid-template-columns: 1fr 1fr; }
  .pband-6 .pband-c { border-left: 1px solid var(--border); border-top: none; }
  .pband-6 .pband-c:nth-child(odd) { border-left: none; }
  .pband-6 .pband-c:nth-child(n+3) { border-top: 1px solid var(--border); }
}
@media (max-width: 420px) { .pband-c { padding: 12px 14px; } .pband-hero .pband-v { font-size: 24px; } .pband-v { font-size: 18px; } }

.port-cap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: var(--text2); }
.port-cap b { color: var(--bright); font-weight: 600; }
.port-cap b.neg { color: var(--neg); }
.port-cap .inp { width: 160px; min-height: 40px; }
.port-ccy-note { font-size: 12px; color: var(--text2); }
.port-note { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--orange-bg); border-radius: var(--r-md); }
.port-note p { flex: 1; min-width: 220px; margin: 0; font-size: 13px; color: var(--text); line-height: 1.5; }

.port-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.port-bar .btn-big { display: inline-flex; align-items: center; gap: 6px; padding: 0 18px; min-height: 44px; width: auto; }
.port-bar > .btn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.port-add { position: relative; }
.menu { position: absolute; left: 0; top: calc(100% + 6px); z-index: 90; min-width: 200px; padding: 6px; background: var(--card); border: 1px solid var(--border2); border-radius: var(--r-md); box-shadow: var(--shadow-lg); }
.port-ccy { display: flex; gap: 2px; margin-left: auto; padding: 2px; background: var(--card2); border: 1px solid var(--border); border-radius: var(--r-sm); overflow-x: auto; max-width: 100%; }
.port-ccy button { min-height: 36px; min-width: 44px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: var(--text2); font: inherit; font-size: 12px; cursor: pointer; }
.port-ccy button.act { background: var(--card); color: var(--bright); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border2); }
@media (pointer: coarse) { .port-ccy button { min-height: 44px; } }

/* position:relative contiene los .sr-only (absolutos) dentro del scroll de la tabla:
   antes escapaban y ensanchaban la pagina. */
.tw { position: relative; }
.port-table th, .port-table td { white-space: nowrap; padding: 10px 8px; }
.port-table th:first-child, .port-table td:first-child { padding-left: 14px; }
.port-table td { vertical-align: top; }
.port-table .trow { cursor: pointer; }
.port-tk { background: none; border: none; padding: 0; font: inherit; font-weight: 600; color: var(--bright); cursor: pointer; text-align: left; }
.port-tk:hover { text-decoration: underline; }
.port-sub { display: block; font-size: 12px; font-weight: 400; color: var(--text2); margin-top: 2px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.port-strong { font-weight: 600; color: var(--bright); }
.port-stop { width: 100px; min-height: 36px; padding: 4px 8px; font-size: 13px; }
.port-acts { white-space: nowrap; }
.port-ib { padding: 0; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; }
.port-acts .port-ib + .port-ib { margin-left: 4px; }
.port-table tfoot td { font-weight: 600; color: var(--bright); border-top: 1px solid var(--border2); }

/* Movil: filas apiladas en vez de tabla cortada */
.port-stack { display: none; list-style: none; margin: 0; padding: 0; border: 1px solid var(--border2); border-radius: var(--r-md); background: var(--card); }
/* Fase 3: tambien en tableta (768-1023): la tabla de 11 columnas no cabia. */
@media (max-width: 1023px) {
  .port-tw { display: none; }
  .port-stack { display: block; }
  .port-ccy { margin-left: 0; }
}
.ps-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 4px 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
.ps-row:first-child { border-top: none; }
.ps-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 44px; padding: 0; border: none; background: none; text-align: left; font: inherit; color: var(--text); cursor: pointer; }
.ps-l1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 14px; }
.ps-t { font-weight: 600; color: var(--bright); margin-right: auto; }
.ps-l2 { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--text2); }
.ps-l2 b { font-weight: 600; color: var(--text); }
.ps-more { min-height: 44px; }
.ps-edit { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 6px; }
.ps-edit .btn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.ps-stop { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
.ps-stop .port-stop { width: 140px; min-height: 44px; }

.port-div { border: 1px solid var(--border2); border-radius: var(--r-md); background: var(--card); }
.port-div > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 600; color: var(--bright); cursor: pointer; }
.port-div > summary::-webkit-details-marker { display: none; }
.port-div > summary::after { content: ''; width: 8px; height: 8px; border-right: 1.5px solid var(--text2); border-bottom: 1.5px solid var(--text2); transform: rotate(45deg); transition: transform .2s; }
