}

// Sector RS — performance del sector del ticker vs SPY (30 días)
var SECTOR_MAP={
  AAPL:'XLK',MSFT:'XLK',NVDA:'XLK',META:'XLK',GOOGL:'XLK',AMD:'XLK',AVGO:'XLK',CRM:'XLK',
  AMZN:'XLY',TSLA:'XLY',HD:'XLY',NKE:'XLY',
  JPM:'XLF',BAC:'XLF',WFC:'XLF',GS:'XLF',V:'XLF',MA:'XLF',
  JNJ:'XLV',UNH:'XLV',PFE:'XLV',ABBV:'XLV',MRK:'XLV',
  XOM:'XLE',CVX:'XLE',COP:'XLE',
  PG:'XLP',KO:'XLP',WMT:'XLP',COST:'XLP',
  NEE:'XLU',DUK:'XLU',
  CAT:'XLI',HON:'XLI',UPS:'XLI',
  LIN:'XLB',NEM:'XLB',
  AMT:'XLRE',PLD:'XLRE',
};
async function deGetSectorRS(ticker){
  var etf=SECTOR_MAP[ticker];
  if(!etf)return null;
  if(DE_CACHE.sectorRS[etf]&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.sectorRS[etf];
  try{
    var [etfH,spyH]=await Promise.all([fetchHistory(etf,'3mo'),fetchHistory('SPY','3mo')]);
    if(!etfH||etfH.length<22||!spyH||spyH.length<22)return null;
    var etfRet=(etfH[etfH.length-1].close-etfH[etfH.length-22].close)/etfH[etfH.length-22].close;
    var spyRet=(spyH[spyH.length-1].close-spyH[spyH.length-22].close)/spyH[spyH.length-22].close;
    var rs=etfRet-spyRet;
    var label=etf+' '+(rs>=0.02?'rinde más que SPY':rs>=-0.02?'en línea con SPY':'rinde menos que SPY');
    var color=rs>=0.02?'var(--grn)':rs>=-0.02?'var(--text2)':'var(--red)';
    var mult=rs>=0.02?1.2:rs>=-0.02?1.0:0.7;
    var result={etf:etf,rs:rs,label:label,color:color,mult:mult,etfRet:etfRet,spyRet:spyRet};
    DE_CACHE.sectorRS[etf]=result;return result;
  }catch(e){return null;}
}

async function deGetRegime(){
  // Return from cache if < 30 min old
  if(DE_CACHE.regime&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.regime;
  var hist=await fetchHistory('SPY','1y');
  if(!hist||hist.length<55){return{regime:'neutral',label:'Sin datos',color:'var(--text2)',spy:null,sma200:null};}
  var closes=hist.map(function(d){return d.close;});
  var sma200arr=TI.sma(closes,Math.min(200,closes.length));
  var sma50arr =TI.sma(closes,Math.min(50,closes.length));
  var last=closes[closes.length-1];
  var s200=sma200arr[sma200arr.length-1];
  var s50 =sma50arr[sma50arr.length-1];
  var regime,label,color,emoji,desc;
  var pct200=(last-s200)/s200;
  if(last>s200&&s50>s200&&pct200>0.01){
    regime='risk_on';label='Tendencia alcista';color='var(--grn)';emoji='pos';
    desc='SPY y su media de 50 días están sobre la media de 200 días.';
  }else if(last<s200&&s50<s200){
    regime='risk_off';label='Tendencia bajista';color='var(--red)';emoji='neg';
    desc='SPY y su media de 50 días están bajo la media de 200 días.';
  }else{
    regime='neutral';label='En transición';color='var(--amber)';emoji='warn';
    desc='SPY está entre sus medias de 50 y 200 días.';
  }
  var result={regime:regime,label:label,color:color,emoji:emoji,desc:desc,spy:last,sma200:s200,sma50:s50,pct200:pct200,hist:hist};
  DE_CACHE.regime=result;DE_CACHE.lastFetch=Date.now();
  return result;
}

function drawSPYMiniChart(regime){
  try{
    var canvas=document.getElementById('spy-mini-chart');
    if(!canvas) return;
    var ctx=canvas.getContext('2d');
    var rawHist=regime&&regime.hist;
    // Work on a copy sorted oldest→newest — do not mutate regime.hist
    // Se ordenaba por la fecha ya formateada ("jun. 5"), que es alfabetica:
    // "dic." caia antes que "ene.". Se ordena por el timestamp original.
    var hist=rawHist?rawHist.slice().sort(function(a,b){
      var ta=a.t||a.ts||Date.parse(a.date)||0, tb=b.t||b.ts||Date.parse(b.date)||0;
      return ta-tb;
    }):[];
    var closes=hist.map(function(d){return d.close;});
    var hasSMA200=closes.length>=200;
    // Status label
    var statusEl=document.getElementById('spy-mini-status');
    if(statusEl){
      if(!closes.length){statusEl.textContent='No se pudo cargar el contexto SPY.';}
      else if(!hasSMA200){statusEl.textContent='SMA200 no disponible — datos insuficientes.';}
      else{statusEl.textContent=closes[closes.length-1]>=regime.sma200?'SPY sobre SMA200':'SPY bajo SMA200';}
    }
    if(!hasSMA200||!closes.length){
      canvas.style.display='none';
      var lg=canvas.nextElementSibling; if(lg&&lg.classList.contains('mkt-key-l')) lg.style.display='none';
      var fb0=document.getElementById('spy-mini-fallback');
      if(fb0){ fb0.textContent='No hay un año de historia de SPY para dibujar su media de 200 días.'; fb0.hidden=false; }
      return;
    }
    // Compute full SMA200 array (only real 200-period values — no Math.min shortcut)
    var smaArr=[];
    for(var i=0;i<closes.length;i++){
      if(i<199){smaArr.push(null);}
      else{var sum=0;for(var j=i-199;j<=i;j++) sum+=closes[j];smaArr.push(sum/200);}
    }
    // Size canvas for retina
    var dpr=window.devicePixelRatio||1;
    var W=canvas.offsetWidth||canvas.parentElement.offsetWidth||300;
    var H=76;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.scale(dpr,dpr);
    // Price range across both series
    var validSma=smaArr.filter(function(v){return v!=null;});
    var allV=closes.concat(validSma);
    var minP=Math.min.apply(null,allV), maxP=Math.max.apply(null,allV);
    var rng=maxP-minP||1;
    function xOf(i){return 1+(W-2)*(i/(closes.length-1));}
    function yOf(v){return H-4-(H-8)*((v-minP)/rng);}
    // SMA200 line
    var _cs2=getComputedStyle(document.documentElement);
    var _ink=(_cs2.getPropertyValue('--bright')||'').trim()||'#14213D', _lat=(_cs2.getPropertyValue('--laton')||'').trim()||'#B8863B';
    var _sl=(_cs2.getPropertyValue('--blue')||'').trim()||'#3E5A78'; ctx.beginPath(); ctx.strokeStyle=_sl; ctx.lineWidth=1.5; if(ctx.setLineDash) ctx.setLineDash([5,3]);
    var firstSma=true;
    smaArr.forEach(function(v,i){
      if(v==null) return;
      if(firstSma){ctx.moveTo(xOf(i),yOf(v));firstSma=false;}else ctx.lineTo(xOf(i),yOf(v));
    });
    ctx.stroke(); if(ctx.setLineDash) ctx.setLineDash([]);
    // SPY price line
    ctx.beginPath(); ctx.strokeStyle=_ink; ctx.lineWidth=1.5;
    closes.forEach(function(v,i){if(i===0)ctx.moveTo(xOf(i),yOf(v));else ctx.lineTo(xOf(i),yOf(v));});
    ctx.stroke();
    // Current price dot
    var lx=xOf(closes.length-1),ly=yOf(closes[closes.length-1]);
    ctx.beginPath(); ctx.arc(lx,ly,3,0,Math.PI*2); ctx.fillStyle=_ink; ctx.fill();
  }catch(e){
    var fb=document.getElementById('spy-mini-fallback');
    if(fb) fb.style.display='block';
    var mc=document.getElementById('spy-mini-chart');
    if(mc) mc.style.display='none';
  }
}

// ALL_SIG nacio como array estatico: 20 tickers con sig y sc escritos a mano

// Coste acotado: fetchHistory ya cachea en localStorage y deScoreTicker tiene
// DE_CACHE con 30 min de TTL, asi que 20 tickers no son 20 llamadas por carga.
var ALL_SIG_REAL=false;              // true cuando los scores vienen del motor



// Suma al universo los tickers de la watchlist y del portafolio, para que
// sus tablas muestren tendencia y RSI reales y no un "—".
function _allSigIncluirUniverso(){
  var add=function(t){ if(t&&!ALL_SIG.some(function(x){return x.t===t;})) ALL_SIG.push({t:t,sig:null,rsi:null}); };
  (S.watchlist||[]).forEach(function(w){ add(typeof w==='string'?w:(w&&w.ticker)); });
  (S.portfolio||[]).forEach(function(h){ if(h.type!=='Crypto') add(h.t); });
}

// I11: Panorama solo necesita lo que la persona sigue (portafolio + lista).
// El universo de referencia completo se calcula al entrar a Analizar.
var MINE_SIG_REAL=false, _mineSigLoading=false;
function _mineTickers(){
  var out=[];
  (S.portfolio||[]).forEach(function(h){ if(h.type!=='Crypto'&&out.indexOf(h.t)<0) out.push(h.t); });
  (S.watchlist||[]).forEach(function(t){ if(out.indexOf(t)<0) out.push(t); });
  return out;
}
async function loadMineSigScores(){
  if(_mineSigLoading||MINE_SIG_REAL||ALL_SIG_REAL) return;
  _mineSigLoading=true;
  try{

    for(var i=0;i<ts.length;i++){
      try{
        var r=await deScoreTicker(ts[i]);
        var x=ALL_SIG.find(function(y){return y.t===ts[i];});
        if(r&&x){ x.sig=r.trend; x.rsi=r.rsi; n++; }
      }catch(e){}

  }finally{ _mineSigLoading=false; }
}

// Fase 3: UNA serie diaria de un año por ticker, compartida por las lecturas
// (Mi lista, ficha, Mercado) y el grafico de la ficha. Asi el RSI coincide en
// todas las vistas.
var _daily1y={};
function getDaily1y(ticker){
  var c=_daily1y[ticker];
  if(c&&c.data&&(Date.now()-c.ts)<DE_CACHE_TTL) return Promise.resolve(c.data);
  if(c&&c.p) return c.p;
  var p=fetchHistory(ticker,'1y').then(function(h){
    if(h&&h.length>5&&!h[0]._synthetic){ _daily1y[ticker]={data:h,ts:Date.now()}; return h; }
    delete _daily1y[ticker]; return h;
  }).catch(function(){ delete _daily1y[ticker]; return null; });
  _daily1y[ticker]={p:p,ts:Date.now()};
  return p;
}
// Relanzamiento v2 (T18): el motor ya no suma puntos en una nota de 0 a 100
// ni propone niveles de entrada/stop/objetivo. Calcula cada indicador con un
// año de historia y devuelve una lectura por indicador (app/lib/readings.js).
async function deScoreTicker(ticker){
  if(DE_CACHE.scores[ticker]&&(Date.now()-(DE_CACHE.scores[ticker]._ts||0))<DE_CACHE_TTL)return DE_CACHE.scores[ticker];
  var hist=await getDaily1y(ticker);
  if(!hist||hist.length<30)return null;
  var closes=hist.map(function(d){return d.close;});
  var highs=hist.map(function(d){return d.high;});
  var lows=hist.map(function(d){return d.low;});
  var vols=hist.map(function(d){return d.vol;});
  var last=closes[closes.length-1];

  var s50arr=TI.sma(closes,Math.min(50,closes.length));var s50v=s50arr[s50arr.length-1];
  var s200v=closes.length>=200?(function(){var a=TI.sma(closes,200);return a[a.length-1];}()):null;
  var rsi=lastRsi(closes,14);
  var macd=TI.macd(closes);var mhist=macd.hist;
  var mLast=mhist[mhist.length-1];var mPrev=mhist[mhist.length-2];
  var avgVol=vols.slice(-20).reduce(function(a,b){return a+b;},0)/20;
  var lastVol=vols[vols.length-1];
  var volRatio=avgVol>0?lastVol/avgVol:null;
  var atrArr=TI.atr(highs,lows,closes,14);var atr=atrArr[atrArr.length-1]||null;
  var high52=Math.max.apply(null,highs.slice(-Math.min(252,highs.length)));
  var low52=Math.min.apply(null,lows.slice(-Math.min(252,lows.length)).filter(function(v){return v>0;}));
  var sectorRS=null;
  try{ sectorRS=await deGetSectorRS(ticker); }catch(e){}

  var trend=classifyTrend(last,s50v,s200v);
  var readings=buildReadings({last:last,rsi:rsi,s50:s50v,s200:s200v,macdHist:mLast,macdPrev:mPrev,volRatio:volRatio,high52:high52,atr:atr});
  var result={ticker:ticker,last:last,rsi:isFinite(rsi)?Math.round(rsi):null,trend:trend,trendLabel:trendLabel(trend),
    readings:readings,sectorRS:sectorRS,atr:atr,s50v:s50v,s200v:s200v,high52:high52,low52:low52,
    macdHist:mLast,macdPrev:mPrev,volRatio:volRatio,_ts:Date.now()};
  DE_CACHE.scores[ticker]=result;
  return result;
}


async function deGetEarnings(ticker){
  try{
    var ckey='earn_'+ticker;
    var cached=_cacheGet(ckey);
    if(cached) return cached;
    var r=_USE_EDGE
      ? await fetchWithTimeout('/api/quoteSummary?ticker='+encodeURIComponent(ticker)+'&modules=calendarEvents',7000)
      : await fetchWithTimeout('https://api.allorigins.win/raw?url='+encodeURIComponent('https://query1.finance.yahoo.com/v10/finance/quoteSummary/'+ticker+'?modules=calendarEvents'),9000);
    if(!r||!r.ok) return null;
    var data=await r.json();
    var cal=data&&data.quoteSummary&&data.quoteSummary.result&&data.quoteSummary.result[0]&&data.quoteSummary.result[0].calendarEvents;
    if(!cal) return null;
    var dates=cal.earnings&&cal.earnings.earningsDate;
    if(!dates||!dates.length) return null;
    var ts=dates[0].raw*1000;
    var dt=new Date(ts);
    var out={ticker:ticker,date:dt,dateStr:dt.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'}),daysAway:Math.round((ts-Date.now())/86400000)};
    _cacheSet(ckey,out);
    return out;
  }catch(e){return null;}
}

  var pend=tickers.filter(function(t){var c=DE_CACHE.scores[t];return !c&&!LI.loading[t];});

  var idx=0;
  function next(){
    if(idx>=pend.length) return;

function screenerRun(){
  if(S.screenerRunning) return; // evita corridas simultaneas (filas duplicadas)
  scrReadInputs();
  var seen={}, list=String(S.screenerTickers||'').split(/[\s,]+/).map(function(t){return t.trim().toUpperCase();}).filter(function(t){ if(!t||seen[t]) return false; seen[t]=1; return true; });
  if(!list.length){ showToast('Escribe al menos un ticker','warning'); return; }
  var run=(S.screenerRunId||0)+1; S.screenerRunId=run;
  S.screenerResults=[]; S.screenerRunning=true; S.screenerTotal=list.length;
  renderScreenerBody();
  function timeout(ms){return new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);});}
  var idx=0, done=0;
  function push(r){ if(S.screenerRunId!==run) return; S.screenerResults.push(r); clearTimeout(S._scrT); S._scrT=setTimeout(renderScreenerBody,120); }
  function next(){
    if(idx>=list.length) return Promise.resolve();
    var t=list[idx++];
    return Promise.race([deScoreTicker(t),timeout(12000)]).then(function(r){
      push(r?r:{ticker:t,error:true,reason:'no encontrado o sin historia suficiente'});
    }).catch(function(err){
      push({ticker:t,error:true,reason:(err&&err.message==='timeout')?'tardó demasiado':'error al obtener datos'});
    }).then(next);
  }
  Promise.all([next(),next(),next(),next()]).then(function(){
    if(S.screenerRunId!==run) return;
    S.screenerRunning=false; renderScreenerBody();
  });
}

// ── GLOBO DEL HERO ───────────────────────────────────────────────────────
// Globo de puntos dibujado en canvas 2D. Se implementa nativo en vez de
// instalar cobe desde un registro externo: este proyecto no tiene React ni
// build step, y el codigo del componente de aquel registro no es auditable
// sin cuenta. La malla se genera con espiral de Fibonacci (puntos repartidos
// uniformemente sobre la esfera, sin acumularse en los polos) y se rota sobre
// el eje Y; los puntos de la cara oculta se descartan por su normal.
var _globeRAF=null, _globeObs=null;
function globeBgStart(){
  var cv=document.getElementById('globe-bg');
  if(!cv) return;
  // Igual que el hero anterior: renderWelcome puede ejecutarse varias veces y
  // cada vez crea un canvas nuevo. Sin cancelar, el bucle viejo seguiria vivo
  // sobre un canvas desechado y bloquearia el arranque del nuevo.
  if(_globeRAF){ cancelAnimationFrame(_globeRAF); _globeRAF=null; }
  if(_globeObs){ try{ _globeObs.disconnect(); }catch(e){} _globeObs=null; }
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx=cv.getContext('2d'); if(!ctx) return;

  var N=2600, pts=[], phi=Math.PI*(3-Math.sqrt(5));
  for(var i=0;i<N;i++){
    var y=1-(i/(N-1))*2, r=Math.sqrt(Math.max(0,1-y*y)), th=phi*i;
    pts.push([Math.cos(th)*r, y, Math.sin(th)*r]);
  }

  var t=0, dpr=1, W=0, H=0, R=0;
  function medir(){
    var rc=cv.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1,rc.width); H=Math.max(1,rc.height);
    cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    R=Math.min(W,H)*0.42;
  }
  function tinte(){
    var cs=getComputedStyle(document.documentElement);
    return (cs.getPropertyValue('--grn')||'#d8c9a3').trim();
  }
  var col=tinte();

  function pinta(){
    ctx.clearRect(0,0,W,H);
    var cx=W/2, cy=H/2;
    var ct=Math.cos(t), st=Math.sin(t);
    // Inclinacion fija del eje: un globo perfectamente vertical lee como circulo
    var tilt=-0.38, ctl=Math.cos(tilt), stl=Math.sin(tilt);
    for(var i=0;i<N;i++){
      var p=pts[i];
      var x=p[0]*ct - p[2]*st;
      var z=p[0]*st + p[2]*ct;
      var y=p[1]*ctl - z*stl;
      z=p[1]*stl + z*ctl;
      if(z<0) continue;               // cara oculta
      var d=0.55+0.45*z;              // los puntos del frente pesan mas
      ctx.globalAlpha=d*d;
      ctx.fillStyle=col;
      var s=d*2.0;
      ctx.fillRect(cx+x*R-s/2, cy+y*R-s/2, s, s);
    }
    ctx.globalAlpha=1;
    t+=0.0022;
    _globeRAF=requestAnimationFrame(pinta);
  }
  function arranca(){ if(!_globeRAF){ col=tinte(); _globeRAF=requestAnimationFrame(pinta); } }
  function para(){ if(_globeRAF){ cancelAnimationFrame(_globeRAF); _globeRAF=null; } }

  medir();
  window.addEventListener('resize',medir,{passive:true});
  // No gastar bateria pintando lo que no se ve.
  try{
    _globeObs=new IntersectionObserver(function(e){ e[0].isIntersecting?arranca():para(); });
    _globeObs.observe(cv);
  }catch(e){ arranca(); }
  document.addEventListener('visibilitychange',function(){ document.hidden?para():arranca(); });
  arranca();
}

// Responde "¿cómo voy y cuánto arriesgo?": la misma banda de resumen que
// Posiciones, tu riesgo hoy, lo que conviene revisar, tus 5 posiciones de
// mayor peso, el aporte del mes y una línea de contexto que lleva a Mercado.
// Salieron de Hoy: noticias e índices (viven en Mercado), "Mayores
// movimientos" (era una lista fija, se eliminó de la app), la mini-lista
// (está en la barra lateral y en Lista) y la asignación (Portafolio ›
// Posiciones › Diversificación).

// "Para revisar hoy": desde datos reales (ALL_SIG del cálculo de lecturas +
// lista + portafolio). Solo describe datos de lo que la persona ya tiene o
// sigue, sin sugerir operaciones.
function dashFocoCard(port){
  if(!ALL_SIG_REAL && !MINE_SIG_REAL){
    loadMineSigScores().catch(function(){});
  }
  var inPort={}; (port||[]).forEach(function(h){inPort[h.t]=true;});
  var wl=S.watchlist||[];
  var bajo=[], extremos=[];
  if(ALL_SIG_REAL||MINE_SIG_REAL){
    ALL_SIG.forEach(function(s){
      var mio=inPort[s.t]||wl.indexOf(s.t)>=0;
      if(!mio) return;
      if(inPort[s.t]&&s.sig==='DOWN') bajo.push(s);
      if(s.rsi!=null&&(s.rsi>=70||s.rsi<=30)) extremos.push(s);
    });
  }
  function tkChips(arr,conRsi){
    return '<div class="li-chips">'+arr.slice(0,6).map(function(s){
      return '<button type="button" class="tab" onclick="openDrawer(\''+esc(s.t)+'\','+getLivePrice(s.t)+')" aria-label="Abrir la ficha de '+esc(s.t)+'">'+esc(s.t)+(conRsi?' RSI <span class="num">'+s.rsi+'</span>':'')+'</button>';
    }).join('')+'</div>';
  }
  var rows='';
  if(!ALL_SIG_REAL&&!MINE_SIG_REAL){
    rows='<p class="port-muted"><span class="spin-sm"></span> Calculando indicadores con datos históricos…</p>';
  }else if(!bajo.length && !extremos.length){
    rows='<p class="hoy-txt">Ninguna de tus posiciones cotiza bajo sus dos medias y ningún activo que sigues tiene el RSI fuera de la zona 30–70.</p>';
  }else{
    if(bajo.length){
      rows+='<div class="hoy-rev"><p class="hoy-txt">'+bajo.length+(bajo.length===1?' posición cotiza':' posiciones cotizan')+' bajo sus medias de 50 y 200 días</p>'+tkChips(bajo,false)+'</div>';
    }
    if(extremos.length){
      rows+='<div class="hoy-rev"><p class="hoy-txt">'+extremos.length+(extremos.length===1?' activo que sigues tiene':' activos que sigues tienen')+' el RSI fuera de 30–70</p>'+tkChips(extremos,true)+'</div>';
    }
  }
  return '<section class="hoy-sec" aria-labelledby="hoy-rev-h">'+
    '<div class="hoy-sec-h"><h2 class="port-h2" id="hoy-rev-h">Para revisar hoy</h2></div>'+
    rows+
    '<p class="port-muted">Datos para revisar, no instrucciones de compra o venta.</p>'+
  '</section>';
}

function renderDash(){
  var plan=planOf();
  var port=S.portfolio.slice(0,plan.maxT);
  // Precio actual: live si existe, sino el último conocido, sino el costo
  // (evita NaN/"—" mientras cargan los precios o si el fetch falla)
  port.forEach(function(h){h.cur=LIVE[h.t]?LIVE[h.t].price:(h.cur||h.cost);});
  var main=document.getElementById('main');

  // ── Estado vacío (I01): portada de la cuenta nueva ──
  if(port.length===0){
    main.innerHTML='<div class="port-wrap pv">'+seedCleanupBanner()+firstRunEmpty()+'</div>';
    return;
  }

  var T=dashTotals(port);
  var winners=port.filter(function(h){return h.cur>h.cost;}).length;
  var losers=port.filter(function(h){return h.cur<h.cost;}).length;
  var lim=riskConcentrationLimit();
  var real=HOLDINGS_STOP===true;
  var rs=computeRiskAtStop(port.map(function(h){ return {t:h.t,sh:h.sh,cur:h.cur,stop:h.stop}; }),S.capital>0?S.capital:0,lim,{estimateMissing:!real});

  // ── Banda de resumen (mismo componente que Posiciones) ──
  var approx;
  if(T.missing) approx=T.missing+(T.missing===1?' precio cargando':' precios cargando');
  else if(USER_CURRENCY==='USD'){ var lc=localCcy()||'CLP'; var fx=fxIn(T.value,lc); approx=fx?'≈ '+fx:'En USD'; }
  else approx='≈ '+fmtUSD(T.value,0)+' USD';
  var dc=T.day>=0?'pos':'neg', tc=T.total>=0?'pos':'neg';
  var band=heroFig({aria:'Resumen de hoy',label:'Valor de tu portafolio',value:money(T.value,0),sub:numWrap(approx),
    row:[['Hoy','<b class="num '+dc+'">'+money(T.day,0,true)+'</b> <span class="num '+dc+'">'+(T.day>=0?'+':'')+pct(T.dayPct)+'</span>'],
         ['Total','<b class="num '+tc+'">'+money(T.total,0,true)+'</b> <span class="'+tc+'"><span class="num">'+(T.total>=0?'+':'')+pct(T.totalPct)+'</span> sobre lo invertido</span>']]});

  main.innerHTML=
    '<div class="fos-module-header"><div><div class="fos-module-sub"><span class="fresh-m live-badge-wrap">'+liveBadge()+'</span></div></div></div>'+
    '<div class="port-wrap pv hoy">'+
    seedCleanupBanner()+
    band+
    '<div class="hoy-grid">'+dashRiskCard(rs,lim,real)+dashFocoCard(port)+'</div>'+
    dashTopPositions(port,rs,T.value)+
    dashAporteCard()+
    '<p class="hoy-ctx" id="hoy-ctx" aria-live="polite">'+dashCtxHtml(DE_CACHE.regime,DE_CACHE.vix,false)+'</p>'+
    '</div>';

  // Indicador de guardado (invisible, compatibilidad con persist()).
  var savedEl=document.createElement('span');
  savedEl.id='saved';savedEl.style.display='none';
  main.appendChild(savedEl);

  dashLoadContext();
}

var _CCY_BY_REGION={CL:'CLP',MX:'MXN',CO:'COP',AR:'ARS',PE:'PEN'};
function localCcy(){
  if(USER_CURRENCY&&USER_CURRENCY!=='USD') return USER_CURRENCY;
  var m=/-([A-Z]{2})$/i.exec(LOC); var c=m&&_CCY_BY_REGION[m[1].toUpperCase()];

}
function fxIn(usd,ccy){
  var r=FX_RATES[ccy]; if(!r||!isFinite(usd)) return '';
  return (usd<0?'−':'')+(FX_SYMBOLS[ccy]||'$')+fmt(Math.round(Math.abs(usd*r)))+' '+ccy;
}
// Valor, Hoy y Total con precios en vivo. Hoy usa el cambio diario de cada
// cotización; las posiciones sin precio todavía no suman a "Hoy".
function dashTotals(port){
  var value=0,cost=0,day=0,priced=0;
  port.forEach(function(h){
    var lq=LIVE[h.t];
    var px=lq&&lq.price>0?lq.price:null;
    cost+=h.sh*h.cost;
    value+=h.sh*(px||h.cost);
    if(px){ priced++; var cp=lq.changePct||0; var prev=px/(1+cp); day+=h.sh*(px-prev); }
  });
  return {value:value,cost:cost,total:value-cost,totalPct:cost>0?(value-cost)/cost:0,day:day,dayPct:(value-day)>0?day/(value-day):0,priced:priced,missing:port.length-priced};
}
// Tu riesgo hoy: total al stop, posiciones sin stop (no se cuentan) y mayor

// Superficie asesora embebida: sugerencia de rebalanceo dentro de la vista de
// Portfolio (no en una pagina estatica aparte). Solo aparece si el usuario fijo
// objetivos de verdad — sin objetivos guardados el rebalanceo por defecto iguala
// el peso actual (desvio cero) y la sugerencia seria ruido. Umbral 2% para no
// alertar por micro-desvios.
function portRebalHint(port,totM){
  if(!port||!port.length||!(totM>0)) return '';
  if(!Object.keys((REBAL&&REBAL.targets)||{}).length){ try{rebalLoadTargets();}catch(e){} }
  var targets=(REBAL&&REBAL.targets)||{};
  if(!Object.keys(targets).length) return '';
  var drifts=[];
  port.forEach(function(h){
    var t=targets[h.t]; if(t==null) return;
    var cur=getLivePrice(h.t)||h.cur||0;
    var curW=h.sh*cur/totM*100;
    var diff=curW-t; // + sobre el objetivo, - bajo el objetivo
    if(Math.abs(diff)>=2) drifts.push({t:h.t,diff:diff});
  });
  if(!drifts.length) return ''; // alineado con los objetivos
  drifts.sort(function(a,b){return Math.abs(b.diff)-Math.abs(a.diff);});
  var top=drifts[0];
  // Fondo tenue completo, sin franja lateral. Lleva a Portafolio › Objetivos.
  return '<div class="port-note" role="note">'+
    '<p>'+warnTag('Fuera de tus objetivos:')+' '+drifts.length+(drifts.length!==1?' posiciones se desviaron':' posición se desvió')+
    ' más de 2 puntos. La mayor es '+esc(top.t)+' ('+(top.diff>0?'+':'−')+Math.abs(top.diff).toLocaleString(LOC,{maximumFractionDigits:1})+' puntos '+(top.diff>0?'sobre':'bajo')+' su objetivo).</p>'+
    '<button type="button" class="btn" onclick="setPage(\'rebal\')">Ver objetivos</button></div>';
}

var PORT={capEdit:false,editRow:null,divOpen:false,corrLoading:false};

function ccyRate(){ return FX_RATES[USER_CURRENCY]||1; }
// Dinero en la moneda elegida. dec: decimales (por defecto 2 en USD/MXN/PEN y
// 0 en CLP/COP/ARS). signed: antepone + a los positivos.
function money(usd,dec,signed){
  if(usd==null||!isFinite(usd)) return '—';
  var c=USER_CURRENCY, v=usd*ccyRate();
  if(dec==null) dec=(c==='CLP'||c==='COP'||c==='ARS')?0:2;
  if(c==='CLP'||c==='COP'||c==='ARS') dec=0;
  var s=Math.abs(v).toLocaleString(LOC,{minimumFractionDigits:dec,maximumFractionDigits:dec});
  var sym=FX_SYMBOLS[c]||'$';
  return (v<0?'−':(signed&&v>0?'+':''))+sym+s;
}
function ccyNote(){
  if(USER_CURRENCY==='USD') return '';
  return '<p class="port-ccy-note">Cifras en '+USER_CURRENCY+' · 1 USD = '+fmt(ccyRate())+' '+USER_CURRENCY+' · tus montos se guardan en USD</p>';

async function portLoadCorr(){
  var port=S.portfolio.slice(0,planOf().maxT);
  if(port.length<2||PORT.corrLoading) return;
  var tickers=port.map(function(h){return h.t;}).slice(0,8);
  if(tickers.every(function(t){return dHistCache[t+'_60']&&dHistCache[t+'_60'].length>5;})) return;
  PORT.corrLoading=true;
  await Promise.all(tickers.map(async function(t){
    var k=t+'_60';
    if(!dHistCache[k]){
      try{ var h=await fetchHistory(t,'2mo'); if(h&&h.length>5) dHistCache[k]=h; }catch(e){}
    }
  }));
  PORT.corrLoading=false;
  PORT.corrTried=true;
  if(S.page==='port') renderMain();
}
function portDiversificacion(port){
  var corr;
  if(port.length<2) corr='<p class="port-muted">La correlación necesita al menos dos posiciones.</p>';
  else {
    var tickers=port.map(function(h){return h.t;}).slice(0,8);
    var loaded=tickers.every(function(t){return dHistCache[t+'_60']&&dHistCache[t+'_60'].length>5;});
    if(loaded) corr=renderCorrelationMatrix(port);
    else if(PORT.corrTried&&!PORT.corrLoading) corr='<p class="port-muted">No se pudo cargar la historia de precios para calcular la correlación. <button type="button" class="linkbtn" onclick="PORT.corrTried=false;portLoadCorr()">Reintentar</button></p>';
    else corr='<p class="port-muted"><span class="spin-sm"></span> Calculando la correlación con dos meses de cierres…</p>';
  }
  return '<details class="port-div"'+(PORT.divOpen?' open':'')+' ontoggle="portDivToggle(this)">'+
    '<summary>Diversificación</summary>'+
    '<div class="port-div-b">'+dashAllocBar(port)+
    '<h3 class="port-h3">Correlación entre tus posiciones</h3>'+
    '<p class="port-muted">Cómo se movieron juntos sus precios en los últimos dos meses: 1 es igual, 0 es independiente, −1 es opuesto.</p>'+corr+
    '</div></details>';
}

function renderPort(){
  var plan=planOf();
  if(!S.portfolio.length){
    document.getElementById("main").innerHTML=seedCleanupBanner()+firstRunEmpty();
    return;
  }
  var port=S.portfolio.slice(0,plan.maxT);
  port.forEach(function(h){h.cur=LIVE[h.t]?LIVE[h.t].price:(h.cur||h.cost);});
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);

function updateCap(v){

function saveRuleSettings(){
  var fields=[
    ['set-capital',function(v){return v>0;},'Escribe un capital mayor que 0.'],
    ['set-risk',function(v){return v>=0.1&&v<=10;},'El riesgo por operación va de 0,1 % a 10 %.'],
    ['set-limit',function(v){return v>=5&&v<=100;},'El límite de concentración va de 5 % a 100 %.']
  ];
  var vals={}, firstBad=null;
  var ok=document.getElementById('set-rule-ok'); if(ok) ok.innerHTML='';
  fields.forEach(function(f){
    var i=document.getElementById(f[0]), e=document.getElementById(f[0]+'-err');
    var raw=i?String(i.value).trim():'', v=parseFloat(raw.replace(',','.'));
    var good=raw!==''&&isFinite(v)&&f[1](v);
    if(good){ vals[f[0]]=v; if(i) i.removeAttribute('aria-invalid'); if(e){ e.hidden=true; e.innerHTML=''; } }
    else {
      if(i) i.setAttribute('aria-invalid','true');
      if(e){ e.innerHTML=icon('warning','ico-inline')+(raw===''?'Este campo no puede quedar vacío. ':'')+f[2]; e.hidden=false; }
      if(!firstBad) firstBad=i;
    }
  });
  if(firstBad){ firstBad.focus(); return false; }
  updateCap(vals['set-capital']);
  saveRiskRule(vals['set-risk'],vals['set-limit']);
  PB.capital=0; PB.risk=0; // la calculadora vuelve a tomar los valores guardados
  if(ok) ok.innerHTML=icon('check','ico-inline')+'Guardado';
  showToast('Tu regla quedó guardada');
  return true;
}
// ── PORTAFOLIO › MOVIMIENTOS (ex Bitácora + Analizador de Bitácora) ──────
// Las operaciones se guardan en este navegador (persistTrades). El rendimiento
// junta lo que calculaban la Bitácora y el analizador del simulador: tasa de
// acierto, factor de beneficio, promedios, resultado medio, mayor caída y el
// detalle por activo.
function movStats(sells){
  var wins=sells.filter(function(t){return t.pnl>0;});
  var losses=sells.filter(function(t){return t.pnl<0;});
  var sumW=wins.reduce(function(s,t){return s+t.pnl;},0);
  var sumL=Math.abs(losses.reduce(function(s,t){return s+t.pnl;},0));
  var total=sells.reduce(function(s,t){return s+(t.pnl||0);},0);
  var sorted=sells.slice().sort(function(a,b){return (a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:a.id-b.id;});
  var cum=0,peak=0,maxDD=0;
  sorted.forEach(function(t){ cum+=(t.pnl||0); if(cum>peak) peak=cum; if(peak-cum>maxDD) maxDD=peak-cum; });
  var byT={};
  sells.forEach(function(t){
    var k=t.ticker||'—';
    if(!byT[k]) byT[k]={t:k,n:0,w:0,l:0,pnl:0};
    byT[k].n++; byT[k].pnl+=(t.pnl||0);
    if(t.pnl>0) byT[k].w++; else if(t.pnl<0) byT[k].l++;
  });
  return {
    n:sells.length, wins:wins.length, losses:losses.length,
    winRate:sells.length?wins.length/sells.length:null,
    profitFactor:(sumL>0&&wins.length)?sumW/sumL:null,
    avgWin:wins.length?sumW/wins.length:null,
    avgLoss:losses.length?sumL/losses.length:null,
    avgPerTrade:sells.length?total/sells.length:null,
    maxDD:maxDD, total:total,
    byTicker:Object.keys(byT).map(function(k){return byT[k];}).sort(function(a,b){return b.pnl-a.pnl;})
  };
}

// renderInvestigar): un re-render debe dispararse desde cualquiera de las
// tres, no solo desde 'watch' — antes de renderInvestigar cada una vivia
// aislada y este chequeo bastaba con 'watch'.
function isInvestigarPage(p){ p=p||S.page; return p==='watch'||p==='screener'||p==='comp'; }
function addWatch(t){
  if(S.watchlist.indexOf(t)<0){
    S.watchlist.push(t);persist();
    sbAddWatch(t);
    showToast(t+' agregado a tu lista');
    if(isInvestigarPage()) renderMain();
  }
}
function rmWatch(t){
  // A diferencia de borrar una posicion del portfolio (que pide confirmacion),
  // sacar un ticker de la watchlist es reversible al toque: se puede deshacer
  // desde el propio toast en vez de interrumpir con un modal.
  var idx=S.watchlist.indexOf(t);
  S.watchlist=S.watchlist.filter(function(x){return x!==t;});
  persist();
  sbRmWatch(t);
  showToast(t+' quitado de tu lista','warning',function(){
    if(S.watchlist.indexOf(t)<0){
      S.watchlist.splice(Math.min(idx,S.watchlist.length),0,t);
      persist();
      sbAddWatch(t);
      showToast(t+' restaurado');
      if(isInvestigarPage()) renderMain();
    }
  });
  if(isInvestigarPage()) renderMain();
}

var LIVE_NEWS=[];

// ── MARKET BAR ─────────────────────────────────────────────────
// _barFetched pasó de booleano "ya lo intenté" a createLoadGate() el
// 13-sep-2026: la version vieja marcaba _barFetched=true tambien dentro del
// catch(e) de fallo, asi que un solo timeout de /api/marketbar dejaba los
// indices (S&P/Dow/Nasdaq/VIX/Bitcoin) en "sin dato" para el resto de la
// sesion, sin reintentar nunca — bug confirmado navegando: a veces cargaban,
// a veces se quedaban pegados. El gate reintenta solo despues de 20s si el
// intento anterior fallo, en vez de rendirse para siempre.
var MARKET_BAR=[];
var MARKET_BAR_TS=0; // hora de consulta (la fuente no informa la hora de cada simbolo)
var _barGate=createLoadGate(20000);
function barIsLoading(){ return _barGate.isLoading(); }

// Devuelve true solo si MARKET_BAR quedo con datos nuevos (cache valida o
// fetch exitoso) — false en cualquier otro caso (cooldown, _USE_EDGE=false,
// fallo de red). Antes esta funcion siempre "resolvia" (nunca rechazaba al
// caller, tragaba sus propios errores) y renderMercado() llamaba
// renderMain() en el .then() incondicionalmente — eso recreaba el mismo
// "render -> pedir datos -> settle casi instantaneo -> renderMain -> render
// de nuevo" en bucle apretado cada vez que la respuesta no tenia datos
// (cooldown activo o _USE_EDGE=false), sin importar que el gate ya evitara
// llamadas de red repetidas. El valor de retorno le permite al caller no
// volver a renderizar cuando no hubo nada nuevo que mostrar.
async function fetchMarketBar(){
  try{
    var cached=JSON.parse(localStorage.getItem('mv_market_bar')||'null');
    if(cached&&(Date.now()-cached.ts)<3*60*1000&&cached.items&&cached.items.length){
      MARKET_BAR=cached.items;MARKET_BAR_TS=cached.ts;return true;
    }
  }catch(e){/* silent */}
  try{
    await _barGate.run(async function(){
      // _USE_EDGE=false (dominio sin funciones edge, ej. localhost o un
      // preview fuera de la lista) tiene que pasar por el gate igual que un
      // fallo de red real — si no, _barGate.isLoading() nunca refleja nada
      // y el caller reintenta en cada render (ver nota de retorno arriba).
      if(!_USE_EDGE) throw new Error('edge_unavailable');
      var res=await fetchWithTimeout('/api/marketbar',7000);
      if(!res.ok) throw new Error('marketbar '+res.status);
      var data=await res.json();
      if(data.items&&data.items.length){
        MARKET_BAR=data.items;MARKET_BAR_TS=data.fetchedAt||Date.now();
        localStorage.setItem('mv_market_bar',JSON.stringify({ts:MARKET_BAR_TS,items:MARKET_BAR}));
      }
      return data;
    });
    return MARKET_BAR.length>0;
  }catch(e){
    if(e&&e.message!=='cooldown'&&e.message!=='edge_unavailable') trackError('marketbar',e);
    return false;
  }
}

// _newsFetched: mismo fix que _barGate arriba — antes era una bandera que se
// marcaba true tambien en el catch(e) de fallo, dejando el feed de noticias
// (y por eso tambien MARKET_BAR, ver renderMercado) sin reintentar nunca
// mas tras un solo error de red.
var _newsGate=createLoadGate(20000);
function newsIsLoading(){ return _newsGate.isLoading(); }

// Mismo contrato de retorno que fetchMarketBar (ver su comentario): true
// solo si LIVE_NEWS quedo con datos nuevos, false en cooldown/fallo/
// _USE_EDGE=false — para que el caller no re-renderice sin necesidad.
async function fetchLiveNews(){
  // Check localStorage cache first (15 min TTL)
  try{
    var cached=JSON.parse(localStorage.getItem('mv_live_news')||'null');
    if(cached&&(Date.now()-cached.ts)<15*60*1000&&cached.items.length){
      LIVE_NEWS=cached.items;return true;
    }
  }catch(e){/* silent */}
  try{
    await _newsGate.run(async function(){
      if(!_USE_EDGE) throw new Error('edge_unavailable');
      var tickers=['SPY','QQQ','NVDA','AAPL','AMZN','META','MSFT','GLD','BTC-USD'];
      S.portfolio.slice(0,5).forEach(function(h){if(tickers.indexOf(h.t)<0)tickers.unshift(h.t);});
      var res=await fetchWithTimeout('/api/news?tickers='+tickers.slice(0,12).join(','),8000);
      if(!res.ok) throw new Error('news api '+res.status);
      var data=await res.json();
      if(data.items&&data.items.length){
        LIVE_NEWS=data.items;
        localStorage.setItem('mv_live_news',JSON.stringify({ts:Date.now(),items:LIVE_NEWS}));
      }
      return data;
    });
    return LIVE_NEWS.length>0;
  }catch(e){
    if(e&&e.message!=='cooldown'&&e.message!=='edge_unavailable') trackError('news',e);
    return false;
  }
}

function getNewsData(){
  // Solo noticias en vivo. Ya no se anexa NEWS_DATA (era ficticio): si el feed
  // no responde se devuelve [] y la vista muestra un empty state honesto.
  return LIVE_NEWS.length?LIVE_NEWS.slice():[];
}

async function confirmDeleteAccount(){
  var btn=document.getElementById('da-btn');
  var err=document.getElementById('da-err');
  if(err){ err.style.display='none'; }
  if(btn){ btn.disabled=true; btn.textContent='Eliminando…'; }

    var sess=await sb.auth.getSession();
    var tok=sess&&sess.data&&sess.data.session&&sess.data.session.access_token;
    if(!tok){ throw new Error('Inicia sesión de nuevo para poder eliminar tus datos.'); }
    var res=await fetch('/api/delete-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})});
    var data=await res.json().catch(function(){return {};});
    if(!res.ok||!data.ok){
      throw new Error(data.error||'No se pudieron eliminar tus datos. Intenta de nuevo o escribe a invest@moyiq.app.');
    }
    // Los datos de Invest ya no existen en el servidor: cerrar sesión y volver
    // a la landing (la cuenta de acceso sigue viva para MOY IQ).
    if(typeof stopBoot==='function') stopBoot();
    try{ await sb.auth.signOut(); }catch(e){}

  }catch(e){
    if(err){ err.textContent=e.message||'Error de conexión. Intenta de nuevo.'; err.style.display='block'; }

  }
}

// Niveles propuestos a partir de datos que la app YA tiene del usuario, para no
// fijar el objetivo a ciegas. Cada chip dice de donde sale el numero: sin la
// razon visible seria un numero magico y el usuario no podria juzgarlo.
// Solo se ofrecen niveles coherentes con la direccion elegida: un objetivo por
// encima del precio actual no tiene sentido en una alerta de bajada.
function alSugerencias(tk,ty,cur){
  var cont=document.getElementById('al-sug'); if(!cont) return;
  var sug=[];
  try{
    var pos=(S.portfolio||[]).find(function(h){return h.t===tk;});
    if(pos&&pos.cost>0) sug.push({v:pos.cost, txt:'tu coste medio'});
    var lq=(typeof LIVE==='object')?LIVE[tk]:null;
    if(lq&&lq.low52>0) sug.push({v:lq.low52, txt:'mínimo 52 semanas'});
    if(cur>0){
      sug.push({v:cur*0.9,  txt:'−10% desde hoy'});
      sug.push({v:cur*1.1,  txt:'+10% desde hoy'});
    }
  }catch(e){}
  // Max = avisar al subir -> solo niveles por encima. Min = al bajar -> por debajo.
  sug=sug.filter(function(s){
    return isFinite(s.v)&&s.v>0&&(ty==='Max'? s.v>cur : s.v<cur);
  });
  // Quitar duplicados muy proximos entre si (mismo nivel por dos motivos)
  var vistos=[];
  sug=sug.filter(function(s){
    var dup=vistos.some(function(v){return Math.abs(v-s.v)/s.v<0.005;});
    if(!dup) vistos.push(s.v);
    return !dup;
  });
  if(!sug.length){ cont.innerHTML=''; return; }
  cont.innerHTML='<div style="font-size:11px;color:var(--text3);margin-bottom:5px">Niveles sugeridos según tus datos</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:5px">'+
    sug.map(function(s){
      return '<button type="button" class="btn" style="padding:3px 9px;font-size:11px" '+
        'onclick="document.getElementById(\'al-pr\').value='+s.v.toFixed(2)+';alSync()">'+
        '$'+fmtD(s.v)+' <span style="color:var(--text3)">· '+s.txt+'</span></button>';
    }).join('')+'</div>';
}

  var tk=(document.getElementById('al-tk')||{}).value||'';

}





// Autofill "Precio actual" en el modal de posición. Type==="Crypto" usa
// /api/crypto (CoinGecko); el resto sigue por /api/quote (Yahoo) via fetchQuote.
// Compartida entre el input de ticker y el select de tipo: cambiar cualquiera
// de los dos debe re-resolver el precio con la fuente correcta.
function posAutofillPrice(){
  var tEl=document.getElementById('pt'),tyEl=document.getElementById('pty'),el=document.getElementById('pcur');
  if(!tEl||!el)return;
  var t=(tEl.value||"").toUpperCase().trim();
  if(!t)return;
  var isCrypto=tyEl&&tyEl.value==='Crypto';
  if(LIVE[t]&&!isCrypto){el.value=LIVE[t].price.toFixed(2);return;}
  var p=isCrypto?fetchCryptoQuote(t):fetchQuote(t);
  p.then(function(q){
    if(!q)return;
    // Ticker y tipo pedidos en esta llamada — el usuario pudo haber tipeado
    // otro ticker o cambiado Stock↔Crypto mientras la request estaba en vuelo.
    // Sin este chequeo, una respuesta de Yahoo que tarda más que la de
    // CoinGecko (o viceversa) puede llegar después y pisar el precio correcto
    // con uno de la fuente equivocada (mismo ticker, forma de datos distinta).
    var tNow=document.getElementById('pt'),tyNow=document.getElementById('pty');
    if(!tNow||!el)return;
    var curT=(tNow.value||"").toUpperCase().trim();
    var curIsCrypto=tyNow&&tyNow.value==='Crypto';
    if(curT!==t||curIsCrypto!==isCrypto)return;
    LIVE[t]=q;el.value=q.price.toFixed(2);
  });
}

async function savePos(id){
  var t=(document.getElementById("pt").value||"").toUpperCase().trim();
  var type=document.getElementById("pty").value;
  var sh=parseFloat(document.getElementById("ps").value||"");
  var cost=parseFloat(document.getElementById("pc").value||"");
  var cur=parseFloat(document.getElementById("pcur").value||"");
  var stopEl=document.getElementById("pstop");
  var stop=stopEl?parseFloat(stopEl.value||""):NaN;
  stop=stop>0?stop:null;
  var err=document.getElementById("perr");
  if(!t){err.style.display="block";err.textContent="Ticker requerido";return;}
  if(!sh||sh<=0){err.style.display="block";err.textContent="Unidades no válidas";return;}
  if(!cost||cost<=0){err.style.display="block";err.textContent="Precio de entrada inválido";return;}
  if(!cur||cur<=0) cur=(LIVE[t]&&LIVE[t].price)||cost; // sin cotización aún: se usa la entrada hasta que llegue
  if(id===-1){
    var h={id:S.nextId++,t:t,type:type,sh:sh,cost:cost,cur:cur,stop:stop};
    S.portfolio.push(h);
    sbAddHolding(h).then(function(realId){if(realId){h.id=realId;persist();}}).catch(function(){});
  } else {
    var idx=S.portfolio.findIndex(function(p){return p.id===id;});
    if(idx>=0){
      S.portfolio[idx]=Object.assign({},S.portfolio[idx],{type:type,sh:sh,cost:cost,cur:cur},stopEl?{stop:stop}:{});
      sbUpdateHolding(S.portfolio[idx]);
    }
  }
  persist();
  REBAL.targets={}; // reset rebalancing targets when portfolio changes
  S.modal=null;S.editPos=null;
  document.getElementById("mroot").innerHTML="";
  showToast(id===-1?'Posición agregada':'Posición actualizada');
  renderMain(); // fast partial re-render
}

function saveTrade(){
  var type=document.getElementById("tr_type").value;
  var ticker=(document.getElementById("tr_ticker").value||"").toUpperCase().trim();
  var price=parseFloat(document.getElementById("tr_price").value||"");
  var qty=parseFloat(document.getElementById("tr_qty").value||"");
  var amount=parseFloat(document.getElementById("tr_amount").value||"");
  var date=document.getElementById("tr_date").value;
  var rsi=parseFloat(document.getElementById("tr_rsi").value||"")||null;
  var note=document.getElementById("tr_note").value.trim();
  var err=document.getElementById("trerr");

  var needsTicker=["buy","sell","dividend"].indexOf(type)>=0;
  if(needsTicker&&!ticker){err.style.display="block";err.textContent="Escribe el ticker.";return;}
  if(!amount||amount<=0){err.style.display="block";err.textContent="Escribe el monto total.";return;}
  if(!date){err.style.display="block";err.textContent="Elige la fecha.";return;}

  // For buy/sell compute qty if missing
  if(["buy","sell"].indexOf(type)>=0&&(!qty||qty<=0)&&price>0) qty=amount/price;

  // Fase 3: la operacion AJUSTA la posicion (app/lib/holdings.js). El
  // resultado de una venta se mide contra la entrada de la posicion.
  var pos=ticker?S.portfolio.find(function(h){return h.t===ticker;}):null;
  var adj=(type==='buy'||type==='sell')&&ticker?applyTrade(pos||null,{type:type,qty:qty,price:price,amount:amount}):{action:'none'};
  var pnl=(type==='sell'&&adj.pnl!=null)?adj.pnl:null;

  loadTrades();loadAlerts();
  S.trades.push({
    id:S.tradeNextId++,
    ticker:needsTicker?ticker:null,
    type:type,
    date:date,
    price:price||null,
    qty:qty||null,
    amount:amount,
    rsi:rsi,
    note:note,
    pnl:pnl,
  });
  persistTrades();

  var creoPosicion=false, cerrar=null;
  if(adj.action==='create'){
    var nuevo={id:S.nextId++, t:ticker, type:/-USD$/.test(ticker)?'Crypto':'Stock', sh:adj.sh, cost:adj.cost, cur:price||adj.cost, stop:null};
    S.portfolio.push(nuevo);
    creoPosicion=true;
    if(typeof sbAddHolding==='function'&&!S.demoMode){
      sbAddHolding(nuevo).then(function(realId){ if(realId){ nuevo.id=realId; persist(); } }).catch(function(){});
    }
    persist();
  } else if(adj.action==='update'&&pos){
    // Mismo objeto que leen Posiciones, Hoy y la ficha: el stop queda intacto.
    pos.sh=adj.sh; pos.cost=adj.cost;
    if(!S.demoMode) sbUpdateHolding(pos);
    persist();
  } else if(adj.action==='close'&&pos){
    // Vendio todas las unidades: se confirma con el mismo flujo de "Eliminar".
    cerrar=pos;
  }

  closeModal();
  showToast(creoPosicion?ticker+' agregado a tu portafolio':'Operación registrada en Movimientos');
  setPage("bitacora");
  if(cerrar){ showToast('Vendiste todas tus unidades de '+ticker+'. Confirma si la quitas del portafolio.','info'); openModal('delpos',cerrar); }
}

function pearson(a,b){
  var n=Math.min(a.length,b.length);
  if(n<5) return null;
  var ax=a.slice(-n),bx=b.slice(-n);
  var ma=ax.reduce(function(s,v){return s+v;},0)/n;
  var mb=bx.reduce(function(s,v){return s+v;},0)/n;
  var num=0,da=0,db=0;
  for(var i=0;i<n;i++){var ra=ax[i]-ma,rb=bx[i]-mb;num+=ra*rb;da+=ra*ra;db+=rb*rb;}
  var denom=Math.sqrt(da)*Math.sqrt(db);
  return denom===0?null:num/denom;
}

function corrColor(r){
  if(r===null) return 'var(--card3)';
  var abs=Math.abs(r);
  if(r>0.7) return 'rgba(239,68,68,0.5)';
  if(r>0.4) return 'rgba(234,179,8,0.4)';
  if(r>0.1) return 'rgba(255,255,255,0.08)';
  if(r>-0.1) return 'rgba(255,255,255,0.04)';
  if(r>-0.4) return 'rgba(59,130,246,0.2)';
  return 'rgba(34,197,94,0.3)';
}

function openDrawer(ticker,curPrice){
  var wasOpen=document.getElementById('drw').classList.contains('open');
  if(!wasOpen) _drwLastFocus=document.activeElement;
  dTicker=ticker; dTab='ind';
  var price=curPrice||getLivePrice(ticker)||null;
  renderDrawerHead(ticker,price);
  document.getElementById('dov').classList.add('open');
  var drw=document.getElementById('drw');
  drw.classList.add('open');
  drw.setAttribute('role','dialog'); drw.setAttribute('aria-modal','true'); drw.setAttribute('aria-labelledby','drw-title');
  document.body.style.overflow='hidden';
  renderDrawerBody();
  var bd=document.getElementById('drwb'); if(bd) bd.scrollTop=0;
  setTimeout(function(){ var c=document.getElementById('drw-close'); if(c) c.focus(); },40);
  loadDrawerHistory(ticker);
  if(!DE_CACHE.scores[ticker]) deScoreTicker(ticker).then(function(){ if(dTicker===ticker) renderDrawerBody(); }).catch(function(){});
  if(!dFundCache[ticker]){
    try{ var _lsf=localStorage.getItem('ff_'+ticker); if(_lsf){var _pf=JSON.parse(_lsf);if(_pf&&_pf.ts&&(Date.now()-_pf.ts)<3600000&&_pf.data) dFundCache[ticker]=_pf.data;} }catch(e){}
  }
  if(!dEarnCache[ticker]){
    try{ var _lse=localStorage.getItem('fe_'+ticker); if(_lse){var _pe=JSON.parse(_lse);if(_pe&&_pe.ts&&(Date.now()-_pe.ts)<14400000&&_pe.data) dEarnCache[ticker]=_pe.data;} }catch(e){}
  }
  if(!dFundCache[ticker]){
    fetchFundamentals(ticker).then(function(f){ if(f){ dFundCache[ticker]=f; if(dTicker===ticker){ renderDrawerHead(ticker); if(dTab==='fund') renderDrawerBody(); } } }).catch(function(){});
  }
  if(!dEarnCache[ticker]){
    fetchEarningsData(ticker).then(function(e){ if(e&&dTicker===ticker&&dTab==='fund') renderDrawerBody(); }).catch(function(){});
  }
  if(!LIVE[ticker]){
    fetchQuote(ticker).then(function(q){ if(q){ LIVE[ticker]=q; if(dTicker===ticker){ renderDrawerHead(ticker,q.price); renderDrawerBody(); } } }).catch(function(){});
  }
}

function drwRsiSvg(vals){
  var W=400,H=80,n=vals.length;
  var y=function(v){return H-(v/100)*H;};
  var pts=vals.map(function(v,i){return v==null?null:(i/Math.max(n-1,1)*W).toFixed(1)+','+y(v).toFixed(1);}).filter(Boolean).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="drw-sub-svg" aria-hidden="true">'+
    '<rect x="0" y="'+y(70)+'" width="'+W+'" height="'+(y(30)-y(70))+'" fill="var(--grn-bg)"/>'+
    '<line x1="0" x2="'+W+'" y1="'+y(70)+'" y2="'+y(70)+'" stroke="var(--border3)" stroke-dasharray="4,3"/>'+
    '<line x1="0" x2="'+W+'" y1="'+y(30)+'" y2="'+y(30)+'" stroke="var(--border3)" stroke-dasharray="4,3"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="var(--bright)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
}
function drwMacdSvg(h){
  var W=400,H=70,n=h.length;
  var mx=Math.max.apply(null,h.map(function(v){return Math.abs(v||0);}))||1;
  var bw=W/Math.max(n,1);
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="drw-sub-svg" aria-hidden="true">'+
    '<line x1="0" x2="'+W+'" y1="'+H/2+'" y2="'+H/2+'" stroke="var(--border3)"/>'+
    h.map(function(v,i){ v=v||0; var hh=Math.abs(v)/mx*(H/2-2); return '<rect x="'+(i*bw).toFixed(2)+'" y="'+(v>=0?H/2-hh:H/2).toFixed(2)+'" width="'+Math.max(bw-0.6,0.6).toFixed(2)+'" height="'+hh.toFixed(2)+'" fill="'+(v>=0?'var(--pos)':'var(--neg)')+'" opacity=".75"/>'; }).join('')+'</svg>';
}

// Copia de seguridad completa: todo vive en localStorage, un borrado de
// navegador lo pierde todo. Serializa lo esencial y permite restaurarlo.
function exportBackup(){
  var data={
    _v:1, _fecha:new Date().toISOString(),
    portfolio:S.portfolio, trades:S.trades, watchlist:S.watchlist,
    capitalPlan:S.capitalPlan, capital:S.capital,
    rebalTargets:(REBAL&&REBAL.targets)||{}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='moyiq-invest-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  showToast('Copia de seguridad descargada');
}
function importBackup(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d||typeof d!=='object') throw new Error('formato');
      if(Array.isArray(d.portfolio)) S.portfolio=d.portfolio;
      if(Array.isArray(d.trades)) S.trades=d.trades;
      if(Array.isArray(d.watchlist)) S.watchlist=d.watchlist;
      if(d.capitalPlan) S.capitalPlan=d.capitalPlan;
      if(typeof d.capital==='number') S.capital=d.capital;
      if(d.profile&&typeof radarSaveProfile==='function') radarSaveProfile(d.profile);
      if(d.rebalTargets&&typeof REBAL==='object'){ REBAL.targets=d.rebalTargets; if(typeof rebalSaveTargets==='function') rebalSaveTargets(); }
      if(typeof persist==='function') persist();
      if(typeof persistTrades==='function') persistTrades();
      if(typeof _capSave==='function') _capSave();
      showToast('Copia restaurada correctamente');
      renderMain();
    }catch(err){ showToast('Archivo no válido','error'); }
  };
  reader.readAsText(file);
}
function exportCSV(){
  var port=S.portfolio;
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var rows=[['Ticker','Tipo','Unidades','Entrada','Precio Actual','Valor','P&L $','Retorno %','Peso %','Fecha']];
  var date=new Date().toLocaleDateString('es-CL');
  port.forEach(function(h){
    var pnl=h.sh*(h.cur-h.cost);
    var ret=h.cost>0?(h.cur-h.cost)/h.cost*100:0;   // coste 0 daba Infinity%
    var w=(h.sh*h.cur)/(totM||1)*100;
    rows.push([h.t,h.type,h.sh,h.cost.toFixed(2),h.cur.toFixed(2),(h.sh*h.cur).toFixed(2),pnl.toFixed(2),ret.toFixed(2),w.toFixed(2),date]);
  });
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var tPnl=port.reduce(function(s,h){return s+h.sh*(h.cur-h.cost);},0);
  rows.push(['TOTAL','','','','',totM.toFixed(2),tPnl.toFixed(2),((tPnl/(totC||1))*100).toFixed(2),'100','']);
  var csv=rows.map(function(r){
    return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');
  }).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='moyiq-invest-'+new Date().toISOString().split('T')[0]+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

var PB={ticker:'',price:0,capital:0,risk:2,stop:0,computed:null};

// Abre la calculadora con un ticker (y su precio si se conoce).
function openCalculator(ticker,price){
  ticker=String(ticker||'').toUpperCase().trim();
  PB.ticker=ticker; PB.stop=0; PB.computed=null;
  var own=S.portfolio.find(function(h){return h.t===ticker;});

  PB.price=(price>0?price:0)||(LIVE[ticker]&&LIVE[ticker].price)||0;

function pbFill(ticker){
  PB.ticker=ticker; PB.stop=0;
  var own=S.portfolio.find(function(h){return h.t===ticker;});
  if(own&&own.stop>0) PB.stop=own.stop;
  PB.price=(LIVE[ticker]&&LIVE[ticker].price)||(own&&own.cur)||0;
  renderPBBody();
  if(!PB.price) pbFetchPrice();
}

function pbFetchPrice(){
  var t=(PB.ticker||'').toUpperCase().trim();
  if(!t) return;
  var done=function(q){
    if(!q||!(q.price>0)||PB.ticker!==t) return;
    LIVE[t]=q; PB.price=+q.price.toFixed(2);
    var el=document.getElementById('pb-price'); if(el) el.value=PB.price;
    pbCalc();
  };
  if(LIVE[t]&&LIVE[t].price) return done(LIVE[t]);
  (pbIsCrypto(t)?fetchCryptoQuote(t):fetchQuote(t)).then(done).catch(function(){});
}

function pbCalc(){
  var box=document.getElementById('calc-result');
  if(!box) return;
  var t=(PB.ticker||'').toUpperCase().trim();
  var c=computeSizing({capital:PB.capital,riskPct:PB.risk,entry:PB.price,stop:PB.stop,
    limit:(typeof riskConcentrationLimit==='function'?riskConcentrationLimit():RISK_CONCENTRATION_LIMIT),fractional:pbIsCrypto(t)});
  PB.computed=c.error?null:Object.assign({ticker:t},c);
  if(c.error){
    var msg={
      'no-entry':'Escribe el ticker y la entrada para calcular.',
      'no-capital':'Escribe tu capital. Sin capital no hay regla que aplicar.',
      'no-risk':'Escribe qué porcentaje de tu capital estás dispuesto a perder en esta posición.',
      'stop-not-below-price':'El stop tiene que quedar por debajo de la entrada.'
    }[c.error]||'Revisa los datos.';
    box.innerHTML='<div class="calc-empty">'+icon('calc','ico-lg')+'<p>'+msg+'</p></div>';
    return;
  }
  var unitWord=pbIsCrypto(t)?'unidades':(c.units===1?'unidad':'unidades');
  var conc=c.concentration;
  var concHtml=conc
    ?'<div class="port-note" role="note"><p>'+warnTag('Supera tu límite de concentración del '+fmtPctN(conc.limit*100,0)+'.')+' Esta posición sería el '+fmtPctN(conc.weight*100,0)+' de tu capital. '+
      (conc.maxUnits>0?'Con '+fmtUnits(conc.maxUnits)+' unidades quedarías en '+fmtPctN(conc.weightAtMax*100,0)+'.':'A este precio, ni una unidad entera cabe en el límite.')+'</p></div>'
    :'';
  var rows=c.rTable.map(function(r){
    return '<tr><th scope="row">'+r.label+'</th><td class="num">'+fmtUSD(r.price)+'</td><td class="num '+(r.pnl<0?'neg':'pos')+'">'+(r.pnl>0?'+':'')+fmtUSD(r.pnl,0)+'</td></tr>';
  }).join('');
  box.innerHTML=
    heroFig({aria:'Resultado'+(t?' para '+esc(t):''),label:(t?esc(t)+' · ':'')+'con tu regla de '+numWrap(fmtPctN(PB.risk)),
      value:c.units>0?fmtUnits(c.units)+'<span class="hero-u">'+unitWord+'</span>':'<span class="hero-u hero-u0">No alcanza para una unidad entera</span>',
      row:[['Exposición','<b class="num">'+fmtUSD(c.exposure,0)+'</b> <span><span class="num">'+fmtPctN(c.exposurePct*100,0)+'</span> del capital</span>'],
           ['Si toca el stop','<b class="num neg">'+fmtUSD(-c.lossAtStop,0)+'</b> <span><span class="num">'+fmtPctN(c.lossPct*100,1)+'</span> del capital</span>'],
           ['Stop','<b class="num">'+fmtUSD(c.stop)+'</b> <span>'+(c.stopIsEstimate?'estimación: <span class="num">−8 %</span> bajo la entrada':'el que escribiste')+'</span>']]})+
    concHtml+
    (c.units>0?'<div class="hoy-sec"><div class="hoy-sec-h"><h2 class="port-h2">Escenarios en múltiplos de R</h2><span class="port-muted">R es lo que arriesgas por unidad: entrada − stop = '+fmtUSD(c.perUnitRisk)+'</span></div>'+
      '<div class="tw"><table class="fos-table port-table calc-r"><thead><tr><th scope="col">Escenario</th><th scope="col">Precio</th><th scope="col">Resultado</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':'')+
    (c.units>0&&t?'<div class="port-bar">'+
      '<button type="button" class="btn-big" onclick="pbAddToPortfolio(this)">'+icon('plus')+' Agregar a mi portafolio</button>'+
      '<button type="button" class="btn" onclick="pbSavePlan()">Guardar como plan</button>'+

}

async function pbAddToPortfolio(btn){
  var c=PB.computed;
  if(!c||!c.ticker||!(c.units>0)) return;
  if(S.demoMode) exitDemo();
  if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  var h={id:S.nextId++,t:c.ticker,type:pbIsCrypto(c.ticker)?'Crypto':'Stock',sh:c.units,cost:c.entry,cur:c.entry};
  if(!c.stopIsEstimate) h.stop=c.stop;
  var realId=await sbAddHolding(h);
  if(!realId){
    if(btn){ btn.disabled=false; btn.textContent='Agregar a mi portafolio'; }
    showToast('No se pudo guardar la posición. Revisa tu conexión.','error');
    return;
  }
  h.id=realId; S.portfolio.push(h); REBAL.targets={};

}

var ONBOARD={step:0,shown:false};

// "Nueva posición". El cuestionario de perfil ya no se pide: solo alimentaba
// las cestas por ticker que se retiraron (I05/D2).
var ONBOARD_STEPS=[
  {icon:'dash',page:'dash',title:'Hoy: cómo vas y cuánto arriesgas',
   desc:'El valor de tu portafolio, el resultado del día y el total, cuánto perderías si se activan tus stops y qué conviene revisar.'},
  {icon:'port',page:'port',title:'Portafolio, con tus datos',
   desc:'Cargas tus posiciones y escribes el stop de cada una. Ves su valor, su resultado, su peso y su riesgo al stop. Cada precio muestra su hora y si viene con retraso.'},
  {icon:'watch',page:'watch',title:'Lista: indicadores con su rango',
   desc:'Los activos que sigues, con su tendencia, RSI, MACD y volumen por separado y una frase que explica qué significa cada uno. Sin notas ni señales de compra o venta.'},
  {icon:'calc',page:'pb',title:'Planificar con tu regla de riesgo',
   desc:'La calculadora te dice cuántas unidades caben si arriesgas un porcentaje fijo de tu capital hasta tu stop. En Mercado ves el contexto: régimen, volatilidad, índices y noticias.'}
];
function showOnboarding(){
  var steps=ONBOARD_STEPS;
  var step=steps[ONBOARD.step];
  var isLast=ONBOARD.step===steps.length-1;
  if(S.page!==step.page) setPage(step.page);
  document.getElementById('mroot').innerHTML=
    '<div class="overlay onb-overlay" onclick="">'+
    '<div class="modal onb" role="dialog" aria-modal="true" aria-labelledby="onb-t" onclick="event.stopPropagation()">'+
    '<div class="onb-dots" aria-label="Paso '+(ONBOARD.step+1)+' de '+steps.length+'">'+steps.map(function(_,i){return '<span class="'+(i<=ONBOARD.step?'on':'')+'"></span>';}).join('')+'</div>'+
    '<div class="onb-ico">'+icon(step.icon,'ico-lg')+'</div>'+
    '<h2 id="onb-t">'+step.title+'</h2>'+
    '<p>'+step.desc+'</p>'+
    '<div class="onb-acts">'+
    (ONBOARD.step>0?'<button class="btn" onclick="onboardPrev()">Anterior</button>':'')+
    (isLast
      ?'<button class="btn-big" onclick="onboardFinish(true)">Agrega tu primera posición</button>'
      :'<button class="btn-big" onclick="onboardNext()">Siguiente</button>')+
    '</div>'+
    '<button class="onb-skip" onclick="onboardFinish(false)">Saltar recorrido</button>'+
    '</div></div>';
}
function onboardNext(){
  ONBOARD.step=Math.min(ONBOARD.step+1,ONBOARD_STEPS.length-1);
  showOnboarding();
}
function onboardPrev(){ONBOARD.step=Math.max(0,ONBOARD.step-1);showOnboarding();}
function onboardFinish(addPosition){
  document.getElementById('mroot').innerHTML='';
  ONBOARD.shown=true;
  try{localStorage.setItem('mv_onboard_done','1');}catch(e){/* silent */}
  track('onboarding_done',{add:!!addPosition});
  if(addPosition){ setPage('port'); openModal('addpos'); }
  else setPage('dash');
}
function checkOnboarding(){
  try{if(localStorage.getItem('mv_onboard_done')) return;}catch(e){/* silent */}
  if(!ONBOARD.shown&&S.user){
    setTimeout(showOnboarding, 800);
  }
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────────
// Los controles construidos sobre <div role="button" tabindex="0"> no reciben
// activacion por teclado nativa como un <button>. Un unico manejador delegado
// los cubre a todos en lugar de repetir onkeydown en cada plantilla JS.
// Va en su propio listener y ANTES del guard de sesion: activar un control no
// es un atajo de la app, y varios de estos controles viven en la pantalla de
// acceso, donde todavia no hay S.user.
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  var ctrl=document.activeElement;
  if(!ctrl||!ctrl.getAttribute) return;
  if(ctrl.getAttribute('role')==='button'&&ctrl.tagName!=='BUTTON'){
    e.preventDefault();
    ctrl.click();
  }
});

document.addEventListener('keydown',function(e){
  if(!S.user) return;
  // Escape debe cerrar modal aunque el foco este en un input (ej. da-confirm
  // en el modal de borrado de cuenta) — por eso va ANTES del early-return de
  // INPUT/TEXTAREA que corta los atajos de letra. Usa closeModal() cuando hay
  // un modal abierto para que limpie S.modal y restaure el foco previo.
  if(e.key==='Escape'){
    if(S.modal){closeModal();return;}
    document.getElementById('mroot').innerHTML='';
    acctClose(); gsCloseMobile();
    closeDrawer();
    return;
  }
  // Cmd/Ctrl+K abre el buscador incluso desde un campo de texto.
  if((e.metaKey||e.ctrlKey)&&!e.altKey&&(e.key==='k'||e.key==='K')){ e.preventDefault(); gsFocus(); return; }
  var tag=e.target&&e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(e.target&&e.target.isContentEditable)) return;
  if(e.key==='/'&&!e.altKey&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); gsFocus(); return; }
  if(e.key==='?'){showShortcuts();return;}
  // Alt+1..5: los 5 destinos. Se lee e.code porque en macOS Alt+1 escribe "¡".
  var m=/^Digit([1-5])$/.exec(e.code||'');
  if(e.altKey&&!e.metaKey&&!e.ctrlKey&&m){
    e.preventDefault();
    goDest(DEST[+m[1]-1].id);
    return;
  }
  if(e.key==='r'&&e.ctrlKey){e.preventDefault();manualRefresh();}
});

    var xS=function(i,n){return i/Math.max(n-1,1)*(W-70);}, yS=function(v){return H-((v-minY)/rng)*H;};

    stats='<div class="tw"><table class="fos-table port-table"><thead><tr><th>Medida</th>'+st.map(function(s){return '<th><i class="cmp-sw" style="background:'+s.color+'"></i>'+esc(s.t)+'</th>';}).join('')+'</tr></thead><tbody>'+

      '<p class="port-muted">Índice de Sharpe: rendimiento diario promedio dividido por su volatilidad, anualizado. Mide cuánto rindió por cada unidad de variación; no anticipa el futuro.</p>';
    // Correlacion: solo pares distintos (antes incluia el activo consigo mismo).
    var pares=[];
    for(var i=0;i<st.length;i++) for(var j=i+1;j<st.length;j++){
      var a=st[i].rets,b=st[j].rets,n=Math.min(a.length,b.length);
      var r=pearson(a.slice(-n),b.slice(-n));
      pares.push('<tr><td>'+esc(st[i].t)+' y '+esc(st[j].t)+'</td><td class="num">'+(r==null?'—':r.toLocaleString(LOC,{minimumFractionDigits:2,maximumFractionDigits:2}))+'</td><td>'+(r==null?'':r>0.7?'Se movieron muy parecido':r>0.4?'Se movieron parecido':r>-0.1?'Se movieron con independencia':'Se movieron en sentido opuesto')+'</td></tr>');
    }
    if(pares.length) stats+='<h3 class="port-h3">Correlación de los rendimientos diarios</h3><div class="tw"><table class="fos-table port-table"><thead><tr><th>Par</th><th>Correlación</th><th>Lectura</th></tr></thead><tbody>'+pares.join('')+'</tbody></table></div>'+
      '<p class="port-muted">1 es igual, 0 es independiente, −1 es opuesto.</p>';
  }
  var legend='<div class="cmp-legend">'+COMP.tickers.map(function(t,i){return '<span>'+'<i class="cmp-sw" style="background:'+colors[i]+'"></i>'+esc(t)+'</span>';}).join('')+
    (COMP.tickers.indexOf('SPY')<0?'<button type="button" class="tab'+(COMP.showSPY?' act':'')+'" aria-pressed="'+!!COMP.showSPY+'" onclick="COMP.showSPY=!COMP.showSPY;renderComp()"><i class="cmp-dash"></i>Referencia: SPY</button>':'')+'</div>';

  return '<div class="fos-module-header"><div><div class="fos-module-sub">Cómo rindieron hasta cuatro activos en el mismo período, partiendo de 0 %.</div></div></div>'+

async function compLoad(){
  if(COMP.loading) return;
  COMP.tickers=COMP.tickers.filter(function(t){return t&&t.trim().length>0;});
  if(COMP.tickers.length<2){showToast('Selecciona al menos 2 tickers','warning');return;}
  COMP.loading=true;COMP.data={};COMP.spy=null;COMP.synthetic=[];renderComp();
  var rangeMap={30:'1mo',60:'3mo',90:'3mo',130:'6mo',365:'1y',1095:'5y'}; // 2mo y 3y no existen en Yahoo: devolvian 400
  var rng=rangeMap[COMP.range]||'3mo';
  try{
    var promises=COMP.tickers.map(function(t){
      return fetchHistory(t,rng).then(function(hist){
        if(hist&&hist.length>5){COMP.data[t]=hist;}
        else{COMP.data[t]=genFallback(getLivePrice(t)||100,COMP.range);if(COMP.synthetic.indexOf(t)<0)COMP.synthetic.push(t);}
        if(!LIVE[t]) return fetchQuote(t).then(function(q){if(q) LIVE[t]=q;});
      }).catch(function(){COMP.data[t]=genFallback(getLivePrice(t)||100,COMP.range);if(COMP.synthetic.indexOf(t)<0)COMP.synthetic.push(t);});
    });
    // Fetch SPY benchmark unless already comparing it
    var spyPromise=COMP.tickers.indexOf('SPY')<0
      ?fetchHistory('SPY',rng).then(function(h){if(h&&h.length>5)COMP.spy=h;}).catch(function(){})
      :Promise.resolve();
    await Promise.all(promises.concat([spyPromise]));
  }catch(e){/* silent */}
  COMP.loading=false;renderComp();
}

// los tickers sin respuesta para distinguir "no paga" de "no se pudo cargar".
var DIVS={data:{},loading:false,key:'',failed:0,asked:0};
function divsKey(){ return S.portfolio.map(function(h){return h.t;}).sort().join(','); }
async function loadDivData(){
  if(DIVS.loading) return;
  var tickers=[];
  S.portfolio.forEach(function(h){if(tickers.indexOf(h.t)<0)tickers.push(h.t);});
  if(!tickers.length) return;
  DIVS.loading=true; DIVS.key=divsKey(); DIVS.failed=0; DIVS.asked=tickers.length;
  if(S.page==='divs') renderMain();
  await Promise.allSettled(tickers.map(function(t){
    return fetchFundamentals(t).then(function(f){
      if(!f){ DIVS.failed++; return; }
      var price=getLivePrice(t)||0;
      var dy=f.dividendYield||0;                 // fracción (0.025 = 2.5%)
      var annual=(dy&&price)?dy*price:0;         // $ anual por acción
      DIVS.data[t]={
        dividendYield:dy,
        trailingAnnualDividendRate:annual,
        dividendRate:annual?annual/4:0           // default trimestral (la mayoría US)
      };
    }).catch(function(){ DIVS.failed++; });
  }));
  DIVS.loading=false;
  if(S.page==='divs') renderMain();
}
function divsRetry(){ DIVS.key=''; loadDivData(); }

function renderDivs(){
  var port=S.portfolio;
  var head='<div class="fos-module-header"><div><div class="fos-module-sub">Lo que pagarían tus posiciones en los próximos 12 meses, con el rendimiento por dividendo que informa la fuente</div></div></div>';
  var main=document.getElementById('main');
  if(!port.length){
    main.innerHTML=head+'<div class="port-wrap pv"><div class="mv-empty"><div class="mv-empty-i">'+icon('cash','ico-lg')+'</div>'+
