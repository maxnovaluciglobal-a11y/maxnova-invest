/* ═══════════════════════════════════════════════════════════════════
   MOY IQ INVEST — Sistema de diseño alineado con FinanceOS Pro

/* Fonts loaded async via <link> in <head> — no render-blocking @import */

/* ── NATIVE FEEL: CHASIS ──────────────────────────────────────────────
   Elimina los "tells" que delatan pagina web en vez de app instalada.
   Ver skill native-feel / references/tells.md. */
* { -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
button, a, label, summary, [role="button"], [role="tab"] {
  touch-action: manipulation;
}
nav, header, footer, button, .btn, [role="button"], [role="tab"] {
  -webkit-user-select: none;
  user-select: none;
}
img { -webkit-user-drag: none; user-select: none; }
input, select, textarea { font-size: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .btn:active, [role="button"]:active { transform: scale(.97); transition: transform .06s; }
}

/* ── TOKENS ── */
:root {
  /* Colores — modo claro (idéntico a FinanceOS light) */
  /* ── Marca: azul tinta ───────────────────────────────────────────────
     Era verde, el mismo hex que la ganancia. Compartir color con la semantica
     hacia que el color no dijera nada: boton y "+$400" eran identicos. Verde y
     rojo quedan reservados a resultado (--pos/--neg), y la marca se mueve a un
     hue que no compite con el P&L. Los nombres --grn* se conservan a proposito:
     renombrar 260 usos anadiria riesgo sin cambiar nada visual. */
  /* ── Paleta de marca MOY IQ ("El Instrumento") — alineada a financeos-app ── */
  --grn:       #14213D; /* Navy — marca/estructura */
  /* Superficies solidas de CTA: Latón, SIEMPRE con texto Navy encima (nunca
     blanco — falla AA sobre Latón). Ver los 3 usos de --grn-solid más abajo,
     ya migrados a color:var(--grn) en vez de color:#fff. */
  --grn-solid: #B8863B;
  --grn-bg:    rgba(20,33,61,0.07);
  --grn-lt:    rgba(20,33,61,0.14);
  --grn-d:     #0D1730;

  --laton:      #B8863B;
  --laton-700:  #8A6329; /* texto/íconos sobre Papel — AA */

  --red:       #A23E2E;
  --red-bg:    rgba(162,62,46,0.08);
  --red-lt:    #F3DAD5;

  --amber:     #9C5419;
  --amber-bg:  rgba(201,122,61,0.12);

  /* Alias de fondos/bordes de estado usados en .sigb/.rtab y badges inline.
     Antes se referenciaban sin definir (--gbg/--gborder/--ambg/--amborder)
     y caian a `initial` -> cajas sin fondo ni borde. */
  --gbg:       var(--grn-bg);
  --gborder:   var(--grn-lt);
  --ambg:      var(--amber-bg);
  --amborder:  var(--amber);

  /* ── Semantica de resultado ──────────────────────────────────────────
     Ganancia y perdida. Verde = único color positivo/éxito del brand book;
     rojo/error para pérdida. Convención universal en finanzas, no cambia. */
  --pos:       #356E57;
  --neg:       #A23E2E;

  /* Aliases usados en JS inline styles */
  --green:     #356E57;
  --orange:    #9C5419;
  --orange-bg: rgba(201,122,61,0.12);
  --orange-bd: #E3C08F;

  --blue:      #3E5A78;
  --blue-bg:   rgba(91,122,153,0.12);

  /* Superficies — Papel */
  --bg:        #F1EEE6;
  --bg2:       #FAF8F2;
  --card:      #FAF8F2;
  --card2:     #F1EEE6;
  --card3:     #F5F2EA;
  --card4:     #E4DFD1;

  /* Texto — Navy */
  --text:      #4A4739;
  --text2:     #63604F;
  --text3:     #63604F;
  --bright:    #14213D;
  --white:     #ffffff;

  /* Bordes */
  --border:    rgba(20,33,61,0.10);
  --border2:   rgba(20,33,61,0.18);
  --border3:   rgba(20,33,61,0.24);

  /* Sombras */
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.05);

  /* Radios */
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  12px; /* brand book: radios de 12px como maximo */
  --r-xl:  12px;

  /* Escala de espaciado — base 2px.
     Se eligio 2 y no 4 a partir de medir el CSS existente: el 85% de las
     declaraciones ya caia en multiplos de 2, pero solo el 47% en multiplos de
     4, y los tres valores mas usados (14px, 10px y 6px) son pares fuera del
     grid de 4. Forzar escala estricta de 4 habria movido 94 declaraciones:
     eso no es un refactor, es un rediseno. Con base 2 se elimina la
     arbitrariedad real (los 32 valores impares) sin tocar la composicion. */
  --sp-1:  2px;
  --sp-2:  4px;
  --sp-3:  6px;
  --sp-4:  8px;
  --sp-5:  10px;
  --sp-6:  12px;
  --sp-7:  14px;
  --sp-8:  16px;
  --sp-10: 20px;
  --sp-12: 24px;
  --sp-14: 28px;
  --sp-16: 32px;
  --sp-20: 40px;
  --sp-24: 48px;

  /* Sidebar */
}

/* ── DARK MODE ── */

  --grn:       #F1EEE6; /* Papel funciona como "primario" claro sobre fondo Navy oscuro */
  --grn-solid: #CC9A52; /* Latón para datos/CTA sobre Navy oscuro — texto Navy encima */
  --grn-bg:    rgba(241,238,230,0.08);
  --grn-lt:    rgba(241,238,230,0.16);
  --grn-d:     #FAF8F2;

  --laton:      #CC9A52;
  --laton-700:  #E3C592;

  --red:       #C96856;
  --red-bg:    rgba(201,104,86,0.16);
  --red-lt:    #4A2A22;

  --amber:     #E0975A;
  --amber-bg:  rgba(224,151,90,0.16);

  /* Semantica de resultado en oscuro — verde único positivo/éxito. */
  --pos:       #74C2A3;
  --neg:       #C96856;

  /* Aliases dark mode */
  --green:     #74C2A3;
  --orange:    #E0975A;
  --orange-bg: rgba(224,151,90,0.16);
  --orange-bd: #6B4A2A;

  --blue:      #89A6C2;
  --blue-bg:   rgba(137,166,194,0.16);

  --bg:        #12161F;
  --bg2:       #181D29;
  --card:      #181D29;
  --card2:     #1D2331;
  --card3:     #242B3B;
  --card4:     #2D3547;

  --text:      #C7C2B2;
  --text2:     #9C9784;
  --text3:     #9C9784;
  --bright:    #FAF8F2;
  --white:     #f1f5f9;

  --border:    rgba(228,223,209,0.10);
  --border2:   rgba(228,223,209,0.18);
  --border3:   rgba(228,223,209,0.26);

  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
}

/* ── RESET ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { font-size:14px; -webkit-text-size-adjust:100%; }

body {
  font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh; min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

/* ── LAYOUT ── */
/* Marco de la app (reestructura v3): barra lateral + columna de contenido.
   Las reglas viven en "APP SHELL" al final de esta hoja. */

/* ── MAIN CONTENT ── */
.main {
  flex: 1;
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── PAGE HEADER ── */
/* Cabecera de modulo. Conviven dos formas de escribirla — _ph() genera .ph
   (17 usos) y otros modulos ponen .fos-module-header a mano (9 usos) — pero son
   el mismo componente, asi que comparten una unica regla en vez de dos que se
   desincronizan. Antes renderizaban distinto: .ph a 24/20 y fos-module-header
   a 20/20, porque la regla #main > div le pisaba su padding. */
.ph,
.fos-module-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding:16px var(--content-px) 12px;
  gap:16px;
  flex-wrap: wrap;
}
.ph-crumb {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  margin-bottom:6px;
}
.ph h1, .ph h2 {
  /* Mismo titulo de pagina que .fos-module-title (Instrument Sans serif): antes eran
     3 estilos distintos (Inter 24, Inter 26, Instrument Sans 27) y el H1 cambiaba de
     familia/tamano al moverse entre modulos. El h2 es para _ph() llamado con
     tag:'h2' — secciones que viven dentro de una pagina mas grande con su
     propio h1 (ej. Screener/Comparador dentro de Investigar), mismo look. */
  font-family: 'Instrument Sans', Georgia, sans-serif;
  font-size: 27px;
  font-weight: 600;
  color: var(--bright);
  letter-spacing: -.01em;
  line-height: 1.12;
  margin:0 0 4px;
}

/* ── PAGE BODY ── */

/* ── KPI CARDS ── */

/* KPI color accents — borde izquierdo sutil */

/* El valor tambien hereda el color semantico (--pos/--neg), no solo el borde.
   Antes cada pantalla que queria el numero en verde/rojo tenia que envolverlo
   a mano (asi lo hacia renderDash) y las que no lo hacian se quedaban en
   negro — el mismo concepto (P&L) se leia distinto segun la pantalla. */

/* Rail neutro: para datos sin estado semántico (una magnitud no es "positiva") */

/* ── FRANJA DE SUITE ─────────────────────────────────────────────
   Usa tokens para funcionar en ambos temas. z-index 60 y no 9999: solo debe
   quedar por encima del contenido, nunca del drawer ni de los modales. */
/* #topbar y .sb son position:fixed con top:0, es decir anclados al VIEWPORT,
   no al final de esta franja. Se pintaban encima de ella: el fondo oscuro del
   topbar (var(--bg2)) era la banda negra que tapaba la parte superior.
   Se fija una altura conocida y los tres elementos la descuentan. */

/* Barra de fuerza (score) — las clases .sbar/.sf se usaban en sbar() pero no
   tenian CSS, asi que la columna 'Fuerza' salia vacia. */
.sbar { display:inline-block; width:60px; height:6px; background:var(--card3); border-radius:3px; overflow:hidden; vertical-align:middle; }
.sf   { display:block; height:100%; border-radius:3px; }

/* ── CHIPS DE WATCHLIST ──────────────────────────────────────────
   La clase .wtag se generaba en el HTML pero NO existia en el CSS: eran
   <span> desnudos, sin padding ni borde, separados solo por el espacio del
   texto. De ahi que los tickers aparecieran pegados unos a otros. */

/* Jerarquía 1 respuesta -> 3 apoyos */

/* ── CARD BOX ── */
/* ── CARD: identidad visual unica ──────────────────────────────────
   .cb (card con padding) y .fos-card (card estructurada/flush) eran dos
   "sistemas" con bordes y sombras distintos; moverse entre pantallas cruzaba
   una costura visible. Ahora comparten UNA base (borde/radio/sombra/fondo) y
   solo difieren en el relleno: .cb trae padding+margen por defecto; .fos-card
   queda flush para cards con su propia estructura interna (header+body/tabla). */
.cb {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.cb {
  /* Padding de card unificado al token --sp-8 (16px): antes 18px 20px off-scale.
     Ahora .cb y las fos-card de contenido comparten el mismo relleno. */
  padding:var(--sp-8);
  /* Unica fuente del espaciado de este componente: antes 41 usos de .cb
     llevaban margenes inline de 10/12/14/16px que pisaban esta regla, asi que
     tarjetas identicas quedaban a distancias distintas segun quien las escribio. */
  margin-bottom:var(--sp-7);
}

/* ── SECTION TITLE ── */
.st {
  /* Mismo look que .fos-section-label (mono 9px): eran dos labels de seccion
     con tipografia distinta (Inter 10px vs mono 9px). Ahora leen igual en toda
     la app; la barra .stbar ya coincidia con .fos-section-label::before. */
  display: flex;
  align-items: center;
  gap:8px;
  margin-bottom:14px;
 font-size:15px; font-weight:600; color:var(--bright);}

/* ── TABLE ── */
.tw {
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  overflow-x: auto;

}
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
thead th {
  text-align: left;

 font-size:12px;}

}
tr:last-child td { border-bottom: none; }
.trow:hover td { background: var(--card3); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap:4px;
  padding:6px 12px;
  border-radius: var(--r-sm);
  border: 0.5px solid var(--border2);
  background: var(--card);
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  font-family: 'IBM Plex Sans', sans-serif;
  cursor: pointer;
  transition: border-color .12s cubic-bezier(.23,1,.32,1),
              color .12s cubic-bezier(.23,1,.32,1),
              background-color .12s cubic-bezier(.23,1,.32,1);
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--grn);
  color: var(--grn);
  background: var(--grn-bg);
}
.btn-big {
  display: inline-flex; align-items: center; gap:6px;
  padding:8px 16px;
  border-radius: var(--r-sm);
  border: none;
  background: var(--grn-solid);
  color: #14213D;
  font-size: 12px;
  font-weight: 600;
  font-family: 'IBM Plex Sans', sans-serif;
  cursor: pointer;
  transition: background .12s, transform .1s;
  white-space: nowrap;
}
/* Antes pasaba a Navy con texto Navy encima (texto invisible al pasar el puntero). */
.btn-big:hover { background: var(--grn-solid); filter: brightness(.93); transform: translateY(-1px); }
.btn-big:active { transform: translateY(0); }
.btn-big:disabled { opacity:.5; cursor:not-allowed; transform:none; }

/* ── INPUTS ── */
.inp {

}

/* ── DRAWER ── */
.dov {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.2);
  z-index: 200;
  backdrop-filter: blur(2px);
}
.drw {
  position: fixed;
  top: 0; right: -440px;
  width: 420px;
  max-width: 100%;
  height: 100vh; height: 100dvh;
  background: var(--card);
  border-left: 0.5px solid var(--border2);
  z-index: 201;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  transition: right .25s cubic-bezier(.4,0,.2,1);

}
.drw.open { right: 0; }
@media (max-width: 480px) {
  .drw {
    top: auto;
    bottom: -92vh;
    bottom: -92dvh;
    right: 0; left: 0;
    width: 100%;
    height: 92vh;
    height: 92dvh;
    border-left: none;
    border-radius:var(--r-xl) 16px 0 0;
    border-top: 1px solid var(--border);
    transition: bottom .3s cubic-bezier(.4,0,.2,1);
  }
  .drw.open { bottom: 0; right: 0; }
  .drw::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin:10px auto 0;
    flex-shrink: 0;
  }
}
.drw.open ~ .dov, .dov.open { display: block; }
.drwh {
  padding:18px 20px;
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.drwb {
  flex: 1;
  overflow-y: auto;
  padding:18px 20px;
}

/* ── SPINNER ── */
.spin {
  width: 20px; height: 20px;
  border: 2px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
.sk-pulse {
  background: linear-gradient(90deg, var(--card2) 25%, var(--card3,#2a2a3a) 50%, var(--card2) 75%);
  background-size: 200% 100%;
  animation: sk-shimmer 1.4s infinite;
}
@keyframes sk-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes sk-dot {
  from { opacity: .3; transform: scale(.8); }
  to   { opacity: 1;  transform: scale(1.2); }
}
.spin-sm {
  width: 12px; height: 12px;
  border-width: 1.5px;
  border: 1.5px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── SKELETON LOADER ── */

@keyframes skel-load { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }

.skel-line {
  border-radius: 4px;
  background: linear-gradient(90deg, var(--card3) 25%, var(--card4) 50%, var(--card3) 75%);

.wv3-outer{min-height: 100vh; min-height: 100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;isolation:isolate}
/* Fondo ASCII animado del hero. Se implementa nativo (canvas 2D + JetBrains
   Mono, la fuente que ya carga la pagina) en vez de instalar un componente de
   registro: este proyecto no tiene React ni build step, y el codigo de ese
   componente no es auditable sin cuenta en el registro.
   Va detras del contenido y no captura eventos. */
/* Globo: textura de fondo del hero, anclado a la izquierda y detras del texto.
   Opacidad baja a proposito — es ambiente, no debe disputarle contraste al
   contenido. El mask lo desvanece antes de la columna de texto. */
#globe-bg{
  position:absolute; top:50%; left:0; transform:translate(-22%,-50%);
  width:min(760px,72vw); height:min(760px,72vw);
  z-index:-1; pointer-events:none; opacity:.62;
  -webkit-mask-image:radial-gradient(circle at 44% 50%, #000 46%, transparent 82%);
  mask-image:radial-gradient(circle at 44% 50%, #000 46%, transparent 82%);
}
/* Sin animacion para quien la desactivo por accesibilidad: se oculta el canvas
   y queda un degradado estatico del mismo tono. */
@media (prefers-reduced-motion: reduce){
  #globe-bg{display:none}
  .wv3-outer{background:radial-gradient(90% 70% at 12% 50%, var(--grn-bg) 0%, var(--bg) 62%)}
}
@media (max-width:900px){
  /* En movil el texto ocupa todo el ancho: el globo estorbaria la lectura. */
  #globe-bg{opacity:.28; transform:translate(-38%,-50%)}
}

/* ── DARK MODE TOGGLE ── */

/* Area de toque real de 44x44: el switch visual queda en 32x18, el hit-area
   invisible lo rodea (native-feel: area-de-toque). */

/* ── UPGRADE PLAN BADGE ── */

/* ── PAYWALL ── */

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* Sin esto, CSS Grid usa min-width:auto por default en los items de .resp2 —
   una tabla ancha adentro de una columna (ej. Watchlist de Investigar, 9
   columnas) empuja su track al ancho de su contenido y le roba espacio a la
   columna vecina, en vez de dejarse achicar y scrollear por dentro. La regla
   de mas abajo que hacia esto YA existia pero solo dentro de
   @media(max-width:768px) — a 1024px/1440px (donde .resp2 sigue siendo 2-3
   columnas de verdad, no 1 columna movil) no aplicaba y la grilla se rompia.
   Bug real, confirmado midiendo con getBoundingClientRect: a 1024px el
   Comparador de Investigar quedaba aplastado a ~200px de ancho necesitando
   463px. Unconditional a proposito: no tiene sentido moverse una vez que ya
   cae a 1 columna en movil (max-width:768px, mas abajo). */

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .ph { padding:14px 16px 12px; }
  
  
  
  /* responsive collapse for inline 2-col grids with a fixed px sidebar */
  
  
  .grid2 { grid-template-columns: 1fr !important; }
  
  table { font-size: 11px; }
  td, th { padding:8px 10px; }
  .tw { overflow-x: auto; min-width: 0; }
  /* La tabla de portfolio tiene 11 columnas: a 375px queda ilegible incluso con
     scroll horizontal. En movil se ocultan las secundarias y quedan las 5 que
     responden "¿cuanto tengo y como va?": Activo, Precio, Δ Hoy, P&L y acciones.
     El detalle completo sigue disponible al abrir el activo. */
  .col-sec { display: none; }
  /* permite que los tracks grid 1fr encojan bajo contenido nowrap (evita overflow) */
  
  
  /* headers de módulo: que el botón/acción baje de línea en vez de desbordar */
  .fos-module-header { flex-wrap: wrap; gap:8px; }
  /* ph-right: wrap on small screens so buttons don't overflow */
  
  /* btn-big full width inside modals and locked banners */
  .modal .btn-big, .modal-box .btn-big { width: 100%; }
}
/* Dos columnas para pares de cajas (Escenarios / R:R en Riesgo). Se usaba
   class="grid2" sin ninguna regla, asi que las cajas caian apiladas a lo ancho;
   el usuario lo veia como scroll innecesario. Colapsa a 1 columna en el media
   query de <=900px. */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }

/* ── TOAST NOTIFICATIONS ── */
#toast-container { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); right:calc(24px + env(safe-area-inset-right, 0px)); z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast { display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:var(--r-md); font-size:12px; font-family:'IBM Plex Mono',monospace; color:#fff; min-width:220px; max-width:320px; box-shadow:0 4px 20px rgba(0,0,0,.35); opacity:0; transform:translateY(10px); transition:opacity .25s,transform .25s; pointer-events:auto; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.success { background:var(--grn); }
.toast.error { background:#ef4444; }
.toast.info { background:var(--blue); }
.toast.warning { background:var(--amber); }
.toast-undo { margin-left:auto; flex-shrink:0; background:rgba(255,255,255,.2); border:none; color:#fff; font-weight:700; font-size:11px; padding:8px 12px; border-radius:var(--r-sm); cursor:pointer; }
.toast-undo:hover { background:rgba(255,255,255,.32); }

/* ── @MEDIA PRINT (Radar PDF) ── */
@media print {
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;color:#1a1a1a!important;font-size:10pt!important}
  .sb, .dov, .drw {display:none!important}
  .main{margin:0!important}
  .cb{break-inside:avoid;page-break-inside:avoid;border:0.5pt solid #ddd!important;border-radius:5pt!important}
  
  @page{size:A4;margin:18mm 15mm 14mm}
}

/* Iconos de linea. stroke:currentColor hace que hereden el color del estado
   (normal / hover / activo) y del tema sin necesidad de variantes. */
.ico {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.ico-inline { display: inline-block; vertical-align: -2px; }

/* ── AREA TACTIL ─────────────────────────────────────────────────
   Los botones de accion de tabla usan padding:2px inline y quedan muy por
   debajo del minimo tactil de 44px. Solo se agrandan en dispositivos de puntero
   grueso: en escritorio con raton la densidad se conserva intacta.
   No se usa la tecnica de area invisible ampliada porque estos botones van
   adyacentes (editar junto a borrar) y las areas se solaparian: el usuario
   pulsaria borrar apuntando a editar. */
@media (pointer: coarse) {
  .btn, .wv3-eye-btn { min-height: 44px; }
}

/* ── INDICADOR DE FOCO ───────────────────────────────────────────
   Varios controles declaran outline:none inline dentro de plantillas JS, lo que
   deja a quien navega con teclado sin saber donde esta. Una regla normal no los
   alcanza (inline gana), asi que se restaura con !important sobre :focus-visible
   — solo se ve al navegar con teclado, no al hacer clic con el raton. */
:focus-visible {
  outline: 2px solid var(--grn) !important;
  outline-offset: 2px !important;
  border-radius: inherit;
}

/* ── MOVIMIENTO REDUCIDO ─────────────────────────────────────────
   Se usa !important a proposito: es lo unico que tambien neutraliza las
   transiciones declaradas inline (style="...transition:.15s") dentro de las
   plantillas JS, que no se pueden alcanzar desde una hoja de estilos normal.
   No se anula la animacion por completo: se conservan los cambios de opacidad
   (ayudan a comprender el cambio de estado) y solo se elimina el movimiento. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .spin, .spin-sm { animation: none !important; }
}

.acct-it { display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:0 10px; border:none; border-radius:var(--r-sm); background:transparent; color:var(--text); font:inherit; font-size:14px; text-align:left; text-decoration:none; cursor:pointer; }
.acct-it .ico { color:var(--text2); }
.acct-it:hover, .acct-it:focus-visible { background:var(--grn-bg); color:var(--bright); }
.acct-sep { height:1px; margin:6px 4px; background:var(--border); }

/* Cabecera de pagina + pestañas */
.pagehead { display:none; }
body:not(.no-auth) .pagehead { display:block; }
.pagehead-in { max-width:var(--content-max); margin:0 auto; padding:24px var(--content-px) 0; }
.pg-title { margin:0; font-family:'Instrument Sans', Georgia, sans-serif; font-size:28px; font-weight:600; line-height:1.15; letter-spacing:-.01em; color:var(--bright); }
.pagehead:not(.has-tabs) .pagehead-in { padding-bottom:4px; }
/* Un solo componente de pestañas: .ptab para destinos y .tab para filtros
   internos (Tendencia, periodos del Comparador), que eran botones sin estilo. */
.ptabs { display:flex; gap:4px; margin-top:16px; border-bottom:1px solid var(--border2); overflow-x:auto; scrollbar-width:none; }
.ptabs::-webkit-scrollbar { display:none; }
.ptab, .tab {
  position:relative; flex-shrink:0; border:none; background:transparent; cursor:pointer;
  font:inherit; color:var(--text2); white-space:nowrap; transition:color .15s, background .15s;
}
.ptab { min-height:44px; padding:0 14px; font-size:14px; font-weight:500; }
.ptab:hover { color:var(--bright); }
.ptab.act { color:var(--bright); font-weight:600; }
.ptab.act::after { content:''; position:absolute; left:10px; right:10px; bottom:-1px; height:3px; border-radius:2px 2px 0 0; background:var(--laton); }
.tab {
  min-height:32px; padding:0 12px; margin:0 4px 4px 0; font-size:12px; font-weight:500;
  border:1px solid var(--border2); border-radius:var(--r-sm); background:var(--card);
}
.tab:hover { color:var(--bright); border-color:var(--border3); }
.tab.act { color:var(--bright); font-weight:600; background:var(--grn-bg); border-color:var(--bright); }
@media (pointer: coarse) { .tab { min-height:44px; } }

.ph-empty { display:none !important; }
.mkt-to-list { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:8px 0 0; font-size:13px; color:var(--text2); }

/* Barra inferior */
#mob-tab-bar { display:none; }
@media (max-width: 1023px) {
  body:not(.no-auth) #mob-tab-bar {
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:150;
    height:calc(var(--mbar-h) + env(safe-area-inset-bottom, 0px)); padding-bottom:env(safe-area-inset-bottom, 0px);
    background:var(--bg2); border-top:1px solid var(--border);
  }
  body:not(.no-auth) .appcol { padding-bottom:calc(var(--mbar-h) + env(safe-area-inset-bottom, 0px)); }
  /* Movil: titulo del destino en la franja, buscador a pantalla completa. */
  .tb-dest { display:block; flex:1; min-width:0; font-family:'Instrument Sans', Georgia, sans-serif; font-size:20px; font-weight:600; color:var(--bright); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gs { display:none; }
  .tb-icon { display:flex; align-items:center; justify-content:center; width:44px; height:44px; border:none; border-radius:var(--r-md); background:transparent; color:var(--bright); cursor:pointer; flex-shrink:0; }
  .tb-icon .ico { width:20px; height:20px; }
  .tb-fresh { margin-left:0; }
  .acct-btn { width:44px; height:44px; }
  .topbar.gs-open .gs { display:flex; position:absolute; inset:0; max-width:none; padding:8px 8px 8px var(--content-px); background:var(--bg); gap:4px; z-index:5; }
  .topbar.gs-open .gs-ico { left:calc(var(--content-px) + 12px); top:50%; transform:translateY(-50%); }
  .topbar.gs-open .gs-in { height:44px; }
  .topbar.gs-open .gs-kbd { display:none; }
  .topbar.gs-open .gs-close { display:flex; align-items:center; justify-content:center; width:44px; height:44px; flex-shrink:0; border:none; background:transparent; color:var(--bright); cursor:pointer; border-radius:var(--r-md); }
  .topbar.gs-open .gs-list { position:fixed; top:calc(var(--topbar-h) + 4px); left:8px; right:8px; max-height:calc(100dvh - var(--topbar-h) - var(--mbar-h) - 24px); }
  .pagehead-in { padding-top:12px; }
  .pg-title { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  .ptabs { margin-top:0; margin-left:calc(var(--content-px) * -1); margin-right:calc(var(--content-px) * -1); padding:0 calc(var(--content-px) - 8px); }
  .pagehead:not(.has-tabs) .pagehead-in { padding:0; }
}
@media (max-width: 639px) { .tb-fresh .lb-full { display:none; } .tb-fresh .lb-short { display:inline; } }
.mob-tab {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  min-width:0; min-height:44px; padding:0 2px; border:none; background:transparent; cursor:pointer; position:relative;
  color:var(--text2); font:inherit; font-size:12px; font-weight:500; -webkit-tap-highlight-color:transparent;
  transition:color .15s;
}
.mob-tab .ico { width:22px; height:22px; }
.mob-tab span { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mob-tab.act { color:var(--bright); font-weight:600; }
.mob-tab.act::before { content:''; position:absolute; top:0; left:22%; right:22%; height:3px; border-radius:0 0 2px 2px; background:var(--laton); }
@media (max-width: 1023px) {
  body:not(.no-auth) #toast-container { bottom:calc(var(--mbar-h) + 16px + env(safe-area-inset-bottom, 0px)); }
}
/* La ficha del activo (hoja inferior en movil) va por encima de la barra. */
.dov { z-index:200; backdrop-filter:none; background:rgba(13,23,48,.38); }
.drw { z-index:210; }

/* ── PORTAFOLIO · fase 2 (Posiciones, Movimientos, Dividendos, Objetivos) ── */
.pv .pos { color: var(--pos); }
.pv .neg { color: var(--neg); }

.warn-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--amber); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; }
.warn-tag .ico { width: 14px; height: 14px; }
.pv .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
.port-wrap { display: flex; flex-direction: column; gap: 16px; }
.port-wrap > * { margin: 0; min-width: 0; max-width: 100%; }
.pv .fos-table th { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--text2); }
.linkbtn { background: none; border: none; padding: 0; min-height: 32px; font: inherit; color: var(--blue); text-decoration: underline; cursor: pointer; }
.port-muted { font-size: 12px; line-height: 1.55; color: var(--text2); margin: 0; }
.port-h2 { margin: 8px 0 0; font-size: 16px; font-weight: 600; color: var(--bright); }
.port-h3 { margin: 4px 0 8px; font-size: 14px; font-weight: 600; color: var(--bright); }

/* Banda de resumen: una franja con divisores, no tarjetas */
.pband { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; background: var(--card); border: 1px solid var(--border2); border-radius: var(--r-md); }
.pband-6 { grid-template-columns: repeat(3, 1fr); }
.pband-c { padding: 14px 18px; min-width: 0; border-left: 1px solid var(--border); }
.pband-c:first-child { border-left: none; }
.pband-6 .pband-c:nth-child(3n+1) { border-left: none; }
.pband-6 .pband-c:nth-child(n+4) { border-top: 1px solid var(--border); }
.pband-l { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
.pband-v { font-size: 20px; font-weight: 600; color: var(--bright); line-height: 1.2; overflow-wrap: anywhere; }
.pband-hero .pband-v { font-size: 28px; }
.pband-s { font-size: 12px; color: var(--text2); line-height: 1.45; margin-top: 4px; }
@media (max-width: 1023px) {
  .pband { grid-template-columns: 1fr 1fr; }
  .pband-c:nth-child(3) { border-left: none; }
  .pband-c:nth-child(n+3) { border-top: 1px solid var(--border); }
  .pband-6 { grid-template-columns: 1fr 1fr; }
  .pband-6 .pband-c { border-left: 1px solid var(--border); border-top: none; }
  .pband-6 .pband-c:nth-child(odd) { border-left: none; }
  .pband-6 .pband-c:nth-child(n+3) { border-top: 1px solid var(--border); }
}
@media (max-width: 420px) { .pband-c { padding: 12px 14px; } .pband-hero .pband-v { font-size: 24px; } .pband-v { font-size: 18px; } }

.port-cap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: var(--text2); }
.port-cap b { color: var(--bright); font-weight: 600; }
.port-cap b.neg { color: var(--neg); }
.port-cap .inp { width: 160px; min-height: 40px; }
.port-ccy-note { font-size: 12px; color: var(--text2); }
.port-note { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--orange-bg); border-radius: var(--r-md); }
.port-note p { flex: 1; min-width: 220px; margin: 0; font-size: 13px; color: var(--text); line-height: 1.5; }

.port-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.port-bar .btn-big { display: inline-flex; align-items: center; gap: 6px; padding: 0 18px; min-height: 44px; width: auto; }
.port-bar > .btn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.port-add { position: relative; }
.menu { position: absolute; left: 0; top: calc(100% + 6px); z-index: 90; min-width: 200px; padding: 6px; background: var(--card); border: 1px solid var(--border2); border-radius: var(--r-md); box-shadow: var(--shadow-lg); }
.port-ccy { display: flex; gap: 2px; margin-left: auto; padding: 2px; background: var(--card2); border: 1px solid var(--border); border-radius: var(--r-sm); overflow-x: auto; max-width: 100%; }
.port-ccy button { min-height: 36px; min-width: 44px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: var(--text2); font: inherit; font-size: 12px; cursor: pointer; }
.port-ccy button.act { background: var(--card); color: var(--bright); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border2); }
@media (pointer: coarse) { .port-ccy button { min-height: 44px; } }

/* position:relative contiene los .sr-only (absolutos) dentro del scroll de la tabla:
   antes escapaban y ensanchaban la pagina. */
.tw { position: relative; }
.port-table th, .port-table td { white-space: nowrap; padding: 10px 8px; }
.port-table th:first-child, .port-table td:first-child { padding-left: 14px; }
.port-table td { vertical-align: top; }
.port-table .trow { cursor: pointer; }
.port-tk { background: none; border: none; padding: 0; font: inherit; font-weight: 600; color: var(--bright); cursor: pointer; text-align: left; }
.port-tk:hover { text-decoration: underline; }
.port-sub { display: block; font-size: 12px; font-weight: 400; color: var(--text2); margin-top: 2px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.port-strong { font-weight: 600; color: var(--bright); }
.port-stop { width: 100px; min-height: 36px; padding: 4px 8px; font-size: 13px; }
.port-acts { white-space: nowrap; }
.port-ib { padding: 0; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; }
.port-acts .port-ib + .port-ib { margin-left: 4px; }
.port-table tfoot td { font-weight: 600; color: var(--bright); border-top: 1px solid var(--border2); }

/* Movil: filas apiladas en vez de tabla cortada */
.port-stack { display: none; list-style: none; margin: 0; padding: 0; border: 1px solid var(--border2); border-radius: var(--r-md); background: var(--card); }
/* Fase 3: tambien en tableta (768-1023): la tabla de 11 columnas no cabia. */
@media (max-width: 1023px) {
  .port-tw { display: none; }
  .port-stack { display: block; }
  .port-ccy { margin-left: 0; }
}
.ps-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 4px 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
.ps-row:first-child { border-top: none; }
.ps-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 44px; padding: 0; border: none; background: none; text-align: left; font: inherit; color: var(--text); cursor: pointer; }
.ps-l1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 14px; }
.ps-t { font-weight: 600; color: var(--bright); margin-right: auto; }
.ps-l2 { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--text2); }
.ps-l2 b { font-weight: 600; color: var(--text); }
.ps-more { min-height: 44px; }
.ps-edit { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 6px; }
.ps-edit .btn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.ps-stop { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
.ps-stop .port-stop { width: 140px; min-height: 44px; }

.port-div { border: 1px solid var(--border2); border-radius: var(--r-md); background: var(--card); }
.port-div > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; font-size: 15px; font-weight: 600; color: var(--bright); cursor: pointer; }
.port-div > summary::-webkit-details-marker { display: none; }
.port-div > summary::after { content: ''; width: 8px; height: 8px; border-right: 1.5px solid var(--text2); border-bottom: 1.5px solid var(--text2); transform: rotate(45deg); transition: transform .2s; }
.port-div[open] > summary::after { transform: rotate(-135deg); }
.port-div-b { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.port-div-b .m10-alloc { padding: 0; border: none; background: none; box-shadow: none; }
.port-corr { overflow-x: auto; }
.port-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); margin: 0 0 8px; }

/* Movimientos */
.mv-empty { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; max-width: 560px; padding: 24px; background: var(--card); border: 1px solid var(--border2); border-radius: var(--r-md); }
.mv-empty h2 { margin: 0; font-size: 18px; font-weight: 600; color: var(--bright); }
.mv-empty p { margin: 0; font-size: 13px; color: var(--text2); line-height: 1.6; }
.mv-empty-i { color: var(--text2); }
.mv-empty .btn-big { display: inline-flex; align-items: center; gap: 6px; width: auto; padding: 0 18px; min-height: 44px; }
.mv-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: var(--text2); }
.mv-filters label { display: inline-flex; align-items: center; gap: 8px; }
.mv-filters .inp { width: auto; min-height: 40px; }
.mv-note { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }

/* Dividendos */
.dv-bars { display: flex; align-items: flex-end; gap: 4px; min-height: 140px; padding: 12px; background: var(--card); border: 1px solid var(--border2); border-radius: var(--r-md); overflow-x: auto; }
.dv-bar { flex: 1; min-width: 22px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--text2); }
.dv-bar i { display: block; width: 100%; max-width: 40px; background: var(--grn); border-radius: 3px 3px 0 0; opacity: .85; }
.dv-bar .num { font-size: 10px; min-height: 13px; }

/* Objetivos */
.rb-grid { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap: 24px; align-items: start; }
.rb-grid > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rb-grid > div > .btn { align-self: flex-start; min-height: 44px; }
@media (max-width: 1023px) { .rb-grid { grid-template-columns: 1fr; } }
.rb-ctl { display: flex; align-items: center; gap: 8px; }
.rb-ctl input[type=range] { width: 120px; accent-color: var(--laton); }
.rb-ctl .inp { width: 64px; min-height: 36px; padding: 4px 6px; }
@media (max-width: 560px) { .rb-ctl input[type=range] { display: none; } .rb-table th, .rb-table td { padding: 8px 6px; } }
.rb-wait { padding: 12px 16px; font-size: 13px; line-height: 1.5; color: var(--text); background: var(--orange-bg); border-radius: var(--r-md); }
.rb-wait.ok { background: var(--grn-bg); }

/* ── LISTA y FICHA · fase 3 ─────────────────────────────────────────── */
@media (max-width: 1023px) { .li-tw { display: none; } }
.fresh-m { display: none; }

.li-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.li-chips .tab { margin: 0; display: inline-flex; align-items: center; gap: 6px; }
.li-chips .tab .num { font-size: 11px; color: var(--text2); }
.li-chips .tab[disabled] { opacity: .5; cursor: default; }
.li-word { font-size: 12px; color: var(--text2); display: inline-flex; align-items: center; gap: 4px; }
.trend-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.trend-tag .ico { width: 15px; height: 15px; }
.trend-tag.t-up { color: var(--pos); }
.trend-tag.t-down { color: var(--neg); }
.trend-tag.t-mix { color: var(--amber); }
.li-range { position: relative; display: inline-block; width: 64px; height: 4px; margin-right: 6px; vertical-align: middle; background: var(--card4); border-radius: 2px; }
.li-range.wide { width: auto; flex: 1; }
.li-range i { position: absolute; top: -4px; width: 4px; height: 12px; margin-left: -2px; background: var(--bright); border-radius: 2px; }
.li-rp { font-size: 12px; color: var(--text2); }
.li-bell { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 8px; border: 1px solid var(--border2); border-radius: var(--r-sm); background: var(--card); color: var(--text2); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
.li-bell:hover { border-color: var(--border3); color: var(--bright); }
.li-bell.on { color: var(--bright); border-color: var(--laton); background: var(--grn-bg); }
.li-bell .ico { width: 15px; height: 15px; }
@media (pointer: coarse) { .li-bell { min-height: 44px; } }
.li-stack .ps-l2 { align-items: center; }
.local-note { margin: 0; font-size: 12px; color: var(--text2); line-height: 1.5; }
.local-note b { color: var(--text); }

/* Descubrir */
.scr-form { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(110px, 1fr)); gap: 12px; align-items: end; padding: 16px; background: var(--card); border: 1px solid var(--border2); border-radius: var(--r-md); }
.scr-f { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text2); min-width: 0; }
.scr-f .inp { width: 100%; min-height: 40px; }
.scr-f textarea.inp { font-family: 'IBM Plex Mono', monospace; font-size: 13px; resize: vertical; }
.scr-acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.scr-acts .btn-big { width: auto; padding: 0 22px; min-height: 44px; }
.scr-acts .btn { min-height: 44px; }
@media (max-width: 767px) { .scr-form { grid-template-columns: 1fr 1fr; } .scr-tk { grid-column: 1 / -1; } }
.scr-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--text2); }
.scr-follow { min-height: 36px; display: inline-flex; align-items: center; gap: 4px; }

/* Comparar */
.cmp-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1023px) { .cmp-grid { grid-template-columns: 1fr; } }
.cmp-side, .cmp-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cmp-tk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.cmp-tk li { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 4px 0 10px; background: var(--card); border: 1px solid var(--border2); border-radius: var(--r-sm); font-size: 13px; }
.cmp-tk li > i, .cmp-legend i, .cmp-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.cmp-tk li .num { margin-left: auto; font-size: 12px; }
.cmp-add { display: flex; gap: 6px; }
.cmp-add .inp { flex: 1; min-width: 0; min-height: 40px; text-transform: uppercase; }
.cmp-add .inp::placeholder, .cap-add .inp::placeholder, #pb-ticker::placeholder { text-transform: none; }
.cmp-sug { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.cmp-sug .btn { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; text-align: left; }
.cmp-sug b { font-size: 12px; color: var(--bright); }
.cmp-sug span { font-size: 12px; color: var(--text2); font-weight: 400; }
.cmp-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; color: var(--text); }
.cmp-legend span { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }

var _errSeen={};
function trackError(context, err, extra){

function addAlert(ticker,tipo,trigger){
  ticker=(ticker||'').toUpperCase().trim();
  if(!/^[A-Z0-9.\-^=]{1,15}$/.test(ticker)){ showToast('Ticker inválido','error'); return false; }
  var t=parseFloat(trigger);
  if(!isFinite(t)||t<=0){ showToast('El precio objetivo debe ser mayor que 0','error'); return false; }
  if(tipo!=='Max'&&tipo!=='Min'){ showToast('Tipo de alerta inválido','error'); return false; }
  var plan=planOf();
  if(plan.maxA<999 && S.alerts.length>=plan.maxA){
    showToast('Llegaste al máximo de '+plan.maxA+' alertas. Elimina una para crear otra.','warning');
    return false;
  }
  if(S.alerts.some(function(a){return a.asset===ticker&&a.type===tipo&&a.trigger===t;})){
    showToast('Ya tienes esa misma alerta','warning'); return false;
  }
  S.alerts.push({id:S.alertNextId++,asset:ticker,type:tipo,trigger:t,createdAt:Date.now()});
  persistAlerts();
  ensureNotifyPermission();
  showToast('Alerta creada para '+ticker);
  return true;
}
function delAlert(id){
  // Mismo patron de undo que rmWatch() en watchlist: guardar la alerta y su
  // posicion antes de filtrar, para poder reinsertarla si el usuario deshace.

  var removed=idx>=0?S.alerts[idx]:null;
  S.alerts=S.alerts.filter(function(a){return a.id!==id;});
  persistAlerts();
  showToast('Alerta eliminada','warning',function(){
    if(removed&&S.alerts.indexOf(removed)<0){
      S.alerts.splice(Math.min(idx,S.alerts.length),0,removed);
      persistAlerts();
      showToast('Alerta restaurada');
      renderAlert();
    }
  });

}

// Evalua TODAS las alertas contra el precio vivo actual y notifica las que se
// disparan. Antes las alertas solo se evaluaban al abrir su pestaña, asi que la
// funcion nunca cumplia su proposito. Ahora corre en el loop de quotes (cada 5
// min y en el arranque). Debounce: una alerta disparada marca a.notified y no
// vuelve a avisar hasta que el precio se despeja (deja de cumplir la condicion),
// evitando spam en cada tick. Devuelve cuantas se dispararon en esta pasada.
function checkAlerts(){
  if(!S.alerts||!S.alerts.length) return 0;
  var fired=0, changed=false;
  S.alerts.forEach(function(a){
    var cur=getLivePrice(a.asset);
    if(!(isFinite(cur)&&cur>0)) return;
    var hit=a.type==='Max'?cur>=a.trigger:cur<=a.trigger;
    if(hit&&!a.notified){
      a.notified=true; a.triggeredAt=Date.now(); a.triggeredPrice=cur; changed=true; fired++;
      notifyAlert(a,cur);
    }else if(!hit&&a.notified){
      a.notified=false; changed=true; // condicion despejada: se re-arma
    }
  });
  if(changed){ persistAlerts(); if(S.page==='alert'){ try{renderMain();}catch(e){} } }
  return fired;
}
function notifyAlert(a,cur){
  var dir=a.type==='Max'?'subió a':'bajó a';
  var msg=a.asset+' '+dir+' $'+cur.toFixed(2)+' · objetivo '+a.type+' $'+a.trigger;
  try{ if(typeof showToast==='function') showToast(icon('alert')+' '+msg); }catch(e){}
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('Alerta · '+a.asset, {body:msg, tag:'alert-'+a.id, icon:'/icon-192.png'});
    }
  }catch(e){}
  try{ if(typeof track==='function') track('alert_triggered',{asset:a.asset,type:a.type}); }catch(e){}
}
// Pide permiso de notificacion una vez, dentro de un gesto del usuario (al crear
// una alerta). Si lo niega, las alertas siguen avisando por toast in-app.
function ensureNotifyPermission(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      var p=Notification.requestPermission();
      if(p&&p.then) p.then(function(){ if(S.page==='alert'){ try{renderMain();}catch(e){} } });
    }
  }catch(e){}
}

// ── COST BASIS — weighted average per ticker from trade log ──
function realizedPnlFor(ticker){
  var avgCost=null,shares=0,realized=0,buyCosts=[];
  S.trades.filter(function(t){return t.ticker===ticker;}).sort(function(a,b){return a.id-b.id;}).forEach(function(t){
    if(t.type==='buy'){buyCosts.push({qty:t.qty,price:t.amount/t.qty});shares+=t.qty;}
    else if(t.type==='sell'){var cost=buyCosts.length?buyCosts.reduce(function(s,b){return s+b.price*b.qty;},0)/buyCosts.reduce(function(s,b){return s+b.qty;},0):0;realized+=(t.amount/t.qty-cost)*t.qty;shares-=t.qty;}
  });
  return realized;
}

// localStorage API cache — 20 min TTL, keyed by url
var _API_CACHE_TTL=20*60*1000;
function _cacheGet(key){
  try{
    var raw=localStorage.getItem('_apic_'+key);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(Date.now()-o.ts>_API_CACHE_TTL){localStorage.removeItem('_apic_'+key);return null;}
    return o.data;
  }catch(e){return null;}
}
function _cacheSet(key,data){
  try{
    var full='_apic_'+key;
    localStorage.setItem(full,JSON.stringify({ts:Date.now(),data:data}));
    // LRU eviction: keep at most 30 _apic_ keys; remove oldest first
    var keys=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('_apic_'))keys.push(k);}
    if(keys.length>30){
      var sorted=keys.map(function(k){try{return{k:k,ts:JSON.parse(localStorage.getItem(k)).ts};}catch(e){return{k:k,ts:0};}});
      sorted.sort(function(a,b){return a.ts-b.ts;});
      sorted.slice(0,sorted.length-30).forEach(function(e){localStorage.removeItem(e.k);});
    }
  }catch(e){}
}

function fetchWithTimeout(url,ms){
  ms=ms||8000;

    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort();reject(new Error('Timeout '+ms+'ms'));},ms);
    fetch(url,{signal:ctrl.signal}).then(function(r){clearTimeout(timer);resolve(r);}).catch(function(e){clearTimeout(timer);reject(e);});
  });
}

var _histInflight={};
function fetchHistory(ticker,range){

  if(_histInflight[k]) return _histInflight[k];
  var p=_fetchHistoryImpl(ticker,range);

async function _fetchHistoryImpl(ticker,range){
  try{
    var r=range||'3mo';
    var ckey='h_'+ticker+'_'+r;
    // 1. In-memory cache (fastest path)
    var cached=_cacheGet(ckey);
    if(cached){fetchStats.ok++;return cached;}
    // 2. localStorage cache — survives page reload, 5-min TTL
    try{
      var lsKey='fh_'+ticker+'_'+r;
      var stored=localStorage.getItem(lsKey);
      if(stored){
        var parsed=JSON.parse(stored);
        if(parsed&&parsed.ts&&(Date.now()-parsed.ts)<300000&&parsed.data&&parsed.data.length>5){
          _cacheSet(ckey,parsed.data);fetchStats.ok++;return parsed.data;
        }
      }
    }catch(e){}
    // 3. Network fetch
    var res;
    if(_USE_EDGE){
      res=await fetchWithTimeout('/api/history?ticker='+encodeURIComponent(ticker)+'&range='+r+'&interval=1d',8000);
    } else {
      var rawUrl='https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range='+r+'&includePrePost=false';
      res=await fetchWithTimeout('https://api.allorigins.win/raw?url='+encodeURIComponent(rawUrl),9000);
    }
    if(!res||!res.ok) throw new Error('HTTP '+(res?res.status:'no response'));
    var json=await res.json();
    var data;
    if(_USE_EDGE){
      // /api/history returns {ticker,range,interval,data:[{date,open,high,low,close,volume}]}
      if(!json.data||!json.data.length) throw new Error('no data');
      data=json.data.map(function(d,i){
        return {date:new Date(d.date).toLocaleDateString('es-CL',{month:'short',day:'numeric'}),
                ts:Math.floor(new Date(d.date).getTime()/1000),
                open:d.open,high:d.high,low:d.low,close:d.close,vol:d.volume,p:i+1};
      }).filter(function(d){return d.close>0;});
    } else {
      // raw Yahoo Finance format
      var result=json.chart&&json.chart.result&&json.chart.result[0];
      if(!result||!result.timestamp) throw new Error('no result');
      var ts=result.timestamp;
      var q2=result.indicators&&result.indicators.quote&&result.indicators.quote[0];
      if(!q2) throw new Error('no quote');
      data=[];
      for(var i=0;i<ts.length;i++){
        if(q2.close[i]!=null&&q2.close[i]>0){
          data.push({date:new Date(ts[i]*1000).toLocaleDateString('es-CL',{month:'short',day:'numeric'}),
                     open:q2.open[i]||q2.close[i],high:q2.high[i]||q2.close[i],
                     low:q2.low[i]||q2.close[i],close:q2.close[i],vol:q2.volume[i]||0,p:i+1});
        }
      }
    }
    if(!data||data.length<5) throw new Error('insufficient data');
    _cacheSet(ckey,data);
    // Persist to localStorage so next page load is instant
    try{localStorage.setItem('fh_'+ticker+'_'+r,JSON.stringify({ts:Date.now(),data:data}));}catch(e){}
    fetchStats.ok++;fetchStats.lastOk=Date.now();
    return data;
  }catch(e){fetchStats.fail++;fetchStats.lastErr=e.message;return null;}
}

async function refreshLive(tickers,manual){
  if(liveLoading&&!manual) return;
  if(_liveAbortCtrl) _liveAbortCtrl.abort();
  _liveAbortCtrl=new AbortController();
  var mySignal=_liveAbortCtrl.signal;
  liveLoading=true;
  liveFailed=false;
  // Spinner on all refresh buttons
  document.querySelectorAll('.refresh-btn').forEach(function(b){
    b.innerHTML='<span class="spin-sm"></span>';b.disabled=true;
  });
  try{
    var gotAny=false;
    var isVercel=_USE_EDGE;

    // Holdings marcadas type==="Crypto" en Portfolio van por /api/crypto
    // (CoinGecko) en vez de /api/quote (Yahoo) — ver api/crypto.js. Watchlist
    // y ALL_SIG no tienen noción de tipo hoy, así que siguen 100% por Yahoo.
    var cryptoTickers=tickers.filter(function(t){
      return S.portfolio.some(function(h){return h.t===t&&h.type==='Crypto';});
    });
    var stockTickers=tickers.filter(function(t){return cryptoTickers.indexOf(t)<0;});

    if(isVercel){
      // /api/quote recorta a 10 tickers por peticion. Antes se enviaban TODOS
      // en una sola URL: el servidor devolvia solo los 10 primeros, gotAny se
      // ponia en true y el fallback nunca corria, asi que del 11 en adelante
      // ninguna posicion recibia precio (ni valor actual, ni P&L, ni retorno).
      // Ahora se pide en trozos de 10 y se recorren todos.
      try{
        for(var qi=0; qi<stockTickers.length; qi+=10){
          if(mySignal.aborted) return;
          var trozo=stockTickers.slice(qi, qi+10);
          var batchRes=await fetchWithTimeout('/api/quote?ticker='+trozo.join(','),6000);
          var batchData=await batchRes.json();
          Object.keys(batchData).forEach(function(t){
            var q=batchData[t];
            if(q&&q.price){
              LIVE[t]=q;
              S.portfolio.forEach(function(h){if(h.t===t)h.cur=q.price;});
              ALL_SIG.forEach(function(s){if(s.t===t)s.p=q.price;});
              gotAny=true;
            }
          });
          if(gotAny) updateLivePricesInDOM();
        }
      }catch(e){if(mySignal.aborted) return;/* fall through to individual fetches */}

      if(cryptoTickers.length&&!mySignal.aborted){
        try{
          var cRes=await fetchWithTimeout('/api/crypto?symbols='+cryptoTickers.join(','),6000);
          var cData=await cRes.json();
          Object.keys(cData).forEach(function(t){
            var q=cData[t];
            if(q&&q.price){
              LIVE[t]=q;
              S.portfolio.forEach(function(h){if(h.t===t)h.cur=q.price;});
              gotAny=true;
            }
          });
          updateLivePricesInDOM();
        }catch(e){if(mySignal.aborted) return;/* precios crypto quedan sin refrescar, resto sigue */}
      }
    }

    if(mySignal.aborted) return;
    if(!gotAny){
      // Fallback: individual fetches with batching (solo acciones/ETF — las
      // crypto ya se intentaron arriba vía /api/crypto, fetchQuote no las resuelve)
      var BATCH_SIZE=6;
      for(var bi=0;bi<stockTickers.length;bi+=BATCH_SIZE){
        var batch=stockTickers.slice(bi,bi+BATCH_SIZE);
        var results=await Promise.allSettled(batch.map(function(t){return fetchQuote(t);}));
        results.forEach(function(r,i){
          if(r.status==="fulfilled"&&r.value){
            var t=batch[i];
            LIVE[t]=r.value;
            S.portfolio.forEach(function(h){if(h.t===t)h.cur=r.value.price;});
            ALL_SIG.forEach(function(s){if(s.t===t)s.p=r.value.price;});
            gotAny=true;
          }
        });
        if(gotAny) updateLivePricesInDOM();
      }
    }
    if(gotAny){
      liveUpdated=Date.now();liveFailed=false;liveFromCache=false;
      try{localStorage.setItem('mv_prices_cache',JSON.stringify({ts:Date.now(),live:LIVE}));}catch(e){/* silent */}
    } else {
      liveFailed=true;
      trackError('quotes',new Error('no_prices_returned'),{tickers:tickers.length}); // Yahoo no devolvió precios
      // Load from cache on complete failure
      try{
        var c=JSON.parse(localStorage.getItem('mv_prices_cache')||'null');
        if(c&&(Date.now()-c.ts)<LIVE_CACHE_TTL){
          Object.assign(LIVE,c.live);
          liveFromCache=true;liveUpdated=c.ts;
          S.portfolio.forEach(function(h){if(LIVE[h.t])h.cur=LIVE[h.t].price;});
        }
      }catch(e){/* silent */}
    }
  }catch(e){liveFailed=true;trackError('quotes',e);}
  liveLoading=false;
  // Restore refresh buttons
  var updStr=liveUpdated?new Date(liveUpdated).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'—';
  document.querySelectorAll('.refresh-btn').forEach(function(b){
    b.innerHTML=icon('refresh');b.disabled=false;
    b.title='Actualizado: '+updStr+(liveFailed?' · Error de conexión':liveFromCache?' · Datos cacheados':'');
  });
  updateLiveBadge();
  updateLivePricesInDOM();
}

  var sg=ALL_SIG.find(function(s){return s.t===ticker;});
  // Sin dato no se inventa un precio (antes devolvía 100).
  return sg&&sg.p?sg.p:null;
}
// ── TI ─────────────────────────────────────────────────────────
var TI={
  sma:function(p,n){return p.map(function(_,i){return i<n-1?null:p.slice(i-n+1,i+1).reduce(function(a,b){return a+b;},0)/n;});},
  ema:function(p,n){var k=2/(n+1),r=[p[0]];for(var i=1;i<p.length;i++)r.push(p[i]*k+r[i-1]*(1-k));return r;},
  // Fase 3: una sola implementacion del RSI (app/lib/readings.js, con tests).
  rsi:function(p,n){ return rsiSeries(p,n||14); },
  macd:function(p){
    var e12=this.ema(p,12),e26=this.ema(p,26);
    var line=e12.map(function(v,i){return v-e26[i];});
    var sig=this.ema(line,9);
    return{line:line,signal:sig,hist:line.map(function(v,i){return v-sig[i];})};
  },
  bb:function(p,n,m){
    n=n||20;m=m||2;
    var sma=this.sma(p,n);
    return p.map(function(_,i){
      if(!sma[i])return{mid:null,upper:null,lower:null};
      var sl=p.slice(Math.max(0,i-n+1),i+1);
      var avg=sma[i];
      var std=Math.sqrt(sl.reduce(function(s,v){return s+(v-avg)*(v-avg);},0)/sl.length);
      return{mid:avg,upper:avg+m*std,lower:avg-m*std};
    });
  },
  atr:function(highs,lows,closes,n){
    n=n||14;
    var tr=highs.map(function(h,i){
      if(i===0)return h-lows[i];
      return Math.max(h-lows[i],Math.abs(h-closes[i-1]),Math.abs(lows[i]-closes[i-1]));
    });
    // El array debe tener un elemento por vela para que atr[i] corresponda a
    // closes[i]. Antes arrancaba con un solo null y quedaba de longitud
    // tr.length-n+2: indexar en closes.length-1 devolvia undefined y el NaN se
    // propagaba al R:R del motor y a los health scores.
    var result=new Array(n-1).fill(null);          // indices 0..n-2 sin ATR aun
    var atr0=tr.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    result.push(atr0);                              // indice n-1
    for(var i=n;i<tr.length;i++){atr0=(atr0*(n-1)+tr[i])/n;result.push(atr0);}
    return result;                                  // longitud == tr.length
  }
};

var _lwLoaded=false;

var _lwChartMain=null;

var _lwResizeObs=null;

function loadLWScript(){
  if(_lwLoaded) return Promise.resolve();
  if(_lwLoadPromise) return _lwLoadPromise;
  _lwLoadPromise=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    // Same-origin (auto-hospedado) en vez de cdn.jsdelivr.net: mismo motivo que
    // Supabase — un CDN bloqueado dejaba los charts sin cargar.
    s.src='/vendor-lightweight-charts.js';
    s.onload=function(){_lwLoaded=true;resolve();};
    s.onerror=reject;
    document.head.appendChild(s);
  });
  return _lwLoadPromise;
}

// '#RRGGBB' (o '#RGB') → rgba con transparencia; si no es hex, lo devuelve igual.
function hexAlpha(c,a){
  var m=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(c||'').trim()); if(!m) return c;
  var h=m[1].length===3?m[1].replace(/./g,'$&$&'):m[1];
  return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+a+')';
}
function renderLWCharts(hist,sma20,sma50,bbArr,sma200){
  loadLWScript().then(function(){
    var LW=window.LightweightCharts;
    if(!LW) return;
    var mainEl=document.getElementById('lw-chart-main');
    var volEl=document.getElementById('lw-chart-vol');
    if(!mainEl||!volEl) return;
    if(_lwChartMain){try{_lwChartMain.remove();}catch(e){} _lwChartMain=null;}
    if(_lwChartVol){try{_lwChartVol.remove();}catch(e){} _lwChartVol=null;}
    // Filter valid OHLCV bars
    var bars=hist.filter(function(d){return d.ts&&d.open&&d.high&&d.low&&d.close;});
    if(!bars.length) return;

    // I07: colores de la paleta (--pos/--neg) y atribución en el pie, no sobre el gráfico.
    var _cs=getComputedStyle(document.documentElement);
    var _tok=function(n,f){ var v=(_cs.getPropertyValue(n)||'').trim(); return v||f; };
    var bgColor=_tok('--card','#FAF8F2');
    var textColor=_tok('--text2','#63604F');
    var gridColor=_tok('--border','rgba(20,33,61,0.10)');
    var posC=_tok('--pos','#356E57'), negC=_tok('--neg','#A23E2E');
    // Medias en Navy (tinta) y Latón, bandas y ejes en tinta tenue: nada de los
    // rojo/verde/violeta por defecto de la librería. Volumen desaturado.
    var inkC=_tok('--bright','#14213D'), latonC=_tok('--laton','#B8863B');
    var bandC=_tok('--border3','rgba(20,33,61,0.24)'), axisC=_tok('--border2','rgba(20,33,61,0.18)');
    var volUp=hexAlpha(posC,0.32), volDn=hexAlpha(negC,0.32);

    _lwChartMain=LW.createChart(mainEl,{
      width:mainEl.clientWidth||mainEl.offsetWidth||300,
      height:210,
      layout:{background:{type:'solid',color:bgColor},textColor:textColor,fontFamily:"'IBM Plex Mono',monospace",fontSize:11,attributionLogo:false},
      localization:{locale:LOC,priceFormatter:function(p){return fmtD(p);}},
      grid:{vertLines:{color:gridColor},horzLines:{color:gridColor}},
      crosshair:{mode:LW.CrosshairMode.Normal},
      timeScale:{timeVisible:false,borderColor:axisC},
      rightPriceScale:{borderColor:axisC},
    });
    var chart=_lwChartMain;

    var candleSeries=chart.addCandlestickSeries({
      upColor:posC,downColor:negC,wickUpColor:posC,wickDownColor:negC,
      borderVisible:false,
    });
    candleSeries.setData(bars.map(function(d){return {time:d.ts,open:d.open,high:d.high,low:d.low,close:d.close};}));

    var s20Data=bars.map(function(d,i){return sma20[i]!=null?{time:d.ts,value:sma20[i]}:null;}).filter(Boolean);
    if(s20Data.length){
      var s20s=chart.addLineSeries({color:_tok('--blue','#3E5A78'),lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      s20s.setData(s20Data);
    }
    var s50Data=bars.map(function(d,i){return sma50[i]!=null?{time:d.ts,value:sma50[i]}:null;}).filter(Boolean);
    if(s50Data.length){
      var s50s=chart.addLineSeries({color:inkC,lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      s50s.setData(s50Data);
    }
    if(sma200&&sma200.length){
      var s200Data=bars.map(function(d,i){return sma200[i]!=null?{time:d.ts,value:sma200[i]}:null;}).filter(Boolean);
      if(s200Data.length){
        var s200s=chart.addLineSeries({color:inkC,lineWidth:1.5,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
        s200s.setData(s200Data);
      }
    }
    if(bbArr&&bbArr.length){
      var bbUpData=bars.map(function(d,i){return bbArr[i]&&bbArr[i].upper!=null?{time:d.ts,value:bbArr[i].upper}:null;}).filter(Boolean);
      var bbLoData=bars.map(function(d,i){return bbArr[i]&&bbArr[i].lower!=null?{time:d.ts,value:bbArr[i].lower}:null;}).filter(Boolean);
      if(bbUpData.length){
        var bbUs=chart.addLineSeries({color:bandC,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,lineStyle:2});
        bbUs.setData(bbUpData);
      }
      if(bbLoData.length){
        var bbLs=chart.addLineSeries({color:bandC,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,lineStyle:2});
        bbLs.setData(bbLoData);
      }
    }
    chart.timeScale().fitContent();

    // Volume chart
    _lwChartVol=LW.createChart(volEl,{
      width:volEl.clientWidth||volEl.offsetWidth||300,
      height:60,
      layout:{background:{type:'solid',color:bgColor},textColor:textColor,attributionLogo:false},
      localization:{locale:LOC,priceFormatter:function(v){return v>=1e6?(v/1e6).toLocaleString(LOC,{maximumFractionDigits:1})+' M':v>=1e3?(v/1e3).toLocaleString(LOC,{maximumFractionDigits:0})+' mil':fmt(v);}},
      grid:{vertLines:{color:gridColor},horzLines:{color:gridColor}},
      timeScale:{timeVisible:false,borderColor:axisC},
      rightPriceScale:{borderColor:axisC},
      crosshair:{mode:LW.CrosshairMode.Hidden},
    });
    var volChart=_lwChartVol;
    var volSeries=volChart.addHistogramSeries({
      color:volUp,priceFormat:{type:'custom',minMove:1,formatter:function(v){return v>=1e6?(v/1e6).toLocaleString(LOC,{maximumFractionDigits:1})+' M':v>=1e3?(v/1e3).toLocaleString(LOC,{maximumFractionDigits:0})+' mil':fmt(v);}},priceScaleId:'',
    });
    volSeries.setData(bars.map(function(d){return {time:d.ts,value:d.vol||0,color:d.close>=d.open?volUp:volDn};}));
    volChart.timeScale().fitContent();

    // Sync x-axis scroll between both charts
    chart.timeScale().subscribeVisibleLogicalRangeChange(function(r){if(r)volChart.timeScale().setVisibleLogicalRange(r);});

    // Reflow al cambiar el ancho (resize/rotacion): los charts se crean con
    // ancho fijo. Un observer sobre el contenedor reajusta ambos; se desconecta
    // en closeDrawer para no quedar observando un drawer cerrado.
    if(_lwResizeObs){try{_lwResizeObs.disconnect();}catch(e){}}
    if(window.ResizeObserver){
      _lwResizeObs=new ResizeObserver(function(){
        var w=mainEl.clientWidth||mainEl.offsetWidth;
        if(!w) return;
        try{if(_lwChartMain)_lwChartMain.applyOptions({width:w});}catch(e){}
        try{if(_lwChartVol)_lwChartVol.applyOptions({width:volEl.clientWidth||w});}catch(e){}
      });
      _lwResizeObs.observe(mainEl);
    }
  }).catch(function(){});
}

function genFallback(basePrice,days){
  var data=[];var p=basePrice*0.88;
  for(var i=0;i<days;i++){
    var chg=(Math.random()-0.48)*p*0.022;
    var c=Math.max(p+chg,1);
    data.push({date:"D"+(i+1),open:p,high:Math.max(p,c)*1.005,low:Math.min(p,c)*0.995,close:c,vol:Math.floor(Math.random()*50e6+10e6),p:i+1,_synthetic:true});
    p=c;
  }
  data[data.length-1].close=basePrice;
  return data;
}

  var cls=f.state==='offline'?'live-badge error':(f.state==='live'?'live-badge':'live-badge loading');
  var ico=f.state==='offline'?icon('warning','ico-inline'):icon('clock','ico-inline');
  var lbl=String(f.label||''), tm=/(\d{1,2}:\d{2})/.exec(lbl), mn=/(\d+)\s*min/.exec(lbl);
  var short=tm?((mn?'Retraso '+mn[1]+' min · ':'')+tm[1]):lbl;
  return '<div class="'+cls+'" role="status" aria-live="polite" title="Fuente: Yahoo Finance (acciones y ETF) y CoinGecko (cripto). La hora es la del último precio informado por la fuente." style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-sm);font-size:12px">'+

function isNYSEOpen(){
  var now=new Date();
  // NYSE: Mon–Fri 09:30–16:00 ET
  var et=new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  var d=et.getDay(); // 0=Sun,6=Sat
  if(d===0||d===6) return false;
  var h=et.getHours(),m=et.getMinutes();
  return (h>9||(h===9&&m>=30))&&h<16;
}

function chgCell(lq,size){
  // Devolvia cadena vacia sin dato: la celda quedaba en blanco y parecia que la
  // fila estaba incompleta, en vez de decir que ese precio no llego. La columna
  // vecina ya usaba '—' para lo mismo.
  if(!lq||lq.changePct==null) return '<span style="color:var(--text3)">—</span>';
  var p=(lq.changePct||0)*100;
  var s=Math.max(size||12,12);
  return '<span class="num" style="font-size:'+s+'px;color:'+(p>=0?'var(--pos)':'var(--neg)')+'">'+(p>=0?'+':'\u2212')+fmtD(Math.abs(p))+'\u202f%</span>';
}

// ── TABLE SORTING ────────────────────────────────────────────────
var _tblSort={col:null,asc:true,tbl:null};
function tblSortBy(tbl,col){
  if(_tblSort.tbl===tbl&&_tblSort.col===col){_tblSort.asc=!_tblSort.asc;}
  else{_tblSort.tbl=tbl;_tblSort.col=col;_tblSort.asc=false;}
  var tbody=document.querySelector('#tbl-'+tbl+' tbody');
  if(!tbody) return;
  var rows=Array.from(tbody.querySelectorAll('tr'));
  rows.sort(function(a,b){
    var ca=a.getAttribute('data-'+col)||'';
    var cb=b.getAttribute('data-'+col)||'';
    var na=parseFloat(ca),nb=parseFloat(cb);
    var va=isNaN(na)?ca.toLowerCase():na;
    var vb=isNaN(nb)?cb.toLowerCase():nb;
    if(va<vb) return _tblSort.asc?-1:1;
    if(va>vb) return _tblSort.asc?1:-1;
    return 0;
  });
  rows.forEach(function(r){tbody.appendChild(r);});
  // Update header indicators
  document.querySelectorAll('#tbl-'+tbl+' th[data-sort]').forEach(function(th){
    var arrow=th.getAttribute('data-sort')===col?(_tblSort.asc?' ↑':' ↓'):'';
    th.setAttribute('data-arrow',arrow);
    th.querySelector('.sarrow').textContent=arrow;
  });
}
function sortTh(tbl,col,label,tip){
  return '<th data-sort="'+col+'" role="button" tabindex="0" onclick="tblSortBy(\''+tbl+'\',\''+col+'\')" style="cursor:pointer;white-space:nowrap"'+(tip?' title="'+tip+'"':'')+'>'+label+' <span class="sarrow"></span></th>';
}
function showToast(msg,type,undoFn){
  var c=document.getElementById('toast-container');
  if(!c) return;
  var t=document.createElement('div');
  t.className='toast '+(type||'success');
  var ico=type==='error'?'close':type==='warning'?'alert':type==='info'?'help':'check';
  var iconEl=document.createElement('span');iconEl.className='toast-ico';iconEl.innerHTML=icon(ico);
  var msgEl=document.createElement('span');msgEl.textContent=msg;
  t.appendChild(iconEl);t.appendChild(msgEl);
  function dismiss(){ t.classList.remove('show'); setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},300); }
  // Acciones reversibles (quitar de watchlist, etc.) dan mas tiempo y un boton
  // real en vez de depender de que el usuario lea el toast antes de que se vaya.
  if(undoFn){
    var undoBtn=document.createElement('button');
    undoBtn.type='button';
    undoBtn.className='toast-undo';
    undoBtn.textContent='Deshacer';
    undoBtn.onclick=function(){ undoFn(); dismiss(); };
    t.appendChild(undoBtn);
  }
  c.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(dismiss, undoFn?5000:3000);
}

function resolvePage(p){
  p=String(p||'dash');

    var parts=p.split('/'), d=DEST.find(function(x){return x.id===parts[0];});

    if(tb) return tb.page;

  if(PAGE_ALIAS[p]) return PAGE_ALIAS[p];
  for(var i=0;i<DEST.length;i++) for(var j=0;j<DEST[i].tabs.length;j++) if(DEST[i].tabs[j].page===p) return p;

// Buscador: tickers del portafolio, de la lista, del universo de referencia,
// de los presets de Descubrir y los nombres conocidos. Acepta cualquier ticker
// escrito aunque no este en la lista.
var GS={items:[],idx:-1};
function gsUniverse(){
  var out=[], seen={};
  function add(t,src){
    t=String(t||'').toUpperCase().trim(); if(!t||seen[t]) return;
    seen[t]=1; out.push({t:t,name:TICKER_NAMES[t]||'',src:src||''});
  }
  (S.portfolio||[]).forEach(function(h){add(h.t,'En tu portafolio');});
  navWatchTickers().forEach(function(t){add(t,'En tu lista');});
  ALL_SIG.forEach(function(x){add(x.t);});
  SCREENER_PRESET_TICKERS.forEach(function(t){add(t);});
  Object.keys(TICKER_NAMES).forEach(function(t){add(t);});
  return out;
}
function gsMatches(q){
  var all=gsUniverse();
  q=String(q||'').trim();
  if(!q) return all.filter(function(x){return x.src;}).slice(0,8);
  var Q=q.toUpperCase(), ql=q.toLowerCase();
  var a=[],b=[],c=[];
  all.forEach(function(x){
    if(x.t===Q||x.t.indexOf(Q)===0) a.push(x);
    else if(x.t.indexOf(Q)>0) b.push(x);
    else if(x.name&&x.name.toLowerCase().indexOf(ql)>=0) c.push(x);
  });
  var res=a.concat(b,c).slice(0,7);
  // Cualquier ticker escrito se puede abrir: va al final si hay coincidencias.
  if(/^[A-Z0-9.\-=^]{1,12}$/.test(Q)&&!res.some(function(x){return x.t===Q;})) res.push({t:Q,name:'',src:'',typed:true});
  return res;
}
function gsInput(){
  var inp=document.getElementById('gs-in'); if(!inp) return;
  GS.items=gsMatches(inp.value); GS.idx=GS.items.length&&inp.value.trim()?0:-1;
  gsPaint();
}
function gsPaint(){
  var list=document.getElementById('gs-list'), inp=document.getElementById('gs-in');
  if(!list||!inp) return;
  if(!GS.items.length){
    var q=inp.value.trim();
    list.innerHTML=q?'':'<li class="gs-empty" role="presentation">Escribe un ticker, por ejemplo AAPL o SPY</li>';
    list.hidden=!!q;
    inp.setAttribute('aria-expanded',String(!list.hidden)); inp.removeAttribute('aria-activedescendant');
    return;
  }
  list.innerHTML=GS.items.map(function(x,i){

// El destino ya imprime su titulo arriba: la cabecera interna de cada
// pantalla (rotulo "Seguir · Portafolio" + su propio h1) se quita para que
// la pagina tenga un solo titulo. Queda su subtitulo y sus acciones.
// Una sola tabla: columnas numéricas alineadas a la derecha (celda y
// encabezado) y pestañas que no caben marcadas como desplazables.
function tableTidy(root){
  root=root||document;
  Array.prototype.forEach.call(root.querySelectorAll('table.fos-table'),function(tb){
    var rows=tb.tBodies[0]?Array.prototype.slice.call(tb.tBodies[0].rows):[]; if(!rows.length) return;
    var n=0; rows.forEach(function(r){ n=Math.max(n,r.cells.length); });
    for(var i=1;i<n;i++){
      var num=0,tot=0;
      rows.forEach(function(r){ var c=r.cells[i]; if(!c||c.colSpan>1) return; var t=c.textContent.trim(); if(!t||t==='—'||/^(sin stop|sin dato|calculando|cargando)/i.test(t)) return; tot++;
        if(c.classList.contains('num')||/^[−+\-]?[$≈]?\s?[\d.,]+(\s?[%M]|\s?pts)?(\s.*)?$/.test(t)&&!/[a-zA-Z]{3,}/.test(t.replace(/pts|est|M\b/g,''))) num++; });
      if(tot&&num/tot>=0.6){
        rows.forEach(function(r){ var c=r.cells[i]; if(c&&c.colSpan===1) c.classList.add('nc'); });
        var hr=tb.tHead&&tb.tHead.rows[0]; if(hr&&hr.cells[i]) hr.cells[i].classList.add('nc');
        if(tb.tFoot) Array.prototype.forEach.call(tb.tFoot.rows,function(r){ if(r.cells[i]) r.cells[i].classList.add('nc'); });
      }
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll('.ptabs'),function(t){
    var o=t.scrollWidth>t.clientWidth+2; t.classList.toggle('ovf',o);
    if(o&&!t._ovf){ t._ovf=1; t.addEventListener('scroll',function(){ t.classList.toggle('at-end',t.scrollLeft+t.clientWidth>=t.scrollWidth-4); },{passive:true}); }
  });
}
var _tidyT=null;
function tableTidySoon(){ clearTimeout(_tidyT); _tidyT=setTimeout(function(){ tableTidy(); },30); }
(function(){
  if(!window.MutationObserver) return;

  document.addEventListener('DOMContentLoaded',function(){
    ['main','drw','pagehead'].forEach(function(id){ var el=document.getElementById(id); if(el) mo.observe(el,{childList:true,subtree:true}); });

// Foco inicial + trap de Tab dentro del modal (role=dialog aria-modal sin trap
// es un defecto conocido: Tab se escapaba al fondo). Se llama tras renderizar.
function _setupModalFocus(){
  var mr=document.getElementById("mroot");
  var modal=mr&&mr.querySelector(".modal, .modal-box");
  if(!modal) return;
  var SEL='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function focusables(){
    return Array.prototype.slice.call(modal.querySelectorAll(SEL)).filter(function(el){return el.offsetParent!==null;});
  }
  setTimeout(function(){
    if(modal.contains(document.activeElement)) return; // re-render con foco ya dentro
    var first=modal.querySelector("input:not([type=hidden]),textarea,select")||focusables()[0];
    if(first){try{first.focus();}catch(e){}}
  },30);
  modal.addEventListener("keydown",function(e){
    if(e.key!=="Tab") return;
    var f=focusables(); if(!f.length) return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
}

var DE_CACHE={regime:null,vix:null,breadth:null,sectorRS:{},scores:{},lastFetch:0};

// VIX — volatility regime layer
async function deGetVIX(){
  if(DE_CACHE.vix&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.vix;
  try{
    var hist=await fetchHistory('^VIX','3mo');
    if(!hist||!hist.length)throw new Error('no data');
    var v=hist[hist.length-1].close;
    var prev=hist.length>5?hist[hist.length-6].close:v;
    var regime=v<15?'low':v<25?'normal':v<35?'elevated':'crisis';
    var sizing={low:1.0,normal:0.75,elevated:0.50,crisis:0.25}[regime];
    var label={low:'baja',normal:'normal',elevated:'elevada',crisis:'extrema'}[regime];
    var color={low:'var(--grn)',normal:'var(--blue)',elevated:'var(--amber)',crisis:'var(--red)'}[regime];
    var emoji={low:'pos',normal:'info',elevated:'warn',crisis:'neg'}[regime];
    var tip={low:'Volatilidad baja — entorno de baja incertidumbre histórica.',normal:'Volatilidad normal — nivel dentro del rango histórico promedio.',elevated:'Volatilidad alta — entorno de mayor incertidumbre de mercado.',crisis:'Volatilidad extrema — nivel históricamente muy elevado.'}[regime];
    var result={vix:v,prev:prev,regime:regime,label:label,color:color,emoji:emoji,tip:tip,sizing:sizing};
    DE_CACHE.vix=result;return result;
  }catch(e){return{vix:null,regime:'unknown',label:'sin dato',color:'var(--text3)',emoji:'muted',tip:'No se pudo obtener VIX.',sizing:1.0};}
}

// Market Breadth — % S&P 500 above SMA200 via $SPXA200R
async function deGetBreadth(){
  if(DE_CACHE.breadth&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.breadth;
  try{
    var hist=await fetchHistory('%5ESPXA200R','3mo');
    if(!hist||!hist.length)throw new Error('no data');
    var v=hist[hist.length-1].close; // value is already a percentage (0-100)
    var prev=hist.length>5?hist[hist.length-6].close:v;
    var regime=v>=70?'strong':v>=50?'neutral':v>=30?'weak':'bear';
    var label={strong:'fuerte',neutral:'neutral',weak:'débil',bear:'muy débil'}[regime];
    var color={strong:'var(--grn)',neutral:'var(--blue)',weak:'var(--amber)',bear:'var(--red)'}[regime];
    var warning=v<50&&v<prev?'Menos de la mitad de las acciones del índice está sobre su media de 200 días, y la proporción viene bajando.':'';
    var result={pct:v,prev:prev,regime:regime,label:label,color:color,warning:warning};
    DE_CACHE.breadth=result;return result;
